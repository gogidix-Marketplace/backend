spring:
  application:
    name: api-rate-limit-service
  data:
    mongodb:
      uri: mongodb://localhost:27017
      database: gogidix_api_rate_limit
    redis:
      host: localhost
      port: 6379
      database: 6
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: api-rate-limit-service
      auto-offset-reset: earliest

server:
  port: 8096

rate-limit:
  default:
    requests-per-minute: 60
    requests-per-hour: 1000
    requests-per-day: 10000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    app-name: api-rate-limit-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.gogidix: DEBUG
    org.springframework.data.mongodb: INFO
