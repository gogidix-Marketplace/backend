server:
  port: ${SERVER_PORT:8920}

spring:
  application:
    name: centralized-api-gateway
  
  profiles:
    active: dev
  
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - AddResponseHeader=X-Response-Default-Foo, Default-Bar
      
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      
      httpclient:
        connect-timeout: 10000
        response-timeout: 30s
        pool:
          type: elastic
          max-idle-time: 15s
          max-life-time: 60s
      
      redis-rate-limiter:
        replenish-rate: 100
        burst-capacity: 200
        requested-tokens: 1
    
    loadbalancer:
      ribbon:
        enabled: false
      
      cache:
        enabled: true
        ttl: 30s
        capacity: 256
  
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-wait: -1ms
          max-idle: 10
          min-idle: 0
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8080/auth/realms/gogidix}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:http://localhost:8080/auth/realms/gogidix/protocol/openid_connect/certs}

eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 15
    lease-expiration-duration-in-seconds: 45
    metadata-map:
      zone: primary
      version: ${spring.application.version:1.0.0}
      metrics-path: /actuator/prometheus
  
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 15
    eureka-service-url-poll-interval-seconds: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
      base-path: /actuator
  
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    
    gateway:
      enabled: true
  
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}
  
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 20
        permittedNumberOfCallsInHalfOpenState: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        minimumNumberOfCalls: 10
        automaticTransitionFromOpenToHalfOpenEnabled: true
        eventConsumerBufferSize: 10
        recordExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
        ignoreExceptions:
          - java.lang.IllegalArgumentException
    
    instances:
      centralized-core:
        baseConfig: default
        slidingWindowSize: 10
        failureRateThreshold: 60
      
      centralized-data-aggregation:
        baseConfig: default
        slidingWindowSize: 15
        failureRateThreshold: 50
      
      centralized-performance-metrics:
        baseConfig: default
        slidingWindowSize: 10
        failureRateThreshold: 70
      
      centralized-business-intelligence:
        baseConfig: default
        slidingWindowSize: 20
        failureRateThreshold: 50
  
  timelimiter:
    configs:
      default:
        timeoutDuration: 10s
        cancelRunningFuture: true
    instances:
      centralized-core:
        timeoutDuration: 5s
      centralized-data-aggregation:
        timeoutDuration: 15s
      centralized-performance-metrics:
        timeoutDuration: 8s
      centralized-business-intelligence:
        timeoutDuration: 20s

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
    org.springframework.web.reactive: INFO
    reactor.netty: INFO
    com.gogidix: DEBUG
  
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n"

gateway:
  custom:
    security:
      enabled: true
      public-paths:
        - /actuator/**
        - /swagger-ui/**
        - /v3/api-docs/**
        - /dashboard/login
        - /dashboard/public/**
      
      jwt:
        verify-signature: true
        verify-expiration: true
        leeway: 10
    
    rate-limiting:
      enabled: true
      default-replenish-rate: 100
      default-burst-capacity: 200
      redis:
        enabled: true
        key-prefix: "gateway:rate-limit:"
    
    circuit-breaker:
      enabled: true
      default-failure-threshold: 50
      default-timeout: 30s
      metrics-enabled: true
    
    cors:
      enabled: true
      allowed-origins: "*"
      allowed-methods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600
    
    metrics:
      enabled: true
      export-interval: 60s
      detailed-metrics: true