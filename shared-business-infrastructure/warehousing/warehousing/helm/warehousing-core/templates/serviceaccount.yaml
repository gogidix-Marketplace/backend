{{/*
===============================================================================
ServiceAccount Template
===============================================================================
Creates ServiceAccount for the warehousing services.
*/}}
{{- if .Values.global.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "warehousing-core.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "warehousing-core.labels" . | nindent 4 }}
    app.kubernetes.io/component: service-account
  annotations:
    {{- with .Values.global.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- if .Values.global.serviceAccount.automountToken }}
automountToken: {{ .Values.global.serviceAccount.automountToken }}
{{- end }}
{{- end }}

{{/*
ServiceAccounts for individual services (if needed)
*/}}
{{- range $serviceName, $serviceConfig := .Values }}
{{- if and $serviceConfig.enabled (or (hasSuffix "Service" $serviceName) (hasSuffix "service" $serviceName)) }}
{{- if and $serviceConfig.serviceAccount $serviceConfig.serviceAccount.create }}
{{- $name := $serviceConfig.name | default $serviceName }}
{{- $kebabName := $name | lower | replace "_" "-" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $kebabName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "warehousing-core.deploymentLabels" (list $name $) | nindent 4 }}
    app.kubernetes.io/component: service-account
  annotations:
    {{- with $serviceConfig.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- with $serviceConfig.serviceAccount.automountToken }}
automountToken: {{ . }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
