name: Test Platform Services

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

env:
  JAVA_VERSION: '17'
  MAVEN_VERSION: '3.9.12'
  DOMAIN_NAME: platform
  MIN_COVERAGE: '80'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: platform_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      kafka:
        image: confluentinc/cp-kafka:latest
        env:
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        ports:
          - 9092:9092

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: Set up Maven
      uses: stCarolas/setup-maven@1de1a71b382c93941688b189d9a18c7049058f84
      with:
        maven-version: ${{ env.MAVEN_VERSION }}

    - name: Cache Maven dependencies
      uses: actions/cache@13aacd865c20de90d75de3dcf1572b4a4f02ed94
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Run tests with coverage for platform-service
      run: mvn clean test jacoco:report
      working-directory: Backend/Java/platform-service
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/platform_test
        SPRING_DATASOURCE_USERNAME: test
        SPRING_DATASOURCE_PASSWORD: test
        SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        SPRING_REDIS_HOST: localhost
        SPRING_REDIS_PORT: 6379

    - name: Run tests with coverage for subscription-service
      run: mvn clean test jacoco:report
      working-directory: Backend/Java/subscription-service
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/platform_test
        SPRING_DATASOURCE_USERNAME: test
        SPRING_DATASOURCE_PASSWORD: test

    - name: Run tests with coverage for tenant-registry-service
      run: mvn clean test jacoco:report
      working-directory: Backend/Java/tenant-registry-service
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/platform_test
        SPRING_DATASOURCE_USERNAME: test
        SPRING_DATASOURCE_PASSWORD: test

    - name: Run tests with coverage for usage-metering-service
      run: mvn clean test jacoco:report
      working-directory: Backend/Java/usage-metering-service
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/platform_test
        SPRING_DATASOURCE_USERNAME: test
        SPRING_DATASOURCE_PASSWORD: test

    - name: Check coverage thresholds
      run: |
        for service in platform-service subscription-service tenant-registry-service usage-metering-service; do
          echo "Checking coverage for $service"
          cd Backend/Java/$service
          coverage=$(mvn jacoco:check -q | grep -oP 'Coverage \K[0-9]+' || echo "0")
          echo "Coverage: $coverage%"
          if (( $(echo "$coverage < $MIN_COVERAGE" | bc -l) )); then
            echo "Coverage below $MIN_COVERAGE% for $service"
            exit 1
          fi
          cd -
        done

    - name: Generate test report
      if: always()
      uses: dorny/test-reporter@31d2709a2c8dd9a676293445a22b9449df6ac703
      with:
        name: Test Results
        path: '**/target/surefire-reports/*.xml'
        reporter: java-junit
        fail-on-error: true

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
      with:
        name: platform-services-test-results
        path: |
          Backend/Java/platform-service/target/surefire-reports/
          Backend/Java/subscription-service/target/surefire-reports/
          Backend/Java/tenant-registry-service/target/surefire-reports/
          Backend/Java/usage-metering-service/target/surefire-reports/
        retention-days: 30

    - name: Upload code coverage
      if: always()
      uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
      with:
        name: platform-services-coverage
        path: |
          Backend/Java/platform-service/target/site/jacoco/
          Backend/Java/subscription-service/target/site/jacoco/
          Backend/Java/tenant-registry-service/target/site/jacoco/
          Backend/Java/usage-metering-service/target/site/jacoco/
        retention-days: 30

    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@ab904c41d6ece7705aeb9a60b392016e95e53396
      with:
        files: |
          Backend/Java/platform-service/target/site/jacoco/jacoco.xml
          Backend/Java/subscription-service/target/site/jacoco/jacoco.xml
          Backend/Java/tenant-registry-service/target/site/jacoco/jacoco.xml
          Backend/Java/usage-metering-service/target/site/jacoco/jacoco.xml
        flags: platform
        name: platform-services-coverage

    - name: Comment coverage on PR
      if: github.event_name == 'pull_request'
      uses: madrapps/jacoco-report@24171c2c9c06d7a4ec279b318dc4e0d7b4a64970
      with:
        paths: |
          Backend/Java/platform-service/target/site/jacoco/jacoco.xml
          Backend/Java/subscription-service/target/site/jacoco/jacoco.xml
          Backend/Java/tenant-registry-service/target/site/jacoco/jacoco.xml
          Backend/Java/usage-metering-service/target/site/jacoco/jacoco.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        min-coverage-overall: ${{ env.MIN_COVERAGE }}
        title: Code Coverage Report

  integration-test:
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: platform_it
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

    - name: Set up JDK
      uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: Run integration tests
      run: mvn verify -DskipUnitTests=true
      working-directory: Backend/Java/platform-service
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/platform_it
        SPRING_DATASOURCE_USERNAME: test
        SPRING_DATASOURCE_PASSWORD: test

  security-scan:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

    - name: Run OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@e325ac157b4bddfa7e19f9f0f79b51292c6d0c2e
      with:
        project: 'platform-services'
        path: 'Backend/Java'
        format: 'HTML'
        out: 'dependency-check-report'

    - name: Upload security report
      uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
      with:
        name: dependency-check-report
        path: dependency-check-report

  architecture-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

    - name: Set up JDK
      uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: Run architecture tests
      run: mvn test -Dtest=ArchTest
      working-directory: Backend/Java/platform-service
