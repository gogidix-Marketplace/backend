# Brand Management Service Test Configuration

spring:
  application:
    name: brand-management-service

  data:
    mongodb:
      database: test_brand_management
      auto-index-creation: true

logging:
  level:
    root: INFO
    com.gogidix: DEBUG

app:
  brand:
    max-file-size: 50MB
    allowed-formats: png,jpg,jpeg,pdf,svg,mp4
