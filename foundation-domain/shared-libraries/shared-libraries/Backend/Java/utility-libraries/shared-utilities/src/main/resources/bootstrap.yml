# Bootstrap Configuration for Shared Utilities
# Loaded before application.yml - used for Spring Cloud Config and early initialization

spring:
  application:
    name: shared-utilities
  
  # Spring Cloud Config (if using config server)
  cloud:
    config:
      enabled: false
      uri: ${CONFIG_SERVER_URI:http://localhost:8888}
      fail-fast: false
      retry:
        initial-interval: 1000
        multiplier: 1.1
        max-attempts: 6
        max-interval: 2000

  # Profile selection
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# Logging configuration for bootstrap phase
logging:
  level:
    org.springframework.cloud.config: WARN
    org.springframework.web: WARN