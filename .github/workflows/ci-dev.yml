name: CI - Dev Branch

on:
  push:
    branches: [Dev]
  pull_request:
    branches: [Dev]
  workflow_dispatch:

concurrency:
  group: ci-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  install-shared-libraries:
    name: Install Shared Libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: 'maven'
      - name: Install shared-libraries to local .m2
        working-directory: foundation-domain/shared-libraries/shared-libraries/Backend/Java
        run: mvn clean install -DskipTests -B -q
      - name: Cache .m2 repository
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: m2-shared-libs-dev-${{ github.sha }}

  quick-build:
    name: Quick Build - ${{ matrix.domain }}
    runs-on: ubuntu-latest
    needs: install-shared-libraries
    strategy:
      fail-fast: true
      matrix:
        domain:
          - foundation-domain
          - management-domain
          - shared-business-logics
          - shared-business-infrastructure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: 'maven'
      - name: Restore shared-libraries from cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: m2-shared-libs-dev-${{ github.sha }}
      - name: Build ${{ matrix.domain }}
        run: |
          FAILED=0
          COUNT=0
          for pom in $(find ${{ matrix.domain }} -name "pom.xml" -type f | grep -v target | head -50); do
            dir=$(dirname "$pom")
            COUNT=$((COUNT + 1))
            echo "::group::[$COUNT] Building $dir"
            if ! (cd "$dir" && mvn clean compile -DskipTests -B -q); then
              echo "::error::Build failed in $dir"
              FAILED=1
            fi
            echo "::endgroup::"
          done
          echo "Built $COUNT services in ${{ matrix.domain }}"
          if [ "$FAILED" -ne 0 ]; then exit 1; fi

  basic-tests:
    name: Basic Tests - ${{ matrix.domain }}
    runs-on: ubuntu-latest
    needs: install-shared-libraries
    strategy:
      fail-fast: true
      matrix:
        domain:
          - foundation-domain
          - management-domain
          - shared-business-logics
          - shared-business-infrastructure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: 'maven'
      - name: Restore shared-libraries from cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: m2-shared-libs-dev-${{ github.sha }}
      - name: Run Tests in ${{ matrix.domain }}
        run: |
          FAILED=0
          COUNT=0
          for pom in $(find ${{ matrix.domain }} -name "pom.xml" -type f | grep -v target | head -30); do
            dir=$(dirname "$pom")
            # Check if tests exist
            if find "$dir" -name "*Test.java" | grep -q .; then
              COUNT=$((COUNT + 1))
              echo "::group::[$COUNT] Testing $dir"
              if ! (cd "$dir" && mvn test -B); then
                echo "::error::Tests failed in $dir"
                FAILED=1
              fi
              echo "::endgroup::"
            fi
          done
          echo "Tested $COUNT services in ${{ matrix.domain }}"
          if [ "$FAILED" -ne 0 ]; then exit 1; fi

  summary:
    name: Dev CI Summary
    runs-on: ubuntu-latest
    needs: [quick-build, basic-tests]
    if: always()
    steps:
      - run: |
          echo "## CI - Dev Branch Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Quick Build | ${{ needs.quick-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Basic Tests | ${{ needs.basic-tests.result }} |" >> $GITHUB_STEP_SUMMARY
