---
apiVersion: v1
kind: ConfigMap
metadata:
  name: message-broker-config
  namespace: infrastructure
  labels:
    app: message-broker
    version: v1
data:
  application.yml: |
    server:
      port: 8080
    spring:
      application:
        name: message-broker
      cloud:
        discovery:
          enabled: true
          service-url:
            defaultZone: http://discovery-service:8761/eureka/
        config:
          enabled: true
          uri: http://config-server:8888
      data:
        kafka:
          bootstrap-servers: kafka-bootstrap.infrastructure.svc.cluster.local:9092
          producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.apache.kafka.common.serialization.StringSerializer
          consumer:
            group-id: message-broker-group
            auto-offset-reset: earliest
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
      endpoint:
        health:
          show-details: always
      metrics:
        export:
          prometheus:
            enabled: true
---
apiVersion: v1
kind: Secret
metadata:
  name: message-broker-secrets
  namespace: infrastructure
  labels:
    app: message-broker
type: Opaque
stringData:
  kafka-password: "ChangeThisInProduction123!"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-broker
  namespace: infrastructure
  labels:
    app: message-broker
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: message-broker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: message-broker
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: message-broker
      containers:
        - name: message-broker
          image: gogidix/message-broker:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: message-broker-secrets
                  key: kafka-password
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              value: "http://discovery-service:8761/eureka/"
            - name: SPRING_CLOUD_CONFIG_URI
              value: "http://config-server:8888"
          envFrom:
            - configMapRef:
                name: message-broker-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - message-broker
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: message-broker
  namespace: infrastructure
  labels:
    app: message-broker
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: message-broker
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: message-broker
  namespace: infrastructure
  labels:
    app: message-broker
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: message-broker-hpa
  namespace: infrastructure
  labels:
    app: message-broker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: message-broker
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: message-broker-pdb
  namespace: infrastructure
  labels:
    app: message-broker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: message-broker
