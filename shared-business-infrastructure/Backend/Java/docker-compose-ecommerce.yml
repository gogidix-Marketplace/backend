# ============================================================================
# VOLUMES - Persistent Data Storage
# ============================================================================
volumes:
  # MongoDB Data Volumes
  mongodb-primary-data:
    driver: local
  mongodb-secondary-1-data:
    driver: local
  mongodb-secondary-2-data:
    driver: local
  mongodb-config:
    driver: local

  # Kafka/Zookeeper Data Volumes
  kafka-data:
    driver: local
  zookeeper-data:
    driver: local
  zookeeper-logs:
    driver: local

# ============================================================================
# NETWORKS - Container Communication
# ============================================================================
networks:
  ecommerce-network:
    name: ecommerce-network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
