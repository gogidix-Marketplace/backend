# GitLab CI/CD Pipeline for Shared Audit Library
# Enterprise-grade pipeline with security, testing, and deployment automation

# Global variables and settings
variables:
  # Maven settings
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true"
  
  # Docker settings
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_REGISTRY: "$CI_REGISTRY"
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
  LATEST_TAG: "$CI_REGISTRY_IMAGE:latest"
  
  # Security and testing
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"
  
  # Application settings
  SERVICE_NAME: "shared-audit"
  SERVICE_PORT: "8701"
  JAVA_VERSION: "17"
  
  # Deployment settings
  KUBERNETES_NAMESPACE: "gogidix-shared-libraries"
  HELM_CHART_PATH: "./k8s/helm"

# Global cache configuration
cache:
  key: "${CI_JOB_NAME}"
  paths:
    - .m2/repository/
    - .sonar/cache/
    - target/
    - node_modules/

# Pipeline stages
stages:
  - validate
  - build
  - test
  - security
  - package
  - deploy-dev
  - integration-test
  - deploy-staging
  - deploy-production

# Templates for reusability
.maven-template: &maven-template
  image: maven:3.9.4-eclipse-temurin-17
  before_script:
    - mkdir -p .m2/repository
    - echo "Using Java version:"
    - java -version
    - echo "Using Maven version:"
    - mvn -version

.docker-template: &docker-template
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - docker info
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY

.kubernetes-template: &kubernetes-template
  image: bitnami/kubectl:latest
  before_script:
    - kubectl version --client
    - kubectl config current-context

# Stage 1: Validation
validate:
  <<: *maven-template
  stage: validate
  script:
    - echo "🔍 Validating project structure and dependencies..."
    - mvn $MAVEN_CLI_OPTS validate
    - mvn $MAVEN_CLI_OPTS dependency:analyze
    - mvn $MAVEN_CLI_OPTS versions:display-dependency-updates
    - echo "✅ Project validation completed successfully"
  artifacts:
    expire_in: 1 hour
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
    paths:
      - target/dependency-analysis/
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Stage 2: Build
build:
  <<: *maven-template
  stage: build
  script:
    - echo "🏗️ Building shared-audit library..."
    - mvn $MAVEN_CLI_OPTS clean compile
    - mvn $MAVEN_CLI_OPTS compile test-compile
    - echo "📦 Generating build info..."
    - echo "BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> build.env
    - echo "GIT_COMMIT=$CI_COMMIT_SHA" >> build.env
    - echo "GIT_BRANCH=$CI_COMMIT_REF_NAME" >> build.env
    - echo "BUILD_NUMBER=$CI_PIPELINE_ID" >> build.env
    - echo "✅ Build completed successfully"
  artifacts:
    expire_in: 2 hours
    reports:
      dotenv: build.env
    paths:
      - target/classes/
      - target/test-classes/
      - target/generated-sources/
  cache:
    key: build-cache-$CI_COMMIT_REF_SLUG
    paths:
      - .m2/repository/
      - target/
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Stage 3: Unit Tests
unit-tests:
  <<: *maven-template
  stage: test
  script:
    - echo "🧪 Running unit tests..."
    - mvn $MAVEN_CLI_OPTS test
    - echo "📊 Generating test coverage report..."
    - mvn jacoco:report
    - echo "✅ Unit tests completed successfully"
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    expire_in: 1 week
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: target/site/jacoco/jacoco.xml
    paths:
      - target/site/jacoco/
      - target/surefire-reports/
  dependencies:
    - build
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Integration Tests
integration-tests:
  <<: *maven-template
  stage: test
  services:
    - postgres:15-alpine
    - redis:7-alpine
  variables:
    POSTGRES_DB: "test_audit"
    POSTGRES_USER: "test_user"
    POSTGRES_PASSWORD: "test_password"
    SPRING_PROFILES_ACTIVE: "test"
    DATABASE_URL: "jdbc:postgresql://postgres:5432/test_audit"
    DATABASE_USERNAME: "test_user"
    DATABASE_PASSWORD: "test_password"
    REDIS_HOST: "redis"
    REDIS_PORT: "6379"
  script:
    - echo "🔄 Running integration tests..."
    - mvn $MAVEN_CLI_OPTS failsafe:integration-test failsafe:verify
    - echo "✅ Integration tests completed successfully"
  artifacts:
    expire_in: 1 week
    reports:
      junit:
        - target/failsafe-reports/TEST-*.xml
    paths:
      - target/failsafe-reports/
  dependencies:
    - build
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Stage 4: Security Scanning
security-scan:
  <<: *maven-template
  stage: security
  script:
    - echo "🔒 Running security scans..."
    - mvn $MAVEN_CLI_OPTS org.owasp:dependency-check-maven:check
    - echo "📋 Generating security report..."
  artifacts:
    expire_in: 1 week
    reports:
      dependency_scanning: target/dependency-check-report.json
    paths:
      - target/dependency-check-report.html
      - target/dependency-check-report.json
  dependencies:
    - build
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Code Quality with SonarQube
sonarqube-check:
  <<: *maven-template
  stage: security
  script:
    - echo "📈 Running SonarQube analysis..."
    - mvn $MAVEN_CLI_OPTS verify sonar:sonar
      -Dsonar.projectKey=gogidix_shared-audit
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.login=$SONAR_TOKEN
      -Dsonar.qualitygate.wait=true
    - echo "✅ SonarQube analysis completed"
  dependencies:
    - unit-tests
  allow_failure: true
  only:
    variables:
      - $SONAR_HOST_URL
      - $SONAR_TOKEN
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Stage 5: Package
package-jar:
  <<: *maven-template
  stage: package
  script:
    - echo "📦 Packaging JAR artifact..."
    - mvn $MAVEN_CLI_OPTS package -DskipTests
    - ls -la target/
    - echo "✅ JAR packaging completed successfully"
  artifacts:
    expire_in: 1 week
    paths:
      - target/*.jar
  dependencies:
    - unit-tests
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

package-docker:
  <<: *docker-template
  stage: package
  script:
    - echo "🐳 Building Docker image..."
    - docker build -t $IMAGE_TAG .
    - docker build -t $LATEST_TAG .
    - echo "📤 Pushing Docker image to registry..."
    - docker push $IMAGE_TAG
    - docker push $LATEST_TAG
    - echo "✅ Docker image built and pushed successfully"
    - echo "IMAGE_TAG=$IMAGE_TAG" >> docker.env
  artifacts:
    expire_in: 1 week
    reports:
      dotenv: docker.env
  dependencies:
    - package-jar
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"

# Stage 6: Deploy to Development
deploy-dev:
  <<: *kubernetes-template
  stage: deploy-dev
  environment:
    name: development
    url: https://shared-audit-dev.gogidix.com
  script:
    - echo "🚀 Deploying to development environment..."
    - kubectl apply -f k8s/development/
    - kubectl set image deployment/shared-audit shared-audit=$IMAGE_TAG -n $KUBERNETES_NAMESPACE-dev
    - kubectl rollout status deployment/shared-audit -n $KUBERNETES_NAMESPACE-dev --timeout=300s
    - echo "✅ Development deployment completed successfully"
  dependencies:
    - package-docker
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  when: manual

# Stage 7: Integration Testing in Dev Environment
dev-integration-test:
  image: curlimages/curl:latest
  stage: integration-test
  script:
    - echo "🔄 Running integration tests against dev environment..."
    - sleep 30  # Wait for service to be ready
    - curl -f https://shared-audit-dev.gogidix.com/actuator/health
    - curl -f https://shared-audit-dev.gogidix.com/actuator/info
    - echo "✅ Development integration tests passed"
  dependencies:
    - deploy-dev
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

# Stage 8: Deploy to Staging
deploy-staging:
  <<: *kubernetes-template
  stage: deploy-staging
  environment:
    name: staging
    url: https://shared-audit-staging.gogidix.com
  script:
    - echo "🚀 Deploying to staging environment..."
    - kubectl apply -f k8s/staging/
    - kubectl set image deployment/shared-audit shared-audit=$IMAGE_TAG -n $KUBERNETES_NAMESPACE-staging
    - kubectl rollout status deployment/shared-audit -n $KUBERNETES_NAMESPACE-staging --timeout=300s
    - echo "✅ Staging deployment completed successfully"
  dependencies:
    - package-docker
    - dev-integration-test
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: manual

# Stage 9: Deploy to Production
deploy-production:
  <<: *kubernetes-template
  stage: deploy-production
  environment:
    name: production
    url: https://shared-audit.gogidix.com
  script:
    - echo "🚀 Deploying to production environment..."
    - kubectl apply -f k8s/production/
    - kubectl set image deployment/shared-audit shared-audit=$IMAGE_TAG -n $KUBERNETES_NAMESPACE-prod
    - kubectl rollout status deployment/shared-audit -n $KUBERNETES_NAMESPACE-prod --timeout=600s
    - echo "✅ Production deployment completed successfully"
  dependencies:
    - deploy-staging
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  when: manual

# Rollback job (manual trigger)
rollback-production:
  <<: *kubernetes-template
  stage: deploy-production
  script:
    - echo "⏪ Rolling back production deployment..."
    - kubectl rollout undo deployment/shared-audit -n $KUBERNETES_NAMESPACE-prod
    - kubectl rollout status deployment/shared-audit -n $KUBERNETES_NAMESPACE-prod --timeout=300s
    - echo "✅ Production rollback completed successfully"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: manual
  allow_failure: false

# Performance Testing (optional)
performance-test:
  image: loadimpact/k6:latest
  stage: integration-test
  script:
    - echo "⚡ Running performance tests..."
    - k6 run --vus 10 --duration 60s performance-tests/load-test.js
    - echo "✅ Performance tests completed"
  artifacts:
    expire_in: 1 week
    paths:
      - performance-results/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true
  when: manual

# Cleanup job
cleanup:
  image: alpine:latest
  stage: .post
  script:
    - echo "🧹 Cleaning up temporary resources..."
    - echo "✅ Cleanup completed"
  rules:
    - when: always