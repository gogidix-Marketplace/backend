apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-document-processing-service
  namespace: ai-services
  labels:
    app: ai-document-processing-service
    version: v1
    team: team-ai-content-processing
    domain: ai-services
    component: content-document-processing
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    nginx.ingress.kubernetes.io/enable-opentracing: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ai-document-processing.gogidix.com
    - ai-document-processing-api.gogidix.com
    secretName: ai-document-processing-service-tls
  rules:
  - host: ai-document-processing.gogidix.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ai-document-processing-service
            port:
              number: 8080
  - host: ai-document-processing-api.gogidix.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: ai-document-processing-service
            port:
              number: 8080
      - path: /actuator
        pathType: Prefix
        backend:
          service:
            name: ai-document-processing-service
            port:
              number: 8080
