openapi: 3.0.3
info:
  title: AI IntelligenceReport Analysis Service API
  description: |
    AI-powered customer segmentation service for the GOGIDIX Social E-commerce Ecosystem.

    ## Features
    - Create and manage customer segments
    - Analyze customer behavior and demographics
    - Real-time segment updates
    - Multi-tenant support

    ## Authentication
    All endpoints require a valid JWT token in the Authorization header.

  version: 1.0.0
  contact:
    name: GOGIDIX Development Team
    email: dev@gogidix.com
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080/api/v1
    description: Development server
  - url: https://api.gogidix.com/ai-customer-segmentation/v1
    description: Production server

security:
  - bearerAuth: []

tags:
  - name: IntelligenceReport Analysiss
    description: IntelligenceReport segment management operations
  - name: Analysis Analysis
    description: Analysis analysis and insights
  - name: Health
    description: Health check endpoints

paths:
  /segments:
    get:
      tags:
        - IntelligenceReport Analysiss
      summary: List all customer segments
      description: Retrieve a paginated list of customer segments for the current tenant
      operationId: listAnalysiss
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: sort
          in: query
          schema:
            type: string
            default: createdAt,desc
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, DRAFT]
          description: Filter by segment status
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedAnalysisResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - IntelligenceReport Analysiss
      summary: Create a new customer segment
      description: Create a new customer segment with specified criteria
      operationId: createAnalysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnalysisRequest'
      responses:
        '201':
          description: Analysis created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntelligenceAnalysisResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /segments/{segmentId}:
    get:
      tags:
        - IntelligenceReport Analysiss
      summary: Get a customer segment by ID
      description: Retrieve detailed information about a specific segment
      operationId: getAnalysis
      parameters:
        - name: segmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntelligenceAnalysisResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - IntelligenceReport Analysiss
      summary: Update a customer segment
      description: Update an existing customer segment
      operationId: updateAnalysis
      parameters:
        - name: segmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAnalysisRequest'
      responses:
        '200':
          description: Analysis updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntelligenceAnalysisResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - IntelligenceReport Analysiss
      summary: Delete a customer segment
      description: Delete an existing customer segment
      operationId: deleteAnalysis
      parameters:
        - name: segmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Analysis deleted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /segments/{segmentId}/analyze:
    post:
      tags:
        - Analysis Analysis
      summary: Analyze a customer segment
      description: Run analysis on a customer segment to generate insights
      operationId: analyzeAnalysis
      parameters:
        - name: segmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeAnalysisRequest'
      responses:
        '200':
          description: Analysis completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisAnalysisResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /segments/{segmentId}/customers:
    post:
      tags:
        - IntelligenceReport Analysiss
      summary: Add customers to segment
      description: Add specific customers to a segment
      operationId: addIntelligenceReportsToAnalysis
      parameters:
        - name: segmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customerIds
              properties:
                customerIds:
                  type: array
                  items:
                    type: string
                  maxItems: 1000
      responses:
        '200':
          description: IntelligenceReports added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntelligenceAnalysisResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - IntelligenceReport Analysiss
      summary: Remove customers from segment
      description: Remove specific customers from a segment
      operationId: removeIntelligenceReportsFromAnalysis
      parameters:
        - name: segmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customerIds
              properties:
                customerIds:
                  type: array
                  items:
                    type: string
                  maxItems: 1000
      responses:
        '200':
          description: IntelligenceReports removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntelligenceAnalysisResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check the health status of the service
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [UP, DOWN]
                  components:
                    type: object

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from authentication service

  schemas:
    IntelligenceAnalysisResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        criteria:
          $ref: '#/components/schemas/AnalysisCriteria'
        customerCount:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [DRAFT, ACTIVE, INACTIVE, ARCHIVED]
        segmentType:
          type: string
          enum: [BEHAVIORAL, DEMOGRAPHIC, TRANSACTIONAL, CUSTOM]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastAnalyzedAt:
          type: string
          format: date-time
          nullable: true

    AnalysisCriteria:
      type: object
      properties:
        type:
          type: string
          enum: [BEHAVIOR, DEMOGRAPHIC, TRANSACTION, CUSTOM]
        operator:
          type: string
          enum: [EQUALS, NOT_EQUALS, CONTAINS, GREATER_THAN, LESS_THAN, BETWEEN, IN]
        field:
          type: string
        value:
          oneOf:
            - type: string
            - type: number
            - type: array
              items:
                type: string
            - type: object
        logicalOperator:
          type: string
          enum: [AND, OR]
          default: AND

    CreateAnalysisRequest:
      type: object
      required:
        - name
        - criteria
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        segmentType:
          type: string
          enum: [BEHAVIORAL, DEMOGRAPHIC, TRANSACTIONAL, CUSTOM]
          default: CUSTOM
        criteria:
          type: object
          required:
            - type
            - operator
            - field
            - value
          properties:
            type:
              type: string
              enum: [BEHAVIOR, DEMOGRAPHIC, TRANSACTION, CUSTOM]
            operator:
              type: string
              enum: [EQUALS, NOT_EQUALS, CONTAINS, GREATER_THAN, LESS_THAN, BETWEEN, IN]
            field:
              type: string
            value:
              oneOf:
                - type: string
                - type: number
                - type: array
                - type: object
            logicalOperator:
              type: string
              enum: [AND, OR]

    UpdateAnalysisRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        criteria:
          $ref: '#/components/schemas/AnalysisCriteria'
        status:
          type: string
          enum: [ACTIVE, INACTIVE, DRAFT]

    AnalyzeAnalysisRequest:
      type: object
      properties:
        analysisType:
          type: string
          enum: [FULL, INCREMENTAL, QUICK]
          default: QUICK
        options:
          type: object
          properties:
            includeIntelligenceReportProfiles:
              type: boolean
              default: false
            includeTrends:
              type: boolean
              default: true
            timeRangeDays:
              type: integer
              minimum: 1
              maximum: 365
              default: 30

    AnalysisAnalysisResponse:
      type: object
      properties:
        segmentId:
          type: string
        analysisType:
          type: string
        customerCount:
          type: integer
        insights:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              description:
                type: string
              value:
                oneOf:
                  - type: string
                  - type: number
                  - type: object
              confidence:
                type: number
                minimum: 0
                maximum: 1
        trends:
          type: array
          items:
            type: object
            properties:
              period:
                type: string
              metric:
                type: string
              value:
                type: number
              change:
                type: number
        recommendations:
          type: array
          items:
            type: object
            properties:
              action:
                type: string
              priority:
                type: string
                enum: [HIGH, MEDIUM, LOW]
              reason:
                type: string
        analyzedAt:
          type: string
          format: date-time

    PagedAnalysisResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/IntelligenceAnalysisResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
        first:
          type: boolean
        last:
          type: boolean

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
        correlationId:
          type: string
        tenantId:
          type: string

  responses:
    BadRequest:
      description: Bad request - invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Unauthorized - missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: Conflict - resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
