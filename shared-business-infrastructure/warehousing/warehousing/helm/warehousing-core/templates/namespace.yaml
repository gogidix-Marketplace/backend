{{/*
===============================================================================
Namespace Template
===============================================================================
Creates Kubernetes Namespace for warehousing-core services.
*/}}
{{- if .Values.namespace.create }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace.name | default "warehousing-core" }}
  labels:
    {{- include "warehousing-core.labels" . | nindent 4 }}
    name: {{ .Values.namespace.name | default "warehousing-core" }}
{{- with .Values.namespace.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}
