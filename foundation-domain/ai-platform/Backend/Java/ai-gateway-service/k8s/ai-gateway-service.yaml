---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-gateway-service-config
  namespace: ai-platform
  labels:
    app: ai-gateway-service
    version: v1
data:
  application.yml: |
    server:
      port: 8000
    spring:
      application:
        name: ai-gateway-service
      cloud:
        discovery:
          enabled: true
          service-url:
            defaultZone: http://discovery-service.infrastructure.svc.cluster.local:8761/eureka/
        config:
          enabled: true
          uri: http://config-server.infrastructure.svc.cluster.local:8888/
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
      endpoint:
        health:
          show-details: always
      metrics:
        export:
          prometheus:
            enabled: true
    gateway:
      load-balancing-strategy: round-robin
      circuit-breaker:
        enabled: true
        failure-threshold: 5
        timeout: 30000
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-gateway-service-secrets
  namespace: ai-platform
  labels:
    app: ai-gateway-service
type: Opaque
stringData:
  jwt-secret: "ChangeThisJwtSecretInProduction"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway-service
  namespace: ai-platform
  labels:
    app: ai-gateway-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-gateway-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ai-gateway-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: ai-gateway-service
      containers:
        - name: ai-gateway-service
          image: gogidix/ai-gateway-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              value: "http://discovery-service.infrastructure.svc.cluster.local:8761/eureka/"
            - name: SPRING_CLOUD_CONFIG_URI
              value: "http://config-server.infrastructure.svc.cluster.local:8888/"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-service-secrets
                  key: jwt-secret
          envFrom:
            - configMapRef:
                  name: ai-gateway-service-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: config-volume
          configMap:
            name: ai-gateway-service-config
---
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway-service
  namespace: ai-platform
  labels:
    app: ai-gateway-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: ai-gateway-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-gateway-service
  namespace: ai-platform
  labels:
    app: ai-gateway-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-gateway-service-hpa
  namespace: ai-platform
  labels:
    app: ai-gateway-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-gateway-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-gateway-service-pdb
  namespace: ai-platform
  labels:
    app: ai-gateway-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ai-gateway-service
