# Test Configuration for Budget Management Service
spring:
  application:
    name: budget-management-service-test
  data:
    mongodb:
      host: localhost
      port: 27017
      database: budget-management-test-db
      auto-index-creation: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: budget-management-test-group
      auto-offset-reset: earliest
spring.redis:
  host: localhost
  port: 6379
  database: 6
server:
  port: 0
logging:
  level:
    com.gogidix.finance.budgetmanagement: DEBUG
    org.springframework.kafka: WARN
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
test:
  tenant:
    id: tenant-test-001
  budget:
    period: 2024
