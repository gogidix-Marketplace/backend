apiVersion: v1
kind: Service
metadata:
  name: packing-service
  namespace: warehousing-core
  labels:
    app: packing-service
    service: packing-service
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
  - name: http
    port: 8204
    targetPort: http
    protocol: TCP
  - name: management
    port: 8205
    targetPort: management
    protocol: TCP
  selector:
    app: packing-service
---
apiVersion: v1
kind: Service
metadata:
  name: packing-service-headless
  namespace: warehousing-core
  labels:
    app: packing-service
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8204
    targetPort: http
    protocol: TCP
  selector:
    app: packing-service
