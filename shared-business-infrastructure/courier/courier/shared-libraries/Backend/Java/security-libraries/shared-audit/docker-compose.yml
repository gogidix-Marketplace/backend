# Docker Compose for Shared Audit Service Development Environment
# Version: 3.8
# Description: Complete development stack with all dependencies for shared-audit service

version: '3.8'

networks:
  gogidix-audit-network:
    driver: bridge
    name: gogidix-audit-network
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  postgres_audit_data:
    driver: local
    name: gogidix_audit_postgres_data
  redis_audit_data:
    driver: local
    name: gogidix_audit_redis_data
  kafka_audit_data:
    driver: local
    name: gogidix_audit_kafka_data
  zookeeper_audit_data:
    driver: local
    name: gogidix_audit_zookeeper_data
  audit_logs:
    driver: local
    name: gogidix_audit_logs
  audit_config:
    driver: local
    name: gogidix_audit_config

services:
  # PostgreSQL Database for Audit Data
  postgres-audit:
    image: postgres:15-alpine
    container_name: gogidix-audit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gogidix_audit
      POSTGRES_USER: gogidix_audit
      POSTGRES_PASSWORD: audit_secure_password_2024
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_audit_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      gogidix-audit-network:
        ipv4_address: 172.21.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gogidix_audit -d gogidix_audit"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: '1.0'

  # Redis Cache for Session and Performance
  redis-audit:
    image: redis:7-alpine
    container_name: gogidix-audit-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass audit_redis_2024
    ports:
      - "6379:6379"
    volumes:
      - redis_audit_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      gogidix-audit-network:
        ipv4_address: 172.21.0.11
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: '0.5'

  # Zookeeper for Kafka
  zookeeper-audit:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: gogidix-audit-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_MAX_CLIENT_CNXNS: 0
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_audit_data:/var/lib/zookeeper/data
    networks:
      gogidix-audit-network:
        ipv4_address: 172.21.0.12
    healthcheck:
      test: ["CMD", "nc", "-vz", "localhost", "2181"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: '0.5'

  # Kafka for Event Streaming
  kafka-audit:
    image: confluentinc/cp-kafka:7.4.0
    container_name: gogidix-audit-kafka
    restart: unless-stopped
    depends_on:
      zookeeper-audit:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-audit:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-audit:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka_audit_data:/var/lib/kafka/data
    networks:
      gogidix-audit-network:
        ipv4_address: 172.21.0.13
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: '1.0'

  # Eureka Service Discovery (Development)
  eureka-server:
    image: springcloud/eureka:latest
    container_name: gogidix-audit-eureka
    restart: unless-stopped
    environment:
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: false
      EUREKA_CLIENT_FETCH_REGISTRY: false
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://localhost:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: eureka-server
    ports:
      - "8761:8761"
    networks:
      gogidix-audit-network:
        ipv4_address: 172.21.0.14
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: '0.5'

  # Shared Audit Service
  shared-audit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gogidix-shared-audit
    restart: unless-stopped
    depends_on:
      postgres-audit:
        condition: service_healthy
      redis-audit:
        condition: service_healthy
      kafka-audit:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      # Spring Profiles
      SPRING_PROFILES_ACTIVE: development
      
      # Database Configuration
      DATABASE_URL: jdbc:postgresql://postgres-audit:5432/gogidix_audit
      DATABASE_USERNAME: gogidix_audit
      DATABASE_PASSWORD: audit_secure_password_2024
      
      # Redis Configuration
      REDIS_HOST: redis-audit
      REDIS_PORT: 6379
      REDIS_PASSWORD: audit_redis_2024
      REDIS_DATABASE: 3
      
      # Kafka Configuration
      KAFKA_BOOTSTRAP_SERVERS: kafka-audit:29092
      
      # Eureka Configuration
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: shared-audit
      EUREKA_PREFER_IP: false
      
      # JVM Configuration
      JAVA_OPTS: -Xms256m -Xmx512m -XX:+UseG1GC -XX:+UseContainerSupport
      
      # Application Configuration
      SERVER_PORT: 8300
      LOG_LEVEL_ROOT: DEBUG
      LOG_LEVEL_AUDIT: DEBUG
      LOG_LEVEL_SQL: DEBUG
      
      # Security Configuration
      AUDIT_SECURITY_ESCALATION: false
      AUDIT_ENCRYPTION: false
      
      # Performance Configuration
      AUDIT_ASYNC_ENABLED: false
      AUDIT_CACHE_ENABLED: true
      
      # Development Configuration
      ACTUATOR_ENDPOINTS: health,info,metrics,loggers,env,configprops,mappings,beans
      ACTUATOR_HEALTH_DETAILS: always
      
    ports:
      - "8300:8300"
    volumes:
      - audit_logs:/home/audit/logs
      - audit_config:/home/audit/config
    networks:
      gogidix-audit-network:
        ipv4_address: 172.21.0.15
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8300/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    mem_limit: 1g
    cpus: '1.0'

  # Development Tools Container
  audit-tools:
    image: alpine:latest
    container_name: gogidix-audit-tools
    restart: "no"
    command: tail -f /dev/null
    volumes:
      - audit_logs:/shared/logs:ro
      - audit_config:/shared/config
    networks:
      - gogidix-audit-network
    profiles:
      - tools
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: '0.1'