apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: centralized-real-time-platform-ingress
  namespace: centralized-dashboard
  labels:
    app: centralized-real-time-platform
    team: team-f-centralized-dashboard
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
    nginx.ingress.kubernetes.io/compression-backend: "on"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    nginx.ingress.kubernetes.io/websocket-services: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - realtime.gogidix.com
    secretName: centralized-real-time-platform-tls
  rules:
  - host: realtime.gogidix.com
    http:
      paths:
      - path: /api/realtime(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: centralized-real-time-platform
            port:
              number: 8915
      - path: /ws/realtime
        pathType: Prefix
        backend:
          service:
            name: centralized-real-time-platform
            port:
              number: 8915
