name: Deploy Development

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    strategy:
      matrix:
        service: [config-server, feature-flag-service, environment-service, notification-service, config-audit-service]
        include:
          - service: config-server
            port: 8888
          - service: feature-flag-service
            port: 8889
          - service: environment-service
            port: 8890
          - service: notification-service
            port: 8891
          - service: config-audit-service
            port: 8892
    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up JDK 17
        uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build ${{ matrix.service }}
        run: cd ${{ matrix.service }} && mvn clean package -DskipTests -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@2b512430cf1c7c4fe9b7815b4c7d761f6e893f6b

      - name: Login to Docker Hub
        uses: docker/login-action@e92390c5fb421da1463b202fbb5d8c4abc1a1ff6
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@af5a7ed5ba88268de6df9df61a84dfe726b25e69
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            gogidix/${{ matrix.service }}:dev
            gogidix/${{ matrix.service }}:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
