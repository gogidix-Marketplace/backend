apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: centralized-real-time-data-ingress
  namespace: centralized-dashboard
  labels:
    app: centralized-real-time-data
    team: team-f-centralized-dashboard
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
    nginx.ingress.kubernetes.io/websocket-services: "centralized-real-time-data"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/compression-backend: "on"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - realtime-data.gogidix.com
    secretName: centralized-real-time-data-tls
  rules:
  - host: realtime-data.gogidix.com
    http:
      paths:
      - path: /api/realtime(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: centralized-real-time-data
            port:
              number: 8103
