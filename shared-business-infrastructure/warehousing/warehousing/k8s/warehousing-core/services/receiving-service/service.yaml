apiVersion: v1
kind: Service
metadata:
  name: receiving-service
  namespace: warehousing-core
  labels:
    app: receiving-service
    service: receiving-service
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
  - name: http
    port: 8206
    targetPort: http
    protocol: TCP
  - name: management
    port: 8207
    targetPort: management
    protocol: TCP
  selector:
    app: receiving-service
---
apiVersion: v1
kind: Service
metadata:
  name: receiving-service-headless
  namespace: warehousing-core
  labels:
    app: receiving-service
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8206
    targetPort: http
    protocol: TCP
  selector:
    app: receiving-service
