server:
  port: ${SERVICE_PORT:8115}
  servlet:
    context-path: /api/v1
  shutdown: graceful

spring:
  application:
    name: commission-service
  data:
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT:27017}
      database: ${MONGODB_DB:commission_service}
      username: ${MONGODB_USER:}
      password: ${MONGODB_PASSWORD:}
      authentication-database: ${MONGODB_AUTH_DB:admin}
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializers.JsonSerializer
    consumer:
      group-id: ${spring.application.name}
      properties:
        spring.json.trusted.packages: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    root: INFO
    com.gogidix.courier: ${LOG_LEVEL:DEBUG}

commission:
  default-rate: ${DEFAULT_COMMISSION_RATE:0.15}
  settlement-threshold: ${SETTLEMENT_THRESHOLD:100.00}
