apiVersion: v2
name: ai-services
description: A Helm chart for Gogidix AI Services
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - ai
  - machine-learning
  - analytics
  - personalization
  - nlp
maintainers:
  - name: Gogidix AI Platform Team
    email: ai-platform@gogidix.com
home: https://github.com/gogidix/ai-services
sources:
  - https://github.com/gogidix/ai-services
icon: https://raw.githubusercontent.com/gogidix/ai-services/main/docs/logo.png
annotations:
  category: "AI & Machine Learning"
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: "Apache-2.0"
dependencies:
  - name: mongodb
    version: "^15.0.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: mongodb.enabled
  - name: redis
    version: "^18.0.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: kafka
    version: "^26.0.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: kafka.enabled
