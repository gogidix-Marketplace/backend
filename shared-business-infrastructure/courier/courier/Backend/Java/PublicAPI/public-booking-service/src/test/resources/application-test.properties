# Test Configuration for Public Booking Service

# Spring Profile
spring.profiles.active=test

# MongoDB Test Configuration (using Testcontainers)
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=public_booking_test

# Kafka Test Configuration (using Testcontainers)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=public-booking-test-group
spring.kafka.consumer.auto-offset-reset=earliest

# Logging
logging.level.root=INFO
logging.level.com.gogidix.courier.publicbookingservice=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
