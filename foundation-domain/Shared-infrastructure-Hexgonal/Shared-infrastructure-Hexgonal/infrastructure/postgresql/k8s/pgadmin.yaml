---
apiVersion: v1
kind: Secret
metadata:
  name: pgadmin-credentials
  namespace: infrastructure
type: Opaque
stringData:
  username: "admin@gogidix.com"
  password: "change_this_pgadmin_password"

---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: infrastructure
  labels:
    app: pgadmin
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 5050
    targetPort: 80
  selector:
    app: pgadmin

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: infrastructure
  labels:
    app: pgadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      containers:
      - name: pgadmin
        image: dpage/pgadmin4:latest
        ports:
        - name: http
          containerPort: 80
        env:
        - name: PGADMIN_DEFAULT_EMAIL
          valueFrom:
            secretKeyRef:
              name: pgadmin-credentials
              key: username
        - name: PGADMIN_DEFAULT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pgadmin-credentials
              key: password
        - name: PGADMIN_CONFIG_SERVER_MODE
          value: "False"
        - name: PGADMIN_LISTEN_PORT
          value: "80"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        volumeMounts:
        - name: pgadmin-data
          mountPath: /var/lib/pgadmin
      volumes:
      - name: pgadmin-data
        emptyDir: {}
