# Grafana Datasource Configuration for Prometheus
# Automatically configures Prometheus as a data source
# Author: Gogidix Development Team
# Version: 1.0.0
# Date: 2025-08-13

apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    isDefault: true
    basicAuth: false
    jsonData:
      httpMethod: POST
      queryTimeout: 60s
      timeInterval: 15s
      manageAlerts: true
      alertmanagerUid: ""
    editable: true