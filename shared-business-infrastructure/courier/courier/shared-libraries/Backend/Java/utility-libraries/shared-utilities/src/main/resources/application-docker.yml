# Docker Profile Configuration for Shared Utilities
spring:
  config:
    activate:
      on-profile: docker

  # Docker Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:gogidix_utilities}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000

  # JPA Docker Settings
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  # Docker Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 2
      timeout: 10000ms

  # Docker Cache Settings
  cache:
    redis:
      time-to-live: 3600000

  # Docker Security
  security:
    user:
      name: ${SECURITY_USER:admin}
      password: ${SECURITY_PASSWORD:admin123}
      roles: ADMIN

# Docker Logging
logging:
  level:
    com.gogidix.infrastructure.sharedlibraries.sharedutilities: INFO
    org.springframework: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Docker Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Docker-specific utility settings
gogidix:
  utilities:
    file:
      temp-directory: ${TEMP_DIR:/tmp/utilities}
      max-file-size: 100MB
    validation:
      strict-mode: false
      log-validation-errors: true
    date:
      cache-ttl-seconds: 1800
    json:
      cache-ttl-seconds: 1800

# Docker async settings
utilities:
  async:
    core-pool-size: 3
    max-pool-size: 10
    queue-capacity: 500
  cache:
    enabled: true
    ttl-seconds: 3600
  processing:
    timeout-seconds: 30
    max-retries: 3