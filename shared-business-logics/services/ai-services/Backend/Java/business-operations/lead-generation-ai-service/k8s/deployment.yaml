apiVersion: apps/v1
kind: Deployment
metadata:
  name: lead-generation-ai-service
  namespace: ai-services
  labels:
    app: lead-generation-ai-service
    version: v1
    team: team-ai-business-ops
    component: lead-generation
    part-of: ai-platform
spec:
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: lead-generation-ai-service
  template:
    metadata:
      labels:
        app: lead-generation-ai-service
        version: v1
        team: team-ai-business-ops
        component: lead-generation
    spec:
      serviceAccountName: lead-generation-ai-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: lead-generation-ai-service
        image: gogidix/lead-generation-ai-service:1.0.0
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: SERVER_PORT
          value: "8080"
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: AI_SERVICE_BASE_URL
          value: "http://ai-scoring-service.ai-services.svc.cluster.local:9090"
        - name: AI_SERVICE_SCORING_ENDPOINT
          value: "/api/v1/score"
        - name: AI_SERVICE_ENRICHMENT_ENDPOINT
          value: "/api/v1/enrich"
        - name: AI_SERVICE_TIMEOUT
          value: "5000"
        - name: JAVA_OPTS
          value: "-Xmx1g -Xms512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: lead-generation-ai-service-config
              key: log-level
        - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
          value: "health,info,metrics"
        - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
          value: "always"
        resources:
          requests:
            memory: "768Mi"
            cpu: "250m"
          limits:
            memory: "1536Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /actuator/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 18
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
            runAsUser: 1000
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: lead-generation-ai-service
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: nodepool
                operator: In
                values:
                - ai-workloads
                - general-purpose
