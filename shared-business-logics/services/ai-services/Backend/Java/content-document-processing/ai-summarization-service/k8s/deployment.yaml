apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-summarization-service
  namespace: ai-services
  labels:
    app: ai-summarization-service
    team: team-ai-content-processing
    version: v1
spec:
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: ai-summarization-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ai-summarization-service
        team: team-ai-content-processing
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: ai-summarization-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: ai-summarization-service
        image: gogidix/ai-summarization-service:1.0.0
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: management
          containerPort: 8080
          protocol: TCP
        env:
        - name: SERVER_PORT
          value: "8080"
        - name: SERVICE_NAME
          value: "ai-summarization-service"
        - name: SERVICE_DATABASE
          valueFrom:
            secretKeyRef:
              name: ai-summarization-service-secrets
              key: database-name
        - name: SPRING_DATA_MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: ai-summarization-service-secrets
              key: mongodb-uri
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: ai-summarization-service-config
              key: kafka-bootstrap-servers
        - name: EUREKA_URL
          valueFrom:
            configMapKeyRef:
              name: ai-summarization-service-config
              key: eureka-url
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: ai-summarization-service-config
              key: log-level
        - name: MONGO_LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: ai-summarization-service-config
              key: mongo-log-level
        - name: JAVA_OPTS
          value: "-Xmx1536m -Xms768m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
        resources:
          requests:
            memory: "768Mi"
            cpu: "250m"
          limits:
            memory: "1536Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: management
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: management
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /actuator/health
            port: management
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
