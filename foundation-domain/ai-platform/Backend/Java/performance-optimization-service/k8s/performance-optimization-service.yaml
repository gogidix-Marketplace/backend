---
apiVersion: v1
kind: ConfigMap
metadata:
  name: performance-optimization-service-config
  namespace: ai-platform
  labels:
    app: performance-optimization-service
    version: v1
data:
  application.yml: |
    server:
      port: 8005
    spring:
      application:
        name: performance-optimization-service
      cloud:
        discovery:
          enabled: true
          service-url:
            defaultZone: http://discovery-service.infrastructure.svc.cluster.local:8761/eureka/
        config:
          enabled: true
          uri: http://config-server.infrastructure.svc.cluster.local:8888/
      data:
        mongodb:
          uri: mongodb://perf-opt-user:${MONGODB_PASSWORD}@mongodb.infrastructure.svc.cluster.local:27017/performance-optimization?authSource=admin
      management:
        endpoints:
          web:
            exposure:
              include: health,info,metrics,prometheus
        endpoint:
          health:
            show-details: always
      metrics:
        export:
          prometheus:
            enabled: true
    optimization:
      enable-auto-scaling: true
      resource-utilization-threshold: 70
      enable-cpu-profiling: false
      enable-memory-profiling: false
---
apiVersion: v1
kind: Secret
metadata:
  name: performance-optimization-service-secrets
  namespace: ai-platform
  labels:
    app: performance-optimization-service
type: Opaque
stringData:
  mongodb-password: "ChangeThisInProduction123!"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: performance-optimization-service
  namespace: ai-platform
  labels:
    app: performance-optimization-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: performance-optimization-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: performance-optimization-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8005"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: performance-optimization-service
      containers:
        - name: performance-optimization-service
          image: gogidix/performance-optimization-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8005
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              value: "http://discovery-service.infrastructure.svc.cluster.local:8761/eureka/"
            - name: SPRING_CLOUD_CONFIG_URI
              value: "http://config-server.infrastructure.svc.cluster.local:8888/"
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: performance-optimization-service-secrets
                  key: mongodb-password
          envFrom:
            - configMapRef:
                  name: performance-optimization-service-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8005
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8005
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: config-volume
          configMap:
            name: performance-optimization-service-config
---
apiVersion: v1
kind: Service
metadata:
  name: performance-optimization-service
  namespace: ai-platform
  labels:
    app: performance-optimization-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8005
      targetPort: 8005
      protocol: TCP
  selector:
    app: performance-optimization-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: performance-optimization-service
  namespace: ai-platform
  labels:
    app: performance-optimization-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: performance-optimization-service-hpa
  namespace: ai-platform
  labels:
    app: performance-optimization-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: performance-optimization-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: performance-optimization-service-pdb
  namespace: ai-platform
  labels:
    app: performance-optimization-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: performance-optimization-service
