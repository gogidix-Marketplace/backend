spring:
  application:
    name: air-freight-service
  data:
    mongodb:
      uri: mongodb://localhost:27017
      database: gogidix_airfreight
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092
      bindings:
        airfreightEvents-out-0:
          destination: airfreight-events
          content-type: application/json
server:
  port: 8073
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
logging:
  level:
    com.gogidix.ecommerce.airfreight: DEBUG
