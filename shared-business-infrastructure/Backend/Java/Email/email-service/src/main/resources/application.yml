server:
  port: 8082

spring:
  application:
    name: Email-service
  data:
    mongodb:
      uri: mongodb://localhost:27017
      database: gogidix_email
  cloud:
    stream:
      function:
        definition: emailEvents
      bindings:
        emailEvents-out-0:
          destination: emailEvents
          contentType: application/json

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true