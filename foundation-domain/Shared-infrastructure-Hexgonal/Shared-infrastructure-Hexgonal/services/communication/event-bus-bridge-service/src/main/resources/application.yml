spring:
  application:
    name: event-bus-bridge-service
  data:
    mongodb:
      uri: mongodb://localhost:27017
      database: gogidix_event_bus_service
  redis:
    host: localhost
    port: 6379
    database: 12
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8102

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.gogidix: DEBUG
    org.springframework.data.mongodb: DEBUG
