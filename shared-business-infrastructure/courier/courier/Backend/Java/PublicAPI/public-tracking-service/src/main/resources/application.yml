server:
  port: ${SERVICE_PORT:8119}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: public-tracking-service
  data:
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT:27017}
      database: ${MONGODB_DB:public_tracking}
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: ${spring.application.name}
      properties:
        spring.json.trusted.packages: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    root: INFO
    com.gogidix.courier: ${LOG_LEVEL:DEBUG}

tracking:
  history-days: ${HISTORY_DAYS:90}
