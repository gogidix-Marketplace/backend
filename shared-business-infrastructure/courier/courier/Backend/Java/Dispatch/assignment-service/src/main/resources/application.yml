# =============================================================================
# Assignment Service Configuration
# =============================================================================

server:
  port: ${SERVICE_PORT:8102}
  servlet:
    context-path: /api/v1
  shutdown: graceful

spring:
  application:
    name: assignment-service

  # MongoDB Configuration
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017}
      database: ${MONGODB_DB:assignment_service}
      auto-index-creation: true

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializers.JsonSerializer
      acks: all
      retries: 3
      properties:
        delivery.timeout.ms: 30000
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializers.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
    topic:
      assignment-events: assignment-events

  # Cache Configuration
  cache:
    type: simple
    cache-names: assignments,assignmentStats

  # Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# Logging Configuration
logging:
  level:
    root: INFO
    com.gogidix.courier: ${LOG_LEVEL:DEBUG}
    org.springframework.data.mongodb: ${MONGO_LOG_LEVEL:INFO}
    org.springframework.kafka: ${KAFKA_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} - %msg [tenantId=%X{tenantId}][userId=%X{userId}][traceId=%X{traceId},spanId=%X{spanId}]%n"

# Service Specific Configuration
assignment:
  optimization:
    enabled: ${OPTIMIZATION_ENABLED:true}
    algorithm: ${OPTIMIZATION_ALGORITHM:nearest-driver}
    max-distance-km: ${MAX_DISTANCE_KM:50.0}
    max-drivers-to-consider: ${MAX_DRIVERS_CONSIDER:10}
  timeout:
    pending-minutes: ${PENDING_TIMEOUT_MINUTES:5}
    acceptance-minutes: ${ACCEPTANCE_TIMEOUT_MINUTES:3}
  metrics:
    collection-enabled: ${METRICS_COLLECTION_ENABLED:true}
  history:
    retention-days: ${HISTORY_RETENTION_DAYS:90}
