apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-processing-service
  namespace: business-operations
  labels:
    app: payment-processing-service
    team: team-d-business-operations
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-processing-service
  namespace: business-operations
  labels:
    app: payment-processing-service
    team: team-d-business-operations
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-processing-service
  template:
    metadata:
      labels:
        app: payment-processing-service
        team: team-d-business-operations
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8097"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: payment-processing-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: payment-processing-service
        image: ghcr.io/gogidix/payment-processing-service:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8097
          protocol: TCP
        env:
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: payment-processing-service-secrets
              key: mongodb-uri
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: payment-processing-service-config
              key: redis-host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: payment-processing-service-config
              key: redis-port
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: payment-processing-service-config
              key: kafka-bootstrap-servers
        - name: STRIPE_API_KEY
          valueFrom:
            secretKeyRef:
              name: payment-processing-service-secrets
              key: stripe-api-key
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: payment-processing-service-secrets
              key: stripe-webhook-secret
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
          value: "http://eureka:8761/eureka/"
        resources:
          requests:
            memory: "768Mi"
            cpu: "250m"
          limits:
            memory: "1.5Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8097
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8097
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8097
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 18
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      restartPolicy: Always
