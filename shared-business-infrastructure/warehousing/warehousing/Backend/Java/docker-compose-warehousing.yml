# ==============================================================================
# Warehousing Core - Docker Compose Configuration
# ==============================================================================
# This Docker Compose file orchestrates all warehousing core services along with
# infrastructure components (MongoDB, Kafka, Redis) for local development and testing.
#
# Usage:
#   docker-compose -f docker-compose-warehousing.yml up -d
#   docker-compose -f docker-compose-warehousing.yml down
#
# Environment:
#   - PROFILE: Spring profile to use (default: dev)
#   - MONGODB_VERSION: MongoDB version (default: 7.0)
#   - KAFKA_VERSION: Kafka version (default: 3.7.0)
#   - REDIS_VERSION: Redis version (default: 7.2)
# ==============================================================================

version: '3.8'

networks:
  warehousing-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  mongodb-data-1:
    driver: local
  mongodb-data-2:
    driver: local
  mongodb-data-3:
    driver: local
  mongodb-config-1:
    driver: local
  mongodb-config-2:
    driver: local
  mongodb-config-3:
    driver: local
  zookeeper-data:
    driver: local
  kafka-data-1:
    driver: local
  kafka-data-2:
    driver: local
  kafka-data-3:
    driver: local
  redis-data:
    driver: local

# -----------------------------------------------------------------------------
# Infrastructure Services
# -----------------------------------------------------------------------------

services:
  # ========================================
  # MongoDB Replica Set (3 nodes)
  # ========================================
  mongodb-1:
    image: mongo:${MONGODB_VERSION:-7.0}
    container_name: warehousing-mongodb-1
    hostname: mongodb-1
    networks:
      - warehousing-network
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data-1:/data/db
      - mongodb-config-1:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: warehousing_dev_password
      MONGO_INITDB_DATABASE: warehousing_core
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  mongodb-2:
    image: mongo:${MONGODB_VERSION:-7.0}
    container_name: warehousing-mongodb-2
    hostname: mongodb-2
    networks:
      - warehousing-network
    ports:
      - "27018:27017"
    volumes:
      - mongodb-data-2:/data/db
      - mongodb-config-2:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: warehousing_dev_password
      MONGO_INITDB_DATABASE: warehousing_core
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    depends_on:
      - mongodb-1
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  mongodb-3:
    image: mongo:${MONGODB_VERSION:-7.0}
    container_name: warehousing-mongodb-3
    hostname: mongodb-3
    networks:
      - warehousing-network
    ports:
      - "27019:27017"
    volumes:
      - mongodb-data-3:/data/db
      - mongodb-config-3:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: warehousing_dev_password
      MONGO_INITDB_DATABASE: warehousing_core
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    depends_on:
      - mongodb-1
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # MongoDB Replica Set Initializer
  mongodb-init:
    image: mongo:${MONGODB_VERSION:-7.0}
    container_name: warehousing-mongodb-init
    networks:
      - warehousing-network
    depends_on:
      - mongodb-1
      - mongodb-2
      - mongodb-3
    command: >
      bash -c "
      sleep 30 &&
      mongosh --host mongodb-1:27017 -u admin -p warehousing_dev_password --authenticationDatabase admin --eval '
      try {
        rs.status();
        print(\"Replica set already initialized\");
      } catch(e) {
        rs.initiate({
          _id: \"rs0\",
          members: [
            {_id: 0, host: \"mongodb-1:27017\"},
            {_id: 1, host: \"mongodb-2:27017\"},
            {_id: 2, host: \"mongodb-3:27017\"}
          ]
        });
        print(\"Replica set initialized\");
      }
      '
      "

  # ========================================
  # Zookeeper (required for Kafka)
  # ========================================
  zookeeper:
    image: bitnami/zookeeper:${ZOOKEEPER_VERSION:-3.9.2}
    container_name: warehousing-zookeeper
    hostname: zookeeper
    networks:
      - warehousing-network
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ALLOW_ANONYMOUS_LOGIN: "yes"
    volumes:
      - zookeeper-data:/bitnami/zookeeper
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # Kafka Cluster (3 brokers)
  # ========================================
  kafka-1:
    image: bitnami/kafka:${KAFKA_VERSION:-3.7.0}
    container_name: warehousing-kafka-1
    hostname: kafka-1
    networks:
      - warehousing-network
    ports:
      - "9092:9092"
      - "19092:19092"
    environment:
      KAFKA_CFG_BROKER_ID: 1
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:19092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:19092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_LOG_RETENTION_HOURS: 168
      KAFKA_CFG_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data-1:/bitnami/kafka
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  kafka-2:
    image: bitnami/kafka:${KAFKA_VERSION:-3.7.0}
    container_name: warehousing-kafka-2
    hostname: kafka-2
    networks:
      - warehousing-network
    ports:
      - "9093:9093"
      - "19093:19093"
    environment:
      KAFKA_CFG_BROKER_ID: 2
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9093,EXTERNAL://:19093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9093,EXTERNAL://localhost:19093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data-2:/bitnami/kafka
    depends_on:
      - zookeeper

  kafka-3:
    image: bitnami/kafka:${KAFKA_VERSION:-3.7.0}
    container_name: warehousing-kafka-3
    hostname: kafka-3
    networks:
      - warehousing-network
    ports:
      - "9094:9094"
      - "19094:19094"
    environment:
      KAFKA_CFG_BROKER_ID: 3
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9094,EXTERNAL://:19094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9094,EXTERNAL://localhost:19094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data-3:/bitnami/kafka
    depends_on:
      - zookeeper

  # ========================================
  # Redis with Redis Commander
  # ========================================
  redis:
    image: bitnami/redis:${REDIS_VERSION:-7.2}
    container_name: warehousing-redis
    hostname: redis
    networks:
      - warehousing-network
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: warehousing_redis_password
      REDIS_AOF_ENABLED: "yes"
      REDIS_MAXMEMORY: 256mb
      REDIS_MAXMEMORY_POLICY: allkeys-lru
    volumes:
      - redis-data:/bitnami/redis/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "warehousing_redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: warehousing-redis-commander
    hostname: redis-commander
    networks:
      - warehousing-network
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379:0:warehousing_redis_password
      HTTP_USER: admin
      HTTP_PASSWORD: admin
    depends_on:
      - redis

  # ========================================
  # Eureka Server (Service Discovery)
  # ========================================
  eureka-server:
    image: gogidix/eureka-server:latest
    container_name: warehousing-eureka-server
    hostname: eureka-server
    networks:
      - warehousing-network
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8761
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

# -----------------------------------------------------------------------------
# Analytics Services
# -----------------------------------------------------------------------------

  fulfillment-analytics-service:
    image: gogidix/fulfillment-analytics-service:latest
    container_name: fulfillment-analytics-service
    hostname: fulfillment-analytics-service
    networks:
      - warehousing-network
    ports:
      - "8250:8250"
      - "8251:8251"
    environment:
      SPRING_PROFILES_ACTIVE: ${PROFILE:-dev},docker
      SERVER_PORT: 8250
      MANAGEMENT_SERVER_PORT: 8251
      SPRING_APPLICATION_NAME: fulfillment-analytics-service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9093,kafka-3:9094
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: warehousing_redis_password
      SPRING_DATA_MONGODB_URI: mongodb://admin:warehousing_dev_password@mongodb-1:27017,mongodb-2:27017,mongodb-3:27017/fulfillment_analytics?authSource=admin&replicaSet=rs0
      JAVA_OPTS: -XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -Xms256m -Xmx512m
    depends_on:
      - mongodb-1
      - kafka-1
      - redis
      - eureka-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8251/actuator/health"]
