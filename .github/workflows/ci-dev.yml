name: CI - Dev Branch (Maven Reactor)

on:
  push:
    branches: [Dev]
  pull_request:
    branches: [Dev]
  workflow_dispatch:

concurrency:
  group: ci-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  MAVEN_OPTS: -Xmx3072m

jobs:
  install-shared-libraries:
    name: Install Shared Libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: 'maven'
      - name: Install shared-libraries to local .m2
        working-directory: foundation-domain/shared-libraries/shared-libraries/Backend/Java
        run: mvn clean install -DskipTests -B -q
      - name: Cache .m2 repository
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: m2-shared-libs-dev-${{ github.sha }}

  # Foundation Domain Reactor Builds
  build-foundation:
    name: Foundation - ${{ matrix.parent }}
    runs-on: ubuntu-latest
    needs: install-shared-libraries
    strategy:
      fail-fast: true
      matrix:
        parent:
          - ai-platform
          - centralized-configuration
          - Shared-infrastructure-Hexgonal/Shared-infrastructure-Hexgonal
          - platform/platform/Backend/Java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: 'maven'
      - name: Restore shared-libraries from cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: m2-shared-libs-dev-${{ github.sha }}
      - name: Check parent POM exists
        id: check
        run: |
          POM_PATH="foundation-domain/${{ matrix.parent }}/pom.xml"
          if [ -f "$POM_PATH" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✓ Found: $POM_PATH"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::error::POM not found: $POM_PATH"
            exit 1
          fi
      - name: Build ${{ matrix.parent }} (Maven Reactor)
        if: steps.check.outputs.exists == 'true'
        working-directory: foundation-domain/${{ matrix.parent }}
        run: mvn clean verify -T 1C -B -DskipTests=false

  # Management Domain Reactor Builds
  build-management:
    name: Management - ${{ matrix.parent }}
    runs-on: ubuntu-latest
    needs: install-shared-libraries
    strategy:
      fail-fast: true
      matrix:
        parent:
          - Foundation-Services-Monitoring/Backend
          - Global-business-management/Backend/Java
          - Human-resource/Human-resource/Backend/Java
          - Sales-department/Backend/Java
          - System-Administrator/Backend
          - Customer-support/Customer-support/Backend/Java
          - Digital-marketing/Backend/Java
          - Executive-domain-X/Executive-domain-X/Backend/Java
          - Finance-department/Backend/Java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: 'maven'
      - name: Restore shared-libraries from cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: m2-shared-libs-dev-${{ github.sha }}
      - name: Check parent POM exists
        id: check
        run: |
          POM_PATH="management-domain/${{ matrix.parent }}/pom.xml"
          if [ -f "$POM_PATH" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✓ Found: $POM_PATH"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::error::POM not found: $POM_PATH"
            exit 1
          fi
      - name: Build ${{ matrix.parent }} (Maven Reactor)
        if: steps.check.outputs.exists == 'true'
        working-directory: management-domain/${{ matrix.parent }}
        run: mvn clean verify -T 1C -B -DskipTests=false

  # Shared Business Logics Reactor Build
  build-shared-logics:
    name: Shared Business Logics
    runs-on: ubuntu-latest
    needs: install-shared-libraries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: 'maven'
      - name: Restore shared-libraries from cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: m2-shared-libs-dev-${{ github.sha }}
      - name: Build shared-business-logics (Maven Reactor)
        working-directory: shared-business-logics
        run: mvn clean verify -T 1C -B -DskipTests=false

  # Shared Business Infrastructure Reactor Builds
  build-shared-infra:
    name: Shared Infra - ${{ matrix.parent }}
    runs-on: ubuntu-latest
    needs: install-shared-libraries
    strategy:
      fail-fast: true
      matrix:
        parent:
          - Backend/Java
          - courier/courier
          - warehousing/warehousing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: 'maven'
      - name: Restore shared-libraries from cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: m2-shared-libs-dev-${{ github.sha }}
      - name: Check parent POM exists
        id: check
        run: |
          POM_PATH="shared-business-infrastructure/${{ matrix.parent }}/pom.xml"
          if [ -f "$POM_PATH" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✓ Found: $POM_PATH"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::warning::POM not found: $POM_PATH (may be optional)"
          fi
      - name: Build ${{ matrix.parent }} (Maven Reactor)
        if: steps.check.outputs.exists == 'true'
        working-directory: shared-business-infrastructure/${{ matrix.parent }}
        run: mvn clean verify -T 1C -B -DskipTests=false

  summary:
    name: Dev CI Summary
    runs-on: ubuntu-latest
    needs: [build-foundation, build-management, build-shared-logics, build-shared-infra]
    if: always()
    steps:
      - run: |
          echo "## CI - Dev Branch (Maven Reactor) Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Foundation Domain | ${{ needs.build-foundation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Management Domain | ${{ needs.build-management.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Shared Business Logics | ${{ needs.build-shared-logics.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Shared Business Infrastructure | ${{ needs.build-shared-infra.result }} |" >> $GITHUB_STEP_SUMMARY
