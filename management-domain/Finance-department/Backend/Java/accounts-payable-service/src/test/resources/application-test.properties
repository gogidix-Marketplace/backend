# Test Configuration for Accounts Payable Service

spring.application.name=accounts-payable-service-test

# MongoDB Test Configuration (using embedded or test container)
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=accounts_payable_test
spring.data.mongodb.auto-index-creation=true

# Kafka Test Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=accounts-payable-test-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.properties.spring.json.trusted.packages=*

# Redis Test Configuration
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.database=15

# Logging
logging.level.root=INFO
logging.level.com.gogidix.finance.accountspayable=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.kafka=DEBUG

# Test-specific properties
test.tenant.id=tenant-test-001
test.vendor.id=vendor-test-001
test.user.id=user-test@example.com
