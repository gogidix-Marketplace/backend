spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: executive_dashboard_prod
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

logging:
  level:
    com.gogidix: INFO
    org.springframework: WARN
