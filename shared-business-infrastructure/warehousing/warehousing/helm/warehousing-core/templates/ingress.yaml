{{/*
===============================================================================
Ingress Template
===============================================================================
Creates Kubernetes Ingress for external access to warehousing services.
*/}}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "warehousing-core.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "warehousing-core.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingress
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
{{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
{{- end }}
  rules:
  {{- range .Values.ingress.hosts }}
  - host: {{ .host | quote }}
    http:
      paths:
        {{- range .paths }}
        - path: {{ .path }}
          pathType: {{ .pathType }}
          backend:
            service:
              name: {{ .serviceName }}
              port:
                number: {{ .servicePort }}
        {{- end }}
  {{- end }}
{{- end }}

{{/*
Ingress for public API services with separate configuration
*/}}
{{- if .Values.ingress.public }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "warehousing-core.fullname" . }}-public
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "warehousing-core.labels" . | nindent 4 }}
    app.kubernetes.io/component: public-ingress
  annotations:
    {{- toYaml .Values.ingress.public.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.public.className | default .Values.ingress.className }}
{{- if .Values.ingress.public.tls }}
  tls:
    {{- range .Values.ingress.public.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
{{- end }}
  rules:
  {{- range .Values.ingress.public.hosts }}
  - host: {{ .host | quote }}
    http:
      paths:
        {{- range .paths }}
        - path: {{ .path }}
          pathType: {{ .pathType }}
          backend:
            service:
              name: {{ .serviceName }}
              port:
                number: {{ .servicePort }}
        {{- end }}
  {{- end }}
{{- end }}
