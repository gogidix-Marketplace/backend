# Test Configuration for Audit Trail Service

spring.application.name=audit-trail-service-test

# Database Configuration (TestContainers will override this)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Redis Configuration (disabled for tests)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Kafka Configuration (disabled for tests)
spring.kafka.enabled=false
spring.kafka.bootstrap-servers=localhost:9092

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.gogidix=DEBUG
logging.level.org.springframework.test=INFO
logging.level.org.hibernate.SQL=ERROR
