server:
  port: 8082

spring:
  application:
    name: onboarding-tracker-service

  data:
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT:27017}
      database: ${MONGODB_DATABASE:onboarding_tracker_db}
      username: ${MONGODB_USERNAME:}
      password: ${MONGODB_PASSWORD:}
      uri: ${MONGODB_URI:mongodb://localhost:27017/onboarding_tracker_db}
      auto-index-creation: true

# Onboarding Service Configuration
onboarding:
  stale-threshold-hours: 24
  max-retries: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    com.gogidix.transaction.onboarding: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} - %msg%n'
