  warehousing-alerts.yml: |
    groups:
      - name: warehousing-alerts
        interval: 30s
        rules:
          # Service Health Alerts
          - alert: ServiceDown
            expr: up{job=~".*service"} == 0
            for: 2m
            labels:
              severity: critical
              component: warehousing
            annotations:
              summary: "Service {{ $labels.job }} is down"
              description: "{{ $labels.job }} has been down for more than 2 minutes."

          - alert: HighErrorRate
            expr: |
              rate(http_server_requests_seconds_count{status=~"5.."}[5m]) /
              rate(http_server_requests_seconds_count[5m]) > 0.05
            for: 5m
            labels:
              severity: warning
              component: warehousing
            annotations:
              summary: "High error rate on {{ $labels.job }}"
              description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.job }}."

          - alert: HighLatency
            expr: |
              histogram_quantile(0.95,
                rate(http_server_requests_seconds_bucket[5m])
              ) > 1
            for: 5m
            labels:
              severity: warning
              component: warehousing
            annotations:
              summary: "High latency on {{ $labels.job }}"
              description: "P95 latency is {{ $value }}s for {{ $labels.job }}."

          # JVM Alerts
          - alert: HighMemoryUsage
            expr: |
              jvm_memory_used_bytes{area="heap"} /
              jvm_memory_max_bytes{area="heap"} > 0.9
            for: 5m
            labels:
              severity: warning
              component: warehousing
            annotations:
              summary: "High memory usage on {{ $labels.job }}"
              description: "Heap memory usage is {{ $value | humanizePercentage }} for {{ $labels.job }}."

          - alert: HighGCPauseTime
            expr: |
              rate(jvm_gc_pause_seconds_sum[5m]) > 0.1
            for: 5m
            labels:
              severity: warning
              component: warehousing
            annotations:
              summary: "High GC pause time on {{ $labels.job }}"
              description: "GC pause time is {{ $value }}s/s for {{ $labels.job }}."

          # Database Alerts
          - alert: HighMongoDBLatency
            expr: |
              histogram_quantile(0.95,
                rate(mongo_driver_commands_seconds_bucket[5m])
              ) > 0.5
            for: 5m
            labels:
              severity: warning
              component: warehousing
            annotations:
              summary: "High MongoDB latency on {{ $labels.job }}"
              description: "P95 MongoDB latency is {{ $value }}s for {{ $labels.job }}."

          - alert: MongoDBConnectionPoolExhausted
            expr: |
              mongo_driver_pool_wait_queues_total > 10
            for: 2m
            labels:
              severity: critical
              component: warehousing
            annotations:
              summary: "MongoDB connection pool exhausted on {{ $labels.job }}"
              description: "Connection pool wait queue is {{ $value }} for {{ $labels.job }}."

          # Kafka Alerts
          - alert: KafkaConsumerLag
            expr: |
              kafka_consumergroup_lag > 1000
            for: 5m
            labels:
              severity: warning
              component: warehousing
            annotations:
              summary: "High Kafka consumer lag on {{ $labels.job }}"
              description: "Consumer lag is {{ $value }} for {{ $labels.job }}."

          # Inventory Alerts
          - alert: LowStockItems
            expr: |
              inventory_items_low_count{tenant_id="*"} > 100
            for: 1m
            labels:
              severity: info
              component: inventory
            annotations:
              summary: "Many low stock items for tenant {{ $labels.tenant_id }}"
              description: "{{ $value }} items are below reorder threshold."

          - alert: StockoutDetected
            expr: |
              inventory_items_stockout{tenant_id="*"} > 10
            for: 1m
            labels:
              severity: warning
              component: inventory
            annotations:
              summary: "Stockouts detected for tenant {{ $labels.tenant_id }}"
              description: "{{ $value }} items are out of stock."

          # Fulfillment Alerts
          - alert: OrdersPendingTooLong
            expr: |
              fulfillment_orders_pending_age_seconds > 3600
            for: 5m
            labels:
              severity: warning
              component: fulfillment
            annotations:
              summary: "Orders pending for over 1 hour"
              description: "{{ $value }} orders have been pending for over 1 hour."

          - alert: PickRateBelowThreshold
            expr: |
              rate(fulfillment_picks_total[1h]) < 10
            for: 10m
            labels:
              severity: warning
              component: fulfillment
            annotations:
              summary: "Low picking rate"
              description: "Picking rate is below 10 picks/hour."

          # Storage Alerts
          - alert: StorageCapacityHigh
            expr: |
              storage_utilization_percent > 90
            for: 5m
            labels:
              severity: warning
              component: storage
            annotations:
              summary: "Storage capacity high for warehouse {{ $labels.warehouse_id }}"
              description: "Storage utilization is {{ $value }}%."

          - alert: StorageCapacityCritical
            expr: |
              storage_utilization_percent > 95
            for: 2m
            labels:
              severity: critical
              component: storage
            annotations:
              summary: "Storage capacity critical for warehouse {{ $labels.warehouse_id }}"
              description: "Storage utilization is {{ $value }}%."

          # Expiration Alerts
          - alert: ItemsExpiringSoon
            expr: |
              inventory_items_expiring_7days > 50
            for: 1m
            labels:
              severity: warning
              component: inventory
            annotations:
              summary: "Many items expiring soon"
              description: "{{ $value }} items will expire within 7 days."

          - alert: ExpiredItemsNotQuarantined
            expr: |
              inventory_items_expired_not_quarantined > 0
            for: 5m
            labels:
              severity: critical
              component: inventory
            annotations:
              summary: "Expired items not quarantined"
              description: "{{ $value }} expired items are not in quarantine."

          # Pod Alerts
          - alert: PodNotReady
            expr: |
              kube_pod_status_ready{namespace="warehousing-core", condition="false"} == 1
            for: 5m
            labels:
              severity: warning
              component: kubernetes
            annotations:
              summary: "Pod {{ $labels.pod }} not ready"
              description: "Pod {{ $labels.pod }} has been not ready for more than 5 minutes."

          - alert: PodCrashLooping
            expr: |
              rate(kube_pod_container_status_restarts_total{namespace="warehousing-core"}[15m]) > 0
            for: 5m
            labels:
              severity: critical
              component: kubernetes
            annotations:
              summary: "Pod {{ $labels.pod }} is crash looping"
              description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last 15 minutes."
