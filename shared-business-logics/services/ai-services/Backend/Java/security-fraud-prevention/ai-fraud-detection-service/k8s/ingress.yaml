apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-fraud-detection-service
  namespace: ai-services
  labels:
    app: ai-fraud-detection-service
    version: v1
    team: team-ai-security
    domain: ai-services
    component: security-fraud-prevention
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/rate-limit: "200"
    nginx.ingress.kubernetes.io/limit-connections: "100"
    nginx.ingress.kubernetes.io/limit-rps: "200"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    nginx.ingress.kubernetes.io/enable-opentracing: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ai-fraud-detection.gogidix.com
    - ai-fraud-detection-api.gogidix.com
    secretName: ai-fraud-detection-service-tls
  rules:
  - host: ai-fraud-detection.gogidix.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ai-fraud-detection-service
            port:
              number: 8090
  - host: ai-fraud-detection-api.gogidix.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: ai-fraud-detection-service
            port:
              number: 8090
      - path: /actuator
        pathType: Prefix
        backend:
          service:
            name: ai-fraud-detection-service
            port:
              number: 8090
