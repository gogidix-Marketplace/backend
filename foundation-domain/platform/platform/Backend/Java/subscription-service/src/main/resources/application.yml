spring:
  application:
    name: subscription-service

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/subscription_service}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 2
        max-wait: -1ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: subscription-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

server:
  port: ${SERVER_PORT:8402}
  servlet:
    context-path: /subscriptions
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,httptrace,env,configprops,beans,threaddump,heapdump
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active:default}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
      sla:
        http.server.requests: 100ms,200ms,500ms,1s,2s

# Stripe Configuration
stripe:
  api-key: ${STRIPE_API_KEY:sk_test_test}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_test}
  success-url: ${STRIPE_SUCCESS_URL:https://app.gogidix.com/billing/success}
  cancel-url: ${STRIPE_CANCEL_URL:https://app.gogidix.com/billing/cancel}

# Application properties
subscription:
  billing:
    invoice-days-before-due: 7
    payment-reminder-days: 3
    dunning-max-attempts: 3
    auto-renewal-enabled: true

  trial:
    default-days: 14
    reminder-days-before-end: 3

  plans:
    allow-custom-plans: false
    require-payment-method: true

# Kafka topics
topics:
  subscription-created: subscription.created
  subscription-updated: subscription.updated
  subscription-cancelled: subscription.cancelled
  subscription-renewed: subscription.renewed
  invoice-generated: invoice.generated
  invoice-paid: invoice.paid
  invoice-overdue: invoice.overdue
  payment-processed: payment.processed
  payment-failed: payment.failed
  plan-upgraded: plan.upgraded
  plan-downgraded: plan.downgraded
  trial-started: trial.started
  trial-ended: trial.ended

logging:
  level:
    root: INFO
    com.gogidix: DEBUG
    com.stripe: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/subscription-service.log
    max-size: 100MB
    max-history: 30

---
# Development profile
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true

logging:
  level:
    com.gogidix: DEBUG
    com.stripe: DEBUG

---
# Production profile
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.gogidix: INFO
    com.stripe: WARN
