apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-recommendation-service
  namespace: ai-services
  labels:
    app: ai-recommendation-service
    team: team-ai-customer-experience
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-recommendation-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 4
        periodSeconds: 60
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-recommendation-service-hpa
  namespace: ai-services
  labels:
    app: ai-recommendation-service
    team: team-ai-customer-experience
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ai-recommendation-service
