# Centralized Real-time Data Service Configuration

# Application name and port
spring.application.name=centralized-real-time-data
server.port=8103
server.servlet.context-path=/api/realtime

# MongoDB configuration
spring.data.mongodb.host=${MONGODB_HOST:localhost}
spring.data.mongodb.port=${MONGODB_PORT:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:realtime_db}
spring.data.mongodb.username=${MONGODB_USERNAME:}
spring.data.mongodb.password=${MONGODB_PASSWORD:}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/realtime_db}
spring.data.mongodb.auto-index-creation=true

# Eureka client configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}

# Actuator endpoints configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized

# Logging configuration
logging.level.com.gogidix.centralizeddashboard.realtime=INFO
logging.level.org.springframework=INFO

# WebSocket configuration
websocket.enabled=true
websocket.allowed-origins=*
websocket.heartbeat.interval=30s

# Redis Configuration for real-time data caching
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.timeout=2000
spring.redis.database=2

# Kafka configuration for real-time events
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=realtime-data-consumer
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.JsonSerializer

# Real-time data configuration
realtime.data.buffer-size=1000
realtime.data.flush-interval=5s
realtime.streaming.enabled=true
