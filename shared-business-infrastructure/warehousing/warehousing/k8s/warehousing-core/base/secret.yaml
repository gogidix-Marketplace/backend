apiVersion: v1
kind: Secret
metadata:
  name: warehousing-common-secret
  namespace: warehousing-core
type: Opaque
stringData:
  # MongoDB Credentials (change these values)
  MONGODB_USERNAME: "warehousing_user"
  MONGODB_PASSWORD: "change_me_in_production"

  # Redis Credentials
  REDIS_PASSWORD: "change_me_in_production"

  # Kafka Credentials (if using SASL/SSL)
  KAFKA_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"kafka_user\" password=\"change_me_in_production\";"
  KAFKA_SASL_MECHANISM: "PLAIN"

  # JWT Secret for token validation
  JWT_SECRET: "change_me_in_production_use_256_bit_key"

  # External API Keys
  SHIPPING_CARRIER_API_KEY: "change_me"
  SHIPPING_CARRIER_API_SECRET: "change_me"
  BARCODE_GENERATION_API_KEY: "change_me"
  LABEL_PRINTING_API_KEY: "change_me"

  # IoT/Scanner Integration
  WAREHOUSE_IOT_HUB_CONNECTION_STRING: "change_me"
  WAREHOUSE_SCANNER_API_KEY: "change_me"

  # Storage Credentials
  AWS_ACCESS_KEY_ID: "change_me"
  AWS_SECRET_ACCESS_KEY: "change_me"
  AWS_REGION: "us-east-1"
  AZURE_STORAGE_ACCOUNT: "change_me"
  AZURE_STORAGE_KEY: "change_me"

---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-warehousing-secret
  namespace: warehousing-core
type: Opaque
stringData:
  mongodb-root-password: "change_me_root_password"
  mongodb-password: "change_me_user_password"

---
apiVersion: v1
kind: Secret
metadata:
  name: redis-warehousing-secret
  namespace: warehousing-core
type: Opaque
stringData:
  redis-password: "change_me_redis_password"

---
apiVersion: v1
kind: Secret
metadata:
  name: kafka-warehousing-secret
  namespace: warehousing-core
type: Opaque
stringData:
  kafka-client-password: "change_me_kafka_password"
