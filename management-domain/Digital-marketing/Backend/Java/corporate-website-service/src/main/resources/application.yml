spring:
  application:
    name: corporate-website-service

  profiles:
    active: dev

  data:
    mongodb:
      uri: mongodb://${MONGODB_HOST:localhost}:${MONGODB_PORT:27017}/${MONGODB_DATABASE:corporate_website}?authSource=admin
      auto-index-creation: true

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  web:
    locale: en
    locale-resolver: fixed

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.gogidix.corporate.website: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

application:
  security:
    enabled: false
    api-key: ${API_KEY:gogidix-secret-key}

  content:
    cache:
      ttl: 600
      max-size: 1000
    default-language: en
    default-region: NG

  integration:
    lead-generation:
      base-url: ${LEAD_SERVICE_URL:http://localhost:8081}
      timeout: 5000
      enabled: true
    analytics:
      base-url: ${ANALYTICS_SERVICE_URL:http://localhost:8082}
      timeout: 3000
      enabled: true
    content-management:
      base-url: ${CONTENT_SERVICE_URL:http://localhost:8083}
      timeout: 5000
      enabled: true

  sitemap:
    base-url: ${SITEMAP_BASE_URL:https://gogidix.com}
    changefreq: weekly
    priority: 0.8

  seo:
    default-title: Gogidix - Digital Solutions for African Businesses
    default-description: Gogidix provides innovative digital solutions tailored for African businesses. Discover our services across Nigeria, Kenya, Ghana, South Africa, and the US.
    default-keywords: gogidix,digital,africa,business,technology
    og-image: https://gogidix.com/assets/og-default.jpg
    twitter-card: summary_large_image

---

spring:
  config:
    activate:
      on-profile: dev

  data:
    mongodb:
      uri: mongodb://localhost:27017/corporate_website_dev?authSource=admin

logging:
  level:
    root: DEBUG
    com.gogidix.corporate.website: DEBUG

---

spring:
  config:
    activate:
      on-profile: test

  data:
    mongodb:
      uri: mongodb://localhost:27017/corporate_website_test?authSource=admin

logging:
  level:
    root: WARN
    com.gogidix.corporate.website: DEBUG

---

spring:
  config:
    activate:
      on-profile: prod

  data:
    mongodb:
      uri: ${MONGODB_URI}

logging:
  level:
    root: WARN
    com.gogidix.corporate.website: INFO
