name: Build Transaction Orchestration Services

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

env:
  JAVA_VERSION: '17'
  MAVEN_VERSION: '3.9.12'
  DOCKER_REGISTRY: ghcr.io
  DOMAIN_NAME: transaction-orchestration

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v3
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: Set up Maven
      uses: stCarolas/setup-maven@v4.5
      with:
        maven-version: ${{ env.MAVEN_VERSION }}

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build audit-trail-service
      run: mvn clean compile
      working-directory: Backend/Java/audit-trail-service

    - name: Build onboarding-tracker-service
      run: mvn clean compile
      working-directory: Backend/Java/onboarding-tracker-service

    - name: Build progress-step-service
      run: mvn clean compile
      working-directory: Backend/Java/progress-step-service

    - name: Build status-broadcast-service
      run: mvn clean compile
      working-directory: Backend/Java/status-broadcast-service

    - name: Build transaction-monitoring-service
      run: mvn clean compile
      working-directory: Backend/Java/transaction-monitoring-service

    - name: Package audit-trail-service
      run: mvn package -DskipTests
      working-directory: Backend/Java/audit-trail-service

    - name: Package onboarding-tracker-service
      run: mvn package -DskipTests
      working-directory: Backend/Java/onboarding-tracker-service

    - name: Package progress-step-service
      run: mvn package -DskipTests
      working-directory: Backend/Java/progress-step-service

    - name: Package status-broadcast-service
      run: mvn package -DskipTests
      working-directory: Backend/Java/status-broadcast-service

    - name: Package transaction-monitoring-service
      run: mvn package -DskipTests
      working-directory: Backend/Java/transaction-monitoring-service

    - name: Build Docker image - audit-trail-service
      run: |
        docker build -t ghcr.io/${{ github.repository_owner }}/audit-trail-service:${{ github.sha }} .
        docker tag ghcr.io/${{ github.repository_owner }}/audit-trail-service:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/audit-trail-service:latest
      working-directory: Backend/Java/audit-trail-service

    - name: Build Docker image - onboarding-tracker-service
      run: |
        docker build -t ghcr.io/${{ github.repository_owner }}/onboarding-tracker-service:${{ github.sha }} .
        docker tag ghcr.io/${{ github.repository_owner }}/onboarding-tracker-service:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/onboarding-tracker-service:latest
      working-directory: Backend/Java/onboarding-tracker-service

    - name: Build Docker image - progress-step-service
      run: |
        docker build -t ghcr.io/${{ github.repository_owner }}/progress-step-service:${{ github.sha }} .
        docker tag ghcr.io/${{ github.repository_owner }}/progress-step-service:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/progress-step-service:latest
      working-directory: Backend/Java/progress-step-service

    - name: Build Docker image - status-broadcast-service
      run: |
        docker build -t ghcr.io/${{ github.repository_owner }}/status-broadcast-service:${{ github.sha }} .
        docker tag ghcr.io/${{ github.repository_owner }}/status-broadcast-service:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/status-broadcast-service:latest
      working-directory: Backend/Java/status-broadcast-service

    - name: Build Docker image - transaction-monitoring-service
      run: |
        docker build -t ghcr.io/${{ github.repository_owner }}/transaction-monitoring-service:${{ github.sha }} .
        docker tag ghcr.io/${{ github.repository_owner }}/transaction-monitoring-service:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/transaction-monitoring-service:latest
      working-directory: Backend/Java/transaction-monitoring-service

    - name: Log in to Docker Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v2
      with:
        registry: ${{ env.DOCKER_REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push Docker images
      if: github.event_name != 'pull_request'
      run: |
        docker push ghcr.io/${{ github.repository_owner }}/audit-trail-service:${{ github.sha }}
        docker push ghcr.io/${{ github.repository_owner }}/audit-trail-service:latest
        docker push ghcr.io/${{ github.repository_owner }}/onboarding-tracker-service:${{ github.sha }}
        docker push ghcr.io/${{ github.repository_owner }}/onboarding-tracker-service:latest
        docker push ghcr.io/${{ github.repository_owner }}/progress-step-service:${{ github.sha }}
        docker push ghcr.io/${{ github.repository_owner }}/progress-step-service:latest
        docker push ghcr.io/${{ github.repository_owner }}/status-broadcast-service:${{ github.sha }}
        docker push ghcr.io/${{ github.repository_owner }}/status-broadcast-service:latest
        docker push ghcr.io/${{ github.repository_owner }}/transaction-monitoring-service:${{ github.sha }}
        docker push ghcr.io/${{ github.repository_owner }}/transaction-monitoring-service:latest

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: transaction-orchestration-build-artifacts
        path: |
          Backend/Java/audit-trail-service/target/
          Backend/Java/onboarding-tracker-service/target/
          Backend/Java/progress-step-service/target/
          Backend/Java/status-broadcast-service/target/
          Backend/Java/transaction-monitoring-service/target/
        retention-days: 7
