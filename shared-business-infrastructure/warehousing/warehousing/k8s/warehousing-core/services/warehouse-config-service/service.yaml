apiVersion: v1
kind: Service
metadata:
  name: warehouse-config-service
  namespace: warehousing-core
  labels:
    app: warehouse-config-service
    service: warehouse-config-service
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
  - name: http
    port: 8221
    targetPort: http
    protocol: TCP
  - name: management
    port: 8222
    targetPort: management
    protocol: TCP
  selector:
    app: warehouse-config-service
---
apiVersion: v1
kind: Service
metadata:
  name: warehouse-config-service-headless
  namespace: warehousing-core
  labels:
    app: warehouse-config-service
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8221
    targetPort: http
    protocol: TCP
  selector:
    app: warehouse-config-service
