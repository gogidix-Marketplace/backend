apiVersion: v1
kind: Secret
metadata:
  name: payment-processing-service-secrets
  namespace: business-operations
  labels:
    app: payment-processing-service
    team: team-d-business-operations
type: Opaque
stringData:
  mongodb-uri: "mongodb://payment_user:CHANGE_ME_PROD_PASSWORD@mongodb:27017/gogidix_payment_processing?authSource=admin"
  stripe-api-key: "CHANGE_ME_STRIPE_API_KEY"
  stripe-webhook-secret: "CHANGE_ME_WEBHOOK_SECRET"
