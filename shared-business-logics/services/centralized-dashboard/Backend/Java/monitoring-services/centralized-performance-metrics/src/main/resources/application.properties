# Centralized Performance Metrics Service Configuration

# Application name and port
spring.application.name=centralized-performance-metrics
server.port=8102
server.servlet.context-path=/api/performance

# MongoDB configuration
spring.data.mongodb.host=${MONGODB_HOST:localhost}
spring.data.mongodb.port=${MONGODB_PORT:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:metrics_db}
spring.data.mongodb.username=${MONGODB_USERNAME:}
spring.data.mongodb.password=${MONGODB_PASSWORD:}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/metrics_db}
spring.data.mongodb.auto-index-creation=true

# Eureka client configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}

# Actuator endpoints configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true

# Logging configuration
logging.level.com.gogidix.centralizeddashboard.metrics=INFO
logging.level.org.springframework=INFO

# Redis Configuration for caching
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.timeout=2000
spring.redis.database=1

# Metrics collection configuration
metrics.collection.enabled=true
metrics.collection.interval=30s
metrics.retention.days=30

# Performance monitoring
performance.monitoring.enabled=true
performance.alerts.enabled=true
performance.thresholds.cpu=80
performance.thresholds.memory=85
performance.thresholds.disk=90
