name: CI - Staging/UAT (Production-Ready)

on:
  pull_request:
    branches: [staging/uat]
    types: [opened, synchronize, reopened]
  push:
    branches: [staging/uat]
  workflow_dispatch:

concurrency:
  group: ci-staging-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  MAVEN_OPTS: -Xmx3072m

jobs:
  # STEP 1: Install Shared Libraries
  install-shared-libraries:
    name: Install Shared Libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: 'maven'
      - name: Install shared-libraries to local .m2
        working-directory: foundation-domain/shared-libraries/shared-libraries/Backend/Java
        run: mvn clean install -DskipTests -B -q
      - name: Cache .m2 repository
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: m2-shared-libs-staging-${{ github.sha }}

  # STEP 2: Foundation Domain - Maven Reactor Build
  build-foundation:
    name: Foundation - ${{ matrix.parent }}
    runs-on: ubuntu-latest
    needs: install-shared-libraries
    strategy:
      fail-fast: true
      matrix:
        parent:
          - ai-platform
          - centralized-configuration
          - Shared-infrastructure-Hexgonal/Shared-infrastructure-Hexgonal
          - platform/platform/Backend/Java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: 'maven'
      - name: Restore shared-libraries from cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: m2-shared-libs-staging-${{ github.sha }}
      - name: Check parent POM exists
        id: check
        run: |
          POM_PATH="foundation-domain/${{ matrix.parent }}/pom.xml"
          if [ -f "$POM_PATH" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::POM not found: $POM_PATH"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Maven Reactor Build & Test
        if: steps.check.outputs.exists == 'true'
        working-directory: foundation-domain/${{ matrix.parent }}
        run: mvn clean verify -T 1C -B

  # STEP 3: Management Domain - Maven Reactor Build
  build-management:
    name: Management - ${{ matrix.parent }}
    runs-on: ubuntu-latest
    needs: install-shared-libraries
    strategy:
      fail-fast: true
      matrix:
        parent:
          - Foundation-Services-Monitoring/Backend
          - Global-business-management/Backend/Java
          - Human-resource/Human-resource/Backend/Java
          - Sales-department/Backend/Java
          - System-Administrator/Backend
          - Customer-support/Customer-support/Backend/Java
          - Digital-marketing/Backend/Java
          - Executive-domain-X/Executive-domain-X/Backend/Java
          - Finance-department/Backend/Java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: 'maven'
      - name: Restore shared-libraries from cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: m2-shared-libs-staging-${{ github.sha }}
      - name: Check parent POM exists
        id: check
        run: |
          POM_PATH="management-domain/${{ matrix.parent }}/pom.xml"
          if [ -f "$POM_PATH" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::POM not found: $POM_PATH"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Maven Reactor Build & Test
        if: steps.check.outputs.exists == 'true'
        working-directory: management-domain/${{ matrix.parent }}
        run: mvn clean verify -T 1C -B

  # STEP 4: Shared Business Logics - Maven Reactor Build
  build-shared-logics:
    name: Shared Business Logics
    runs-on: ubuntu-latest
    needs: install-shared-libraries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: 'maven'
      - name: Restore shared-libraries from cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: m2-shared-libs-staging-${{ github.sha }}
      - name: Maven Reactor Build & Test
        working-directory: shared-business-logics
        run: mvn clean verify -T 1C -B

  # STEP 5: Shared Business Infrastructure - Maven Reactor Build
  build-shared-infra:
    name: Shared Infra - ${{ matrix.parent }}
    runs-on: ubuntu-latest
    needs: install-shared-libraries
    strategy:
      fail-fast: true
      matrix:
        parent:
          - Backend/Java
          - courier/courier
          - warehousing/warehousing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: 'maven'
      - name: Restore shared-libraries from cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: m2-shared-libs-staging-${{ github.sha }}
      - name: Check parent POM exists
        id: check
        run: |
          POM_PATH="shared-business-infrastructure/${{ matrix.parent }}/pom.xml"
          if [ -f "$POM_PATH" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::POM not found: $POM_PATH"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Maven Reactor Build & Test
        if: steps.check.outputs.exists == 'true'
        working-directory: shared-business-infrastructure/${{ matrix.parent }}
        run: mvn clean verify -T 1C -B

  # STEP 6: Security SAST Scan
  security-sast:
    name: SAST Scan - Semgrep
    runs-on: ubuntu-latest
    needs: install-shared-libraries
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/java
            p/spring-boot
            p/owasp-top-ten
            p/sql-injection
            p/xss
            p/command-injection
            p/insecure-transport
            p/jwt
            p/secrets
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}
          publishDeployment: ${{ secrets.SEMGREP_DEPLOYMENT_ID }}
          severity: ERROR

  # STEP 7: Dependency Scanning
  security-dependency:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: [install-shared-libraries, build-foundation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: 'maven'
      - name: Restore shared-libraries from cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: m2-shared-libs-staging-${{ github.sha }}
      - name: Run OWASP Dependency Check
        run: mvn org.owasp:dependency-check-maven:aggregate -DfailBuildOnCVSS=4 -B
      - name: Upload OWASP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 30

  # STEP 8: Build Docker Images
  build-docker:
    name: Docker - ${{ matrix.domain }}
    runs-on: ubuntu-latest
    needs: [build-foundation, build-management, build-shared-logics, build-shared-infra, security-sast, security-dependency]
    strategy:
      fail-fast: true
      matrix:
        domain:
          - foundation-domain
          - management-domain
          - shared-business-logics
          - shared-business-infrastructure
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push Docker Images
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION="staging-${TIMESTAMP}-${SHORT_SHA}"
          BUILT=0

          for jar in $(find ${{ matrix.domain }} -path "*/target/*.jar" -not -name "*-sources.jar" -not -name "*-javadoc.jar" | grep -v shared-libraries | head -50); do
            service_dir=$(dirname $(dirname "$jar"))
            service_name=$(basename "$service_dir")
            if [[ "$service_name" != "target" && "$service_name" != "classes" ]]; then
              IMAGE_TAG="ghcr.io/${{ github.repository }}/${service_name}:${VERSION}"
              if [ -f "$service_dir/Dockerfile" ]; then
                echo "::group::Building $service_name"
                docker build -t "$IMAGE_TAG" "$service_dir"
                docker push "$IMAGE_TAG"
                BUILT=$((BUILT + 1))
                echo "::endgroup::"
              elif [ -f "$service_dir/src/main/docker/Dockerfile" ]; then
                echo "::group::Building $service_name"
                docker build -t "$IMAGE_TAG" -f "$service_dir/src/main/docker/Dockerfile" "$service_dir"
                docker push "$IMAGE_TAG"
                BUILT=$((BUILT + 1))
                echo "::endgroup::"
              fi
            fi
          done
          echo "Built $BUILT images for ${{ matrix.domain }}"

  # STEP 9: Container Scanning
  container-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy Scan
        env:
          TRIVY_TIMEOUT: 10m
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION="staging-${TIMESTAMP}-${SHORT_SHA}"
          FAILED=0

          for image in $(docker images --format '{{.Repository}}:{{.Tag}}' | grep "ghcr.io/${{ github.repository }}" | grep "$VERSION"); do
            echo "::group::Scanning $image"
            if ! docker run --rm aquasec/trivy:latest image --severity "CRITICAL,HIGH" --exit-code 1 "$image"; then
              echo "::error::Vulnerabilities found in $image"
              FAILED=1
            fi
            echo "::endgroup::"
          done
          if [ "$FAILED" -ne 0 ]; then exit 1; fi

  # Summary Report
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [build-foundation, build-management, build-shared-logics, build-shared-infra, security-sast, security-dependency, build-docker, container-scan]
    if: always()
    steps:
      - run: |
          echo "## CI - Staging/UAT Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Foundation Domain | ${{ needs.build-foundation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Management Domain | ${{ needs.build-management.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Shared Business Logics | ${{ needs.build-shared-logics.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Shared Business Infrastructure | ${{ needs.build-shared-infra.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security SAST | ${{ needs.security-sast.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| OWASP Dependency Check | ${{ needs.security-dependency.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.build-docker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Scan | ${{ needs.container-scan.result }} |" >> $GITHUB_STEP_SUMMARY
