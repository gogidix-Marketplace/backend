apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-business-automation-service
  namespace: ai-services
  labels:
    app: ai-business-automation-service
    version: v1
    team: team-ai-business-ops
    component: business-operations
    environment: production
automountServiceAccountToken: false
annotations:
    - apiGroups: [""]
      resources: ["secrets", "configmaps"]
      verbs: ["get", "list"]
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["services"]
      verbs: ["get", "list"]
    - apiGroups: ["coordination.k8s.io"]
      resources: ["leases"]
      verbs: ["get", "create", "update"]
