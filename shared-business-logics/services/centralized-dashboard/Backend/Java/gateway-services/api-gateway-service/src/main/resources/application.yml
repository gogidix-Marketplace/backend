spring:
  application:
    name: api-gateway-service

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/api_gateway}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 2
        max-wait: -1ms

  cache:
    type: redis
    redis:
      time-to-live: 300000

  webclient:
    base-url: ${DOWNSTREAM_SERVICES_BASE_URL:http://localhost}

server:
  port: ${SERVER_PORT:8907}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: INFO
    com.gogidix: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/api-gateway-service.log
    max-size: 100MB
    max-history: 30

# Gateway Configuration
gateway:
  downstream:
    services:
      saga-coordinator:
        base-url: ${SAGA_COORDINATOR_URL:http://localhost:8080}
        path: /api/v1/sagas
      websocket-gateway:
        base-url: ${WEBSOCKET_GATEWAY_URL:http://localhost:8908}
        path: /ws
      chart-service:
        base-url: ${CHART_SERVICE_URL:http://localhost:8909}
        path: /api/v1/charts
  rate-limit:
    enabled: true
    requests-per-minute: 100
  cache:
    enabled: true
    ttl-seconds: 300

---
# Development profile
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true

logging:
  level:
    com.gogidix: DEBUG

---
# Production profile
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.gogidix: INFO
