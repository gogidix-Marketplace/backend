name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  checkstyle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up JDK 17
        uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Checkstyle
        run: cd lock-service && mvn checkstyle:check

      - name: Generate Checkstyle report
        if: always()
        run: cd lock-service && mvn checkstyle:checkstyle-aggregate

      - name: Upload Checkstyle results
        if: always()
        uses: actions/upload-artifact@v3@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: checkstyle-report
          path: lock-service/target/site/checkstyle.html
          retention-days: 7

  spotbugs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up JDK 17
        uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run SpotBugs
        run: cd lock-service && mvn spotbugs:check

      - name: Upload SpotBugs results
        if: always()
        uses: actions/upload-artifact@v3@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: spotbugs-report
          path: lock-service/target/spotbugsXml.xml
          retention-days: 7

  pmd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up JDK 17
        uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run PMD
        run: cd lock-service && mvn pmd:check

      - name: Upload PMD results
        if: always()
        uses: actions/upload-artifact@v3@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: pmd-report
          path: lock-service/target/pmd.html
          retention-days: 7

  sonarcloud:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache SonarCloud packages
        uses: actions/cache@v3@13aacd865c20de90d75de3dcf1572b4a4f02ed94
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: cd lock-service && mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
