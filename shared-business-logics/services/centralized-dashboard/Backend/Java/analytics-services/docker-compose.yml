version: '3.8'

services:
  # PostgreSQL Database for Metrics Aggregation Service
  metrics-aggregation-db:
    image: postgres:15-alpine
    container_name: metrics-aggregation-db
    environment:
      POSTGRES_DB: metrics_aggregation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - metrics-aggregation-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Database for Business Intelligence Service
  business-intelligence-db:
    image: postgres:15-alpine
    container_name: business-intelligence-db
    environment:
      POSTGRES_DB: business_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - business-intelligence-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Database for Analytics Data Service
  analytics-data-db:
    image: postgres:15-alpine
    container_name: analytics-data-db
    environment:
      POSTGRES_DB: analytics_data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - analytics-data-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (shared by all services)
  analytics-redis:
    image: redis:7-alpine
    container_name: analytics-redis
    ports:
      - "6380:6379"
    volumes:
      - analytics-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka (shared by all services)
  analytics-zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: analytics-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log

  analytics-kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: analytics-kafka
    depends_on:
      - analytics-zookeeper
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: analytics-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://analytics-kafka:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Metrics Aggregation Service
  metrics-aggregation-service:
    build:
      context: ./metrics-aggregation-service
      dockerfile: Dockerfile
    container_name: metrics-aggregation-service
    depends_on:
      metrics-aggregation-db:
        condition: service_healthy
      analytics-redis:
        condition: service_healthy
      analytics-kafka:
        condition: service_healthy
    ports:
      - "8901:8901"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://metrics-aggregation-db:5432/metrics_aggregation
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      REDIS_HOST: analytics-redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: analytics-kafka:29092
      SERVER_PORT: 8901

  # Business Intelligence Service
  business-intelligence-service:
    build:
      context: ./business-intelligence-service
      dockerfile: Dockerfile
    container_name: business-intelligence-service
    depends_on:
      business-intelligence-db:
        condition: service_healthy
      analytics-redis:
        condition: service_healthy
      analytics-kafka:
        condition: service_healthy
    ports:
      - "8902:8902"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://business-intelligence-db:5432/business_intelligence
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      REDIS_HOST: analytics-redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: analytics-kafka:29092
      SERVER_PORT: 8902

  # Analytics Data Service
  analytics-data-service:
    build:
      context: ./analytics-data-service
      dockerfile: Dockerfile
    container_name: analytics-data-service
    depends_on:
      analytics-data-db:
        condition: service_healthy
      analytics-redis:
        condition: service_healthy
      analytics-kafka:
        condition: service_healthy
    ports:
      - "8903:8903"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://analytics-data-db:5432/analytics_data
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      REDIS_HOST: analytics-redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: analytics-kafka:29092
      SERVER_PORT: 8903

volumes:
  metrics-aggregation-data:
  business-intelligence-data:
  analytics-data-data:
  analytics-redis-data:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
