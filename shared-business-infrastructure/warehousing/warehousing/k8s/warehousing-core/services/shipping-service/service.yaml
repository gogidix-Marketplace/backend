apiVersion: v1
kind: Service
metadata:
  name: shipping-service
  namespace: warehousing-core
  labels:
    app: shipping-service
    service: shipping-service
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
  - name: http
    port: 8207
    targetPort: http
    protocol: TCP
  - name: management
    port: 8208
    targetPort: management
    protocol: TCP
  selector:
    app: shipping-service
---
apiVersion: v1
kind: Service
metadata:
  name: shipping-service-headless
  namespace: warehousing-core
  labels:
    app: shipping-service
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8207
    targetPort: http
    protocol: TCP
  selector:
    app: shipping-service
