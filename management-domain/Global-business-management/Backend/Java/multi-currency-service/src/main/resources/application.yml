server:
  port: 8201
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 10

spring:
  application:
    name: multi-currency-service
  data:
    mongodb:
      host: localhost
      port: 27017
      database: multi_currency_service_db
      auto-index-creation: true
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m

  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true

logging:
  level:
    root: INFO
    com.gogidix.globalbusinessmanagement: DEBUG
    org.springframework.data.mongodb: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

application:
  currency:
    default-base: USD
    cache:
      exchange-rate-ttl: 300
      currency-ttl: 3600
    conversion:
      max-amount: 999999999.99
      min-amount: 0.01
    rate:
      default-provider: ECB
      update-interval: 3600000
      fallback-rate: 1.0
