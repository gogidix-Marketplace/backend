apiVersion: v1
kind: Service
metadata:
  name: quality-service
  namespace: warehousing-core
  labels:
    app: quality-service
    service: quality-service
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
  - name: http
    port: 8209
    targetPort: http
    protocol: TCP
  - name: management
    port: 8210
    targetPort: management
    protocol: TCP
  selector:
    app: quality-service
---
apiVersion: v1
kind: Service
metadata:
  name: quality-service-headless
  namespace: warehousing-core
  labels:
    app: quality-service
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8209
    targetPort: http
    protocol: TCP
  selector:
    app: quality-service
