---
# Zookeeper ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: zookeeper-config
  namespace: infrastructure
data:
  zoo.cfg: |
    tickTime=2000
    initLimit=10
    syncLimit=5
    dataDir=/var/lib/zookeeper/data
    dataLogDir=/var/lib/zookeeper/log
    clientPort=2181
    maxClientCnxns=60
    autopurge.snapRetainCount=3
    autopurge.purgeInterval=24
    4lw.commands.whitelist=*
    admin.enableServer=true
    admin.serverPort=8080

---
# Zookeeper Secret
apiVersion: v1
kind: Secret
metadata:
  name: zookeeper-credentials
  namespace: infrastructure
type: Opaque
stringData:
  username: "zookeeper"
  password: "change_this_zookeeper_password_in_production"

---
# Zookeeper StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: infrastructure
  labels:
    app: zookeeper
    component: messaging
    domain: infrastructure
spec:
  serviceName: zookeeper
  replicas: 3
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
        component: messaging
        domain: infrastructure
    spec:
      containers:
      - name: zookeeper
        image: bitnami/zookeeper:3.9
        ports:
        - name: client
          containerPort: 2181
        - name: election
          containerPort: 2888
        - name: leader
          containerPort: 3888
        - name: admin
          containerPort: 8080
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        - name: ZOOKEEPER_SERVER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['pod-index']
        - name: ZOOKEEPER_SERVERS
          value: "zookeeper-0.zookeeper.infrastructure.svc.cluster.local:2888:3888,zookeeper-1.zookeeper.infrastructure.svc.cluster.local:2888:3888,zookeeper-2.zookeeper.infrastructure.svc.cluster.local:2888:3888"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"
        - name: ZOOKEEPER_INIT_LIMIT
          value: "10"
        - name: ZOOKEEPER_SYNC_LIMIT
          value: "5"
        - name: ZOOKEEPER_MAX_CLIENT_CNXNS
          value: "60"
        - name: ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL
          value: "24"
        - name: ZOOKEEPER_AUTOPURGE_SNAP_RETAIN_COUNT
          value: "3"
        - name: ZOOKEEPER_LOG_LEVEL
          value: "INFO"
        - name: ALLOW_ANONYMOUS_LOGIN
          value: "yes"
        volumeMounts:
        - name: zookeeper-data
          mountPath: /var/lib/zookeeper/data
        - name: zookeeper-logs
          mountPath: /var/log/zookeeper
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - /opt/bitnami/zookeeper/bin/zookeeper-ok.sh
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /opt/bitnami/zookeeper/bin/zookeeper-ready.sh
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: zookeeper-logs
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: zookeeper-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: standard
      resources:
        requests:
          storage: 10Gi

---
# Zookeeper Service (Headless for StatefulSet)
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: infrastructure
  labels:
    app: zookeeper
    component: messaging
spec:
  clusterIP: None
  ports:
  - name: client
    port: 2181
    targetPort: 2181
  - name: election
    port: 2888
    targetPort: 2888
  - name: leader
    port: 3888
    targetPort: 3888
  - name: admin
    port: 8080
    targetPort: 8080
  selector:
    app: zookeeper

---
# Zookeeper Service (Client access)
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-client
  namespace: infrastructure
  labels:
    app: zookeeper
    component: messaging
    role: client
spec:
  type: ClusterIP
  ports:
  - name: client
    port: 2181
    targetPort: 2181
  selector:
    app: zookeeper

---
# Zookeeper PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zookeeper-pdb
  namespace: infrastructure
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: zookeeper

---
# Kafka ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: infrastructure
data:
  server.properties: |
    # Server Basics
    broker.id=0
    listeners=PLAINTEXT://:9092,EXTERNAL://:9094
    advertised.listeners=PLAINTEXT://kafka-0.kafka.infrastructure.svc.cluster.local:9092,EXTERNAL://localhost:9094
    listener.security.protocol.map=PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
    inter.broker.listener.name=PLAINTEXT

    # Log Basics
    log.dirs=/var/lib/kafka/data
    num.partitions=3
    num.recovery.threads.per.data.dir=1
    offsets.topic.replication.factor=3
    transaction.state.log.replication.factor=3
    transaction.state.log.min.isr=2
    log.retention.hours=168
    log.segment.bytes=1073741824
    log.retention.check.interval.ms=300000

    # Zookeeper
    zookeeper.connect=zookeeper-0.zookeeper.infrastructure.svc.cluster.local:2181,zookeeper-1.zookeeper.infrastructure.svc.cluster.local:2181,zookeeper-2.zookeeper.infrastructure.svc.cluster.local:2181/kafka
    zookeeper.connection.timeout.ms=18000

    # Group Coordinator Settings
    group.initial.rebalance.delay.ms=0

    # Log Flush Policy
    log.flush.interval.messages=10000
    log.flush.interval.ms=1000

    # Log Retention
    log.retention.check.interval.ms=300000
    log.retention.hours=168

    # Performance Tuning
    num.network.threads=3
    num.io.threads=8
    socket.send.buffer.bytes=102400
    socket.receive.buffer.bytes=102400
    socket.request.max.bytes=104857600

    # Auto Topic Creation
    auto.create.topics.enable=true
    default.replication.factor=3
    min.insync.replicas=2

    # Security
    authorizer.class.name=kafka.security.authorizer.AclAuthorizer
    allow.everyone.if.no.acl.found=false

---
# Kafka Secret
apiVersion: v1
kind: Secret
metadata:
  name: kafka-credentials
  namespace: infrastructure
type: Opaque
stringData:
  username: "kafka"
  password: "change_this_kafka_password_in_production"
  sasl-password: "change_this_sasl_password_in_production"

---
# Kafka StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: infrastructure
  labels:
    app: kafka
    component: messaging
    domain: infrastructure
spec:
  serviceName: kafka
  replicas: 3
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
        component: messaging
        domain: infrastructure
      annotations:
        pod-index: "0"
    spec:
      containers:
      - name: kafka
        image: bitnami/kafka:3.6
        ports:
        - name: internal
          containerPort: 9092
        - name: external
          containerPort: 9094
        env:
        - name: KAFKA_BROKER_ID
          value: "0"
        - name: KAFKA_CFG_ZOOKEEPER_CONNECT
          value: "zookeeper-0.zookeeper.infrastructure.svc.cluster.local:2181,zookeeper-1.zookeeper.infrastructure.svc.cluster.local:2181,zookeeper-2.zookeeper.infrastructure.svc.cluster.local:2181/kafka"
        - name: KAFKA_CFG_LISTENERS
          value: "PLAINTEXT://:9092"
        - name: KAFKA_CFG_ADVERTISED_LISTENERS
          value: "PLAINTEXT://kafka-0.kafka.infrastructure.svc.cluster.local:9092"
        - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
          value: "PLAINTEXT:PLAINTEXT"
        - name: KAFKA_CFG_INTER_BROKER_LISTENER_NAME
          value: "PLAINTEXT"
        - name: KAFKA_CFG_ZOOKEEPER_CONNECTION_TIMEOUT_MS
          value: "18000"
        - name: KAFKA_CFG_LOG_DIRS
          value: "/opt/bitnami/kafka/data"
        - name: KAFKA_CFG_NUM_PARTITIONS
          value: "3"
        - name: KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE
          value: "true"
        - name: KAFKA_CFG_DEFAULT_REPLICATION_FACTOR
          value: "3"
        - name: KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "3"
        - name: KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: "3"
        - name: KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR
          value: "2"
        - name: KAFKA_CFG_LOG_RETENTION_HOURS
          value: "168"
        - name: KAFKA_CFG_LOG_SEGMENT_BYTES
          value: "1073741824"
        - name: KAFKA_CFG_LOG_RETENTION_CHECK_INTERVAL_MS
          value: "300000"
        - name: KAFKA_CFG_LOG_FLUSH_INTERVAL_MESSAGES
          value: "10000"
        - name: KAFKA_CFG_LOG_FLUSH_INTERVAL_MS
          value: "1000"
        - name: KAFKA_CFG_NUM_NETWORK_THREADS
          value: "3"
        - name: KAFKA_CFG_NUM_IO_THREADS
          value: "8"
        - name: KAFKA_CFG_SOCKET_SEND_BUFFER_BYTES
          value: "102400"
        - name: KAFKA_CFG_SOCKET_RECEIVE_BUFFER_BYTES
          value: "102400"
        - name: KAFKA_CFG_SOCKET_REQUEST_MAX_BYTES
          value: "104857600"
        - name: KAFKA_CFG_ALLOW_EVERYONE_IF_NO_ACL_FOUND
          value: "false"
        - name: ALLOW_PLAINTEXT_LISTENER
          value: "yes"
        - name: KAFKA_OPTS
          value: "-Djava.security.auth.login.config=/opt/bitnami/kafka/conf/jaas.conf"
        volumeMounts:
        - name: kafka-data
          mountPath: /opt/bitnami/kafka/data
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          exec:
            command:
            - /opt/bitnami/kafka/bin/kafka-broker-api-versions.sh
            - --bootstrap-server
            - localhost:9092
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /opt/bitnami/kafka/bin/kafka-broker-api-versions.sh
            - --bootstrap-server
            - localhost:9092
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: kafka-logs
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: kafka-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: standard
      resources:
        requests:
          storage: 20Gi

---
# Kafka Service (Headless for StatefulSet)
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: infrastructure
  labels:
    app: kafka
    component: messaging
spec:
  clusterIP: None
  ports:
  - name: internal
    port: 9092
    targetPort: 9092
  - name: external
    port: 9094
    targetPort: 9094
  selector:
    app: kafka

---
# Kafka Service (Client access)
apiVersion: v1
kind: Service
metadata:
  name: kafka-bootstrap
  namespace: infrastructure
  labels:
    app: kafka
    component: messaging
    role: bootstrap
spec:
  type: ClusterIP
  ports:
  - name: bootstrap
    port: 9092
    targetPort: 9092
  selector:
    app: kafka

---
# Kafka PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka-pdb
  namespace: infrastructure
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: kafka

---
# Kafka Topic: Domain Events
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: domain-events
  namespace: infrastructure
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 12
  replicationFactor: 3
  config:
    retention.ms: 604800000
    segment.bytes: 1073741824
    cleanup.policy: delete

---
# Kafka Topic: Commands
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: commands
  namespace: infrastructure
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 12
  replicationFactor: 3
  config:
    retention.ms: 86400000
    segment.bytes: 536870912
    cleanup.policy: delete

---
# Kafka Topic: Notifications
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: notifications
  namespace: infrastructure
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 6
  replicationFactor: 3
  config:
    retention.ms: 1209600000
    segment.bytes: 536870912
    cleanup.policy: delete

---
# Kafka Topic: Audit Logs
apiVersion: kafka.strimzi.io/v1beta2
