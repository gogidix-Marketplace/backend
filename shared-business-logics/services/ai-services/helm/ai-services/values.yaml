      - ai_services_password
    databases:
      - ai_services_db
  architecture: replicaset
  replicaCount: 3
  persistence:
    enabled: true
    size: 50Gi
    storageClass: fast-ssd

redis:
  enabled: true
  auth:
    enabled: true
    password: redis-password
  architecture: standalone
  master:
    persistence:
      enabled: true
      size: 20Gi
      storageClass: fast-ssd

kafka:
  enabled: true
  listeners:
    liveness:
      enabled: true
    readiness:
      enabled: true
  controller:
    replicaCount: 3
    persistence:
      size: 50Gi
      storageClass: fast-ssd

# ============================================================================
# Persistent Volume Claims
# ============================================================================
persistence:
  enabled: true
  storageClass: fast-ssd

  # AI Models Storage
  aiModelsPvc:
    enabled: true
    name: ai-models-pvc
    accessModes:
      - ReadWriteMany
    size: 100Gi
    storageClass: nfs-client

  # Analytics Data Storage
  analyticsDataPvc:
    enabled: true
    name: analytics-data-pvc
    accessModes:
      - ReadWriteOnce
    size: 200Gi
    storageClass: fast-ssd

# ============================================================================
# Secrets Configuration
# ============================================================================
secrets:
  jwtSecret: change-this-in-production
  apiKey: change-this-in-production
  databasePassword: change-this-in-production
  redisPassword: change-this-in-production
  s3AccessKey: change-this-in-production
  s3SecretKey: change-this-in-production

# ============================================================================
# Network Policies
# ============================================================================
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
