# Docker Compose for Shared Security Library
# Local development environment with dependencies
# Spring Boot 3.1.5 with Java 17

version: '3.8'

networks:
  security-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/16

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  vault-data:
    driver: local

services:
  # =====================================
  # DATABASE SERVICES
  # =====================================
  postgres:
    image: postgres:15-alpine
    container_name: shared-security-postgres
    environment:
      POSTGRES_DB: gogidix_security
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5436:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      security-network:
        ipv4_address: 172.24.0.10

  # =====================================
  # CACHE SERVICES
  # =====================================
  redis:
    image: redis:7-alpine
    container_name: shared-security-redis
    command: redis-server --appendonly yes --requirepass redis123
    ports:
      - "6383:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      security-network:
        ipv4_address: 172.24.0.11

  # =====================================
  # SECURITY SERVICES
  # =====================================
  vault:
    image: vault:1.15
    container_name: shared-security-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: vault-dev-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    volumes:
      - vault-data:/vault/data
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      security-network:
        ipv4_address: 172.24.0.12

  # =====================================
  # APPLICATION SERVICE
  # =====================================
  shared-security:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: shared-security-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    environment:
      # Spring profiles
      SPRING_PROFILES_ACTIVE: docker
      
      # Database configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      
      # Redis configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      REDIS_DATABASE: 1
      
      # Security configuration
      JWT_SECRET: docker-dev-jwt-secret-key-change-in-production-256-bits
      JWT_ISSUER_URI: http://localhost:8302/shared-security
      JWT_JWK_SET_URI: http://localhost:8302/shared-security/.well-known/jwks.json
      
      # Vault configuration
      VAULT_HOST: vault
      VAULT_PORT: 8200
      VAULT_TOKEN: vault-dev-token
      
      # JVM configuration
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseG1GC -XX:+UseStringDeduplication"
      JVM_MEMORY: "-Xmx512m -Xms256m"
      
      # Application configuration
      SERVER_PORT: 8302
      MANAGEMENT_PORT: 8302
      
      # Security-specific configuration
      SECURITY_RATE_LIMITING_ENABLED: true
      SECURITY_CORS_ENABLED: true
      
    ports:
      - "8302:8302"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8302/shared-security/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      security-network:
        ipv4_address: 172.24.0.20

  # =====================================
  # DEVELOPMENT TOOLS
  # =====================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: shared-security-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gogidix.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5054:80"
    depends_on:
      - postgres
    networks:
      security-network:
        ipv4_address: 172.24.0.21

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: shared-security-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379:1:redis123
    ports:
      - "8085:8081"
    depends_on:
      - redis
    networks:
      security-network:
        ipv4_address: 172.24.0.22

  # Vault UI (for development)
  vault-ui:
    image: djenriquez/vault-ui:latest
    container_name: shared-security-vault-ui
    environment:
      VAULT_URL_DEFAULT: http://vault:8200
      VAULT_AUTH_DEFAULT: TOKEN
    ports:
      - "8000:8000"
    depends_on:
      - vault
    networks:
      security-network:
        ipv4_address: 172.24.0.23