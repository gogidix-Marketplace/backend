version: '3.8'

services:
  centralized-api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: centralized-api-gateway
    hostname: centralized-api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_CLIENT_SERVICE_URL=http://eureka-server:8761/eureka
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OAUTH2_ISSUER_URI=http://keycloak:8080/auth/realms/gogidix-dev
      - OAUTH2_JWK_SET_URI=http://keycloak:8080/auth/realms/gogidix-dev/protocol/openid_connect/certs
    depends_on:
      - redis
      - eureka-server
    networks:
      - centralized-dashboard-network
    volumes:
      - ./logs:/var/log/centralized-api-gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: redis-gateway
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - centralized-dashboard-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  eureka-server:
    image: steeltoeoss/eureka-server:latest
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
    networks:
      - centralized-dashboard-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data:
    driver: local

networks:
  centralized-dashboard-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16