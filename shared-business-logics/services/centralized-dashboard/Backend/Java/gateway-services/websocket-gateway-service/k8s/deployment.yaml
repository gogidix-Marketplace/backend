apiVersion: v1
kind: ServiceAccount
metadata:
  name: websocket-gateway-service
  namespace: centralized-dashboard
  labels:
    app: websocket-gateway-service
    team: team-f-centralized-dashboard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-gateway-service
  namespace: centralized-dashboard
  labels:
    app: websocket-gateway-service
    team: team-f-centralized-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: websocket-gateway-service
  template:
    metadata:
      labels:
        app: websocket-gateway-service
        team: team-f-centralized-dashboard
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8908"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: websocket-gateway-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: websocket-gateway-service
        image: ghcr.io/gogidix/websocket-gateway-service:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8908
          protocol: TCP
        env:
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: websocket-gateway-service-config
              key: database-url
        - name: DATABASE_USERNAME
          valueFrom:
            secretKeyRef:
              name: websocket-gateway-service-secrets
              key: database-username
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: websocket-gateway-service-secrets
              key: database-password
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: websocket-gateway-service-config
              key: redis-host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: websocket-gateway-service-config
              key: redis-port
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: websocket-gateway-service-config
              key: kafka-bootstrap-servers
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "800m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8908
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8908
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8908
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 18
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      restartPolicy: Always
