# ==============================================================================
# Warehousing Core Helm Chart - Production Environment Values
# ==============================================================================
# This file contains production environment specific overrides.
# Usage: helm install warehousing-core ./warehousing-core -f values-production.yaml

# ------------------------------------------------------------------------------
# Global Configuration Overrides
# ------------------------------------------------------------------------------
global:
  environment: production
  labels:
    domain: warehousing
    platform: gogidix
    managed-by: helm
    environment: production

  # Production security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    fsGroup: 1001

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsUser: 1001
    capabilities:
      drop:
        - ALL

  # Production resource defaults (higher than default)
  resources:
    limits:
      cpu: 2000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi

# ------------------------------------------------------------------------------
# Namespace Configuration
# ------------------------------------------------------------------------------
namespace:
  create: true
  name: warehousing-production
  annotations:
    iam.amazonaws.com/permitted: ".*"

# ------------------------------------------------------------------------------
# MongoDB Configuration - Production
# ------------------------------------------------------------------------------
mongodb:
  enabled: true
  architecture: replicaset
  replicaSet:
    name: rs0
    replicas:
      secondary: 3
      arbiter: 0
  auth:
    enabled: true
    rootUser: admin
    existingSecret: mongodb-credentials-production
    database: warehousing_production
  persistence:
    enabled: true
    storageClass: "fast-ssd"
    size: 500Gi
  resources:
    limits:
      cpu: 4000m
      memory: 8Gi
    requests:
      cpu: 1000m
      memory: 2Gi
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - mongodb
          topologyKey: kubernetes.io/zone
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# ------------------------------------------------------------------------------
# Kafka Configuration - Production
# ------------------------------------------------------------------------------
kafka:
  enabled: true
  replicas: 5
  controller:
    replicaCount: 5
  broker:
    replicaCount: 5
    persistence:
      size: 500Gi
      storageClass: "fast-ssd"
  resources:
    limits:
      cpu: 4000m
      memory: 8Gi
    requests:
      cpu: 1000m
      memory: 2Gi
  metrics:
    kafka:
      enabled: true
      jmx:
        enabled: true
      serviceMonitor:
        enabled: true

# ------------------------------------------------------------------------------
# Redis Configuration - Production
# ------------------------------------------------------------------------------
redis:
  enabled: true
  architecture: replication
  replica:
    replicaCount: 5
  auth:
    enabled: true
    existingSecret: redis-credentials-production
  master:
    persistence:
      enabled: true
      size: 50Gi
      storageClass: "fast-ssd"
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# ------------------------------------------------------------------------------
# Service Replica Overrides - Production
# ------------------------------------------------------------------------------
# Core services get higher replica counts in production
fulfillmentCoreService:
  replicas: 5
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi
  hpa:
    enabled: true
    minReplicas: 5
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - fulfillment-core-service
          topologyKey: kubernetes.io/zone

