# Centralized Reporting Service Configuration

# Application name and port
spring.application.name=centralized-reporting
server.port=8104
server.servlet.context-path=/api/reporting

# MongoDB configuration
spring.data.mongodb.host=${MONGODB_HOST:localhost}
spring.data.mongodb.port=${MONGODB_PORT:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:reporting_db}
spring.data.mongodb.username=${MONGODB_USERNAME:}
spring.data.mongodb.password=${MONGODB_PASSWORD:}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/reporting_db}
spring.data.mongodb.auto-index-creation=true

# Eureka client configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}

# Actuator endpoints configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized

# Logging configuration
logging.level.com.gogidix.centralizeddashboard.reporting=INFO
logging.level.org.springframework=INFO

# Redis Configuration for report caching
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.timeout=2000
spring.redis.database=3

# Reporting configuration
reporting.output.formats=PDF,EXCEL,CSV,JSON
reporting.storage.path=${REPORT_STORAGE_PATH:/tmp/reports}
reporting.retention.days=90
reporting.async.enabled=true
reporting.max-concurrent-reports=5

# Email configuration for report delivery
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Scheduler configuration
reporting.scheduler.enabled=true
reporting.scheduler.pool-size=5
