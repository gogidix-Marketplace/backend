spring:
  # Production Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gogidix_security}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1

  # JPA Configuration for Production
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        show_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: false

  # Production Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:3}
      ssl: ${REDIS_SSL:false}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-wait: 5000ms
          max-idle: 8
          min-idle: 2

  # Cache Configuration for Production
  cache:
    redis:
      time-to-live: 7200000  # 2 hours for production performance
      cache-null-values: false

  # Session Configuration for Production
  session:
    timeout: 30m
    redis:
      flush-mode: on_save
      namespace: gogidix:security:session

# Production Logging - Optimized for performance
logging:
  level:
    com.gogidix.infrastructure.sharedlibraries.sharedsecurity: INFO
    com.gogidix.security: INFO
    org.springframework.security: WARN
    org.springframework.session: WARN
    io.jsonwebtoken: WARN
    org.springframework.cache: WARN
    org.hibernate: WARN
    org.springframework.web: WARN
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
  file:
    name: /var/log/gogidix/shared-security.log
    max-size: 100MB
    max-history: 30

# Production Security Configuration
gogidix:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:86400000}  # 24 hours
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days
      issuer: ${JWT_ISSUER:gogidix-api}
      audience: ${JWT_AUDIENCE:gogidix-ecosystem}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600
    session:
      timeout: ${SESSION_TIMEOUT:1800}  # 30 minutes
      max-sessions: ${MAX_SESSIONS:1}
      prevent-session-fixation: true
    password:
      encoding: bcrypt
      strength: ${PASSWORD_STRENGTH:12}
    rate-limiting:
      enabled: ${RATE_LIMITING_ENABLED:true}
      requests-per-minute: ${RATE_LIMIT_RPM:60}
      burst-capacity: ${RATE_LIMIT_BURST:100}
    audit:
      enabled: ${AUDIT_ENABLED:true}
      log-successful-auth: ${AUDIT_LOG_SUCCESS:false}  # Reduce log volume
      log-failed-auth: ${AUDIT_LOG_FAILED:true}
      log-access-denied: ${AUDIT_LOG_DENIED:true}

# Production Management Endpoints - Restricted
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
      slo:
        http.server.requests: 10ms,50ms,100ms,200ms,500ms,1s

# Production-specific configuration
production:
  security:
    strict-validation: true
    enable-security-headers: true
    require-ssl: ${REQUIRE_SSL:true}
  temp:
    directory: ${TEMP_DIR:/tmp/gogidix-security}
    max-file-size: ${MAX_FILE_SIZE:10MB}
    cleanup-interval: ${CLEANUP_INTERVAL:3600}  # 1 hour
