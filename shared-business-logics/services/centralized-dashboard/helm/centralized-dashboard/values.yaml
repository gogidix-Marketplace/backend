# Default values for centralized-dashboard

global:
  namespace: centralized-dashboard
  imageRegistry: ghcr.io/gogidix
  imageTag: latest
  imagePullPolicy: IfNotPresent
  database:
    host: postgres
    port: 5432
  redis:
    host: redis
    port: 6379
  kafka:
    bootstrapServers: kafka:9092
  env: production

# Service-specific configurations
apiGatewayService:
  enabled: true
  name: api-gateway-service
  servicePort: 8080
  managementPort: 8081
  replicas: 2
  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "800m"
  ingress:
    enabled: true
    host: api-gateway.gogidix.com
    path: /
    pathType: Prefix
    annotations: {}
  envVars:
    SPRING_PROFILES_ACTIVE: "prod"
    SERVER_PORT: "8080"
    MANAGEMENT_SERVER_PORT: "8081"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilization: 70
    targetMemoryUtilization: 80
  pdb:
    enabled: true
    minAvailable: 1
  monitoring:
    enabled: true
    serviceMonitorEnabled: true
    prometheusScrape: true

dashboardCoreService:
  enabled: true
  name: dashboard-core-service
  servicePort: 8900
  managementPort: 8901
  replicas: 2
  resources:
    requests:
      memory: "768Mi"
