{{- if not .Values.database.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "transaction-orchestration.fullname" . }}-database
  namespace: {{ include "transaction-orchestration.namespace" . }}
  labels:
    {{- include "transaction-orchestration.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.database.username | default "postgres" }}
  password: {{ .Values.database.password | default "CHANGE_ME" }}
{{- end }}

{{- if not .Values.mongodb.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "transaction-orchestration.fullname" . }}-mongodb
  namespace: {{ include "transaction-orchestration.namespace" . }}
  labels:
    {{- include "transaction-orchestration.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.mongodb.username | default "mongouser" }}
  password: {{ .Values.mongodb.password | default "CHANGE_ME" }}
{{- end }}

{{- if not .Values.redis.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "transaction-orchestration.fullname" . }}-redis
  namespace: {{ include "transaction-orchestration.namespace" . }}
  labels:
    {{- include "transaction-orchestration.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.redis.password | default "" }}
{{- end }}
