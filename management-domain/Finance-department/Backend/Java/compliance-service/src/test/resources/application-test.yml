# Test Configuration for Compliance Service
spring:
  application:
    name: compliance-service-test
  data:
    mongodb:
      host: localhost
      port: 27017
      database: compliance-test-db
      auto-index-creation: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: compliance-test-group
      auto-offset-reset: earliest
spring.redis:
  host: localhost
  port: 6379
  database: 9
server:
  port: 0
logging:
  level:
    com.gogidix.finance.compliance: DEBUG
    org.springframework.kafka: WARN
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
test:
  tenant:
    id: tenant-test-001
