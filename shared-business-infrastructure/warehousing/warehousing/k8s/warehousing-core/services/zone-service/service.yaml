apiVersion: v1
kind: Service
metadata:
  name: zone-service
  namespace: warehousing-core
  labels:
    app: zone-service
    service: zone-service
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
  - name: http
    port: 8222
    targetPort: http
    protocol: TCP
  - name: management
    port: 8223
    targetPort: management
    protocol: TCP
  selector:
    app: zone-service
---
apiVersion: v1
kind: Service
metadata:
  name: zone-service-headless
  namespace: warehousing-core
  labels:
    app: zone-service
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8222
    targetPort: http
    protocol: TCP
  selector:
    app: zone-service
