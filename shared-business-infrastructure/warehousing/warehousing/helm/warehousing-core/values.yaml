# ==============================================================================
# Warehousing Core Helm Chart - Default Values
# ==============================================================================

# ------------------------------------------------------------------------------
# Global Configuration
# ------------------------------------------------------------------------------
global:
  # Image registry configuration
  imageRegistry: gogidix.azurecr.io
  imagePullSecrets:
    - name: gogidix-registry-secret

  # Common labels added to all resources
  labels:
    domain: warehousing
    platform: gogidix
    managed-by: helm

  # Common annotations added to all resources
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9000"
    prometheus.io/path: "/actuator/prometheus"

  # Environment (development, staging, production)
  environment: development

  # Service account configuration
  serviceAccount:
    create: true
    annotations: {}
    name: ""

  # Pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    fsGroup: 1001

  # Container security context
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsUser: 1001
    capabilities:
      drop:
        - ALL

  # Resource defaults
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # Health check defaults
  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: management
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6

  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: management
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  startupProbe:
    httpGet:
      path: /actuator/health/startup
      port: management
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 30

# ------------------------------------------------------------------------------
# Namespace Configuration
# ------------------------------------------------------------------------------
namespace:
  create: true
  name: warehousing-core
  annotations: {}

# ------------------------------------------------------------------------------
# MongoDB Configuration (Bitnami Chart Dependency)
# ------------------------------------------------------------------------------
mongodb:
  enabled: true
  architecture: replicaset
  replicaSet:
    name: rs0
    replicas:
      secondary: 2
      arbiter: 1
  auth:
    enabled: true
    rootUser: admin
    existingSecret: mongodb-credentials
    database: warehousing_core
  persistence:
    enabled: true
    storageClass: "standard"
    size: 100Gi
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - mongodb
            topologyKey: kubernetes.io/hostname
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# ------------------------------------------------------------------------------
# Kafka Configuration (Bitnami Chart Dependency)
# ------------------------------------------------------------------------------
kafka:
  enabled: true
  replicas: 3
  controller:
    replicaCount: 3
  broker:
    replicaCount: 3
    persistence:
      size: 100Gi
      storageClass: "standard"
  listeners:
    client:
      protocol: PLAINTEXT
    controller:
      protocol: PLAINTEXT
    interbroker:
      protocol: PLAINTEXT
  autoRecovery:
    enabled: true
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi
  metrics:
    kafka:
      enabled: true
      jmx:
        enabled: true
      serviceMonitor:
        enabled: true

# ------------------------------------------------------------------------------
# Redis Configuration (Bitnami Chart Dependency)
# ------------------------------------------------------------------------------
redis:
  enabled: true
  architecture: replication
  replica:
    replicaCount: 3
  auth:
    enabled: true
    existingSecret: redis-credentials
  master:
    persistence:
      enabled: true
      size: 20Gi
      storageClass: "standard"
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

