name: CI - Hotfix (Fast-Track)

on:
  pull_request:
    branches: [hotfix, production]
    types: [opened, synchronize, reopened]
  push:
    branches: [hotfix]
  workflow_dispatch:

concurrency:
  group: ci-hotfix-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # Install Shared Libraries
  install-shared-libraries:
    name: Install Shared Libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: 'maven'
      - name: Install shared-libraries to local .m2
        working-directory: foundation-domain/shared-libraries/shared-libraries/Backend/Java
        run: mvn clean install -DskipTests -B -q
      - name: Cache .m2 repository
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: m2-shared-libs-hotfix-${{ github.sha }}

  # Detect Hotfix Scope
  detect-changes:
    name: Detect Hotfix Changes
    runs-on: ubuntu-latest
    needs: install-shared-libraries
    outputs:
      foundation: ${{ steps.filter.outputs.foundation }}
      management: ${{ steps.filter.outputs.management }}
      shared-logics: ${{ steps.filter.outputs.shared-logics }}
      shared-infra: ${{ steps.filter.outputs.shared-infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: production
          filters: |
            foundation:
              - 'foundation-domain/**'
            management:
              - 'management-domain/**'
            shared-logics:
              - 'shared-business-logics/**'
            shared-infra:
              - 'shared-business-infrastructure/**'

  # Build Foundation Domain Hotfix
  build-foundation-hotfix:
    name: Foundation Hotfix
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.foundation == 'true'
    strategy:
      fail-fast: true
      matrix:
        parent:
          - ai-platform
          - centralized-configuration
          - Shared-infrastructure-Hexgonal/Shared-infrastructure-Hexgonal
          - platform/platform/Backend/Java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: 'maven'
      - name: Restore shared-libraries from cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: m2-shared-libs-hotfix-${{ github.sha }}
      - name: Check parent POM exists
        id: check
        run: |
          POM_PATH="foundation-domain/${{ matrix.parent }}/pom.xml"
          if [ -f "$POM_PATH" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::POM not found: $POM_PATH (skipping)"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Maven Reactor Build & Test
        if: steps.check.outputs.exists == 'true'
        working-directory: foundation-domain/${{ matrix.parent }}
        run: mvn clean verify -T 1C -B

  # Build Management Domain Hotfix
  build-management-hotfix:
    name: Management Hotfix
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.management == 'true'
    strategy:
      fail-fast: true
      matrix:
        parent:
          - Foundation-Services-Monitoring/Backend
          - Global-business-management/Backend/Java
          - Human-resource/Human-resource/Backend/Java
          - Sales-department/Backend/Java
          - System-Administrator/Backend
          - Customer-support/Customer-support/Backend/Java
          - Digital-marketing/Backend/Java
          - Executive-domain-X/Executive-domain-X/Backend/Java
          - Finance-department/Backend/Java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: 'maven'
      - name: Restore shared-libraries from cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: m2-shared-libs-hotfix-${{ github.sha }}
      - name: Check parent POM exists
        id: check
        run: |
          POM_PATH="management-domain/${{ matrix.parent }}/pom.xml"
          if [ -f "$POM_PATH" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::POM not found: $POM_PATH (skipping)"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Maven Reactor Build & Test
        if: steps.check.outputs.exists == 'true'
        working-directory: management-domain/${{ matrix.parent }}
        run: mvn clean verify -T 1C -B

  # Build Shared Business Logics Hotfix
  build-shared-logics-hotfix:
    name: Shared Logics Hotfix
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.shared-logics == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: 'maven'
      - name: Restore shared-libraries from cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: m2-shared-libs-hotfix-${{ github.sha }}
      - name: Maven Reactor Build & Test
        working-directory: shared-business-logics
        run: mvn clean verify -T 1C -B

  # Build Shared Business Infrastructure Hotfix
  build-shared-infra-hotfix:
    name: Shared Infra Hotfix
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.shared-infra == 'true'
    strategy:
      fail-fast: true
      matrix:
        parent:
          - Backend/Java
          - courier/courier
          - warehousing/warehousing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: 'maven'
      - name: Restore shared-libraries from cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: m2-shared-libs-hotfix-${{ github.sha }}
      - name: Check parent POM exists
        id: check
        run: |
          POM_PATH="shared-business-infrastructure/${{ matrix.parent }}/pom.xml"
          if [ -f "$POM_PATH" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::POM not found: $POM_PATH (skipping)"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Maven Reactor Build & Test
        if: steps.check.outputs.exists == 'true'
        working-directory: shared-business-infrastructure/${{ matrix.parent }}
        run: mvn clean verify -T 1C -B

  # Build Hotfix Docker Images
  docker-hotfix:
    name: Hotfix Docker Images
    runs-on: ubuntu-latest
    needs: [detect-changes, build-foundation-hotfix, build-management-hotfix, build-shared-logics-hotfix, build-shared-infra-hotfix]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push Hotfix Images
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION="hotfix-${SHORT_SHA}"
          echo "## Building hotfix images: ${VERSION}" >> $GITHUB_STEP_SUMMARY

          BUILT=0
          for jar in $(find . -path "*/target/*.jar" -not -name "*-sources.jar" -not -name "*-javadoc.jar" | grep -v shared-libraries | grep -v target | head -50); do
            service_dir=$(dirname $(dirname "$jar"))
            service_name=$(basename "$service_dir")
            if [[ "$service_name" != "target" && "$service_name" != "classes" ]]; then
              IMAGE_TAG="ghcr.io/${{ github.repository }}/${service_name}:${VERSION}"
              if [ -f "$service_dir/Dockerfile" ]; then
                echo "::group::Building $service_name"
                docker build -t "$IMAGE_TAG" "$service_dir"
                docker push "$IMAGE_TAG"
                BUILT=$((BUILT + 1))
                echo "- $service_name" >> $GITHUB_STEP_SUMMARY
                echo "::endgroup::"
              elif [ -f "$service_dir/src/main/docker/Dockerfile" ]; then
                echo "::group::Building $service_name"
                docker build -t "$IMAGE_TAG" -f "$service_dir/src/main/docker/Dockerfile" "$service_dir"
                docker push "$IMAGE_TAG"
                BUILT=$((BUILT + 1))
                echo "- $service_name" >> $GITHUB_STEP_SUMMARY
                echo "::endgroup::"
              fi
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Built $BUILT hotfix images**" >> $GITHUB_STEP_SUMMARY

  # Security Scan Hotfix Images
  scan-hotfix:
    name: Scan Hotfix Images
    runs-on: ubuntu-latest
    needs: docker-hotfix
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy Scan Hotfix Images
        env:
          TRIVY_TIMEOUT: 10m
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION="hotfix-${SHORT_SHA}"
          FAILED=0

          for image in $(docker images --format '{{.Repository}}:{{.Tag}}' | grep "ghcr.io/${{ github.repository }}" | grep "$VERSION"); do
            echo "::group::Scanning $image"
            if ! docker run --rm aquasec/trivy:latest image --severity "CRITICAL,HIGH" --exit-code 1 "$image"; then
              echo "::error::Vulnerabilities found in $image"
              FAILED=1
            fi
            echo "::endgroup::"
          done
          if [ "$FAILED" -ne 0 ]; then exit 1; fi

  # Hotfix Production Approval
  approve-hotfix:
    name: Hotfix Production Approval
    runs-on: ubuntu-latest
    needs: [build-foundation-hotfix, build-management-hotfix, build-shared-logics-hotfix, build-shared-infra-hotfix, scan-hotfix]
    environment: production
    steps:
      - run: |
          echo "## Hotfix Production Approval" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Hotfix requires explicit production approval." >> $GITHUB_STEP_SUMMARY

  # Deploy Hotfix to Production
  deploy-hotfix:
    name: Deploy Hotfix to Production
    runs-on: ubuntu-latest
    needs: approve-hotfix
    environment: production
    steps:
      - run: |
          echo "## 🚀 Hotfix Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deploying hotfix to production..." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ *Actual deployment disabled until cloud provider is configured*" >> $GITHUB_STEP_SUMMARY
