# =============================================================================
# Dynamic Pricing Service Configuration
# =============================================================================

server:
  port: ${SERVICE_PORT:8114}
  servlet:
    context-path: /api/v1
  shutdown: graceful

spring:
  application:
    name: dynamic-pricing-service

  # MongoDB Configuration
  data:
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT:27017}
      database: ${MONGODB_DB:dynamic_pricing}
      username: ${MONGODB_USER:}
      password: ${MONGODB_PASSWORD:}
      authentication-database: ${MONGODB_AUTH_DB:admin}
      auto-index-creation: true

  # Redis Configuration
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializers.JsonSerializer
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializers.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.gogidix.courier: ${LOG_LEVEL:DEBUG}

# Service Specific Configuration
pricing:
  surge:
    enabled: ${SURGE_ENABLED:true}
    default-threshold: ${SURGE_THRESHOLD:1.5}
    max-multiplier: ${MAX_MULTIPLIER:3.0}
  cache:
    ttl-seconds: ${CACHE_TTL_SECONDS:60}
