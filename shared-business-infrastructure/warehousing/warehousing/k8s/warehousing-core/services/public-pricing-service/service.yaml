apiVersion: v1
kind: Service
metadata:
  name: public-pricing-service
  namespace: warehousing-core
  labels:
    app: public-pricing-service
    service: public-pricing-service
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
  - name: http
    port: 8281
    targetPort: http
    protocol: TCP
  - name: management
    port: 8282
    targetPort: management
    protocol: TCP
  selector:
    app: public-pricing-service
---
apiVersion: v1
kind: Service
metadata:
  name: public-pricing-service-headless
  namespace: warehousing-core
  labels:
    app: public-pricing-service
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8281
    targetPort: http
    protocol: TCP
  selector:
    app: public-pricing-service
