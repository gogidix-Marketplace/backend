version: '3.8'

services:
  subscription-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subscription-service
    ports:
      - "8402:8402"
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/subscription_service
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - STRIPE_API_KEY=sk_test_test
      - SERVER_PORT=8402
      - SPRING_PROFILES_ACTIVE=dev
    depends_on:
      - postgres
      - redis
      - kafka
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8402/subscriptions/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    networks:
      - subscription-network

  postgres:
    image: postgres:14-alpine
    container_name: subscription-postgres
    environment:
      - POSTGRES_DB=subscription_service
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - subscription-network

  redis:
    image: redis:7-alpine
    container_name: subscription-redis
    ports:
      - "6381:6379"
    networks:
      - subscription-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: subscription-kafka
    ports:
      - "9094:9092"
    environment:
      - KAFKA_BROKER_ID=3
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    depends_on:
      - zookeeper
    networks:
      - subscription-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: subscription-zookeeper
    ports:
      - "2183:2181"
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    networks:
      - subscription-network

volumes:
  postgres-data:

networks:
  subscription-network:
    driver: bridge
