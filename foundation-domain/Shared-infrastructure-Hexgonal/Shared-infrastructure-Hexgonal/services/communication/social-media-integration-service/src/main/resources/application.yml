server:
  port: 8380
  servlet:
    context-path: /social_media_integration
  compression:
    enabled: true
  http2:
    enabled: true

spring:
  application:
    name: social-media-integration-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:development}

  # Database Configuration

  # JPA Configuration

  # MongoDB Configuration (for documents, search indices, and large data)
  data:
    mongodb:
      uri: mongodb+srv://gogidixtech_db_user:db_Ajimmy2907@cluster0.0kobcr.mongodb.net/social_media_integration_service?retryWrites=true&w=majority
      auto-index-creation: true

  # Elasticsearch Configuration (for search-service)
  elasticsearch:
    uris: http://localhost:9200
    username: elastic
    password: changeme

# Service Discovery
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
    instance-info-replication-interval-seconds: 10
  instance:
    hostname: ${HOSTNAME:localhost}
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,env
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}

# Logging Configuration
logging:
  level:
    com.gogidix.infrastructure.socialmediaintegrationservice: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/social-media-integration-service.log
    max-size: 100MB
    max-history: 30

# Application Specific Configuration

social-media:
  integration:
    platforms:
      - twitter
      - facebook
      - instagram
      - linkedin
    api-keys:
      twitter: ${{TWITTER_API_KEY:}}
      facebook: ${{FACEBOOK_API_KEY:}}


