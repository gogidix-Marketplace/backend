server:
  port: 8080

spring:
  application:
    name: benefits-administration-service

  data:
    mongodb:
      host: localhost
      port: 27017
      database: benefits-administration-service_db
      auto-index-creation: true

    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: benefits-administration-service-group

kafka:
  enabled: true
  topic:
    benefit-events: benefit-events

logging:
  level:
    com.gogidix.hr.benefitsadministration: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
