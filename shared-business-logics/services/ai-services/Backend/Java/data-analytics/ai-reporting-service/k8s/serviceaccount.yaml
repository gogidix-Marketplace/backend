apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-reporting-service
  namespace: ai-services
  labels:
    app: ai-reporting-service
    version: v1
    team: team-ai-data-analytics
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/ai-reporting-service-role
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-reporting-service
  namespace: ai-services
  labels:
    app: ai-reporting-service
    version: v1
    team: team-ai-data-analytics
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-reporting-service
  namespace: ai-services
  labels:
    app: ai-reporting-service
    version: v1
    team: team-ai-data-analytics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-reporting-service
subjects:
- kind: ServiceAccount
  name: ai-reporting-service
  namespace: ai-services
