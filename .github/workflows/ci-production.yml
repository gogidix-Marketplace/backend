name: CI - Production

on:
  pull_request:
    branches: [production]
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-production-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  approve:
    name: Production Approval Gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Production deployment approved"

  pull-and-retag:
    name: Pull & Retag Staging Images
    runs-on: ubuntu-latest
    needs: approve
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Production Version
        id: version
        run: |
          DATE=$(date +%Y.%m.%d)
          RUN_NUMBER=${{ github.run_number }}
          echo "version=v${DATE}.${RUN_NUMBER}" >> $GITHUB_OUTPUT
      - name: Pull Staging Images & Retag for Production
        env:
          PROD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          STAGING_TAG="${{ github.event.pull_request.head.sha }}"
          for image in $(docker images --format '{{.Repository}}' | grep "ghcr.io/${{ github.repository }}" | sort -u); do
            service_name=$(echo "$image" | rev | cut -d/ -f1 | rev)
            STAGING_IMAGE="${image}:staging-*"
            PROD_IMAGE="${image}:${PROD_VERSION}"
            LATEST_IMAGE="${image}:latest"
            echo "::group::Promoting $service_name"
            docker pull "${image}:staging-RC-*" 2>/dev/null || {
              echo "::error::Could not pull staging image for $service_name"
              exit 1
            }
            docker tag "${image}:staging-RC-*" "$PROD_IMAGE"
            docker tag "${image}:staging-RC-*" "$LATEST_IMAGE"
            docker push "$PROD_IMAGE"
            docker push "$LATEST_IMAGE"
            echo "::endgroup::"
          done

  trivy-production-scan:
    name: Trivy Production Scan
    runs-on: ubuntu-latest
    needs: pull-and-retag
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy Scan (CRITICAL only)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          severity: "CRITICAL"
          exit-code: "1"

  deploy-canary-10:
    name: Canary Deploy 10% (Disabled)
    runs-on: ubuntu-latest
    needs: [pull-and-retag, trivy-production-scan]
    if: false
    environment:
      name: production-canary
    steps:
      - run: echo "SAE deployment disabled until Alibaba Cloud is configured"

  deploy-canary-50:
    name: Canary Deploy 50% (Disabled)
    runs-on: ubuntu-latest
    needs: deploy-canary-10
    if: false
    environment: production
    steps:
      - run: echo "SAE deployment disabled until Alibaba Cloud is configured"

  deploy-full:
    name: Full Production Deploy (Disabled)
    runs-on: ubuntu-latest
    needs: deploy-canary-50
    if: false
    environment: production
    steps:
      - run: echo "SAE deployment disabled until Alibaba Cloud is configured"
