apiVersion: v1
kind: Service
metadata:
  name: outbound-core-service
  namespace: warehousing-core
  labels:
    app: outbound-core-service
    service: outbound-core-service
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
  - name: http
    port: 8201
    targetPort: http
    protocol: TCP
  - name: management
    port: 8202
    targetPort: management
    protocol: TCP
  selector:
    app: outbound-core-service
---
apiVersion: v1
kind: Service
metadata:
  name: outbound-core-service-headless
  namespace: warehousing-core
  labels:
    app: outbound-core-service
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8201
    targetPort: http
    protocol: TCP
  selector:
    app: outbound-core-service
