# ============================================================================
# VOLUMES - Persistent Data Storage
# ============================================================================
volumes:
  # MongoDB Data Volumes
  mongodb-primary-data:
    driver: local
  mongodb-secondary-1-data:
    driver: local
  mongodb-secondary-2-data:
    driver: local
  mongodb-config:
    driver: local

  # Kafka/Zookeeper Data Volumes
  kafka-data:
    driver: local
  zookeeper-data:
    driver: local
  zookeeper-logs:
    driver: local

  # Redis Data Volume
  redis-data:
    driver: local

# ============================================================================
# NETWORKS - Container Communication
# ============================================================================
networks:
  courier-network:
    name: courier-network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.29.0.0/16
