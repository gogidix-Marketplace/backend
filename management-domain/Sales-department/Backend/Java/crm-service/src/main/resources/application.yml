# =============================================================================
# CRM Service Configuration - Sales Department
# Multi-Tenant SaaS Hexagonal Architecture
# =============================================================================

server:
  port: ${SERVICE_PORT:8090}
  servlet:
    context-path: /api/v1
  shutdown: graceful

spring:
  application:
    name: crm-service

  # MongoDB Configuration
  data:
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT:27017}
      database: ${MONGODB_DB:crm-service_db}
      username: ${MONGODB_USER:}
      password: ${MONGODB_PASSWORD:}
      authentication-database: admin
      auto-index-creation: true

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializers.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializers.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
    topics:
      crm-events: crm-service.events
      customer-events: crm.customer-events
      interaction-events: crm.interaction-events
      domain-events: sales.domain-events

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# OpenAPI / Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    try-it-out-enabled: true
    display-request-duration: true
  show-actuator: true
  packages-to-scan: com.gogidix.sales.crm.interfaces.rest

# Logging Configuration
logging:
  level:
    root: INFO
    com.gogidix.sales.crm: ${LOG_LEVEL:DEBUG}
    org.springframework.data.mongodb: INFO
    org.springframework.kafka: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg [tenantId=%X{tenantId:UNKNOWN}][traceId=%X{traceId:},spanId=%X{spanId:}]%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg [tenantId=%X{tenantId:UNKNOWN}][traceId=%X{traceId:},spanId=%X{spanId:}]%n"
  file:
    name: logs/crm-service.log
    max-size: 100MB
    max-history: 30

# Application Specific Configuration
crm-service:
  customer:
    lifecycle-stages:
      - LEAD
      - PROSPECT
      - QUALIFIED_LEAD
      - OPPORTUNITY
      - CUSTOMER
      - CHURNED
    segments:
      - ENTERPRISE
      - MID_MARKET
      - SMALL_BUSINESS
      - STARTUP
    industries:
      - TECHNOLOGY
      - FINANCE
      - HEALTHCARE
      - RETAIL
      - MANUFACTURING
      - EDUCATION
      - GOVERNMENT
      - OTHER
  interaction:
    types:
      - CALL
      - EMAIL
      - MEETING
      - SMS
      - CHAT
      - SOCIAL_MEDIA
      - WEBINAR
      - EVENT
      - NOTE
    directions:
      - INBOUND
      - OUTBOUND
  account:
    types:
      - STRATEGIC
      - ENTERPRISE
      - MID_MARKET
      - SMALL_BUSINESS
      - PARTNER
    hierarchies:
      - PARENT
      - CHILD
      - SIBLING
