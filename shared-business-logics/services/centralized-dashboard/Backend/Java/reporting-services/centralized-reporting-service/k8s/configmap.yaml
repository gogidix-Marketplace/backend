apiVersion: v1
kind: ConfigMap
metadata:
  name: centralized-reporting-service-config
  namespace: centralized-dashboard
  labels:
    app: centralized-reporting-service
    team: team-f-centralized-dashboard
data:
  database-url: "jdbc:postgresql://postgres:5432/reporting"
  redis-host: "redis"
  redis-port: "6379"
  kafka-bootstrap-servers: "kafka:9092"
  report-output-dir: "/tmp/reports"
