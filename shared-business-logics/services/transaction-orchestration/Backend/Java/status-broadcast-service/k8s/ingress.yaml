apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: status-broadcast-service-ingress
  namespace: transaction-orchestration
  labels:
    app: status-broadcast-service
    team: team-b-transaction
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
    nginx.ingress.kubernetes.io/websocket-services: "status-broadcast-service"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - status-broadcast.gogidix.com
    secretName: status-broadcast-service-tls
  rules:
  - host: status-broadcast.gogidix.com
    http:
      paths:
      - path: /api/status(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: status-broadcast-service
            port:
              number: 8084
      - path: /ws(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: status-broadcast-service
            port:
              number: 8084
      - path: /
        pathType: Prefix
        backend:
          service:
            name: status-broadcast-service
            port:
              number: 8084
