{{/*
Generate NetworkPolicy for the ai-services namespace if enabled
*/}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-services.fullname" . }}-network-policy
  namespace: {{ .Values.namespace.name | default "ai-services" }}
  labels:
    {{- include "ai-services.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
  {{- range .Values.networkPolicy.policyTypes }}
  - {{ . }}
  {{- end }}
  ingress:
  {{- range .Values.networkPolicy.ingress }}
  - {{- toYaml . | nindent 4 }}
  {{- end }}
  egress:
  {{- range .Values.networkPolicy.egress }}
  - {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
