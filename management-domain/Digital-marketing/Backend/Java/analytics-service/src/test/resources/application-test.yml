# =============================================================================
# Digital Marketing Analytics Service Test Configuration
# =============================================================================

spring:
  application:
    name: analytics-service

  # MongoDB Configuration for tests
  data:
    mongodb:
      database: test_digital_marketing_analytics
      auto-index-creation: true

  # Disable Redis for tests
  redis:
    host: localhost
    port: 6379
    database: 15  # Use separate database for tests

  # Kafka Configuration for tests
  kafka:
    bootstrap-servers: ${KAFKA_TEST_SERVER:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializers.JsonSerializer
    consumer:
      group-id: analytics-service-test
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializers.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

# Disable Mongock for tests
mongock:
  enabled: false

# Logging for tests
logging:
  level:
    root: INFO
    com.gogidix: DEBUG
    org.springframework.data.mongodb: INFO
    org.springframework.test: DEBUG

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Test-specific properties
app:
  analytics:
    metric-retention-days: 30
    default-granularity: DAY
    max-batch-size: 100
