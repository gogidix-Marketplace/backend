apiVersion: v1
kind: ConfigMap
metadata:
  name: message-broker-service-config
  namespace: infrastructure
data:
  application.yml: |
    spring:
      application:
        name: message-broker-service
      kafka:
        bootstrap-servers: kafka.infrastructure.svc.cluster.local:9092
    server:
      port: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: message-broker-service
  namespace: infrastructure
  labels:
    app: message-broker-service
    component: infrastructure
    domain: foundation
    tier: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: message-broker-service

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-broker-service
  namespace: infrastructure
  labels:
    app: message-broker-service
    component: infrastructure
    domain: foundation
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: message-broker-service
  template:
    metadata:
      labels:
        app: message-broker-service
        component: infrastructure
        domain: foundation
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: message-broker-service
      terminationGracePeriodSeconds: 30
      containers:
      - name: message-broker-service
        image: message-broker-service:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: JAVA_OPTS
          value: "-Xms512m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: logs
        emptyDir: {}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: message-broker-service
  namespace: infrastructure
  labels:
    app: message-broker-service

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: message-broker-service-pdb
  namespace: infrastructure
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: message-broker-service

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: message-broker-service-hpa
  namespace: infrastructure
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: message-broker-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
