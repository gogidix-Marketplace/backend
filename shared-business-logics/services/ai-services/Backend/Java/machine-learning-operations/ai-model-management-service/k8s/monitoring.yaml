apiVersion: v1
kind: ServiceMonitor
metadata:
  name: ai-model-management-service
  namespace: ai-services
  labels:
    app: ai-model-management-service
    team: team-ai-mlops
    release: prometheus
spec:
  selector:
    matchLabels:
      app: ai-model-management-service
  endpoints:
  - port: http
    path: /actuator/prometheus
    interval: 30s
    scrapeTimeout: 10s
    scheme: http
---
apiVersion: v1
kind: PrometheusRule
metadata:
  name: ai-model-management-service-alerts
  namespace: ai-services
  labels:
    app: ai-model-management-service
    team: team-ai-mlops
    release: prometheus
spec:
  groups:
  - name: ai-model-management-service
    interval: 30s
    rules:
    - alert: AiModelManagementServiceDown
      expr: up{job="ai-model-management-service"} == 0
      for: 5m
      labels:
        severity: critical
        team: team-ai-mlops
      annotations:
        summary: "AI Model Management Service is down"
        description: "AI Model Management Service has been down for more than 5 minutes"
    - alert: AiModelManagementServiceHighErrorRate
      expr: rate(http_requests_total{job="ai-model-management-service",status=~"5.."}[5m]) > 0.05
      for: 5m
      labels:
        severity: warning
        team: team-ai-mlops
      annotations:
        summary: "AI Model Management Service high error rate"
        description: "AI Model Management Service error rate is {{ $value }} errors/sec"
    - alert: AiModelManagementServiceHighLatency
      expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="ai-model-management-service"}[5m])) > 1
      for: 10m
      labels:
        severity: warning
        team: team-ai-mlops
      annotations:
        summary: "AI Model Management Service high latency"
        description: "95th percentile latency is {{ $value }}s"
    - alert: AiModelManagementServiceStorageFull
      expr: (kubelet_volume_stats_used_bytes{namespace="ai-services", persistentvolumeclaim=~"ai-model-management-.*"} / kubelet_volume_stats_capacity_bytes{namespace="ai-services", persistentvolumeclaim=~"ai-model-management-.*"}) > 0.9
      for: 5m
      labels:
        severity: warning
        team: team-ai-mlops
      annotations:
        summary: "AI Model Management Service storage almost full"
        description: "Storage usage is above 90% for PVC {{ $labels.persistentvolumeclaim }}"
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: ai-model-management-service-metrics
  namespace: ai-services
  labels:
    app: ai-model-management-service
    team: team-ai-mlops
spec:
  from:
  - group: monitoring.coreos.com
    kind: Prometheus
    namespace: monitoring
  to:
  - group: ""
    kind: Service
