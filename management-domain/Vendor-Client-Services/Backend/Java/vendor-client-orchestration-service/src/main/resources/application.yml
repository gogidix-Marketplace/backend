server:
  port: 8080

spring:
  application:
    name: vendor-client-orchestration-service
  datasource:
    url: jdbc:postgresql://localhost:5432/vendor_orchestration_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html