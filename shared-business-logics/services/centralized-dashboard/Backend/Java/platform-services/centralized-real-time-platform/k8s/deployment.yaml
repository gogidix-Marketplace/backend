apiVersion: v1
kind: ServiceAccount
metadata:
  name: centralized-real-time-platform
  namespace: centralized-dashboard
  labels:
    app: centralized-real-time-platform
    team: team-f-centralized-dashboard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: centralized-real-time-platform
  namespace: centralized-dashboard
  labels:
    app: centralized-real-time-platform
    team: team-f-centralized-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: centralized-real-time-platform
  template:
    metadata:
      labels:
        app: centralized-real-time-platform
        team: team-f-centralized-dashboard
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8915"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: centralized-real-time-platform
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: centralized-real-time-platform
        image: ghcr.io/gogidix/centralized-real-time-platform:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8915
          protocol: TCP
        - name: websocket
          containerPort: 8915
          protocol: TCP
        env:
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: centralized-real-time-platform-config
              key: redis-host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: centralized-real-time-platform-config
              key: redis-port
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: centralized-real-time-platform-secrets
              key: redis-password
        - name: KAFKA_SERVERS
          valueFrom:
            configMapKeyRef:
              name: centralized-real-time-platform-config
              key: kafka-bootstrap-servers
        - name: WS_ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: centralized-real-time-platform-config
              key: ws-allowed-origins
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/v1/liveness
            port: 8915
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/readiness
            port: 8915
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/v1/health
            port: 8915
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 18
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      restartPolicy: Always
