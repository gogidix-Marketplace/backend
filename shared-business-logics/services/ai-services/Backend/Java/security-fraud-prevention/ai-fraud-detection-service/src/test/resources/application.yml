spring:
  application:
    name: ai-fraud-detection-service-test
  main:
    allow-bean-definition-overriding: true
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/ai-fraud-detection-test?connectTimeoutMS=60000&serverSelectionTimeoutMS=60000&socketTimeoutMS=60000}
      auto-index-creation: true
  test:
    context:
      cache:
        enabled: false

server:
  port: 0  # Random port for tests

logging:
  level:
    com.gogidix.aiservices.aifrauddetectionservice: DEBUG
    org.springframework.data.mongodb: DEBUG
