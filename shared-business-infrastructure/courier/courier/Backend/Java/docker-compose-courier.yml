      dockerfile: Dockerfile
    container_name: assignment-service
    ports:
      - "8102:8102"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: assignment-service
      SERVER_PORT: 8102
      MONGODB_URI: mongodb://admin:admin123@mongodb-primary:27017,assignment-db?authSource=admin&replicaSet=rs0
      KAFKA_BROKERS: kafka:9092
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      X-TENANT-ID: assignment-service
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      TENANT_CONFIG_SERVICE_URL: http://tenant-config-service:8100
      DRIVER_POOL_SERVICE_URL: http://driver-pool-service:8105
      AVAILABILITY_SERVICE_URL: http://availability-service:8106
      LOAD_BALANCING_SERVICE_URL: http://load-balancing-service:8103
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
    depends_on:
      mongodb-primary:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      tenant-config-service:
        condition: service_healthy
      driver-pool-service:
        condition: service_healthy
      availability-service:
        condition: service_healthy
      load-balancing-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8102/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - courier-network
    restart: unless-stopped

  # ------------------------------------------------------------------------
  # Load Balancing Service - Workload Distribution
  # ------------------------------------------------------------------------
  load-balancing-service:
    build:
      context: ./Dispatch/load-balancing-service
      dockerfile: Dockerfile
    container_name: load-balancing-service
    ports:
      - "8103:8103"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: load-balancing-service
      SERVER_PORT: 8103
      MONGODB_URI: mongodb://admin:admin123@mongodb-primary:27017,load-balancing-db?authSource=admin&replicaSet=rs0
      KAFKA_BROKERS: kafka:9092
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      X-TENANT-ID: load-balancing-service
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      TENANT_CONFIG_SERVICE_URL: http://tenant-config-service:8100
      PERFORMANCE_SERVICE_URL: http://performance-service:8107
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
    depends_on:
      mongodb-primary:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      tenant-config-service:
