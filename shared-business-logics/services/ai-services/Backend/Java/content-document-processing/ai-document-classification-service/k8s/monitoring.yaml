apiVersion: v1
kind: ServiceMonitor
metadata:
  name: ai-document-classification-service
  namespace: ai-services
  labels:
    app: ai-document-classification-service
    version: v1
    team: team-ai-content-processing
    component: content-document-processing
    environment: production
    release: prometheus-operator
spec:
  selector:
    matchLabels:
      app: ai-document-classification-service
  endpoints:
  - port: management
    path: /actuator/prometheus
    interval: 30s
    scrapeTimeout: 10s
    scheme: http
  namespaceSelector:
    matchNames:
    - ai-services
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ai-document-classification-service
  namespace: ai-services
  labels:
    app: ai-document-classification-service
    version: v1
    team: team-ai-content-processing
    component: content-document-processing
    environment: production
    release: prometheus-operator
spec:
  groups:
  - name: ai-document-classification-service
    interval: 30s
    rules:
    - alert: AiDocumentClassificationServiceHighErrorRate
      expr: rate(http_server_requests_seconds_count{app="ai-document-classification-service",status=~"5.."}[5m]) > 0.05
      for: 5m
      labels:
        severity: warning
        team: team-ai-content-processing
      annotations:
        summary: High error rate detected for AI Document Classification Service
        description: "Error rate is {{ $value }} errors/sec"
    - alert: AiDocumentClassificationServiceHighLatency
      expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket{app="ai-document-classification-service"}[5m])) > 1
      for: 10m
      labels:
        severity: warning
        team: team-ai-content-processing
      annotations:
        summary: High latency detected for AI Document Classification Service
        description: "P95 latency is {{ $value }} seconds"
    - alert: AiDocumentClassificationServicePodNotReady
      expr: kube_pod_status_ready{app="ai-document-classification-service",namespace="ai-services"} == 0
      for: 5m
      labels:
        severity: critical
        team: team-ai-content-processing
      annotations:
        summary: AI Document Classification Service pod not ready
        description: "Pod {{ $labels.pod }} is not ready"
    - alert: AiDocumentClassificationServiceHighMemoryUsage
      expr: rate(container_memory_working_set_bytes{app="ai-document-classification-service"}[5m]) > 1200000000
      for: 10m
      labels:
        severity: warning
        team: team-ai-content-processing
      annotations:
        summary: High memory usage detected for AI Document Classification Service
        description: "Memory usage is {{ $value }} bytes"
    - alert: AiDocumentClassificationServiceHighCpuUsage
      expr: rate(container_cpu_usage_seconds_total{app="ai-document-classification-service"}[5m]) > 0.8
      for: 10m
      labels:
        severity: warning
        team: team-ai-content-processing
      annotations:
        summary: High CPU usage detected for AI Document Classification Service
        description: "CPU usage is {{ $value }} cores"
