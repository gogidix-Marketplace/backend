spring:
  application:
    name: data-aggregation-service

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/data_aggregation}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 2

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: data-aggregation-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# Feign Client Configuration
courier:
  service:
    url: ${COURIER_SERVICE_URL:http://localhost:8901}

warehouse:
  service:
    url: ${WAREHOUSE_SERVICE_URL:http://localhost:8902}

social-commerce:
  service:
    url: ${SOCIAL_COMMERCE_SERVICE_URL:http://localhost:8903}

dashboard-core:
  service:
    url: ${DASHBOARD_CORE_SERVICE_URL:http://localhost:8904}

server:
  port: ${SERVER_PORT:8905}
  servlet:
    context-path: /
  compression:
    enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.gogidix: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  file:
    name: logs/data-aggregation-service.log
    max-size: 100MB
    max-history: 30

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      courierService:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
        sliding-window-size: 5
      warehouseService:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
        sliding-window-size: 5
      socialCommerceService:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
        sliding-window-size: 5

  retry:
    instances:
      courierService:
        max-attempts: 3
        wait-duration: 1000
      warehouseService:
        max-attempts: 3
        wait-duration: 1000
      socialCommerceService:
        max-attempts: 3
        wait-duration: 1000
