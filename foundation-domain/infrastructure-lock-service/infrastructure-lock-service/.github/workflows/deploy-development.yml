name: Deploy to Development

on:
  push:
    branches: [ develop ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up JDK 17
        uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: cd lock-service && mvn clean package -DskipTests -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@2b512430cf1c7c4fe9b7815b4c7d761f6e893f6b

      - name: Login to Docker Hub
        uses: docker/login-action@e92390c5fb421da1463b202fbb5d8c4abc1a1ff6
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@af5a7ed5ba88268de6df9df61a84dfe726b25e69
        with:
          context: lock-service
          push: true
          tags: |
            gogidix/lock-service:dev
            gogidix/lock-service:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.docker_build.outputs.digest }}"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Deploy to development cluster
        run: |
          echo "Deploying to development environment"
          # Add actual deployment commands here
          # kubectl set image deployment/lock-service lock-service=gogidix/lock-service:dev
