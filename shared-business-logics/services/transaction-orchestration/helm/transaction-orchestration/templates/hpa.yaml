{{- if .Values.hpa.enabled }}
{{- range $name, $service := dict "transactionCoordinator" .Values.transactionCoordinator "transactionManager" .Values.transactionManager "sagaOrchestration" .Values.sagaOrchestration "distributedTransaction" .Values.distributedTransaction "transactionOutbox" .Values.transactionOutbox "transactionRecovery" .Values.transactionRecovery }}
{{- if and $service.enabled (or (eq $service.hpa.enabled true) (and (not (hasKey $service.hpa "enabled")) $.Values.hpa.enabled)) }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "transaction-orchestration.serviceName" (dict "root" $ "serviceName" $service.serviceName) }}
  namespace: {{ include "transaction-orchestration.namespace" $ }}
  labels:
    {{- include "transaction-orchestration.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $service.serviceName }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "transaction-orchestration.serviceName" (dict "root" $ "serviceName" $service.serviceName) }}
  {{- with $service.hpa.minReplicas }}
  minReplicas: {{ . }}
  {{- else }}
  minReplicas: {{ $.Values.hpa.minReplicas }}
  {{- end }}
  {{- with $service.hpa.maxReplicas }}
  maxReplicas: {{ . }}
  {{- else }}
  maxReplicas: {{ $.Values.hpa.maxReplicas }}
  {{- end }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        {{- with $service.hpa.targetCPUUtilization }}
        averageUtilization: {{ . }}
        {{- else }}
        averageUtilization: {{ $.Values.hpa.targetCPUUtilization }}
        {{- end }}
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        {{- with $service.hpa.targetMemoryUtilization }}
        averageUtilization: {{ . }}
        {{- else }}
        averageUtilization: {{ $.Values.hpa.targetMemoryUtilization }}
        {{- end }}
  {{- with $.Values.hpa.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
