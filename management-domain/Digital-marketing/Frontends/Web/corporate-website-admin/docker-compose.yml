version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: corporate-website-admin
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:4000
    networks:
      - gogidix-network
    restart: unless-stopped

networks:
  gogidix-network:
    external: true
