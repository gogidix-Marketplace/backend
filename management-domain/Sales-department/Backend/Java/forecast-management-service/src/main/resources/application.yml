# =============================================================================
# Forecast Management Service Configuration - Sales Department
# Multi-Tenant SaaS Hexagonal Architecture
# =============================================================================

server:
  port: ${SERVICE_PORT:8090}
  servlet:
    context-path: /api/v1
  shutdown: graceful

spring:
  application:
    name: forecast-management-service

  # MongoDB Configuration
  data:
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT:27017}
      database: ${MONGODB_DB:forecast-management-service_db}
      username: ${MONGODB_USER:}
      password: ${MONGODB_PASSWORD:}
      authentication-database: admin
      auto-index-creation: true

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializers.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializers.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
    topics:
      forecast-events: forecast-management-service.events
      domain-events: sales.domain-events

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# OpenAPI / Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    try-it-out-enabled: true
    display-request-duration: true
  show-actuator: true
  packages-to-scan: com.gogidix.sales.forecast.interfaces.rest

# Logging Configuration
logging:
  level:
    root: INFO
    com.gogidix.sales.forecast: ${LOG_LEVEL:DEBUG}
    org.springframework.data.mongodb: INFO
    org.springframework.kafka: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg [tenantId=%X{tenantId:UNKNOWN}][traceId=%X{traceId:},spanId=%X{spanId:}]%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg [tenantId=%X{tenantId:UNKNOWN}][traceId=%X{traceId:},spanId=%X{spanId:}]%n"
  file:
    name: logs/forecast-management-service.log
    max-size: 100MB
    max-history: 30

# Application Specific Configuration
forecast-management-service:
  forecast:
    periods:
      - MONTHLY
      - QUARTERLY
      - ANNUAL
    categories:
      - BEST_CASE
      - WORST_CASE
      - LIKELY
    line-item-types:
      - PRODUCT
      - TERRITORY
      - CUSTOMER_SEGMENT
      - SALES_CHANNEL
    approval:
      auto-approve-below: 50000
      manager-approve-below: 250000
      director-approve-above: 250000
      required-approvers: 2
    versioning:
      max-versions: 10
      auto-archive: true
    comparison:
      tolerance-percentage: 10
      variance-calculation: actual-vs-forecast
    notification:
      on-create: true
      on-update: true
      on-approve: true
      on-reject: true
