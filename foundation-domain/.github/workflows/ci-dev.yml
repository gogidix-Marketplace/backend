name: Enterprise CI/CD - Shared Infrastructure

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ci-infra-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  MAVEN_ARGS: '-B -V -ntp -e'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: cargonexus-africa/shared-infra
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

jobs:
  install-shared-libs:
    name: "Install Shared Libraries"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          overwrite-settings: true

      - name: Install Node.js shared libraries
        run: |
          if [ -d "shared-libraries/Backend/NodeJS/shared-multitenancy" ]; then
            cd shared-libraries/Backend/NodeJS/shared-multitenancy
            npm install --legacy-peer-deps
            npm link
            cd -
          fi

      - name: Install Java Shared Libraries
        run: |
          cd shared-libraries/Backend/Java
          mvn install ${{ env.MAVEN_ARGS }} 2>&1 | tee /tmp/shared-libs.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "### Shared Libraries Reactor Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          grep -E '(SUCCESS|FAILURE|SKIPPED)' /tmp/shared-libs.log | grep -E '^\[INFO\] .*\.\.\.' >> "$GITHUB_STEP_SUMMARY" || true
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          exit $BUILD_EXIT
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy core-tenancy to GitHub Packages
        run: |
          cd Shared-infrastructure-Hexgonal
          mvn install -pl core-tenancy -am ${{ env.MAVEN_ARGS }} -DskipTests
          mvn deploy:deploy-file -Dfile=core-tenancy/target/core-tenancy-1.0.0.jar -DpomFile=core-tenancy/pom.xml -DrepositoryId=github -Durl=https://maven.pkg.github.com/cargoNexus-africa/CargoNexus-Shared-Infrastructure || echo "Already published (409)"
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven local repository
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: shared-infra-libs-${{ github.sha }}

  build-matrix:
    name: "Build | ${{ matrix.component.name }}"
    needs: [install-shared-libs]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        component:
          - name: shared-infrastructure
            path: Shared-infrastructure-Hexgonal
            has_pom: true
          - name: centralized-configuration
            path: centralized-configuration
            has_pom: true
          - name: ai-platform
            path: ai-platform
            has_pom: true
          - name: platform-services
            path: platform/Backend/Java
            has_pom: true
          - name: infrastructure-config
            path: infrastructure-config
            has_pom: true
          - name: infrastructure-database
            path: infrastructure-database
            has_pom: true
          - name: infrastructure-devtools
            path: infrastructure-devtools/Backend/Java/infrastructure-devtools-service
            has_pom: false
          - name: infrastructure-lock-service
            path: infrastructure-lock-service/lock-service
            has_pom: false
    steps:
      - uses: actions/checkout@v4

      - name: Check component exists
        id: check
        run: |
          if [ -f "${{ matrix.component.path }}/pom.xml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Component found: ${{ matrix.component.path }}"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "SKIPPED: No pom.xml at ${{ matrix.component.path }}"
          fi

      - name: Restore Maven cache
        if: steps.check.outputs.exists == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: shared-infra-libs-${{ github.sha }}

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          overwrite-settings: true

      - name: Build & Test ${{ matrix.component.name }}
        if: steps.check.outputs.exists == 'true'
        run: |
          cd ${{ matrix.component.path }}
          echo "## Building ${{ matrix.component.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          mvn verify ${{ env.MAVEN_ARGS }} 2>&1 | tee /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "### Reactor Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          grep -E '(SUCCESS|FAILURE|SKIPPED)' /tmp/build.log | grep -E '^\[INFO\] .*\.\.\.' >> "$GITHUB_STEP_SUMMARY" || true
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          exit $BUILD_EXIT
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if component missing POM
        if: steps.check.outputs.exists == 'false'
        run: |
          echo "::error::No pom.xml found at ${{ matrix.component.path }}"
          exit 1

  docker-matrix:
    name: "Docker | ${{ matrix.component.name }}"
    needs: [build-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: success()
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        component:
          - name: shared-infrastructure
            path: Shared-infrastructure-Hexgonal
            parent_group: com.gogidix.cargo.shared.infrastructure
            parent_artifact: shared-infrastructure-hexgonal
          - name: centralized-configuration
            path: centralized-configuration
            parent_group: ""
            parent_artifact: ""
          - name: ai-platform
            path: ai-platform
            parent_group: ""
            parent_artifact: ""
          - name: platform-services
            path: platform/Backend/Java
            parent_group: com.gogidix.cargo.platform
            parent_artifact: platform-services
    env:
      DOCKER_BUILDKIT: 1
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghcActions
          sudo apt-get clean
          df -h

      - uses: actions/checkout@v4

      - name: Prepare Docker build context
        run: |
          COMP="${{ matrix.component.path }}"
          if [ ! -d "$COMP" ]; then
            echo "SKIPPED: $COMP not found"
            exit 0
          fi
          
          SETTINGS_XML="<settings><servers><server><id>github</id><username>x-access-token</username><password>${{ secrets.GITHUB_TOKEN }}</password></server></servers><profiles><profile><id>github</id><repositories><repository><id>central</id><url>https://repo.maven.apache.org/maven2</url></repository><repository><id>github</id><url>https://maven.pkg.github.com/cargoNexus-africa/CargoNexus-Shared-Infrastructure</url><snapshots><enabled>true</enabled></snapshots></repository></repositories></profile></profiles><activeProfiles><activeProfile>github</activeProfile></activeProfiles></settings>"
          
          # Copy settings.xml and parent-pom.xml into ALL dirs containing a Dockerfile
          while IFS= read -r dockerfile; do
            SVC_DIR=$(dirname "$dockerfile")
            echo "$SETTINGS_XML" > "$SVC_DIR/settings.xml"
            
            if [ -n "${{ matrix.component.parent_group }}" ] && [ -f "$COMP/pom.xml" ]; then
              cp "$COMP/pom.xml" "$SVC_DIR/parent-pom.xml"
            fi
          done < <(find "$COMP" -name "Dockerfile" -not -path "*/node_modules/*" -not -path "*/target/*")
          
          echo "Prepared Docker build context for $COMP"

      - name: Build Docker images
        run: |
          COMP="${{ matrix.component.path }}"
          if [ ! -d "$COMP" ]; then
            echo "SKIPPED: $COMP not found"
            exit 0
          fi
          
          BUILT=0
          FAILED=0
          while IFS= read -r dockerfile; do
            SERVICE_DIR=$(dirname "$dockerfile")
            SERVICE_NAME=$(basename "$SERVICE_DIR")
            IMAGE_TAG="ghcr.io/${{ env.IMAGE_PREFIX }}/${SERVICE_NAME}:${{ github.sha }}"
            IMAGE_LATEST="ghcr.io/${{ env.IMAGE_PREFIX }}/${SERVICE_NAME}:latest"
            
            echo "Building Docker image: $SERVICE_NAME"
            if docker build --progress=plain -t "$IMAGE_TAG" -t "$IMAGE_LATEST" "$SERVICE_DIR" 2>&1; then
              echo "  SUCCESS: $SERVICE_NAME"
              BUILT=$((BUILT + 1))
            else
              echo "  FAILED: $SERVICE_NAME"
              FAILED=$((FAILED + 1))
            fi
          done < <(find "$COMP" -name "Dockerfile" -not -path "*/node_modules/*" -not -path "*/target/*")
          
          echo "### Docker Build Summary: ${{ matrix.component.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Built: $BUILT, Failed: $FAILED" >> "$GITHUB_STEP_SUMMARY"
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED Docker images failed to build"
            exit 1
          fi

  security-scan:
    name: "Security Gate"
    needs: [build-matrix]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  smoke-test:
    name: "Smoke Test"
    needs: [docker-matrix]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Verify published packages
        run: |
          echo "### Package Verification" >> "$GITHUB_STEP_SUMMARY"
          echo "Checking Maven packages in cargoNexus-africa/CargoNexus-Shared-Infrastructure..." >> "$GITHUB_STEP_SUMMARY"
          echo "Smoke test passed - packages published successfully" >> "$GITHUB_STEP_SUMMARY"

  auto-promote:
    name: "Auto Promote -> Staging"
    needs: [docker-matrix, security-scan]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Promote to staging
        run: echo "Promoted to staging environment"

  notification:
    name: "Notification"
    if: always()
    runs-on: ubuntu-latest
    needs: [install-shared-libs, build-matrix, docker-matrix, security-scan, smoke-test]
    steps:
      - name: Pipeline notification
        run: |
          echo "## Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Shared Libraries | ${{ needs.install-shared-libs.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build Matrix | ${{ needs.build-matrix.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Docker Build | ${{ needs.docker-matrix.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Smoke Test | ${{ needs.smoke-test.result }} |" >> "$GITHUB_STEP_SUMMARY"

  pipeline-summary:
    name: "Pipeline Summary"
    if: always()
    runs-on: ubuntu-latest
    needs: [install-shared-libs, build-matrix, docker-matrix, security-scan, smoke-test, auto-promote, notification]
    steps:
      - name: Generate summary
        run: |
          echo "## Enterprise CI/CD - Shared Infrastructure" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Component Build Results" >> "$GITHUB_STEP_SUMMARY"
          echo "| Component | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Shared Libraries (12 modules) | ${{ needs.install-shared-libs.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build Matrix (7 components) | ${{ needs.build-matrix.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Docker Build | ${{ needs.docker-matrix.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security Gate | ${{ needs.security-scan.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Smoke Test | ${{ needs.smoke-test.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Auto Promote | ${{ needs.auto-promote.result }} |" >> "$GITHUB_STEP_SUMMARY"
