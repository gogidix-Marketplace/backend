apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: progress-step-service-ingress
  namespace: transaction-orchestration
  labels:
    app: progress-step-service
    team: team-b-transaction
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - progress-step.gogidix.com
    secretName: progress-step-service-tls
  rules:
  - host: progress-step.gogidix.com
    http:
      paths:
      - path: /api/progress(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: progress-step-service
            port:
              number: 8083
      - path: /
        pathType: Prefix
        backend:
          service:
            name: progress-step-service
            port:
              number: 8083
