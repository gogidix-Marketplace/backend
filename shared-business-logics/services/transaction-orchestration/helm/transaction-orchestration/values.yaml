# Default values for transaction-orchestration

global:
  namespace: transaction-orchestration
  imageRegistry: ghcr.io/gogidix
  imageTag: latest
  database:
    host: postgres
    port: 5432
  mongodb:
    host: mongodb
    port: 27017
  redis:
    host: redis
    port: 6379
  kafka:
    bootstrapServers: kafka:9092

# Service-specific configurations
transactionCoordinator:
  enabled: true
  serviceName: transaction-coordinator-service
  servicePort: 8080
  managementPort: 9080
  replicas: 2
  resources:
    requests:
      memory: "768Mi"
      cpu: "250m"
    limits:
      memory: "1.5Gi"
      cpu: "1000m"
  ingress:
    enabled: true
    host: transaction-coordinator.gogidix.com
  database:
    name: transaction_coordinator_db
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10

transactionManager:
  enabled: true
  serviceName: transaction-manager-service
  servicePort: 8081
  managementPort: 9081
  replicas: 2
  resources:
    requests:
      memory: "768Mi"
      cpu: "250m"
    limits:
      memory: "1.5Gi"
      cpu: "1000m"
  ingress:
    enabled: true
    host: transaction-manager.gogidix.com
  database:
    name: transaction_manager_db
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10

sagaOrchestration:
  enabled: true
  serviceName: saga-orchestration-service
  servicePort: 8082
  managementPort: 9082
  replicas: 2
  resources:
    requests:
      memory: "768Mi"
      cpu: "250m"
    limits:
      memory: "1.5Gi"
      cpu: "1000m"
  ingress:
    enabled: true
    host: saga-orchestration.gogidix.com
  database:
    name: saga_orchestration_db
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10

distributedTransaction:
  enabled: true
  serviceName: distributed-transaction-service
  servicePort: 8083
  managementPort: 9083
  replicas: 2
  resources:
    requests:
      memory: "768Mi"
      cpu: "250m"
    limits:
      memory: "1.5Gi"
      cpu: "1000m"
  ingress:
    enabled: true
    host: distributed-transaction.gogidix.com
  database:
    name: distributed_transaction_db
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10

transactionOutbox:
  enabled: true
  serviceName: transaction-outbox-service
  servicePort: 8084
  managementPort: 9084
  replicas: 2
  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "800m"
  ingress:
    enabled: true
    host: transaction-outbox.gogidix.com
  database:
    name: transaction_outbox_db
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8

transactionRecovery:
  enabled: true
  serviceName: transaction-recovery-service
  servicePort: 8085
  managementPort: 9085
  replicas: 2
  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "800m"
  ingress:
    enabled: true
    host: transaction-recovery.gogidix.com
  database:
    name: transaction_recovery_db
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8

# Global Horizontal Pod Autoscaler defaults
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilization: 70
  targetMemoryUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max

# Pod Disruption Budget
pdb:
  enabled: true
  minAvailable: 1
  maxUnavailable: 0

# Monitoring
monitoring:
  enabled: true
  serviceMonitorEnabled: true
  serviceMonitorInterval: 30s
  prometheusRulesEnabled: true
  # Metrics configuration
  metrics:
    enabled: true
    path: /actuator/prometheus
    port: management

# Service Account
serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: true

# Pod Security Context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Container Security Context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
    - ALL

# Health check probes
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: management
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: management
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /actuator/health/liveness
    port: management
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 30

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - transaction-orchestration
        topologyKey: kubernetes.io/hostname

# PostgreSQL credentials (use --set or existing secret)
database:
  existingSecret: false
  secretName: ""
  username: "postgres"
  password: "CHANGE_ME"
  sslMode: disable

# MongoDB credentials
mongodb:
  existingSecret: false
  secretName: ""
  username: "mongouser"
  password: "CHANGE_ME"
  uri: ""

# Redis credentials
redis:
  existingSecret: false
  secretName: ""
  password: ""
  tls: false

# Kafka configuration
kafka:
  existingSecret: false
  secretName: ""
  sasl:
    enabled: false
    mechanism: ""
    username: ""
    password: ""
  tls:
    enabled: false

# Environment variables
env: []
  # - name: SPRING_PROFILES_ACTIVE
  #   value: "prod"
  # - name: JAVA_OPTS
  #   value: "-Xms512m -Xmx1024m"

# ConfigMap overrides
configMaps: {}

# Secret overrides
secrets: {}

# Ingress configuration
ingress:
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
  tls: true

# Service configuration
service:
  type: ClusterIP
  annotations: {}
