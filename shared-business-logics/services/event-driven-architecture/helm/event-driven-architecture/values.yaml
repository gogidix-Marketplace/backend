# Default values for event-driven-architecture

global:
  namespace: event-driven-architecture
  imageRegistry: ghcr.io/gogidix
  imageTag: latest
  imagePullPolicy: IfNotPresent
  database:
    host: postgres
    port: 5432
  redis:
    host: redis
    port: 6379
  kafka:
    bootstrapServers: kafka:9092
  env: production

# Service-specific configurations
messageOrchestratorService:
  enabled: true
  name: message-orchestrator-service
  servicePort: 8200
  managementPort: 8201
  replicas: 2
  resources:
    requests:
      memory: "768Mi"
      cpu: "250m"
    limits:
      memory: "1.5Gi"
      cpu: "1000m"
  ingress:
    enabled: true
    host: message-orchestrator.gogidix.com
    path: /
    pathType: Prefix
    annotations: {}
  envVars:
    SPRING_PROFILES_ACTIVE: "prod"
    SERVER_PORT: "8200"
    MANAGEMENT_SERVER_PORT: "8201"
    KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    REDIS_HOST: "redis"
    REDIS_PORT: "6379"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 70
    targetMemoryUtilization: 80
  pdb:
    enabled: true
    minAvailable: 1
  monitoring:
    enabled: true
    serviceMonitorEnabled: true
    prometheusScrape: true

eventAggregatorService:
  enabled: true
  name: event-aggregator-service
  servicePort: 8201
  managementPort: 8202
  replicas: 2
  resources:
    requests:
      memory: "768Mi"
      cpu: "250m"
    limits:
      memory: "1.5Gi"
      cpu: "1000m"
  ingress:
    enabled: true
    host: event-aggregator.gogidix.com
