apiVersion: v1
kind: ServiceMonitor
metadata:
  name: time-series-forecasting-service
  namespace: ai-services
  labels:
    app: time-series-forecasting-service
    version: v1
    team: team-ai-data-analytics
    release: prometheus
spec:
  selector:
    matchLabels:
      app: time-series-forecasting-service
  endpoints:
  - port: management
    path: /actuator/prometheus
    interval: 30s
    scrapeTimeout: 10s
    scheme: http
    relabelings:
    - sourceLabels: [__meta_kubernetes_pod_name]
      targetLabel: pod
    - sourceLabels: [__meta_kubernetes_pod_node_name]
      targetLabel: node
    - sourceLabels: [__meta_kubernetes_namespace]
      targetLabel: namespace
  namespaceSelector:
    matchNames:
    - ai-services
---
apiVersion: v1
kind: PodMonitor
metadata:
  name: time-series-forecasting-service
  namespace: ai-services
  labels:
    app: time-series-forecasting-service
    version: v1
    team: team-ai-data-analytics
spec:
  selector:
    matchLabels:
      app: time-series-forecasting-service
  podMetricsEndpoints:
  - port: management
    path: /actuator/prometheus
    interval: 30s
    relabelings:
    - sourceLabels: [__meta_kubernetes_pod_name]
      targetLabel: pod
    - sourceLabels: [__meta_kubernetes_pod_node_name]
      targetLabel: node
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: time-series-forecasting-service-metrics-reader
  labels:
    app: time-series-forecasting-service
    team: team-ai-data-analytics
rules:
- nonResourceURLs: ["/metrics", "/actuator/prometheus"]
  verbs: ["get"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: time-series-forecasting-service-grafana-dashboard
  namespace: ai-services
  labels:
    app: time-series-forecasting-service
    version: v1
    team: team-ai-data-analytics
    grafana_dashboard: "1"
data:
  time-series-forecasting-service-dashboard.json: |
    {
      "dashboard": {
        "title": "Time Series Forecasting Service Dashboard",
        "tags": ["ai-services", "time-series", "forecasting", "data-analytics"],
        "timezone": "UTC",
        "panels": [
          {
            "title": "Forecast Request Rate",
            "targets": [{
              "expr": "rate(forecast_requests_total{application=\"time-series-forecasting-service\"}[5m])"
            }]
          },
          {
            "title": "Request Rate",
            "targets": [{
              "expr": "rate(http_server_requests_seconds_count{application=\"time-series-forecasting-service\"}[5m])"
            }]
          },
          {
            "title": "Forecast Accuracy (MAPE)",
            "targets": [{
              "expr": "forecast_accuracy_mape{application=\"time-series-forecasting-service\"}"
            }]
          },
          {
            "title": "JVM Memory Usage",
            "targets": [{
              "expr": "jvm_memory_used_bytes{application=\"time-series-forecasting-service\"}"
            }]
          }
        ]
      }
    }
