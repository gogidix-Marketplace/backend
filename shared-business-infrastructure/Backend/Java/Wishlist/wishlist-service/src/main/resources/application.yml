spring:
  application:
    name: wishlist-service
  data:
    mongodb:
      uri: mongodb://localhost:27017
      database: gogidix_wishlist
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092
      bindings:
        wishlistEvents-out-0:
          destination: wishlist-events
          content-type: application/json
server:
  port: 8092
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
logging:
  level:
    com.gogidix.ecommerce.wishlist: DEBUG
