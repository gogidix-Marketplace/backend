apiVersion: v1
kind: ServiceAccount
metadata:
  name: supply-chain-optimization-service
  namespace: ai-services
  labels:
    app: supply-chain-optimization-service
    app.kubernetes.io/name: supply-chain-optimization-service
    app.kubernetes.io/instance: supply-chain-optimization-service
    app.kubernetes.io/component: serviceaccount
    app.kubernetes.io/part-of: ai-services
    team: team-ai-business-ops
    domain: business-operations
  annotations:
    description: "Service account for Supply Chain Optimization Service - handles AI-powered supply chain optimization"
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: supply-chain-optimization-service
  namespace: ai-services
  labels:
    app: supply-chain-optimization-service
    app.kubernetes.io/component: role
    team: team-ai-business-ops
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: supply-chain-optimization-service
  namespace: ai-services
  labels:
    app: supply-chain-optimization-service
    app.kubernetes.io/component: rolebinding
    team: team-ai-business-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: supply-chain-optimization-service
subjects:
- kind: ServiceAccount
  name: supply-chain-optimization-service
  namespace: ai-services
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: supply-chain-optimization-service-metrics
  labels:
    app: supply-chain-optimization-service
    app.kubernetes.io/component: clusterrole
    team: team-ai-business-ops
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - nodes
  - nodes/metrics
  verbs:
  - get
  - list
- nonResourceURLs:
  - "/metrics"
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: supply-chain-optimization-service-metrics
  labels:
    app: supply-chain-optimization-service
    app.kubernetes.io/component: clusterrolebinding
    team: team-ai-business-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: supply-chain-optimization-service-metrics
subjects:
- kind: ServiceAccount
  name: supply-chain-optimization-service
  namespace: ai-services
