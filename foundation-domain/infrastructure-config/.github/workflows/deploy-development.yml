name: Deploy to Development

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up JDK 17
        uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3@2b512430cf1c7c4fe9b7815b4c7d761f6e893f6b

      - name: Login to Docker Registry
        uses: docker/login-action@v3@e92390c5fb421da1463b202fbb5d8c4abc1a1ff6
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5@af5a7ed5ba88268de6df9df61a84dfe726b25e69
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/infrastructure-config:dev
            ${{ secrets.DOCKER_REGISTRY }}/infrastructure-config:dev-${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/infrastructure-config:dev-cache
          cache-to: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/infrastructure-config:dev-cache,mode=max

      - name: Deploy to development environment
        uses: appleboy/ssh-action@v1.0.0@bd3981c1184fe52fc13b56a8fca6cfe3c18333a5
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USERNAME }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_REGISTRY }}/infrastructure-config:dev
            docker stop infrastructure-config-dev || true
            docker rm infrastructure-config-dev || true
            docker run -d \
              --name infrastructure-config-dev \
              -p 8090:8090 \
              -e SPRING_PROFILES_ACTIVE=dev \
              -e MONGODB_URI=${{ secrets.DEV_MONGODB_URI }} \
              -e REDIS_HOST=${{ secrets.DEV_REDIS_HOST }} \
              -e KAFKA_BOOTSTRAP_SERVERS=${{ secrets.DEV_KAFKA_SERVERS }} \
              ${{ secrets.DOCKER_REGISTRY }}/infrastructure-config:dev

  smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Smoke tests
        run: |
          sleep 30  # Wait for service to be ready
          curl -f http://${{ secrets.DEV_HOST }}:8090/actuator/health || exit 1
          curl -f http://${{ secrets.DEV_HOST }}:8090/actuator/info || exit 1
