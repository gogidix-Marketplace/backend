name: Deploy Platform Services to Development

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  MAVEN_VERSION: '3.9.12'
  DOCKER_REGISTRY: ghcr.io
  DEPLOYMENT_ENVIRONMENT: development

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
    - name: Checkout code
      uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: Set up Maven
      uses: stCarolas/setup-maven@1de1a71b382c93941688b189d9a18c7049058f84
      with:
        maven-version: ${{ env.MAVEN_VERSION }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e3dd6a4bde21870e8df56b4ff80a83b5c7e43e94
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@b27b0c23a95bf3c594b7a23df4758e8cb020a1d

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@2b512430cf1c7c4fe9b7815b4c7d761f6e893f6b

    - name: Build and push platform-service
      run: |
        mvn clean package -DskipTests
        docker build -t ${{ secrets.ECR_REGISTRY }}/platform-service:${{ github.sha }} .
        docker tag ${{ secrets.ECR_REGISTRY }}/platform-service:${{ github.sha }} ${{ secrets.ECR_REGISTRY }}/platform-service:development
        docker push ${{ secrets.ECR_REGISTRY }}/platform-service:${{ github.sha }}
        docker push ${{ secrets.ECR_REGISTRY }}/platform-service:development
      working-directory: Backend/Java/platform-service

    - name: Build and push subscription-service
      run: |
        mvn clean package -DskipTests
        docker build -t ${{ secrets.ECR_REGISTRY }}/subscription-service:${{ github.sha }} .
        docker tag ${{ secrets.ECR_REGISTRY }}/subscription-service:${{ github.sha }} ${{ secrets.ECR_REGISTRY }}/subscription-service:development
        docker push ${{ secrets.ECR_REGISTRY }}/subscription-service:${{ github.sha }}
        docker push ${{ secrets.ECR_REGISTRY }}/subscription-service:development
      working-directory: Backend/Java/subscription-service

    - name: Build and push tenant-registry-service
      run: |
        mvn clean package -DskipTests
        docker build -t ${{ secrets.ECR_REGISTRY }}/tenant-registry-service:${{ github.sha }} .
        docker tag ${{ secrets.ECR_REGISTRY }}/tenant-registry-service:${{ github.sha }} ${{ secrets.ECR_REGISTRY }}/tenant-registry-service:development
        docker push ${{ secrets.ECR_REGISTRY }}/tenant-registry-service:${{ github.sha }}
        docker push ${{ secrets.ECR_REGISTRY }}/tenant-registry-service:development
      working-directory: Backend/Java/tenant-registry-service

    - name: Build and push usage-metering-service
      run: |
        mvn clean package -DskipTests
        docker build -t ${{ secrets.ECR_REGISTRY }}/usage-metering-service:${{ github.sha }} .
        docker tag ${{ secrets.ECR_REGISTRY }}/usage-metering-service:${{ github.sha }} ${{ secrets.ECR_REGISTRY }}/usage-metering-service:development
        docker push ${{ secrets.ECR_REGISTRY }}/usage-metering-service:${{ github.sha }}
        docker push ${{ secrets.ECR_REGISTRY }}/usage-metering-service:development
      working-directory: Backend/Java/usage-metering-service

    - name: Deploy to Kubernetes cluster
      uses: azure/k8s-deploy@7f4760bfbcd8be19305cd6108f74f2490291fe8b
      with:
        manifests: |
          k8s/development/platform-service.yaml
          k8s/development/subscription-service.yaml
          k8s/development/tenant-registry-service.yaml
          k8s/development/usage-metering-service.yaml
        images: |
          ${{ secrets.ECR_REGISTRY }}/platform-service:${{ github.sha }}
          ${{ secrets.ECR_REGISTRY }}/subscription-service:${{ github.sha }}
          ${{ secrets.ECR_REGISTRY }}/tenant-registry-service:${{ github.sha }}
          ${{ secrets.ECR_REGISTRY }}/usage-metering-service:${{ github.sha }}
        kubectl-version: 'latest'

    - name: Verify deployment
      run: |
        kubectl rollout status deployment/platform-service -n development
        kubectl rollout status deployment/subscription-service -n development
        kubectl rollout status deployment/tenant-registry-service -n development
        kubectl rollout status deployment/usage-metering-service -n development

    - name: Notify deployment status
      if: always()
      uses: 8398a7/action-slack@v3.15.2
      with:
        status: ${{ job.status }}
        text: |
          Platform Services deployment to ${{ env.DEPLOYMENT_ENVIRONMENT }}
          Status: ${{ job.status }}
          Commit: ${{ github.sha }}
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
