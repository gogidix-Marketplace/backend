spring:
  application:
    name: payment-processing-service
  data:
    mongodb:
      uri: mongodb://localhost:27017
      database: gogidix_payment_processing
    redis:
      host: localhost
      port: 6379
      database: 7
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-processing-service
      auto-offset-reset: earliest

server:
  port: ${SERVER_PORT:8097}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

payment:
  gateway:
    provider: ${PAYMENT_GATEWAY:stripe}
    stripe:
      api-key: ${STRIPE_API_KEY}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    app-name: payment-processing-service

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active:dev}

logging:
  level:
    root: INFO
    com.gogidix: DEBUG
    org.springframework.data.mongodb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/payment-processing-service.log
    max-size: 100MB
    max-history: 30

---
# Development profile
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.gogidix: DEBUG

---
# Production profile
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    root: WARN
    com.gogidix: INFO
