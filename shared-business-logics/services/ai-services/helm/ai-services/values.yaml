        cpu: 1000m

    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80

    pdb:
      enabled: true
      minAvailable: 1
      maxUnavailable: null

