apiVersion: v1
kind: Service
metadata:
  name: shelf-service
  namespace: warehousing-core
  labels:
    app: shelf-service
    service: shelf-service
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
  - name: http
    port: 8224
    targetPort: http
    protocol: TCP
  - name: management
    port: 8225
    targetPort: management
    protocol: TCP
  selector:
    app: shelf-service
---
apiVersion: v1
kind: Service
metadata:
  name: shelf-service-headless
  namespace: warehousing-core
  labels:
    app: shelf-service
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8224
    targetPort: http
    protocol: TCP
  selector:
    app: shelf-service
