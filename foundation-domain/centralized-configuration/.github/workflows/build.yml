name: Build

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [config-server, feature-flag-service, environment-service, notification-service, config-audit-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up JDK 17
        uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build ${{ matrix.service }}
        run: cd ${{ matrix.service }} && mvn clean compile -B

      - name: Run unit tests for ${{ matrix.service }}
        run: cd ${{ matrix.service }} && mvn test -B

      - name: Package ${{ matrix.service }}
        run: cd ${{ matrix.service }} && mvn package -DskipTests -B

      - name: Upload build artifacts
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: jar-${{ matrix.service }}
          path: ${{ matrix.service }}/target/*.jar
          retention-days: 7
