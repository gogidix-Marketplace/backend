apiVersion: v1
kind: Service
metadata:
  name: fulfillment-core-service
  namespace: warehousing-core
  labels:
    app: fulfillment-core-service
    service: fulfillment-core-service
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
  - name: http
    port: 8202
    targetPort: http
    protocol: TCP
  - name: management
    port: 8203
    targetPort: management
    protocol: TCP
  selector:
    app: fulfillment-core-service
---
apiVersion: v1
kind: Service
metadata:
  name: fulfillment-core-service-headless
  namespace: warehousing-core
  labels:
    app: fulfillment-core-service
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8202
    targetPort: http
    protocol: TCP
  selector:
    app: fulfillment-core-service
