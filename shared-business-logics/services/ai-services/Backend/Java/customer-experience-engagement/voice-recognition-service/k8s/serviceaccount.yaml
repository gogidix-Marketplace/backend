apiVersion: v1
kind: ServiceAccount
metadata:
  name: voice-recognition-service
  namespace: ai-services
  labels:
    app: voice-recognition-service
    version: v1
    team: team-ai-customer-experience
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/voice-recognition-service-role
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: voice-recognition-service
  namespace: ai-services
  labels:
    app: voice-recognition-service
    version: v1
    team: team-ai-customer-experience
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: voice-recognition-service
  namespace: ai-services
  labels:
    app: voice-recognition-service
    version: v1
    team: team-ai-customer-experience
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: voice-recognition-service
subjects:
- kind: ServiceAccount
  name: voice-recognition-service
  namespace: ai-services
