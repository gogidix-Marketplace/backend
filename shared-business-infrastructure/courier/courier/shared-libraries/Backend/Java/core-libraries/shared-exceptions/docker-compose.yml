# Docker Compose for Gogidix Shared Exceptions Service
# Complete development and testing environment
# Author: Gogidix Development Team
# Version: 1.0.0
# Date: 2025-08-13

version: '3.8'

services:
  # =================================================================
  # Shared Exceptions Service
  # =================================================================
  shared-exceptions:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: gogidix/shared-exceptions:1.0.0
    container_name: shared-exceptions-service
    restart: unless-stopped
    ports:
      - "8702:8702"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/gogidix_shared_exceptions
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=gogidix_postgres_2025
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_CACHE_REDIS_HOST=redis
      - SPRING_CACHE_REDIS_PORT=6379
      - SPRING_CACHE_REDIS_DATABASE=2
      - JWT_ISSUER_URI=http://keycloak:8080/auth/realms/gogidix
      - JWT_JWK_SET_URI=http://keycloak:8080/auth/realms/gogidix/protocol/openid-connect/certs
      - CONFIG_SERVER_URI=http://config-server:8888
      - OTLP_ENDPOINT=http://jaeger:4318/v1/traces
      - JAVA_OPTS=-XX:MaxRAMPercentage=70.0 -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom
    volumes:
      - shared-exceptions-logs:/app/logs
      - shared-exceptions-heapdumps:/app/heapdumps
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8702/api/v1/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - gogidix-network
    labels:
      - "com.gogidix.service=shared-exceptions"
      - "com.gogidix.version=1.0.0"
      - "com.gogidix.domain=shared-libraries"
      - "traefik.enable=true"
      - "traefik.http.routers.shared-exceptions.rule=Host(`shared-exceptions.local.gogidix.com`)"
      - "traefik.http.services.shared-exceptions.loadbalancer.server.port=8702"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # =================================================================
  # PostgreSQL Database
  # =================================================================
  postgres:
    image: postgres:15.6-alpine
    container_name: shared-exceptions-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=gogidix_shared_exceptions
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=gogidix_postgres_2025
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gogidix_shared_exceptions"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - gogidix-network
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_worker_processes=8
      -c max_parallel_workers_per_gather=4
      -c max_parallel_workers=8
      -c max_parallel_maintenance_workers=4
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"

  # =================================================================
  # Redis Cache
  # =================================================================
  redis:
    image: redis:7.2.4-alpine
    container_name: shared-exceptions-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./docker/redis/redis.conf:/etc/redis/redis.conf:ro
    command: redis-server /etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - gogidix-network
    sysctls:
      - net.core.somaxconn=65535
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"

  # =================================================================
  # Apache Kafka (for event streaming)
  # =================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: shared-exceptions-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - gogidix-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: shared-exceptions-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_LOG_CLEANUP_POLICY: delete
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - gogidix-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"

  # =================================================================
  # Eureka Service Registry (for development)
  # =================================================================
  eureka:
    image: springcloud/eureka:latest
    container_name: shared-exceptions-eureka
    restart: unless-stopped
    environment:
      - EUREKA_INSTANCE_HOSTNAME=eureka
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
      - EUREKA_SERVER_ENABLE_SELF_PRESERVATION=false
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - gogidix-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"

  # =================================================================
  # Jaeger Distributed Tracing
  # =================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: shared-exceptions-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "14250:14250"   # gRPC
      - "14268:14268"   # HTTP
      - "16686:16686"   # Web UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    networks:
      - gogidix-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"

  # =================================================================
  # Prometheus (for metrics collection)
  # =================================================================
  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: shared-exceptions-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - gogidix-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"

  # =================================================================
  # Grafana (for metrics visualization)
  # =================================================================
  grafana:
    image: grafana/grafana:10.2.3
    container_name: shared-exceptions-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - gogidix-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"

# =================================================================
# Networks
# =================================================================
networks:
  gogidix-network:
    name: gogidix-shared-exceptions-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# =================================================================
# Volumes
# =================================================================
volumes:
  shared-exceptions-logs:
    name: shared-exceptions-logs
  shared-exceptions-heapdumps:
    name: shared-exceptions-heapdumps
  postgres-data:
    name: shared-exceptions-postgres-data
  redis-data:
    name: shared-exceptions-redis-data
  kafka-data:
    name: shared-exceptions-kafka-data
  zookeeper-data:
    name: shared-exceptions-zookeeper-data
  zookeeper-logs:
    name: shared-exceptions-zookeeper-logs
  prometheus-data:
    name: shared-exceptions-prometheus-data
  grafana-data:
    name: shared-exceptions-grafana-data