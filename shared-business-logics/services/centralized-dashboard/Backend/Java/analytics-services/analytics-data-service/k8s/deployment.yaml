apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-data-service
  namespace: centralized-dashboard
  labels:
    app: analytics-data-service
    team: team-f-centralized-dashboard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-data-service
  namespace: centralized-dashboard
  labels:
    app: analytics-data-service
    team: team-f-centralized-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics-data-service
  template:
    metadata:
      labels:
        app: analytics-data-service
        team: team-f-centralized-dashboard
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8903"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: analytics-data-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: analytics-data-service
        image: ghcr.io/gogidix/analytics-data-service:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8903
          protocol: TCP
        env:
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: analytics-data-service-config
              key: database-url
        - name: DATABASE_USERNAME
          valueFrom:
            secretKeyRef:
              name: analytics-data-service-secrets
              key: database-username
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: analytics-data-service-secrets
              key: database-password
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: analytics-data-service-config
              key: redis-host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: analytics-data-service-config
              key: redis-port
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: analytics-data-service-config
              key: kafka-bootstrap-servers
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        resources:
          requests:
            memory: "768Mi"
            cpu: "250m"
          limits:
            memory: "1.5Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8903
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8903
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8903
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 18
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      restartPolicy: Always
