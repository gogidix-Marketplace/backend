# =============================================================================
# Location Service Configuration
# =============================================================================

server:
  port: ${SERVICE_PORT:8110}
  servlet:
    context-path: /api/v1
  shutdown: graceful

spring:
  application:
    name: location-service

  # MongoDB Configuration
  data:
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT:27017}
      database: ${MONGODB_DB:location_service}
      username: ${MONGODB_USER:}
      password: ${MONGODB_PASSWORD:}
      authentication-database: ${MONGODB_AUTH_DB:admin}
      auto-index-creation: true

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializers.JsonSerializer
      acks: all
      retries: 3
      properties:
        delivery.timeout.ms: 30000
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializers.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
    topic:
      location-events: location-events

  # WebSocket Configuration
  websocket:
    enabled: true
    path: /ws/location

  # Cache Configuration
  cache:
    type: simple
    cache-names: locationHistory,geofenceEvents

  # Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# Logging Configuration
logging:
  level:
    root: INFO
    com.gogidix.courier: ${LOG_LEVEL:DEBUG}
    org.springframework.data.mongodb: ${MONGO_LOG_LEVEL:INFO}
    org.springframework.kafka: ${KAFKA_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} - %msg [tenantId=%X{tenantId}][driverId=%X{driverId}][traceId=%X{traceId},spanId=%X{spanId}]%n"

# Service Specific Configuration
location:
  tracking:
    min-update-interval-seconds: ${MIN_UPDATE_INTERVAL:5}
    max-batch-size: ${MAX_BATCH_SIZE:1000}
    history-retention-days: ${HISTORY_RETENTION_DAYS:90}
  geofence:
    enabled: ${GEOFENCE_ENABLED:true}
    default-radius-meters: ${DEFAULT_RADIUS_METERS:100}
    check-interval-seconds: ${GEOFENCE_CHECK_INTERVAL:10}
  aggregation:
    window-size-seconds: ${AGGREGATION_WINDOW:60}
    min-points-for-aggregation: ${MIN_POINTS_FOR_AGGREGATION:2}
