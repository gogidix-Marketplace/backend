apiVersion: v1
kind: Service
metadata:
  name: bin-service
  namespace: warehousing-core
  labels:
    app: bin-service
    service: bin-service
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
  - name: http
    port: 8225
    targetPort: http
    protocol: TCP
  - name: management
    port: 8226
    targetPort: management
    protocol: TCP
  selector:
    app: bin-service
---
apiVersion: v1
kind: Service
metadata:
  name: bin-service-headless
  namespace: warehousing-core
  labels:
    app: bin-service
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8225
    targetPort: http
    protocol: TCP
  selector:
    app: bin-service
