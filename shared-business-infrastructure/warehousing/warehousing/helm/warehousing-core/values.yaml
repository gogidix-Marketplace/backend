          port: 6379
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53

# ------------------------------------------------------------------------------
# Pod Disruption Budget Configuration
# ------------------------------------------------------------------------------
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ------------------------------------------------------------------------------
# Service Mesh Configuration
# ------------------------------------------------------------------------------
serviceMesh:
  enabled: false
  istio:
    enabled: false
    mTLS:
      mode: STRICT

# ------------------------------------------------------------------------------
# Observability Configuration
# ------------------------------------------------------------------------------
observability:
  logging:
    enabled: true
    format: json
    level: info
  tracing:
    enabled: true
    sampler: 0.1
    exporter: otlp
    endpoint: "jaeger-collector.observability.svc.cluster.local:4317"
  metrics:
    enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: 30s
        scrapeTimeout: 10s
    datadog:
      enabled: false

# ------------------------------------------------------------------------------
# ConfigMap Configuration
# ------------------------------------------------------------------------------
configMap:
  name: warehousing-core-config
  annotations: {}
  data: {}
