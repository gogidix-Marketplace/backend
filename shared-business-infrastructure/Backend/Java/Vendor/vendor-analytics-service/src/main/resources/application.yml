spring:
  application:
    name: vendor-analytics-service
  data:
    mongodb:
      uri: mongodb://localhost:27017
      database: gogidix_vendor_analytics

server:
  port: 8403

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.gogidix.ecommerce.vendor.analytics: DEBUG