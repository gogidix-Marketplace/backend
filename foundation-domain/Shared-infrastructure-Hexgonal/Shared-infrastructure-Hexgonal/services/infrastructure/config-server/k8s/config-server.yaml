apiVersion: v1
kind: ConfigMap
metadata:
  name: config-server-config
  namespace: infrastructure
data:
  application.yml: |
    spring:
      application:
        name: config-server
      profiles:
        active: prod
      cloud:
        config:
          server:
            git:
              uri: /tmp/config-repo
              default-label: main
              search-paths: applications,*
              clone-on-start: true
            encrypt:
              enabled: true
        bus:
          enabled: true
    server:
      port: 8888

---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: infrastructure
  labels:
    app: config-server
    component: infrastructure
    domain: foundation
    tier: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8888
      targetPort: 8888
      protocol: TCP
  selector:
    app: config-server

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: infrastructure
  labels:
    app: config-server
    component: infrastructure
    domain: foundation
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
        component: infrastructure
        domain: foundation
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: config-server
      terminationGracePeriodSeconds: 30
      containers:
      - name: config-server
        image: config-server:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8888
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: JAVA_OPTS
          value: "-Xms512m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: CONFIG_SERVER_USER
          valueFrom:
            secretKeyRef:
              name: config-server-credentials
              key: username
        - name: CONFIG_SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: config-server-credentials
              key: password
        - name: ENCRYPT_KEY
          valueFrom:
            secretKeyRef:
              name: config-server-encrypt
              key: key
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: config-repo
          mountPath: /tmp/config-repo
      volumes:
      - name: logs
        emptyDir: {}
      - name: config-repo
        emptyDir: {}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: config-server
  namespace: infrastructure
  labels:
    app: config-server

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: config-server-pdb
  namespace: infrastructure
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: config-server

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: config-server-hpa
  namespace: infrastructure
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: config-server
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
