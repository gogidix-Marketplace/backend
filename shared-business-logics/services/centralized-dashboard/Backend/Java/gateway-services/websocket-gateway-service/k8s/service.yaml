apiVersion: v1
kind: Service
metadata:
  name: websocket-gateway-service
  namespace: centralized-dashboard
  labels:
    app: websocket-gateway-service
    team: team-f-centralized-dashboard
spec:
  type: ClusterIP
  selector:
    app: websocket-gateway-service
  ports:
  - name: http
    port: 8908
    targetPort: 8908
    protocol: TCP
  sessionAffinity: None
