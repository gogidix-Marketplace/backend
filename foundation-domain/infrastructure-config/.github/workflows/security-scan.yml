name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM

jobs:
  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up JDK 17
        uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@e325ac157b4bddfa7e19f9f0f79b51292c6d0c2e
        with:
          project: 'infrastructure-config'
          path: '.'
          format: 'HTML'
          out: 'dependency-check-report'

      - name: Upload dependency check report
        uses: actions/upload-artifact@v4@65462800fd760344b1a7b4382951275a0abb4808
        if: always()
        with:
          name: dependency-check-report
          path: dependency-check-report

  sast-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master@6896a38fa877f2db34aa4fff10fa544dbbf9357c
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3@435327b1c2fef2aa9df534fdf274590a098c19f4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3@b56ba49b195e50c6668e0cb9d851e4f82723b1d2
        with:
          languages: java

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3@1f8b57b2f0261c4482c278e70542c291eeba5f3e

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3@1bc7dfb7d0a014aa1eb78219afcdd5d5bf42e4e9
        with:
          category: "/language:java"
