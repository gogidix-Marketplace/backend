spring:
  application:
    name: shared-audit
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:development}

server:
  port: ${SERVER_PORT:8300}
  servlet:
    context-path: /api/v1

# Database Configuration
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gogidix_audit}
    username: ${DATABASE_USERNAME:gogidix_audit}
    password: ${DATABASE_PASSWORD:audit_secure_password_2024}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: ${DB_MIN_CONNECTIONS:5}
      maximum-pool-size: ${DB_MAX_CONNECTIONS:20}
      idle-timeout: ${DB_IDLE_TIMEOUT:300000}
      max-lifetime: ${DB_MAX_LIFETIME:1200000}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:20000}
      leak-detection-threshold: ${DB_LEAK_DETECTION:60000}

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region:
            factory_class: org.hibernate.cache.jcache.JCacheRegionFactory

  # Flyway Migration
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: ${FLYWAY_SCHEMA:audit}

  # Redis Configuration
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:3}
    timeout: ${REDIS_TIMEOUT:2000ms}
    lettuce:
      pool:
        min-idle: ${REDIS_MIN_IDLE:5}
        max-idle: ${REDIS_MAX_IDLE:10}
        max-active: ${REDIS_MAX_ACTIVE:20}
        max-wait: ${REDIS_MAX_WAIT:1000ms}

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: ${KAFKA_PRODUCER_ACKS:all}
      retries: ${KAFKA_PRODUCER_RETRIES:3}
      batch-size: ${KAFKA_BATCH_SIZE:16384}
      linger-ms: ${KAFKA_LINGER_MS:5}
      buffer-memory: ${KAFKA_BUFFER_MEMORY:33554432}
      properties:
        spring.json.trusted.packages: "com.gogidix.infrastructure.sharedlibraries.sharedaudit.domain"
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:shared-audit-consumer}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
      enable-auto-commit: ${KAFKA_AUTO_COMMIT:false}
      properties:
        spring.json.trusted.packages: "com.gogidix.infrastructure.sharedlibraries.sharedaudit.domain"

# Eureka Service Discovery
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: ${EUREKA_REGISTER:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    registry-fetch-interval-seconds: ${EUREKA_FETCH_INTERVAL:30}
    healthcheck:
      enabled: true
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: ${EUREKA_PREFER_IP:true}
    lease-renewal-interval-in-seconds: ${EUREKA_RENEWAL_INTERVAL:30}
    lease-expiration-duration-in-seconds: ${EUREKA_EXPIRATION_DURATION:90}
    metadata-map:
      management.port: ${management.server.port:8300}
      management.context-path: ${management.endpoints.web.base-path:/actuator}
      health.path: ${management.endpoints.web.base-path:/actuator}/health
      zone: ${EUREKA_ZONE:primary}
      version: ${BUILD_VERSION:1.0.0}
      domain: "shared-libraries"
      service-type: "audit-service"
      compliance-types: "PCI_DSS,GDPR,SOX"

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:health,info,metrics,prometheus,loggers,env,configprops,mappings,beans,scheduledtasks,caches,httptrace}
      base-path: ${ACTUATOR_BASE_PATH:/actuator}
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_DETAILS:when-authorized}
      show-components: always
      probes:
        enabled: true
    info:
      enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: ${PROMETHEUS_ENABLED:true}
  health:
    redis:
      enabled: true
    db:
      enabled: true
    diskspace:
      enabled: true
      threshold: ${HEALTH_DISK_THRESHOLD:10GB}
  info:
    env:
      enabled: true
    git:
      mode: full
    build:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: ${PROMETHEUS_ENABLED:true}
        descriptions: true
        step: ${PROMETHEUS_STEP:60s}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        audit.event.processing: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
        audit.event.processing: 0.5, 0.95, 0.99

# Logging Configuration
logging:
  level:
    com.gogidix.infrastructure.sharedlibraries.sharedaudit: ${LOG_LEVEL_AUDIT:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
    org.springframework.web: ${LOG_LEVEL_WEB:WARN}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_SQL_PARAMS:WARN}
    org.springframework.kafka: ${LOG_LEVEL_KAFKA:WARN}
    org.apache.kafka: ${LOG_LEVEL_KAFKA_APACHE:WARN}
    root: ${LOG_LEVEL_ROOT:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId:-}] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId:-}] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:logs/shared-audit.log}
    max-size: ${LOG_FILE_MAX_SIZE:100MB}
    max-history: ${LOG_FILE_MAX_HISTORY:30}

# Async Configuration
spring:
  task:
    execution:
      pool:
        core-size: ${ASYNC_CORE_POOL_SIZE:5}
        max-size: ${ASYNC_MAX_POOL_SIZE:20}
        queue-capacity: ${ASYNC_QUEUE_CAPACITY:100}
        keep-alive: ${ASYNC_KEEP_ALIVE:60s}
      thread-name-prefix: "audit-async-"
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:5}
      thread-name-prefix: "audit-scheduler-"

# Security Configuration
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:9000}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:9000/.well-known/jwks.json}

# Application-Specific Configuration
audit:
  # Event Processing Configuration
  processing:
    batch-size: ${AUDIT_BATCH_SIZE:100}
    batch-timeout: ${AUDIT_BATCH_TIMEOUT:5000}
    async-enabled: ${AUDIT_ASYNC_ENABLED:true}
    retry-attempts: ${AUDIT_RETRY_ATTEMPTS:3}
    retry-delay: ${AUDIT_RETRY_DELAY:1000}
  
  # Security Configuration
  security:
    escalation-enabled: ${AUDIT_SECURITY_ESCALATION:true}
    suspicious-pattern-detection: ${AUDIT_SUSPICIOUS_DETECTION:true}
    real-time-monitoring: ${AUDIT_REAL_TIME_MONITORING:true}
    threat-detection-threshold: ${AUDIT_THREAT_THRESHOLD:5}
  
  # Compliance Configuration
  compliance:
    pci-dss-enabled: ${AUDIT_PCI_DSS:true}
    gdpr-enabled: ${AUDIT_GDPR:true}
    sox-enabled: ${AUDIT_SOX:true}
    retention-days: ${AUDIT_RETENTION_DAYS:2555}
    encryption-enabled: ${AUDIT_ENCRYPTION:true}
    integrity-check-enabled: ${AUDIT_INTEGRITY_CHECK:true}
  
  # Data Retention Configuration
  retention:
    default-days: ${AUDIT_DEFAULT_RETENTION:90}
    financial-days: ${AUDIT_FINANCIAL_RETENTION:2555}
    security-days: ${AUDIT_SECURITY_RETENTION:1095}
    sensitive-data-days: ${AUDIT_SENSITIVE_RETENTION:365}
    cleanup-schedule: ${AUDIT_CLEANUP_SCHEDULE:0 2 * * *}
  
  # Kafka Topics Configuration
  kafka:
    topics:
      audit-events: ${KAFKA_TOPIC_AUDIT_EVENTS:audit.events}
      security-escalation: ${KAFKA_TOPIC_SECURITY:audit.security.escalation}
      compliance-reports: ${KAFKA_TOPIC_COMPLIANCE:audit.compliance.reports}
      suspicious-patterns: ${KAFKA_TOPIC_SUSPICIOUS:audit.security.suspicious}
      financial-alerts: ${KAFKA_TOPIC_FINANCIAL:audit.financial.alerts}
      dashboard-updates: ${KAFKA_TOPIC_DASHBOARD:audit.dashboard.updates}
  
  # Performance Configuration
  performance:
    cache-enabled: ${AUDIT_CACHE_ENABLED:true}
    cache-ttl: ${AUDIT_CACHE_TTL:3600}
    database-batch-size: ${AUDIT_DB_BATCH_SIZE:50}
    connection-pool-size: ${AUDIT_DB_POOL_SIZE:20}
    query-timeout: ${AUDIT_QUERY_TIMEOUT:30}

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      audit-database:
        register-health-indicator: true
        sliding-window-size: ${CIRCUIT_BREAKER_WINDOW_SIZE:10}
        failure-rate-threshold: ${CIRCUIT_BREAKER_FAILURE_RATE:50}
        wait-duration-in-open-state: ${CIRCUIT_BREAKER_WAIT_DURATION:30s}
        permitted-number-of-calls-in-half-open-state: ${CIRCUIT_BREAKER_HALF_OPEN_CALLS:3}
  retry:
    instances:
      audit-operations:
        max-attempts: ${RETRY_MAX_ATTEMPTS:3}
        wait-duration: ${RETRY_WAIT_DURATION:1s}
        exponential-backoff-multiplier: ${RETRY_BACKOFF_MULTIPLIER:2}
  ratelimiter:
    instances:
      audit-api:
        limit-for-period: ${RATE_LIMIT_REQUESTS:1000}
        limit-refresh-period: ${RATE_LIMIT_PERIOD:1m}
        timeout-duration: ${RATE_LIMIT_TIMEOUT:5s}

---
# Development Profile
spring:
  config:
    activate:
      on-profile: development
  datasource:
    url: jdbc:h2:mem:audit_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

logging:
  level:
    com.gogidix.infrastructure.sharedlibraries.sharedaudit: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

audit:
  processing:
    async-enabled: false
  security:
    escalation-enabled: false
  compliance:
    encryption-enabled: false

---
# Test Profile
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:audit_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    producer:
      bootstrap-servers: ${spring.embedded.kafka.brokers}
    consumer:
      bootstrap-servers: ${spring.embedded.kafka.brokers}

eureka:
  client:
    enabled: false

audit:
  processing:
    async-enabled: false
  security:
    escalation-enabled: false
    real-time-monitoring: false
  compliance:
    encryption-enabled: false

---
# Production Profile
spring:
  config:
    activate:
      on-profile: production
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.gogidix.infrastructure.sharedlibraries.sharedaudit: INFO
    org.hibernate.SQL: WARN
    root: WARN

audit:
  security:
    escalation-enabled: true
    real-time-monitoring: true
  compliance:
    encryption-enabled: true
    integrity-check-enabled: true
  performance:
    cache-enabled: true
    database-batch-size: 100
