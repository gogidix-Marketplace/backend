---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: centralized-config
  labels:
    app: notification-service
    version: v1
data:
  application.yml: |
    server:
      port: 8240
    spring:
      application:
        name: notification-service
      cloud:
        discovery:
          enabled: true
          service-url:
            defaultZone: http://discovery-service.infrastructure.svc.cluster.local:8761/eureka/
        config:
          enabled: true
          uri: http://config-server.infrastructure.svc.cluster.local:8888
          fail-fast: true
      datasource:
        url: jdbc:postgresql://postgresql.infrastructure.svc.cluster.local:5432/notification-db
        username: notification-user
        driver-class-name: org.postgresql.Driver
      jpa:
        hibernate:
          ddl-auto: update
        show-sql: false
        properties:
          hibernate:
            dialect: org.hibernate.dialect.PostgreSQLDialect
      kafka:
        bootstrap-servers: kafka-bootstrap.infrastructure.svc.cluster.local:9092
        consumer:
          group-id: notification-group
          auto-offset-reset: earliest
          key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
          value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.apache.kafka.common.serialization.StringSerializer
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
      endpoint:
        health:
          show-details: always
      metrics:
        export:
          prometheus:
            enabled: true
---
apiVersion: v1
kind: Secret
metadata:
  name: notification-service-secrets
  namespace: centralized-config
  labels:
    app: notification-service
type: Opaque
stringData:
  postgresql-password: "ChangeThisInProduction123!"
  jwt-secret: "ChangeThisJwtSecretInProduction"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: centralized-config
  labels:
    app: notification-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: notification-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8240"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: notification-service
      containers:
        - name: notification-service
          image: gogidix/notification-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8240
              protocol: TCP
            - name: management
              containerPort: 8240
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-service-secrets
                  key: postgresql-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: notification-service-secrets
                  key: jwt-secret
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              value: "http://discovery-service.infrastructure.svc.cluster.local:8761/eureka/"
            - name: SPRING_CLOUD_CONFIG_URI
              value: "http://config-server.infrastructure.svc.cluster.local:8888"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-bootstrap.infrastructure.svc.cluster.local:9092"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,info,metrics,prometheus"
          envFrom:
            - configMapRef:
                name: notification-service-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8240
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8240
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: notification-service-config
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - notification-service
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: centralized-config
  labels:
    app: notification-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8240
      targetPort: 8240
      protocol: TCP
  selector:
    app: notification-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service
  namespace: centralized-config
  labels:
    app: notification-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notification-service-hpa
  namespace: centralized-config
  labels:
    app: notification-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notification-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: notification-service-pdb
  namespace: centralized-config
  labels:
    app: notification-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: notification-service
