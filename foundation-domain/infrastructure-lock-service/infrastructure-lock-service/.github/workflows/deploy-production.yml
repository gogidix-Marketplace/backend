name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  security-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up JDK 17
        uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: cd lock-service && mvn test -B

      - name: Run security scan
        uses: aquasecurity/trivy-action@6896a38fa877f2db34aa4fff10fa544dbbf9357c
        with:
          scan-type: 'fs'
          scan-ref: 'lock-service'
          format: 'table'

  build-and-push:
    runs-on: ubuntu-latest
    needs: security-check

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up JDK 17
        uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build with Maven
        run: cd lock-service && mvn clean package -DskipTests -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@2b512430cf1c7c4fe9b7815b4c7d761f6e893f6b

      - name: Login to Docker Hub
        uses: docker/login-action@e92390c5fb421da1463b202fbb5d8c4abc1a1ff6
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@af5a7ed5ba88268de6df9df61a84dfe726b25e69
        with:
          context: lock-service
          push: true
          tags: |
            gogidix/lock-service:latest
            gogidix/lock-service:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Deploy to production cluster
        run: |
          echo "Deploying version ${{ steps.version.outputs.VERSION }} to production"
          # Add actual deployment commands here
          # kubectl set image deployment/lock-service lock-service=gogidix/lock-service:${{ steps.version.outputs.VERSION }}
          # kubectl rollout status deployment/lock-service

      - name: Verify deployment
        run: |
          echo "Verifying deployment health"
          # Add health check commands here
          # kubectl wait --for=condition=available --timeout=300s deployment/lock-service

      - name: Notify deployment success
        if: success()
        run: |
          echo "Deployment successful!"
          # Add notification logic here
