version: '3.8'

services:
  platform-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: platform-service
    ports:
      - "8401:8401"
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/platform_service
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SERVER_PORT=8401
      - SPRING_PROFILES_ACTIVE=dev
    depends_on:
      - postgres
      - redis
      - kafka
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8401/platform/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    networks:
      - platform-network

  postgres:
    image: postgres:14-alpine
    container_name: platform-postgres
    environment:
      - POSTGRES_DB=platform_service
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - platform-network

  redis:
    image: redis:7-alpine
    container_name: platform-redis
    ports:
      - "6380:6379"
    networks:
      - platform-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: platform-kafka
    ports:
      - "9093:9092"
    environment:
      - KAFKA_BROKER_ID=2
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    depends_on:
      - zookeeper
    networks:
      - platform-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: platform-zookeeper
    ports:
      - "2182:2181"
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    networks:
      - platform-network

volumes:
  postgres-data:

networks:
  platform-network:
    driver: bridge
