name: Test

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [config-server, feature-flag-service, environment-service, notification-service, config-audit-service]
        include:
          - service: config-server
            port: 8888
            coverage-min: 80
          - service: config-audit-service
            port: 8892
            coverage-min: 80
          - service: feature-flag-service
            port: 8889
            coverage-min: 75
          - service: environment-service
            port: 8890
            coverage-min: 75
          - service: notification-service
            port: 8891
            coverage-min: 75
    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up JDK 17
        uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests for ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          mvn clean test -B

      - name: Generate coverage report for ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          mvn jacoco:report -B

      - name: Check coverage threshold for ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          COVERAGE=$(mvn jacoco:check -Djacoco.minimum.coverage.ratio=${{ matrix.coverage-min }}/100 -B 2>&1 || echo "FAILED")
          if [[ $COVERAGE == *"FAILED"* ]]; then
            echo "Coverage threshold of ${{ matrix.coverage-min }}% not met for ${{ matrix.service }}"
            exit 1
          fi
        continue-on-error: false

      - name: Upload coverage reports
        uses: codecov/codecov-action@ab904c41d6ece7705aeb9a60b392016e95e53396
        with:
          files: ${{ matrix.service }}/target/site/jacoco/jacoco.xml
          flags: ${{ matrix.service }}
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: test-results-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: coverage-report-${{ matrix.service }}
          path: ${{ matrix.service }}/target/site/jacoco/
