spring:
  application:
    name: discovery-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  security:
    user:
      name: ${EUREKA_USER:eureka-server}
      password: ${EUREKA_PASSWORD:password123}

server:
  port: ${EUREKA_PORT:8761}
  shutdown: graceful
  tomcat:
    connection-timeout: 5000
    threads:
      max: 200
      min-spare: 20

---
# Dev Profile
spring:
  config:
    activate:
      on-profile: dev

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
  server:
    enable-self-preservation: true
    eviction-interval-timer-in-ms: 60000
    renewal-percent-threshold: 0.85
    response-cache-update-interval-ms: 30000
    wait-time-in-ms-when-sync-empty: 5000
  instance:
    hostname: localhost
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

logging:
  level:
    com.netflix.eureka: DEBUG
    com.gogidix: DEBUG

---
# Staging Profile
spring:
  config:
    activate:
      on-profile: staging

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${PEER_EUREKA_URL:http://eureka-staging-0.eureka.internal:8761/eureka/}
  server:
    enable-self-preservation: true
    eviction-interval-timer-in-ms: 30000
    renewal-percent-threshold: 0.85
    response-cache-update-interval-ms: 30000
    wait-time-in-ms-when-sync-empty: 5000
    registry-sync-retry-wait-ms: 30000
  instance:
    hostname: ${HOST_NAME:discovery-service}
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    instance-id: ${spring.application.name}:${server.port}:${spring.application.instance_id:${random.value}}
    appname: ${spring.application.name}
    metadata:
      zone: ${EUREKA_ZONE:zone1}
      environment: staging
      datacenter: ${EUREKA_DATACENTER:default}
  dashboard:
    enabled: true
  datacenter: ${EUREKA_DATACENTER:StagingDataCenter}

logging:
  level:
    com.netflix.eureka: INFO
    com.gogidix: INFO

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 30
    service-url:
      defaultZone: ${PEER_EUREKA_URL:http://eureka-prod-0.eureka.internal:8761/eureka/}
  server:
    enable-self-preservation: true
    eviction-interval-timer-in-ms: 30000
    renewal-percent-threshold: 0.85
    response-cache-update-interval-ms: 30000
    wait-time-in-ms-when-sync-empty: 5000
    registry-sync-retry-wait-ms: 30000
    # Peer awareness for cluster setup
    peer-eureka-nodes-refresh-interval-seconds: 60
    peer-node-connect-timeout-ms: 1000
    peer-node-read-timeout-ms: 5000
    peer-node-total-connections: 1000
    peer-node-total-connections-per-host: 50
    # Rate limiting for registry fetch
    rate-limiter-enabled: true
    rate-limiter-burst-size: 50
    rate-limiter-full-fetch-average-rate: 100
    # Disable delta for production (full fetch)
    disable-delta: true
  instance:
    hostname: ${HOST_NAME:discovery-service}
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    instance-id: ${spring.application.name}:${server.port}:${spring.application.instance_id:${random.value}}
    appname: ${spring.application.name}
    status-page-url: ${STATUS_PAGE_URL:http://${spring.application.name}:8761/actuator/info}
    health-check-url-path: /actuator/health
    home-page-url: ${HOME_PAGE_URL:http://${spring.application.name}:8761}
    secure-port-enabled: false
    non-secure-port-enabled: true
    non-secure-port: ${server.port}
    metadata:
      zone: ${EUREKA_ZONE:zone1}
      environment: production
      datacenter: ${EUREKA_DATACENTER:ProductionDataCenter}
      version: ${APP_VERSION:1.0.0}
      region: ${EUREKA_REGION:us-east-1}
  dashboard:
    enabled: true
  datacenter: ${EUREKA_DATACENTER:ProductionDataCenter}
  environment: production

---
# Common Management Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,eureka,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
    eureka:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}
  health:
    defaults: true
    diskspace:
      enabled: true
      threshold: 10485760 # 10MB

---
# Common Server Configuration
server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false
  tomcat:
    max-connections: 10000
    max-threads: 200
    accept-count: 100
    threads:
      max: 200
      min-spare: 10

---
# Logging Configuration
logging:
  pattern:
    level: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36}:%M} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 10GB
    file:
      max-size: 100MB
  level:
    root: INFO
    com.netflix.eureka: ${EUREKA_LOG_LEVEL:INFO}
    com.gogidix: ${APP_LOG_LEVEL:INFO}
    org.springframework.cloud: INFO
    org.springframework.context: INFO
    org.springframework.boot: INFO
    org.springframework.web: INFO

---
# Eureka Dashboard Configuration (for all profiles)
eureka:
  dashboard:
    enabled: true
    path: /eureka
