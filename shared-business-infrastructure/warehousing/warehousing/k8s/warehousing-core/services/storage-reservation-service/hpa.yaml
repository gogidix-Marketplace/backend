apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: storage-reservation-service-hpa
  namespace: warehousing-core
  labels:
    app: storage-reservation-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: storage-reservation-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: storage-reservation-service-pdb
  namespace: warehousing-core
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: storage-reservation-service
