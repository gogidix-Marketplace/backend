spring:
  application:
    name: warehouse-service
  data:
    mongodb:
      uri: mongodb://localhost:27017
      database: gogidix_warehouse
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092
      bindings:
        warehouseEvents-out-0:
          destination: warehouse-events
          content-type: application/json
server:
  port: 8075
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
logging:
  level:
    com.gogidix.ecommerce.warehouse: DEBUG
