# ------------------------------------------------------------------------------
# Observability - Production
# ------------------------------------------------------------------------------
observability:
  logging:
    enabled: true
    format: json
    level: info
  tracing:
    enabled: true
    sampler: 0.1
    exporter: otlp
    endpoint: "jaeger-collector.observability.svc.cluster.local:4317"
  metrics:
    enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: 15s
        scrapeTimeout: 10s
    datadog:
      enabled: true

# ------------------------------------------------------------------------------
# Service Mesh - Production
# ------------------------------------------------------------------------------
serviceMesh:
  enabled: true
  istio:
    enabled: true
    mTLS:
      mode: STRICT
