# ============================================================================
# Gogidix AI Services Helm Chart
# ============================================================================
# This values.yaml file includes a representative sample of AI services from
# each category. It can be extended to include all 40+ AI services.
#
# Sample services included:
# - customer-experience-engagement: ai-personalization-service (8080), ai-search-service (8084)
# - data-analytics: ai-analytics-dashboard-service (8081), ai-data-processing-service (8082)
# - machine-learning-operations: ai-feature-extraction-service (8080), ai-inference-service (8082), ai-model-management-service (8083)
# - security-fraud-prevention: ai-authentication-service (8082), ai-security-service (8085)
# - business-operations: lead-generation-ai-service (8080)
# - content-document-processing: nlp-processing-service (8080)
# ============================================================================

# ----------------------------------------------------------------------------
# Global Configuration
# ----------------------------------------------------------------------------
global:
  # Environment name (dev, staging, prod)
  environment: prod

  # Domain for ingress routes
  domain: ai-services.gogidix.com

  # Docker registry
  imageRegistry: gogidix

  # Image pull policy
  imagePullPolicy: Always

  # Resource defaults
  resources:
    requests:
      memory: 768Mi
      cpu: 250m
    limits:
      memory: 1536Mi
      cpu: 1000m

  # Java options for Spring Boot services
  javaOpts: "-Xms512m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"

  # Common environment variables
  env:
    SPRING_PROFILES_ACTIVE: "prod"
    MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
    LOGGING_LEVEL_ROOT: "INFO"
    LOGGING_LEVEL_IO_GOGIDIX: "DEBUG"

  # Ingress configuration
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    tls:
      - hosts:
          - "*.ai-services.gogidix.com"
        secretName: ai-services-tls

  # Monitoring configuration
  monitoring:
    enabled: true
    prometheus:
      enabled: true
      scrape: true
      path: "/actuator/prometheus"
    serviceMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s

  # Pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  # Container security context
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

# ----------------------------------------------------------------------------
# Namespace Configuration
# ----------------------------------------------------------------------------
namespace:
  name: ai-services
  create: true
  labels:
    name: ai-services
    environment: production
    team: ai-platform
    cost-center: engineering-ai
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest

# ----------------------------------------------------------------------------
# Resource Quota
# ----------------------------------------------------------------------------
resourceQuota:
  enabled: true
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    persistentvolumeclaims: "20"
    services.loadbalancers: "2"
    services.nodeports: "0"

# ----------------------------------------------------------------------------
# Limit Range
# ----------------------------------------------------------------------------
limitRange:
  enabled: true
  default:
    cpu: 1000m
    memory: 1536Mi
  defaultRequest:
    cpu: 250m
    memory: 768Mi

# ----------------------------------------------------------------------------
# Service Account Configuration
# ----------------------------------------------------------------------------
serviceAccount:
  create: true
  annotations: {}
  automountToken: false

# ============================================================================
# Customer Experience & Engagement Services
# ============================================================================
customerExperienceEngagement:
  enabled: true

  # AI Personalization Service
  aiPersonalizationService:
    enabled: true
    nameOverride: ai-personalization-service
    team: team-ai-customer-experience

    image:
      repository: gogidix/ai-personalization-service
      tag: "1.0.0"
      pullPolicy: Always

    service:
      type: ClusterIP
      port: 8080
      targetPort: 8080

    ingress:
      enabled: true
      host: personalization.ai-services.gogidix.com
      path: /

    replicas: 2

    resources:
      requests:
        memory: 768Mi
        cpu: 250m
      limits:
        memory: 1536Mi
        cpu: 1000m

    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 30
            - type: Pods
              value: 2
              periodSeconds: 60
          selectPolicy: Max

    pdb:
      enabled: true
      minAvailable: 1
      maxUnavailable: null

    env:
      AI_INFERENCE_BASE_URL: "http://ai-inference-service.ai-services.svc.cluster.local:8082"
      AI_RECOMMENDATION_CACHE_TTL: "3600"
      PERSONALIZATION_ALGORITHM: "collaborative-filtering"
      MAX_RECOMMENDATIONS: "50"

    probes:
      liveness:
        enabled: true
        path: /actuator/health/liveness
        initialDelaySeconds: 60
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 3
      readiness:
        enabled: true
        path: /actuator/health/readiness
        initialDelaySeconds: 45
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      startup:
        enabled: true
        path: /actuator/health/startup
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 18

    nodeSelector: {}
    tolerations: []
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - ai-personalization-service
              topologyKey: kubernetes.io/hostname

    volumeMounts:
      - name: tmp
        mountPath: /tmp
    volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi

  # AI Search Service
  aiSearchService:
    enabled: true
    nameOverride: ai-search-service
    team: team-ai-customer-experience

    image:
      repository: gogidix/ai-search-service
      tag: "1.0.0"
      pullPolicy: Always

    service:
      type: ClusterIP
      port: 8084
      targetPort: 8084

    ingress:
      enabled: true
      host: search.ai-services.gogidix.com
      path: /

    replicas: 2

    resources:
      requests:
        memory: 1024Mi
        cpu: 500m
      limits:
        memory: 2048Mi
        cpu: 1500m

    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: 80

    pdb:
      enabled: true
      minAvailable: 1
      maxUnavailable: null

    env:
      ELASTICSEARCH_HOST: "elasticsearch.observability.svc.cluster.local"
      ELASTICSEARCH_PORT: "9200"
      SEARCH_INDEX_PREFIX: "ai-search"
      MAX_SEARCH_RESULTS: "100"
      FUZZY_SEARCH_ENABLED: "true"

    probes:
      liveness:
        enabled: true
        path: /actuator/health/liveness
        initialDelaySeconds: 60
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 3
      readiness:
        enabled: true
        path: /actuator/health/readiness
        initialDelaySeconds: 45
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      startup:
        enabled: true
        path: /actuator/health/startup
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 18

    nodeSelector: {}
    tolerations: []
    affinity: {}

