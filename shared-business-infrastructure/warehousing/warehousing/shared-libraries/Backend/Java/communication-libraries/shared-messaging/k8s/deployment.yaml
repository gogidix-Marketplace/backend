apiVersion: apps/v1
kind: Deployment
metadata:
  name: shared-messaging
  namespace: gogidix-infrastructure
  labels:
    app: shared-messaging
    component: messaging
    tier: infrastructure
    version: v1.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: shared-messaging
  template:
    metadata:
      labels:
        app: shared-messaging
        component: messaging
        tier: infrastructure
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/api/messaging/actuator/prometheus"
        prometheus.io/port: "8501"
    spec:
      serviceAccountName: shared-messaging
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
      - name: shared-messaging
        image: gogidix/shared-messaging:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8501
          name: http
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "kubernetes"
        - name: SERVER_PORT
          value: "8501"
        - name: MANAGEMENT_PORT
          value: "8501"
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: shared-messaging-config
              key: db.host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: shared-messaging-config
              key: db.port
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: shared-messaging-secrets
              key: db.username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: shared-messaging-secrets
              key: db.password
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: shared-messaging-config
              key: redis.host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: shared-messaging-config
              key: redis.port
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: shared-messaging-secrets
              key: redis.password
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: shared-messaging-config
              key: kafka.bootstrap.servers
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/messaging/actuator/health/liveness
            port: 8501
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/messaging/actuator/health/readiness
            port: 8501
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/messaging/actuator/health
            port: 8501
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 30
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: config
          mountPath: /app/config
          readOnly: true
      volumes:
      - name: logs
        emptyDir: {}
      - name: config
        configMap:
          name: shared-messaging-config
      imagePullSecrets:
      - name: gogidix-registry-secret

---
apiVersion: v1
kind: Service
metadata:
  name: shared-messaging-service
  namespace: gogidix-infrastructure
  labels:
    app: shared-messaging
    component: messaging
    tier: infrastructure
spec:
  type: ClusterIP
  ports:
  - port: 8501
    targetPort: 8501
    protocol: TCP
    name: http
  selector:
    app: shared-messaging

---
apiVersion: v1
kind: Service
metadata:
  name: shared-messaging-headless
  namespace: gogidix-infrastructure
  labels:
    app: shared-messaging
    component: messaging
    tier: infrastructure
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 8501
    targetPort: 8501
    protocol: TCP
    name: http
  selector:
    app: shared-messaging