name: Build Universal Tracking Services

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

env:
  JAVA_VERSION: '17'
  MAVEN_VERSION: '3.9.12'
  DOCKER_REGISTRY: ghcr.io
  DOMAIN_NAME: universal-tracking-services

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v3
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: Set up Maven
      uses: stCarolas/setup-maven@v4.5
      with:
        maven-version: ${{ env.MAVEN_VERSION }}

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build universal-tracking-service
      run: mvn clean compile
      working-directory: Backend/Java

    - name: Package universal-tracking-service
      run: mvn package -DskipTests
      working-directory: Backend/Java

    - name: Build Docker image - universal-tracking-service
      run: |
        docker build -t ghcr.io/${{ github.repository_owner }}/universal-tracking-service:${{ github.sha }} .
        docker tag ghcr.io/${{ github.repository_owner }}/universal-tracking-service:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/universal-tracking-service:latest
      working-directory: Backend/Java/universal-tracking-service

    - name: Log in to Docker Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v2
      with:
        registry: ${{ env.DOCKER_REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push Docker image
      if: github.event_name != 'pull_request'
      run: |
        docker push ghcr.io/${{ github.repository_owner }}/universal-tracking-service:${{ github.sha }}
        docker push ghcr.io/${{ github.repository_owner }}/universal-tracking-service:latest

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: universal-tracking-service-build-artifacts
        path: |
          Backend/Java/universal-tracking-service/target/
        retention-days: 7
