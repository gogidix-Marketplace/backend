apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-document-extraction-service
  namespace: ai-services
  labels:
    app: ai-document-extraction-service
    version: v1
    team: team-ai-content-processing
    component: content-document-processing
    environment: production
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ai-document-extraction.gogidix.io
    - ai-document-extraction-service.ai-services.svc.cluster.local
    secretName: ai-document-extraction-service-tls
  rules:
  - host: ai-document-extraction.gogidix.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ai-document-extraction-service
            port:
              number: 8080
