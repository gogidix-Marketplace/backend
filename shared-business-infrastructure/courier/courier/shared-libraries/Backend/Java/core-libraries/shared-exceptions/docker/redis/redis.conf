# Redis Configuration for Gogidix Shared Exceptions Service
# Optimized for development and production use
# Author: Gogidix Development Team
# Version: 1.0.0
# Date: 2025-08-13

# =================================================================
# Network Configuration
# =================================================================
bind 0.0.0.0
port 6379
protected-mode no
tcp-backlog 511
tcp-keepalive 300

# =================================================================
# General Configuration
# =================================================================
timeout 0
databases 16
always-show-logo no
save 900 1
save 300 10
save 60 10000

# =================================================================
# Memory Management
# =================================================================
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# =================================================================
# Persistence Configuration
# =================================================================
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename shared-exceptions-dump.rdb
dir /data

# =================================================================
# Logging Configuration
# =================================================================
loglevel notice
logfile ""
syslog-enabled no

# =================================================================
# Client Configuration
# =================================================================
maxclients 10000

# =================================================================
# Performance Tuning
# =================================================================
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100

# =================================================================
# Security Configuration
# =================================================================
# requirepass your_redis_password_here
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command DEBUG ""
# rename-command CONFIG ""

# =================================================================
# Cache-Specific Configuration for Shared Exceptions
# =================================================================
# Database allocation:
# DB 0: Default
# DB 1: Sessions
# DB 2: Shared Exceptions Cache (configured in application.yml)
# DB 3: Reserved for other shared libraries