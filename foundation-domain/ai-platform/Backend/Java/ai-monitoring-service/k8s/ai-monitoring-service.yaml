---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-monitoring-service-config
  namespace: ai-platform
  labels:
    app: ai-monitoring-service
    version: v1
data:
  application.yml: |
    server:
      port: 8001
    spring:
      application:
        name: ai-monitoring-service
      cloud:
        discovery:
          enabled: true
          service-url:
            defaultZone: http://discovery-service.infrastructure.svc.cluster.local:8761/eureka/
        config:
          enabled: true
          uri: http://config-server.infrastructure.svc.cluster.local:8888/
      data:
        mongodb:
          uri: mongodb://monitoring-user:${MONGODB_PASSWORD}@mongodb.infrastructure.svc.cluster.local:27017/ai-monitoring?authSource=admin
        kafka:
          bootstrap-servers: kafka-bootstrap.infrastructure.svc.cluster.local:9092
          topics:
            - ai-metrics
            - service-health
            - alert-events
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
      endpoint:
        health:
          show-details: always
      metrics:
        export:
          prometheus:
            enabled: true
    monitoring:
      metrics-collection-interval: 60
      alert-threshold-cpu: 80
      alert-threshold-memory: 85
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-monitoring-service-secrets
  namespace: ai-platform
  labels:
    app: ai-monitoring-service
type: Opaque
stringData:
  mongodb-password: "ChangeThisInProduction123!"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-monitoring-service
  namespace: ai-platform
  labels:
    app: ai-monitoring-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-monitoring-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ai-monitoring-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: ai-monitoring-service
      containers:
        - name: ai-monitoring-service
          image: gogidix/ai-monitoring-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              value: "http://discovery-service.infrastructure.svc.cluster.local:8761/eureka/"
            - name: SPRING_CLOUD_CONFIG_URI
              value: "http://config-server.infrastructure.svc.cluster.local:8888/"
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-monitoring-service-secrets
                  key: mongodb-password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-bootstrap.infrastructure.svc.cluster.local:9092"
          envFrom:
            - configMapRef:
                  name: ai-monitoring-service-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8001
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: config-volume
          configMap:
            name: ai-monitoring-service-config
---
apiVersion: v1
kind: Service
metadata:
  name: ai-monitoring-service
  namespace: ai-platform
  labels:
    app: ai-monitoring-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8001
      targetPort: 8001
      protocol: TCP
  selector:
    app: ai-monitoring-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-monitoring-service
  namespace: ai-platform
  labels:
    app: ai-monitoring-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-monitoring-service-hpa
  namespace: ai-platform
  labels:
    app: ai-monitoring-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-monitoring-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-monitoring-service-pdb
  namespace: ai-platform
  labels:
    app: ai-monitoring-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ai-monitoring-service
