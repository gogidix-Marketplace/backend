# Development Profile Configuration for Shared Utilities
spring:
  config:
    activate:
      on-profile: dev

  # Development Database
  datasource:
    url: jdbc:h2:file:./data/shared-utilities-dev;AUTO_SERVER=TRUE
    username: sa
    password: password
    driver-class-name: org.h2.Driver

  # JPA Development Settings
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # Cache Settings - Shorter TTL for development
  cache:
    redis:
      time-to-live: 300000

  # H2 Console for development
  h2:
    console:
      enabled: true
      path: /h2-console

# Logging for Development
logging:
  level:
    com.gogidix.infrastructure.sharedlibraries.sharedutilities: DEBUG
    org.springframework.cache: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

# Development-specific utility settings
gogidix:
  utilities:
    file:
      temp-directory: ./temp-dev
    validation:
      strict-mode: false
    date:
      cache-ttl-seconds: 300
    json:
      cache-ttl-seconds: 300