apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ai-product-recommendationation-service
  namespace: ai-services
  labels:
    app: ai-product-recommendationation-service
    team: team-f-ai-services
spec:
  selector:
    matchLabels:
      app: ai-product-recommendationation-service
  endpoints:
  - port: http
    path: /actuator/prometheus
    interval: 30s
    scrapeTimeout: 10s
    scheme: http
