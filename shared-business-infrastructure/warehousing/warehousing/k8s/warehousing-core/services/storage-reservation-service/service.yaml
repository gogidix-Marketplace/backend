apiVersion: v1
kind: Service
metadata:
  name: storage-reservation-service
  namespace: warehousing-core
  labels:
    app: storage-reservation-service
    service: storage-reservation-service
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
  - name: http
    port: 8233
    targetPort: http
    protocol: TCP
  - name: management
    port: 8234
    targetPort: management
    protocol: TCP
  selector:
    app: storage-reservation-service
---
apiVersion: v1
kind: Service
metadata:
  name: storage-reservation-service-headless
  namespace: warehousing-core
  labels:
    app: storage-reservation-service
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8233
    targetPort: http
    protocol: TCP
  selector:
    app: storage-reservation-service
