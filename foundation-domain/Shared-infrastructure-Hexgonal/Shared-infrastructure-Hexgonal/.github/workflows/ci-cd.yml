name: Shared Infrastructure Hexagonal CI/CD Pipeline

on:
  push:
    branches: [ main, develop, dev ]
  pull_request:
    branches: [ main, develop, dev ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: shared-infrastructure

jobs:
  build-and-test:
    name: Build and Test All Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@13aacd865c20de90d75de3dcf1572b4a4f02ed94
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build all modules
        run: mvn clean install -DskipTests -B

      - name: Run tests with coverage
        run: mvn test jacoco:report -B

      - name: Check Coverage Threshold (85%)
        run: mvn jacoco:check -B

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: test-results
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: coverage-reports
          path: '**/target/site/jacoco/'
          retention-days: 7

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - api-rate-limit-service
          - email-sender-service
          - event-bus-bridge-service
          - message-broker
          - message-queue-management-service
          - notification-service
          - sms-sender-service
          - social-media-integration-service
          - status-broadcast-service
          - webhook-management-service
          - config-server
          - api-gateway-service
          - discovery-service
          - caching-service
          - infrastructure-config-server
          - message-broker-service
          - audit-service
          - rate-limiting-service
          - dlp-service
          - mfa-service
          - secrets-management-service
          - security-analytics-service
          - security-management-service
          - security-orchestration-service
          - threat-intelligence-service
          - file-storage-service
        include:
          - service: api-rate-limit-service
            context: services/api-management/api-rate-limit-service
          - service: email-sender-service
            context: services/communication/email-sender-service
          - service: event-bus-bridge-service
            context: services/communication/event-bus-bridge-service
          - service: message-broker
            context: services/communication/message-broker
          - service: message-queue-management-service
            context: services/communication/message-queue-management-service
          - service: notification-service
            context: services/communication/notification-service
          - service: sms-sender-service
            context: services/communication/sms-sender-service
          - service: social-media-integration-service
            context: services/communication/social-media-integration-service
          - service: status-broadcast-service
            context: services/communication/status-broadcast-service
          - service: webhook-management-service
            context: services/communication/webhook-management-service
          - service: config-server
            context: services/config/config-server
          - service: api-gateway-service
            context: services/gateway/api-gateway-service
          - service: discovery-service
            context: services/gateway/discovery-service
          - service: caching-service
            context: services/infrastructure/caching-service
          - service: infrastructure-config-server
            context: services/infrastructure/config-server
          - service: message-broker-service
            context: services/infrastructure/message-broker-service
          - service: audit-service
            context: services/observability/audit-service
          - service: rate-limiting-service
            context: services/observability/rate-limiting-service
          - service: dlp-service
            context: services/security/dlp-service
          - service: mfa-service
            context: services/security/mfa-service
          - service: secrets-management-service
            context: services/security/secrets-management-service
          - service: security-analytics-service
            context: services/security/security-analytics-service
          - service: security-management-service
            context: services/security/security-management-service
          - service: security-orchestration-service
            context: services/security/security-orchestration-service
          - service: threat-intelligence-service
            context: services/security/threat-intelligence-service
          - service: file-storage-service
            context: services/storage/file-storage-service

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@2b512430cf1c7c4fe9b7815b4c7d761f6e893f6b

      - name: Log in to Container Registry
        uses: docker/login-action@e92390c5fb421da1463b202fbb5d8c4abc1a1ff6
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@8e5442c4c6b23faec5f45e6f8a52f03446a791ce
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@af5a7ed5ba88268de6df9df61a84dfe726b25e69
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.meta.outputs.digest }}"

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: docker-build
    permissions:
      contents: read
      security-events: write

    strategy:
      matrix:
        service:
          - api-rate-limit-service
          - email-sender-service
          - event-bus-bridge-service
          - message-broker
          - message-queue-management-service
          - notification-service
          - sms-sender-service
          - social-media-integration-service
          - status-broadcast-service
          - webhook-management-service
          - config-server
          - api-gateway-service
          - discovery-service
          - caching-service
          - infrastructure-config-server
          - message-broker-service
          - audit-service
          - rate-limiting-service
          - dlp-service
          - mfa-service
          - secrets-management-service
          - security-analytics-service
          - security-management-service
          - security-orchestration-service
          - threat-intelligence-service
          - file-storage-service

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@6896a38fa877f2db34aa4fff10fa544dbbf9357c
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service }}.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@435327b1c2fef2aa9df534fdf274590a098c19f4
        with:
          sarif_file: 'trivy-results-${{ matrix.service }}.sarif'
          category: 'trivy-${{ matrix.service }}'

  deploy:
    name: Deploy to Environment
    runs-on: ubuntu-latest
    needs: [docker-build, security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up kubectl
        uses: azure/setup-kubectl@7c9cd5b7a80e4137fef6d0fcc6593e306757c0f4
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kubeconfig
          export KUBECONFIG=~/.kubeconfig

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/ -n shared-infrastructure

      - name: Verify deployment
        run: |
          kubectl rollout status deployment -n shared-infrastructure
          kubectl get pods -n shared-infrastructure

      - name: Health check
        run: |
          echo "Performing health checks on deployed services..."
          # Add specific health check endpoints here

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()

    steps:
      - name: Send notification
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "Deployment successful"
          else
            echo "Deployment failed"
          fi
          # Add Slack/Teams notification integration here
