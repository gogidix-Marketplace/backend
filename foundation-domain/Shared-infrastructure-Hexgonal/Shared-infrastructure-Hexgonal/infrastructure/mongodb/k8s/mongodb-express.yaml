---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-express
  namespace: infrastructure
  labels:
    app: mongodb-express
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 8081
    targetPort: 8081
  selector:
    app: mongodb-express

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-express
  namespace: infrastructure
  labels:
    app: mongodb-express
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-express
  template:
    metadata:
      labels:
        app: mongodb-express
    spec:
      containers:
      - name: mongodb-express
        image: mongo-express:1.0
        ports:
        - name: http
          containerPort: 8081
        env:
        - name: ME_CONFIG_MONGODB_URL
          valueFrom:
            secretKeyRef:
              name: mongodb-credentials
              key: url
        - name: ME_CONFIG_BASICAUTH_USERNAME
          value: "admin"
        - name: ME_CONFIG_BASICAUTH_PASSWORD
          value: "admin"
        - name: ME_CONFIG_MONGODB_ENABLE_ADMIN
          value: "true"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
