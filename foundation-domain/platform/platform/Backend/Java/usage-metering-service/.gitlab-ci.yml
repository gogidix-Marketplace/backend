# GitLab CI/CD Pipeline for Usage Metering Service

stages:
  - build
  - test
  - security-scan
  - docker-build
  - deploy-staging
  - deploy-production

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_IMAGE: "maven:3.9.5-eclipse-temurin-17"
  DOCKER_IMAGE: "docker:24.0.7"

cache:
  paths:
    - .m2/repository/

# Build stage
build:
  stage: build
  image: $MAVEN_IMAGE
  script:
    - mvn clean compile
  artifacts:
    paths:
      - target/
    expire_in: 1 hour
  only:
    - merge_requests
    - main
    - develop

# Unit tests
unit-tests:
  stage: test
  image: $MAVEN_IMAGE
  script:
    - mvn test
    - mvn jacoco:report
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: target/site/jacoco/jacoco.xml
    paths:
      - target/site/jacoco/
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - develop

# Integration tests
integration-tests:
  stage: test
  image: $MAVEN_IMAGE
  services:
    - postgres:14-alpine
    - redis:7-alpine
    - confluentinc/cp-kafka:7.4.0
  variables:
    DATABASE_URL: "jdbc:postgresql://postgres:5432/test_db"
    DATABASE_USERNAME: "postgres"
    DATABASE_PASSWORD: "postgres"
  script:
    - mvn verify -P integration-test
  only:
    - merge_requests
    - main
    - develop

# Security scanning
dependency-scan:
  stage: security-scan
  image: $MAVEN_IMAGE
  script:
    - mvn org.owasp:dependency-check-maven:check
  artifacts:
    reports:
      sast: dependency-check-report.html
    paths:
      - target/dependency-check-report.html
    expire_in: 1 week
  allow_failure: true
  only:
    - merge_requests
    - main

# Build Docker image
docker-build:
  stage: docker-build
  image: $DOCKER_IMAGE
  services:
    - docker:24.0.7-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  only:
    - main
    - develop

# Deploy to staging
deploy-staging:
  stage: deploy-staging
  image: $DOCKER_IMAGE
  environment:
    name: staging
    url: https://usage-metering-service.staging.gogidix.com
  script:
    - apk add --no-cache curl
    - curl https://cli.railway.app/install.sh | sh
    - railway login --token $RAILWAY_TOKEN_STAGING
    - railway up --service usage-metering-service-staging
  only:
    - develop

# Deploy to production
deploy-production:
  stage: deploy-production
  image: $DOCKER_IMAGE
  environment:
    name: production
    url: https://usage-metering-service.gogidix.com
  script:
    - apk add --no-cache curl
    - curl https://cli.railway.app/install.sh | sh
    - railway login --token $RAILWAY_TOKEN_PROD
    - railway up --service usage-metering-service
  when: manual
  only:
    - main
