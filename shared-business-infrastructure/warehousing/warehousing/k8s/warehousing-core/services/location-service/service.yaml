apiVersion: v1
kind: Service
metadata:
  name: location-service
  namespace: warehousing-core
  labels:
    app: location-service
    service: location-service
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
  - name: http
    port: 8220
    targetPort: http
    protocol: TCP
  - name: management
    port: 8221
    targetPort: management
    protocol: TCP
  selector:
    app: location-service
---
apiVersion: v1
kind: Service
metadata:
  name: location-service-headless
  namespace: warehousing-core
  labels:
    app: location-service
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8220
    targetPort: http
    protocol: TCP
  selector:
    app: location-service
