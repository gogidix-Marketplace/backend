# Kubernetes Profile Configuration for Shared Utilities
spring:
  config:
    activate:
      on-profile: kubernetes

  # Kubernetes Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME:gogidix_utilities}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      idle-timeout: 300000
      connection-timeout: 30000

  # Kubernetes JPA Settings
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  # Kubernetes Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 2
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1

  # Kubernetes Cache Settings
  cache:
    redis:
      time-to-live: 7200000

  # Kubernetes Security
  security:
    user:
      name: ${SECURITY_USER:admin}
      password: ${SECURITY_PASSWORD}
      roles: ADMIN

# Kubernetes Logging
logging:
  level:
    com.gogidix.infrastructure.sharedlibraries.sharedutilities: INFO
    org.springframework: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"

# Kubernetes Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,readiness,liveness
      base-path: /api/utilities/actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

# Kubernetes-specific utility settings
gogidix:
  utilities:
    file:
      temp-directory: ${TEMP_DIR:/tmp/utilities}
      max-file-size: ${MAX_FILE_SIZE:100MB}
      cleanup-interval: 7200000
    validation:
      strict-mode: true
      log-validation-errors: true
    date:
      cache-ttl-seconds: ${CACHE_TTL:3600}
    json:
      cache-ttl-seconds: ${CACHE_TTL:3600}

# Kubernetes async settings
utilities:
  async:
    core-pool-size: 5
    max-pool-size: 15
    queue-capacity: 1000
  cache:
    enabled: true
    ttl-seconds: ${CACHE_TTL:3600}
  processing:
    timeout-seconds: 60
    max-retries: 5