version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: dashboard-postgres
    environment:
      POSTGRES_DB: dashboard_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dashboard-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: dashboard-redis
    ports:
      - "6379:6379"
    networks:
      - dashboard-network

  # Kafka
  kafka:
    image: bitnami/kafka:3.5
    container_name: dashboard-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9091
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9091
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: true
    networks:
      - dashboard-network

  # Dashboard Core Service (Port 8904)
  dashboard-core-service:
    build:
      context: ./dashboard-core-service
      dockerfile: Dockerfile
    container_name: dashboard-core-service
    ports:
      - "8904:8904"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/dashboard_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: 8904
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - dashboard-network

  # Data Aggregation Service (Port 8905)
  data-aggregation-service:
    build:
      context: ./data-aggregation-service
      dockerfile: Dockerfile
    container_name: data-aggregation-service
    ports:
      - "8905:8905"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/dashboard_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: 8905
      COURIER_SERVICE_URL: http://courier-service:8901
      WAREHOUSE_SERVICE_URL: http://warehouse-service:8902
      SOCIAL_COMMERCE_SERVICE_URL: http://social-commerce-service:8903
      DASHBOARD_CORE_SERVICE_URL: http://dashboard-core-service:8904
    depends_on:
      - postgres
      - redis
      - kafka
      - dashboard-core-service
    networks:
      - dashboard-network

volumes:
  postgres_data:

networks:
  dashboard-network:
    driver: bridge
