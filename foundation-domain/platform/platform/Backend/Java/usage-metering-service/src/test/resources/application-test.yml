spring:
  application:
    name: usage-metering-service

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  kafka:
    bootstrap-servers: localhost:9092

  redis:
    host: localhost
    port: 6379

server:
  port: 0

logging:
  level:
    root: INFO
    com.gogidix: DEBUG
