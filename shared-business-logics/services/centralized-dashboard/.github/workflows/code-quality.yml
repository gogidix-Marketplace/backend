name: Code Quality - Centralized Dashboard

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  JAVA_VERSION: '17'
  MAVEN_VERSION: '3.9.12'
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  checkstyle:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v3
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: Run Checkstyle
      run: mvn checkstyle:check
      working-directory: Backend/Java

    - name: Upload Checkstyle results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: checkstyle-results
        path: Backend/Java/target/checkstyle-result.xml

  spotbugs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v3
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: Run SpotBugs
      run: mvn spotbugs:check
      working-directory: Backend/Java

    - name: Upload SpotBugs results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: spotbugs-results
        path: Backend/Java/target/spotbugsXml.xml

  pmd:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v3
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: Run PMD
      run: mvn pmd:check
      working-directory: Backend/Java

    - name: Upload PMD results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: pmd-results
        path: Backend/Java/target/pmd.xml

  sonarcloud:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action == 'synchronize'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v3
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: Set up Maven
      uses: stCarolas/setup-maven@v4.5
      with:
        maven-version: ${{ env.MAVEN_VERSION }}

    - name: Cache SonarCloud packages
      uses: actions/cache@v3
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar

    - name: Build and analyze with SonarCloud
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=gogidix_centralized-dashboard \
          -Dsonar.organization=gogidix \
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
      working-directory: Backend/Java

  coverage:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v3
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: Set up Maven
      uses: stCarolas/setup-maven@v4.5
      with:
        maven-version: ${{ env.MAVEN_VERSION }}

    - name: Run tests with coverage
      run: mvn clean test jacoco:report
      working-directory: Backend/Java

    - name: Generate coverage report
      run: mvn jacoco:report-aggregate
      working-directory: Backend/Java

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: Backend/Java/target/site/jacoco-aggregate/jacoco.xml
        flags: centralized-dashboard
        name: centralized-dashboard-coverage

    - name: Check coverage thresholds
      run: |
        mvn jacoco:check
      working-directory: Backend/Java
