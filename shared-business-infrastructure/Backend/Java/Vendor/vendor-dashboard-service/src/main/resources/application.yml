spring:
  application:
    name: vendor-dashboard-service
  data:
    mongodb:
      uri: mongodb://localhost:27017
      database: gogidix_vendor_dashboard

server:
  port: 8404

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.gogidix.ecommerce.vendor.dashboard: DEBUG