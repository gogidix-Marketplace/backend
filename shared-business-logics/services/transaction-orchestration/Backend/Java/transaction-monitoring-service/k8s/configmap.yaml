apiVersion: v1
kind: ConfigMap
metadata:
  name: transaction-monitoring-service-config
  namespace: transaction-orchestration
  labels:
    app: transaction-monitoring-service
    team: team-b-transaction
data:
  database-url: "jdbc:postgresql://postgres:5432/transaction_monitoring_db"
  kafka-bootstrap-servers: "kafka:9092"
  application.yaml: |
    server:
      port: 8085
      shutdown: graceful

    spring:
      application:
        name: transaction-monitoring-service

      datasource:
        url: ${DATABASE_URL}
        username: ${DATABASE_USERNAME}
        password: ${DATABASE_PASSWORD}
        driver-class-name: org.postgresql.Driver
        hikari:
          maximum-pool-size: 20
          minimum-idle: 5
          connection-timeout: 30000
          idle-timeout: 600000
          max-lifetime: 1800000

      jpa:
        hibernate:
          ddl-auto: validate
        show-sql: false
        properties:
          hibernate:
            dialect: org.hibernate.dialect.PostgreSQLDialect
            format_sql: true
            jdbc:
              batch_size: 100
            order_inserts: true
            order_updates: true
        open-in-view: false

      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
        consumer:
          group-id: transaction-monitoring-service-group
          auto-offset-reset: earliest
          key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
          value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
          properties:
            spring.json.trusted.packages: "*"
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
          acks: all
          retries: 3

      quartz:
        job-store-type: jdbc
        jdbc:
          initialize-schema: never
        properties:
          org:
            quartz:
              scheduler:
                instanceName: transactionMonitoringScheduler
                instanceId: AUTO
              jobStore:
                class: org.quartz.impl.jdbcjobstore.JobStoreTX
                driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
                tablePrefix: QRTZ_
                isClustered: true
                clusterCheckinInterval: 20000
              threadPool:
                class: org.quartz.simpl.SimpleThreadPool
                threadCount: 5
                threadPriority: 5

    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
      endpoint:
        health:
          show-details: always
          show-components: always
      metrics:
        export:
          prometheus:
            enabled: true
        distribution:
          percentiles-histogram:
            http.server.requests: true
          slo:
            http.server.requests: 50ms,100ms,200ms,500ms,1s,2s

    logging:
      level:
        root: INFO
        com.gogidix.transaction.monitoring: INFO
        org.hibernate.SQL: WARN
      pattern:
        console: '%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n'
        file: '%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n'
      file:
        name: /logs/transaction-monitoring-service.log
        max-size: 100MB
        max-history: 30

    application:
      cors:
        allowed-origins: ${CORS_ORIGINS}
        allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
        allowed-headers: "*"
        allow-credentials: true
        max-age: 3600
      monitoring:
        metrics-retention-days: 30
        alerts-retention-days: 90
        cleanup-interval-hours: 24
        default-timeout-seconds: 300

    springdoc:
      api-docs:
        path: /api-docs
      swagger-ui:
        path: /swagger-ui.html
        enabled: true
      show-actuator: true
