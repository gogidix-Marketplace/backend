apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sla-management-service-ingress
  namespace: business-support
  labels:
    app: sla-management-service
    team: team-e-business-support
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - sla-management.gogidix.com
    secretName: sla-management-service-tls
  rules:
  - host: sla-management.gogidix.com
    http:
      paths:
      - path: /api(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: sla-management-service
            port:
              number: 8086
