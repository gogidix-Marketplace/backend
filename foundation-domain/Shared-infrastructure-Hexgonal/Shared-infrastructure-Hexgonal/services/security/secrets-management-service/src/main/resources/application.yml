spring:
  application:
    name: secrets-management-service
  data:
    mongodb:
      uri: mongodb://localhost:27017
      database: gogidix_secrets_management
      auto-index-creation: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://localhost:5432/gogidix_secrets
    username: gogidix
    password: gogidix
    driver-class-name: org.postgresql.Driver
  redis:
    host: localhost
    port: 6379
    database: 5
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  # Vault configuration
  cloud:
    vault:
      uri: http://localhost:8200
      token: ${VAULT_TOKEN:dev-only-token}
      scheme: http
      enabled: true

server:
  port: 8092

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    enabled: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.gogidix: DEBUG
    org.springframework.data.mongodb: INFO
    org.springframework.data.jpa: INFO
