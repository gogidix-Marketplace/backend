apiVersion: v1
kind: ConfigMap
metadata:
  name: universal-tracking-service-config
  namespace: universal-tracking-services
  labels:
    app: universal-tracking-service
    team: team-c-universal-tracking
data:
  database-url: "jdbc:postgresql://postgres:5432/universal_tracking"
  redis-host: "redis"
  redis-port: "6379"
  kafka-bootstrap-servers: "kafka:9092"
  application.yaml: |
    server:
      port: 8080
      servlet:
        context-path: /
      compression:
        enabled: true
        mime-types: application/json,application/xml,text/html,text/xml,text/plain

    spring:
      application:
        name: universal-tracking-service

      datasource:
        url: ${DATABASE_URL}
        username: ${DATABASE_USERNAME}
        password: ${DATABASE_PASSWORD}
        driver-class-name: org.postgresql.Driver
        hikari:
          maximum-pool-size: 20
          minimum-idle: 5
          connection-timeout: 30000
          idle-timeout: 600000
          max-lifetime: 1800000

      jpa:
        hibernate:
          ddl-auto: validate
        show-sql: false
        properties:
          hibernate:
            dialect: org.hibernate.dialect.PostgreSQLDialect
            format_sql: true
            use_sql_comments: true
            jdbc:
              batch_size: 100
            order_inserts: true
            order_updates: true
        open-in-view: false

      data:
        redis:
          host: ${REDIS_HOST}
          port: ${REDIS_PORT}
          password: ${REDIS_PASSWORD}
          timeout: 5000ms
          lettuce:
            pool:
              max-active: 16
              max-idle: 16
              min-idle: 4
              max-wait: -1ms

      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.apache.kafka.common.serialization.StringSerializer
          acks: all
          retries: 3
        consumer:
          group-id: universal-tracking-service
          key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
          value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
          auto-offset-reset: earliest
          enable-auto-commit: false

    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
          base-path: /actuator
      endpoint:
        health:
          show-details: always
          show-components: always
      metrics:
        export:
          prometheus:
            enabled: true
        distribution:
          percentiles-histogram:
            http.server.requests: true
          slo:
            http.server.requests: 50ms,100ms,200ms,500ms,1s,2s

    logging:
      level:
        root: INFO
        com.gogidix: INFO
        org.hibernate.SQL: WARN
      pattern:
        console: '%d{yyyy-MM-dd HH:mm:ss} - %msg%n'
        file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
      file:
        name: /logs/universal-tracking-service.log
        max-size: 100MB
        max-history: 30

    # Application properties
    tracking:
      event:
        retention:
          days: 90
        batch:
          size: 100
      session:
        timeout:
          minutes: 30
      metric:
        aggregation:
          enabled: true

    springdoc:
      api-docs:
        path: /api-docs
      swagger-ui:
        path: /swagger-ui.html
        enabled: true
        operations-sorter: method
        tags-sorter: alpha
      show-actuator: true
