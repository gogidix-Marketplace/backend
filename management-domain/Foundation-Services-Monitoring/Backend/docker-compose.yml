version: '3.8'

services:
  # MongoDB for all services
  mongodb:
    image: mongo:7
    container_name: monitoring-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongodb_data:/data/db
    networks:
      - monitoring-network

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: monitoring-redis
    ports:
      - "6379:6379"
    networks:
      - monitoring-network

  # Kafka for messaging
  kafka:
    image: bitnami/kafka:3.6
    container_name: monitoring-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: true
    networks:
      - monitoring-network

  # Monitoring Data Service
  monitoring-data-service:
    build:
      context: ./monitoring-data-service
      dockerfile: Dockerfile
    container_name: monitoring-data-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_USER=admin
      - MONGODB_PASSWORD=admin123
      - MONGODB_DB=monitoring_data
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_SERVERS=kafka:9092
      - SERVICE_PORT=8081
    depends_on:
      - mongodb
      - redis
      - kafka
    networks:
      - monitoring-network
    restart: unless-stopped

  # Service Health Service
  service-health-service:
    build:
      context: ./service-health-service
      dockerfile: Dockerfile
    container_name: service-health-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_USER=admin
      - MONGODB_PASSWORD=admin123
      - MONGODB_DB=service_health
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_SERVERS=kafka:9092
      - SERVICE_PORT=8082
    depends_on:
      - mongodb
      - redis
      - kafka
      - monitoring-data-service
    networks:
      - monitoring-network
    restart: unless-stopped

  # Alert Management Service
  alert-management-service:
    build:
      context: ./alert-management-service
      dockerfile: Dockerfile
    container_name: alert-management-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_USER=admin
      - MONGODB_PASSWORD=admin123
      - MONGODB_DB=alert_management
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_SERVERS=kafka:9092
      - SERVICE_PORT=8083
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
    depends_on:
      - mongodb
      - redis
      - kafka
      - monitoring-data-service
      - service-health-service
    networks:
      - monitoring-network
    restart: unless-stopped

  # MailHog for email testing (optional)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: monitoring-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - monitoring-network

volumes:
  mongodb_data:

networks:
  monitoring-network:
    driver: bridge
