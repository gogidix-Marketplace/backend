      SPRING_APPLICATION_NAME: routing-service
      SERVER_PORT: 8104
      MONGODB_URI: mongodb://admin:admin123@mongodb-primary:27017,routing-db?authSource=admin&replicaSet=rs0
      KAFKA_BROKERS: kafka:9092
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      X-TENANT-ID: routing-service
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      TENANT_CONFIG_SERVICE_URL: http://tenant-config-service:8100
      LOCATION_SERVICE_URL: http://location-service:8110
      ETA_SERVICE_URL: http://eta-service:8108
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
    depends_on:
      mongodb-primary:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      tenant-config-service:
        condition: service_healthy
      location-service:
        condition: service_healthy
      eta-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8104/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - courier-network
    restart: unless-stopped

  # ------------------------------------------------------------------------
  # Driver Pool Service - Driver Management
  # ------------------------------------------------------------------------
  driver-pool-service:
