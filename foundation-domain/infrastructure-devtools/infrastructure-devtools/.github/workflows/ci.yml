name: Infrastructure DevTools CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '18'

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: mvn test -Dspring.profiles.active=test
        working-directory: Backend/Java/infrastructure-devtools-service

      - name: Generate test report
        uses: dorny/test-reporter@v1@31c3ebddbefeb033073b4ef61a3bc72edd5e41e5
        if: success() || failure()
        with:
          name: Backend Test Results
          path: 'Backend/Java/infrastructure-devtools-service/target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: true

      - name: Check test coverage
        run: mvn jacoco:check
        working-directory: Backend/Java/infrastructure-devtools-service

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3@4fe8c5f003fa651c1f8cceabe96c08c3b616d63e
        with:
          files: Backend/Java/infrastructure-devtools-service/target/site/jacoco/jacoco.xml
          flags: backend

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4@1f5898ba06582a780b702d69c9a7f94c1aa2b1f8
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Frontends/Web/infrastructure-devtools-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Frontends/Web/infrastructure-devtools-frontend

      - name: Run tests
        run: npm run test:coverage
        working-directory: Frontends/Web/infrastructure-devtools-frontend

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3@4fe8c5f003fa651c1f8cceabe96c08c3b616d63e
        with:
          files: Frontends/Web/infrastructure-devtools-frontend/coverage/lcov.info
          flags: frontend

      - name: Lint code
        run: npm run lint
        working-directory: Frontends/Web/infrastructure-devtools-frontend

  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build backend JAR
        run: mvn package -DskipTests
        working-directory: Backend/Java/infrastructure-devtools-service

      - name: Upload backend artifact
        uses: actions/upload-artifact@v3@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: backend-jar
          path: Backend/Java/infrastructure-devtools-service/target/*.jar
          retention-days: 7

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4@1f5898ba06582a780b702d69c9a7f94c1aa2b1f8
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        run: |
          npm ci
          npm run build
        working-directory: Frontends/Web/infrastructure-devtools-frontend

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v3@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: frontend-dist
          path: Frontends/Web/infrastructure-devtools-frontend/dist
          retention-days: 7

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master@6896a38fa877f2db34aa4fff10fa544dbbf9357c
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2@435327b1c2fef2aa9df534fdf274590a098c19f4
        with:
          sarif_file: 'trivy-results.sarif'

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3@2b512430cf1c7c4fe9b7815b4c7d761f6e893f6b

      - name: Login to Docker Hub
        uses: docker/login-action@v3@e92390c5fb421da1463b202fbb5d8c4abc1a1ff6
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5@af5a7ed5ba88268de6df9df61a84dfe726b25e69
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            gogidix/infrastructure-devtools-backend:latest
            gogidix/infrastructure-devtools-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5@af5a7ed5ba88268de6df9df61a84dfe726b25e69
        with:
          context: ./Frontends/Web/infrastructure-devtools-frontend
          push: true
          tags: |
            gogidix/infrastructure-devtools-frontend:latest
            gogidix/infrastructure-devtools-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
