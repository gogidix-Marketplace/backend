version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: gogidix-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: audit_trail_db,onboarding_tracker_db,progress_step_db,status_broadcast_db,transaction_monitoring_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh
    networks:
      - gogidix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper (required for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: gogidix-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - gogidix-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Apache Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: gogidix-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - gogidix-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Audit Trail Service
  audit-trail-service:
    build:
      context: ./Backend/Java/audit-trail-service
      dockerfile: Dockerfile
    container_name: audit-trail-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/audit_trail_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - gogidix-network
    restart: unless-stopped

  # Onboarding Tracker Service
  onboarding-tracker-service:
    build:
      context: ./Backend/Java/onboarding-tracker-service
      dockerfile: Dockerfile
    container_name: onboarding-tracker-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/onboarding_tracker_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - gogidix-network
    restart: unless-stopped

  # Progress Step Service
  progress-step-service:
    build:
      context: ./Backend/Java/progress-step-service
      dockerfile: Dockerfile
    container_name: progress-step-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/progress_step_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - gogidix-network
    restart: unless-stopped

  # Status Broadcast Service
  status-broadcast-service:
    build:
      context: ./Backend/Java/status-broadcast-service
      dockerfile: Dockerfile
    container_name: status-broadcast-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/status_broadcast_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - gogidix-network
    restart: unless-stopped

  # Transaction Monitoring Service
  transaction-monitoring-service:
    build:
      context: ./Backend/Java/transaction-monitoring-service
      dockerfile: Dockerfile
    container_name: transaction-monitoring-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/transaction_monitoring_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - gogidix-network
    restart: unless-stopped

  # React Web Dashboard
  web-dashboard:
    build:
      context: ./Frontends/Web
      dockerfile: Dockerfile
    container_name: web-dashboard
    depends_on:
      - audit-trail-service
      - onboarding-tracker-service
      - progress-step-service
      - status-broadcast-service
      - transaction-monitoring-service
    ports:
      - "3000:80"
    networks:
      - gogidix-network
    restart: unless-stopped

networks:
  gogidix-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
