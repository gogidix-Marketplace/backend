server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /api/devtools

spring:
  application:
    name: infrastructure-devtools-service
  profiles:
    active: ${SPRING_PROFILE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: devtools
    open-in-view: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gogidix_devtools}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    enabled: true
    schemas: devtools
    locations: classpath:db/migration
    baseline-on-migrate: true
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 5000
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: devtools-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  security:
    user:
      name: ${DEVTOOLS_ADMIN_USER:admin}
      password: ${DEVTOOLS_ADMIN_PASSWORD:admin}
      roles: ADMIN, DEVELOPER

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,heapdump,threaddump,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  show-actuator: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.gogidix.foundation.devtools: ${LOG_LEVEL:DEBUG}
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE_PATH:logs/devtools-service.log}
    max-size: 100MB
    max-history: 30

# Application-specific Configuration
devtools:
  api-testing:
    timeout: ${API_TEST_TIMEOUT:30000}
    max-concurrent: ${API_TEST_MAX_CONCURRENT:10}
    storage-retention-days: ${API_TEST_RETENTION_DAYS:30}
  database:
    query-timeout: ${DB_QUERY_TIMEOUT:60000}
    max-rows: ${DB_MAX_ROWS:1000}
    allowed-schemas: ${DB_ALLOWED_SCHEMAS:public,devtools}
  logging:
    retention-days: ${LOG_RETENTION_DAYS:7}
    max-log-size-mb: ${LOG_MAX_SIZE_MB:500}
  deployment:
    timeout: ${DEPLOY_TIMEOUT:300000}
    max-concurrent: ${DEPLOY_MAX_CONCURRENT:5}
  documentation:
    output-dir: ${DOC_OUTPUT_DIR:./docs/generated}
    formats: markdown,html,pdf

# CORS Configuration
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    com.gogidix.foundation.devtools: DEBUG
    org.springframework.web: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
logging:
  level:
    com.gogidix.foundation.devtools: DEBUG
    org.hibernate.SQL: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
logging:
  level:
    root: WARN
    com.gogidix.foundation.devtools: INFO
