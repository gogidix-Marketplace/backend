---
apiVersion: v1
kind: ConfigMap
metadata:
  name: email-sender-service-config
  namespace: infrastructure
  labels:
    app: email-sender-service
    version: v1
data:
  application.yml: |
    server:
      port: 8080
    spring:
      application:
        name: email-sender-service
      cloud:
        discovery:
          enabled: true
          service-url:
            defaultZone: http://discovery-service:8761/eureka/
        config:
          enabled: true
          uri: http://config-server:8888
      mail:
        host: ${SMTP_HOST}
        port: ${SMTP_PORT:587}
        username: ${SMTP_USERNAME}
        password: ${SMTP_PASSWORD}
        properties:
          mail:
            smtp:
              auth: true
              starttls:
                enable: true
              ssl:
                trust: "*"
      data:
        mongodb:
          uri: mongodb://email-user:${MONGODB_PASSWORD}@mongodb.infrastructure.svc.cluster.local:27017/email-sender?authSource=admin
          auto-index-creation: true
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
      endpoint:
        health:
          show-details: always
      metrics:
        export:
          prometheus:
            enabled: true
---
apiVersion: v1
kind: Secret
metadata:
  name: email-sender-service-secrets
  namespace: infrastructure
  labels:
    app: email-sender-service
type: Opaque
stringData:
  mongodb-password: "ChangeThisInProduction123!"
  smtp-host: "smtp.gmail.com"
  smtp-port: "587"
  smtp-username: "noreply@gogidix.com"
  smtp-password: "ChangeThisSmtpPasswordInProduction"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-sender-service
  namespace: infrastructure
  labels:
    app: email-sender-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: email-sender-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: email-sender-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: email-sender-service
      containers:
        - name: email-sender-service
          image: gogidix/email-sender-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: email-sender-service-secrets
                  key: mongodb-password
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: email-sender-service-secrets
                  key: smtp-host
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: email-sender-service-secrets
                  key: smtp-port
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: email-sender-service-secrets
                  key: smtp-username
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: email-sender-service-secrets
                  key: smtp-password
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              value: "http://discovery-service:8761/eureka/"
            - name: SPRING_CLOUD_CONFIG_URI
              value: "http://config-server:8888"
          envFrom:
            - configMapRef:
                name: email-sender-service-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - email-sender-service
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: email-sender-service
  namespace: infrastructure
  labels:
    app: email-sender-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: email-sender-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: email-sender-service
  namespace: infrastructure
  labels:
    app: email-sender-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: email-sender-service-hpa
  namespace: infrastructure
  labels:
    app: email-sender-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: email-sender-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: email-sender-service-pdb
  namespace: infrastructure
  labels:
    app: email-sender-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: email-sender-service
