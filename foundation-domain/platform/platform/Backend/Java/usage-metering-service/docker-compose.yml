version: '3.8'

services:
  usage-metering-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: usage-metering-service
    ports:
      - "8403:8403"
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/usage_metering
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SERVER_PORT=8403
      - SPRING_PROFILES_ACTIVE=dev
    depends_on:
      - postgres
      - redis
      - kafka
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8403/usage-metering/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    networks:
      - usage-metering-network

  postgres:
    image: postgres:14-alpine
    container_name: usage-metering-postgres
    environment:
      - POSTGRES_DB=usage_metering
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - usage-metering-network

  redis:
    image: redis:7-alpine
    container_name: usage-metering-redis
    ports:
      - "6382:6379"
    networks:
      - usage-metering-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: usage-metering-kafka
    ports:
      - "9095:9092"
    environment:
      - KAFKA_BROKER_ID=4
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    depends_on:
      - zookeeper
    networks:
      - usage-metering-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: usage-metering-zookeeper
    ports:
      - "2184:2181"
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    networks:
      - usage-metering-network

volumes:
  postgres-data:

networks:
  usage-metering-network:
    driver: bridge
