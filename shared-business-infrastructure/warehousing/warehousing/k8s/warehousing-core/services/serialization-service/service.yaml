apiVersion: v1
kind: Service
metadata:
  name: serialization-service
  namespace: warehousing-core
  labels:
    app: serialization-service
    service: serialization-service
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
  - name: http
    port: 8215
    targetPort: http
    protocol: TCP
  - name: management
    port: 8216
    targetPort: management
    protocol: TCP
  selector:
    app: serialization-service
---
apiVersion: v1
kind: Service
metadata:
  name: serialization-service-headless
  namespace: warehousing-core
  labels:
    app: serialization-service
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8215
    targetPort: http
    protocol: TCP
  selector:
    app: serialization-service
