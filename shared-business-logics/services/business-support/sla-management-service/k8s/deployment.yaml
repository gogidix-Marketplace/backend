apiVersion: v1
kind: ServiceAccount
metadata:
  name: sla-management-service
  namespace: business-support
  labels:
    app: sla-management-service
    team: team-e-business-support
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sla-management-service
  namespace: business-support
  labels:
    app: sla-management-service
    team: team-e-business-support
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sla-management-service
  template:
    metadata:
      labels:
        app: sla-management-service
        team: team-e-business-support
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8086"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: sla-management-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: sla-management-service
        image: ghcr.io/gogidix/sla-management-service:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8086
          protocol: TCP
        env:
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: sla-management-service-secrets
              key: mongodb-uri
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: sla-management-service-config
              key: redis-host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: sla-management-service-config
              key: redis-port
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: sla-management-service-config
              key: kafka-bootstrap-servers
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
          value: "http://eureka:8761/eureka/"
        - name: SERVER_SERVLET_CONTEXT_PATH
          value: "/api"
        resources:
          requests:
            memory: "768Mi"
            cpu: "250m"
          limits:
            memory: "1.5Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/actuator/health/liveness
            port: 8086
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/actuator/health/readiness
            port: 8086
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/actuator/health
            port: 8086
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 18
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      restartPolicy: Always
