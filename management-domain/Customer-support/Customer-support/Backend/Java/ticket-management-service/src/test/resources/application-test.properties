spring.application.name=ticket-management-service-test
# MongoDB Test Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=ticket_management_test

# Redis Test Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka Test Configuration
spring.kafka.bootstrap-servers=localhost:9092

# Logging
logging.level.root=INFO
logging.level.com.gogidix=DEBUG

# JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/auth/realms/gogidix
