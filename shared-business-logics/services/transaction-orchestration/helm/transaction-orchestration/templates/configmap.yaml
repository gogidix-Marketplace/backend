{{- range $name, $service := dict "transactionCoordinator" .Values.transactionCoordinator "transactionManager" .Values.transactionManager "sagaOrchestration" .Values.sagaOrchestration "distributedTransaction" .Values.distributedTransaction "transactionOutbox" .Values.transactionOutbox "transactionRecovery" .Values.transactionRecovery }}
{{- if $service.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "transaction-orchestration.serviceName" (dict "root" $ "serviceName" $service.serviceName) }}
  namespace: {{ include "transaction-orchestration.namespace" $ }}
  labels:
    {{- include "transaction-orchestration.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $service.serviceName }}
data:
  application.yaml: |-
    server:
      port: {{ $service.servicePort }}
      shutdown: graceful
    management:
      server:
        port: {{ $service.managementPort }}
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
      endpoint:
        health:
          probes:
            enabled: true
          show-details: always
      metrics:
        export:
          prometheus:
            enabled: true
    spring:
      application:
        name: {{ $service.serviceName }}
      datasource:
        url: jdbc:postgresql://${DB_HOST:{{ $.Values.global.database.host }}}:${DB_PORT:{{ $.Values.global.database.port }}}/{{ $service.database.name }}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
      redis:
        host: ${REDIS_HOST:{{ $.Values.global.redis.host }}}
        port: ${REDIS_PORT:{{ $.Values.global.redis.port }}}
      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:{{ $.Values.global.kafka.bootstrapServers }}}
    logging:
      level:
        root: INFO
        com.gogidix: DEBUG
      pattern:
        console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
        file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
{{- end }}
{{- end }}
