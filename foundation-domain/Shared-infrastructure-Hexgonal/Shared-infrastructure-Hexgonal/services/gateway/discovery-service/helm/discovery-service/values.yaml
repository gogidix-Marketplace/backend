# Default values for discovery-service Helm chart

# Namespace configuration
namespace:
  create: false
  name: infrastructure

replicaCount: 3

image:
  repository: discovery-service
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8761
  annotations: {}
  labels: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: discovery.gogidix.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2
  maxUnavailable:

# StatefulSet specific
statefulset:
  enabled: true
  serviceName: discovery-service-headless
  podManagementPolicy: Parallel

# Eureka Configuration
eureka:
  server:
    enableSelfPreservation: true
    evictionIntervalTimerInMs: 30000
    renewalPercentThreshold: 0.85
    responseCacheUpdateIntervalMs: 30000
    registrySyncRetryWaitMs: 30000
    peerEurekaNodesRefreshIntervalSeconds: 60
    rateLimiterEnabled: true
    rateLimiterBurstSize: 50
    rateLimiterFullFetchAverageRate: 100
    disableDelta: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    registryFetchIntervalSeconds: 30
    serviceUrl: http://discovery-service-0.infrastructure.svc.cluster.local:8761/eureka/
  instance:
    leaseRenewalIntervalInSeconds: 10
    leaseExpirationDurationInSeconds: 30
    preferIpAddress: false
  dashboard:
    enabled: true
    path: /eureka
  datacenter: ProductionDataCenter
  zone: zone1
  region: us-east-1

# Environment variables
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  - name: JAVA_OPTS
    value: "-Xms512m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# PVC for data persistence (optional)
persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi

# Monitoring
monitoring:
  enabled: true
  serviceMonitor:
    enabled: false
    labels: {}
    interval: 30s
  prometheusRule:
    enabled: false
    labels: {}
    rules: []

# Security
security:
  enabled: false
  username: eureka-server
  existingSecret: eureka-credentials

# Health probes
livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Logging levels
logLevel:
  eureka: INFO
  application: INFO
  spring: WARN
