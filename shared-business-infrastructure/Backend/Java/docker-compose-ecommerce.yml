version: '3.8'

# ============================================================================
# Gogidix E-Commerce Core - Docker Compose Configuration
# ============================================================================
# This docker-compose file orchestrates all 44+ microservices in the
# shared-ecommerce-core domain, including infrastructure components.
#
# Infrastructure Services:
#   - MongoDB Replica Set (ports 27017-27019)
#   - Zookeeper (port 2181)
#   - Kafka (port 9092)
#   - Eureka Server (port 8761)
#
# Usage:
#   docker-compose -f docker-compose-ecommerce.yml up -d
# ============================================================================

services:
  # ==========================================================================
  # INFRASTRUCTURE SERVICES
  # ==========================================================================

  # ------------------------------------------------------------------------
  # MongoDB Replica Set Configuration
  # ------------------------------------------------------------------------
  mongodb-primary:
    image: mongo:7.0
    container_name: mongodb-primary
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_REPLICA_SET_NAME: rs0
    volumes:
      - mongodb-primary-data:/data/db
      - mongodb-config:/data/configdb
      - ./scripts/mongodb-init.sh:/docker-entrypoint-initdb.d/mongodb-init.sh:ro
    command: mongod --replSet rs0 --bind_ip_all
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network
    restart: unless-stopped

  mongodb-secondary-1:
    image: mongo:7.0
    container_name: mongodb-secondary-1
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_REPLICA_SET_NAME: rs0
    volumes:
      - mongodb-secondary-1-data:/data/db
      - mongodb-config:/data/configdb
    command: mongod --replSet rs0 --bind_ip_all
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network
    restart: unless-stopped

  mongodb-secondary-2:
    image: mongo:7.0
    container_name: mongodb-secondary-2
    ports:
      - "27019:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_REPLICA_SET_NAME: rs0
    volumes:
      - mongodb-secondary-2-data:/data/db
      - mongodb-config:/data/configdb
    command: mongod --replSet rs0 --bind_ip_all
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network
    restart: unless-stopped

  # ------------------------------------------------------------------------
  # MongoDB Replica Set Initialization
  # ------------------------------------------------------------------------
  mongodb-init:
    image: mongo:7.0
    container_name: mongodb-init
    depends_on:
      - mongodb-primary
      - mongodb-secondary-1
      - mongodb-secondary-2
    networks:
      - ecommerce-network
    volumes:
      - ./scripts/mongodb-init.sh:/mongodb-init.sh:ro
    command: >
      bash -c "
        sleep 20 &&
        mongosh --host mongodb-primary:27017 -u admin -p admin123 --authenticationDatabase admin --eval '
        rs.initiate({
          _id: \"rs0\",
          members: [
            {_id: 0, host: \"mongodb-primary:27017\"},
            {_id: 1, host: \"mongodb-secondary-1:27017\"},
            {_id: 2, host: \"mongodb-secondary-2:27017\"}
          ]
        })
        ' &&
        sleep 10 &&
        mongosh --host mongodb-primary:27017 -u admin -p admin123 --authenticationDatabase admin --eval 'rs.status()'
      "
    restart: "no"

  # ------------------------------------------------------------------------
  # Zookeeper - Required for Kafka
  # ------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_MAX_CLIENT_CNXNS: 0
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network
    restart: unless-stopped

  # ------------------------------------------------------------------------
  # Kafka - Message Broker
  # ------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - ecommerce-network
    restart: unless-stopped

  # ------------------------------------------------------------------------
  # Kafka UI - Optional Management Interface
  # ------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ecommerce-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - ecommerce-network
    restart: unless-stopped

  # ------------------------------------------------------------------------
  # Eureka Server - Service Discovery
  # ------------------------------------------------------------------------
  eureka-server:
    image: springcloud/eureka:latest
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      SPRING_APPLICATION_NAME: eureka-server
      SPRING_CLOUD_CONFIG_ENABLED: "false"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      EUREKA_SERVER_ENABLE_SELF_PRESERVATION: "false"
      EUREKA_INSTANCE_HOSTNAME: eureka-server
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JAVA_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ecommerce-network
    restart: unless-stopped

  # ==========================================================================
  # CORE E-COMMERCE SERVICES
  # ==========================================================================

  # ------------------------------------------------------------------------
  # Cart Service
  # ------------------------------------------------------------------------
  cart-service:
    build:
      context: ./Cart/cart-service
      dockerfile: Dockerfile
    container_name: cart-service
    ports:
      - "8306:8306"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: cart-service
      SERVER_PORT: 8306
      MONGODB_URI: mongodb://admin:admin123@mongodb-primary:27017,cart-db?authSource=admin&replicaSet=rs0
      KAFKA_BROKERS: kafka:9092
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      MANAGEMENT_HEALTH_MONGODB_ENABLED: "true"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
    depends_on:
      mongodb-primary:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8306/actuator/health"]
