apiVersion: v1
kind: Service
metadata:
  name: picking-service
  namespace: warehousing-core
  labels:
    app: picking-service
    service: picking-service
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
  - name: http
    port: 8203
    targetPort: http
    protocol: TCP
  - name: management
    port: 8204
    targetPort: management
    protocol: TCP
  selector:
    app: picking-service
---
apiVersion: v1
kind: Service
metadata:
  name: picking-service-headless
  namespace: warehousing-core
  labels:
    app: picking-service
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8203
    targetPort: http
    protocol: TCP
  selector:
    app: picking-service
