---
apiVersion: v1
kind: ConfigMap
metadata:
  name: file-storage-service-config
  namespace: infrastructure
  labels:
    app: file-storage-service
    version: v1
data:
  application.yml: |
    server:
      port: 8080
    spring:
      application:
        name: file-storage-service
      cloud:
        discovery:
          enabled: true
          service-url:
            defaultZone: http://discovery-service:8761/eureka/
        config:
          enabled: true
          uri: http://config-server:8888
      servlet:
        multipart:
          max-file-size: 50MB
          max-request-size: 50MB
      data:
        mongodb:
          uri: mongodb://storage-user:${MONGODB_PASSWORD}@mongodb.infrastructure.svc.cluster.local:27017/file-storage?authSource=admin
          auto-index-creation: true
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
      endpoint:
        health:
          show-details: always
      metrics:
        export:
          prometheus:
            enabled: true
    storage:
      type: s3
      bucket-name: ${S3_BUCKET:gogidix-files}
      region: ${S3_REGION:us-east-1}
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
      endpoint-url: ${S3_ENDPOINT:https://s3.amazonaws.com}
      path-style-access: true
      max-file-size: 52428800
---
apiVersion: v1
kind: Secret
metadata:
  name: file-storage-service-secrets
  namespace: infrastructure
  labels:
    app: file-storage-service
type: Opaque
stringData:
  mongodb-password: "ChangeThisInProduction123!"
  aws-access-key: "AKIAIOSFODNN7EXAMPLE"
  aws-secret-key: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
  s3-bucket: "gogidix-files"
  s3-region: "us-east-1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-storage-service
  namespace: infrastructure
  labels:
    app: file-storage-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: file-storage-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: file-storage-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: file-storage-service
      containers:
        - name: file-storage-service
          image: gogidix/file-storage-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: file-storage-service-secrets
                  key: mongodb-password
            - name: AWS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: file-storage-service-secrets
                  key: aws-access-key
            - name: AWS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: file-storage-service-secrets
                  key: aws-secret-key
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: file-storage-service-secrets
                  key: s3-bucket
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: file-storage-service-secrets
                  key: s3-region
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              value: "http://discovery-service:8761/eureka/"
            - name: SPRING_CLOUD_CONFIG_URI
              value: "http://config-server:8888"
          envFrom:
            - configMapRef:
                name: file-storage-service-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1.5Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - file-storage-service
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: file-storage-service
  namespace: infrastructure
  labels:
    app: file-storage-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: file-storage-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: file-storage-service
  namespace: infrastructure
  labels:
    app: file-storage-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: file-storage-service-hpa
  namespace: infrastructure
  labels:
    app: file-storage-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: file-storage-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: file-storage-service-pdb
  namespace: infrastructure
  labels:
    app: file-storage-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: file-storage-service
