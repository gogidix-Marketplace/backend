apiVersion: v1
kind: Service
metadata:
  name: batch-service
  namespace: warehousing-core
  labels:
    app: batch-service
    service: batch-service
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
  - name: http
    port: 8216
    targetPort: http
    protocol: TCP
  - name: management
    port: 8217
    targetPort: management
    protocol: TCP
  selector:
    app: batch-service
---
apiVersion: v1
kind: Service
metadata:
  name: batch-service-headless
  namespace: warehousing-core
  labels:
    app: batch-service
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8216
    targetPort: http
    protocol: TCP
  selector:
    app: batch-service
