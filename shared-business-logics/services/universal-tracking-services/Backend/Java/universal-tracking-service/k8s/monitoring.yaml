apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: universal-tracking-service
  namespace: universal-tracking-services
  labels:
    app: universal-tracking-service
    team: team-c-universal-tracking
spec:
  selector:
    matchLabels:
      app: universal-tracking-service
  endpoints:
  - port: http
    path: /actuator/prometheus
    interval: 30s
    scrapeTimeout: 10s
    scheme: http
