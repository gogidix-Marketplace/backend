---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-server-config
  namespace: centralized-config
  labels:
    app: config-server
    version: v1
data:
  application.yml: |
    server:
      port: 8210
    spring:
      application:
        name: config-server
      cloud:
        config:
          server:
            git:
              uri: ${GIT_URI:https://github.com/gogidix/config-repo.git}
              username: ${GIT_USERNAME}
              password: ${GIT_PASSWORD}
              default-label: main
              search-paths:
                - application
                - centralized-config
        discovery:
          enabled: true
          service-url:
            defaultZone: http://discovery-service.infrastructure.svc.cluster.local:8761/eureka/
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus,configprops,env
      endpoint:
        health:
          show-details: always
      metrics:
        export:
          prometheus:
            enabled: true
---
apiVersion: v1
kind: Secret
metadata:
  name: config-server-secrets
  namespace: centralized-config
  labels:
    app: config-server
type: Opaque
stringData:
  git-username: "your-git-username"
  git-password: "your-git-token"
  jwt-secret: "ChangeThisJwtSecretInProduction"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: centralized-config
  labels:
    app: config-server
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: config-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: config-server
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8210"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: config-server
      containers:
        - name: config-server
          image: gogidix/config-server:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8210
              protocol: TCP
            - name: management
              containerPort: 8210
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: GIT_URI
              value: "https://github.com/gogidix/config-repo.git"
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: config-server-secrets
                  key: git-username
            - name: GIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: config-server-secrets
                  key: git-password
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              value: "http://discovery-service.infrastructure.svc.cluster.local:8761/eureka/"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,info,metrics,prometheus,configprops,env"
          envFrom:
            - configMapRef:
                name: config-server-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8210
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8210
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: git-repo-cache
              mountPath: /tmp/config-repo
      volumes:
        - name: git-repo-cache
          emptyDir:
            sizeLimit: 100Mi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - config-server
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: centralized-config
  labels:
    app: config-server
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8210
      targetPort: 8210
      protocol: TCP
  selector:
    app: config-server
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: config-server
  namespace: centralized-config
  labels:
    app: config-server
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: config-server-hpa
  namespace: centralized-config
  labels:
    app: config-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: config-server
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: config-server-pdb
  namespace: centralized-config
  labels:
    app: config-server
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: config-server
