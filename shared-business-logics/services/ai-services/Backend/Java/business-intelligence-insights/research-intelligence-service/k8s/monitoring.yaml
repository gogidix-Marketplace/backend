apiVersion: v1
kind: Service
metadata:
  name: research-intelligence-service-metrics
  namespace: ai-services
  labels:
    app: research-intelligence-service
    team: team-ai-business-intelligence
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"
spec:
  type: ClusterIP
  ports:
  - name: metrics
    port: 8080
    targetPort: management
    protocol: TCP
  selector:
    app: research-intelligence-service
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: research-intelligence-service
  namespace: ai-services
  labels:
    app: research-intelligence-service
    team: team-ai-business-intelligence
    release: prometheus-operator
spec:
  selector:
    matchLabels:
      app: research-intelligence-service
  endpoints:
  - port: metrics
    path: /actuator/prometheus
    interval: 30s
    scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
    - ai-services
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: research-intelligence-service-alerts
  namespace: ai-services
  labels:
    app: research-intelligence-service
    team: team-ai-business-intelligence
data:
  alerts.yml: |
    groups:
    - name: research-intelligence-service
      rules:
      - alert: ResearchIntelligenceServiceDown
        expr: up{job="research-intelligence-service"} == 0
        for: 5m
        labels:
          severity: critical
          team: team-ai-business-intelligence
        annotations:
          summary: "Research Intelligence Service is down"
          description: "Research Intelligence Service has been down for more than 5 minutes"
      - alert: ResearchIntelligenceServiceHighErrorRate
        expr: rate(http_requests_total{job="research-intelligence-service",status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          team: team-ai-business-intelligence
        annotations:
          summary: "High error rate on Research Intelligence Service"
          description: "Error rate is {{ $value }} errors per second"
      - alert: ResearchIntelligenceServiceHighMemory
        expr: jvm_memory_used_bytes{job="research-intelligence-service",area="heap"} / jvm_memory_max_bytes{job="research-intelligence-service",area="heap"} > 0.9
        for: 10m
        labels:
          severity: warning
          team: team-ai-business-intelligence
        annotations:
          summary: "High memory usage on Research Intelligence Service"
          description: "Heap memory usage is above 90%"
