apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api-gateway.fullname" . }}-config
  namespace: {{ include "api-gateway.namespace" . }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
data:
  application.yml: |
    spring:
      application:
        name: {{ include "api-gateway.name" . }}
      cloud:
        gateway:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins: {{ .Values.gateway.cors.allowedOrigins | quote }}
                allowedMethods:
                {{- toYaml .Values.gateway.cors.allowedMethods | nindent 16 }}
                allowedHeaders: {{ .Values.gateway.cors.allowedHeaders | quote }}
                allowCredentials: {{ .Values.gateway.cors.allowCredentials }}
                maxAge: {{ .Values.gateway.cors.maxAge }}
          discovery:
            locator:
              enabled: {{ .Values.gateway.discovery.enabled }}
              lower-case-service-id: {{ .Values.gateway.discovery.lowerCaseServiceId }}
      config:
        import: optional:configserver:http://config-server.{{ include "api-gateway.namespace" . }}.svc.cluster.local:8888

    server:
      port: {{ .Values.service.port }}
      shutdown: graceful

    eureka:
      client:
        service-url:
          defaultZone: {{ .Values.eureka.client.serviceUrl | quote }}
        enabled: {{ .Values.eureka.client.registerWithEureka }}
        fetch-registry: {{ .Values.eureka.client.fetchRegistry }}
        registry-fetch-interval-seconds: {{ .Values.eureka.client.registryFetchIntervalSeconds }}
      instance:
        prefer-ip-address: {{ .Values.eureka.instance.preferIpAddress }}
        lease-renewal-interval-in-seconds: {{ .Values.eureka.instance.leaseRenewalIntervalInSeconds }}
        lease-expiration-duration-in-seconds: {{ .Values.eureka.instance.leaseExpirationDurationInSeconds }}

    management:
      endpoints:
        web:
          exposure:
            include: health,info,gateway,metrics,prometheus
      endpoint:
        health:
          probes:
            enabled: true
          show-details: always
      metrics:
        export:
          prometheus:
            enabled: true

    logging:
      level:
        org.springframework.cloud.gateway: INFO
        org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping: DEBUG
        com.gogidix: INFO
        reactor.netty: INFO

    resilience4j:
    {{- if .Values.resilience4j.circuitbreaker.enabled }}
      circuitbreaker:
        configs:
          default:
            sliding-window-size: {{ .Values.resilience4j.circuitbreaker.slidingWindowSize }}
            wait-duration-in-open-state: {{ .Values.resilience4j.circuitbreaker.waitDurationInOpenState }}
            failure-rate-threshold: {{ .Values.resilience4j.circuitbreaker.failureRateThreshold }}
    {{- end }}
    {{- if .Values.resilience4j.retry.enabled }}
      retry:
        configs:
          default:
            max-attempts: {{ .Values.resilience4j.retry.maxAttempts }}
            wait-duration: {{ .Values.resilience4j.retry.waitDuration }}
    {{- end }}
