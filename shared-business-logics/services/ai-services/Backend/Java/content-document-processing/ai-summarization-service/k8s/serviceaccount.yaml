apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-summarization-service
  namespace: ai-services
  labels:
    app: ai-summarization-service
    team: team-ai-content-processing
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::CHANGE_ME:role/ai-summarization-service-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-summarization-service-role
  namespace: ai-services
  labels:
    app: ai-summarization-service
    team: team-ai-content-processing
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-summarization-service-rolebinding
  namespace: ai-services
  labels:
    app: ai-summarization-service
    team: team-ai-content-processing
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-summarization-service-role
subjects:
- kind: ServiceAccount
  name: ai-summarization-service
  namespace: ai-services
