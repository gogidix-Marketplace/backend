apiVersion: v1
kind: Service
metadata:
  name: reorder-service
  namespace: warehousing-core
  labels:
    app: reorder-service
    service: reorder-service
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
  - name: http
    port: 8218
    targetPort: http
    protocol: TCP
  - name: management
    port: 8219
    targetPort: management
    protocol: TCP
  selector:
    app: reorder-service
---
apiVersion: v1
kind: Service
metadata:
  name: reorder-service-headless
  namespace: warehousing-core
  labels:
    app: reorder-service
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8218
    targetPort: http
    protocol: TCP
  selector:
    app: reorder-service
