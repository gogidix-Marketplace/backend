---
apiVersion: v1
kind: Namespace
metadata:
  name: infra-config
  labels:
    name: infra-config
    domain: foundation-domain
    environment: production
spec:
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: infra-config-network-policy
  namespace: infra-config
spec:
  podSelector:
    matchLabels:
      namespace: infra-config
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              namespace: infra-config
    - from:
        - namespaceSelector:
            matchLabels:
              namespace: infrastructure
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              namespace: infra-config
    - to:
        - namespaceSelector:
            matchLabels:
              namespace: infrastructure
    - to:
        - namespaceSelector:
            matchLabels:
              domain: kube-system
          ports:
            - protocol: TCP
              port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/cluster: ""
        ports:
            - protocol: TCP
              port: 443
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: infra-config-resource-quota
  namespace: infra-config
spec:
  hard:
    requests.cpu: "1"
    requests.memory: "2Gi"
    limits.cpu: "2"
    limits.memory: "4Gi"
    persistentvolumeclaims: "20Gi"
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: infra-config-container-limits
  namespace: infra-config
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "250m"
        memory: "512Mi"
      defaultLimit:
        cpu: "1000m"
        memory: "1Gi"
      maxLimit:
        cpu: "2000m"
        memory: "2Gi"
---
apiVersion: v1
kind: PriorityClass
metadata:
  name: config-priority-class
  namespace: infra-config
spec:
  value: 500
  globalDefault: true
  description: "Standard priority for infrastructure config services"
