spring:
  application:
    name: executive-dashboard-service
  profiles:
    active: dev

  # MongoDB Configuration
  data:
    mongodb:
      uri: mongodb://localhost:27017
      database: executive_dashboard
      auto-index-creation: true

  # Redis Configuration
  redis:
    host: localhost
    port: 6379
    password:
    timeout: 60000
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms

  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: executive-dashboard-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    topics:
      dashboard-updates: executive.dashboard.updates
      kpi-updates: executive.kpi.updates
      alert-notifications: executive.alert.notifications

  # Security Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/auth/realms/gogidix

# Server Configuration
server:
  port: 8083
  servlet:
    context-path: /api/v1
  error:
    include-message: always
    include-binding-errors: always

# Application Configuration
executive:
  dashboard:
    cache:
      ttl: 300
      max-size: 1000
    analytics:
      batch-size: 100
      max-threads: 4
    kpi:
      refresh-interval: 60000
      alert-threshold: 0.8
    aggregation:
      time-windows: 15m,1h,1d,1w,1M
    tenant:
      isolation: schema
      default-tenant: default

# Management & Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# Logging Configuration
logging:
  level:
    root: INFO
    com.gogidix: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.springframework.kafka: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    display-operation-id: true
  packages-to-scan: com.gogidix.management.executive
  paths-to-match: /**

# Resilience4J Configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 30s
        failure-rate-threshold: 50
        event-consumer-buffer-size: 10
    instances:
      externalApi:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - java.lang.IllegalArgumentException
    instances:
      externalApi:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
    instances:
      externalApi:
        base-config: default
