name: Code Quality

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [config-server, feature-flag-service, environment-service, notification-service, config-audit-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Checkstyle
        run: cd ${{ matrix.service }} && mvn checkstyle:check -B

      - name: Run SpotBugs
        run: cd ${{ matrix.service }} && mvn spotbugs:check -B

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@df822f582edf545851a0be862faf7e6f9b4de3be
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=gogidix_${{ matrix.service }}
            -Dsonar.sources=${{ matrix.service }}/src
            -Dsonar.java.binaries=${{ matrix.service }}/target/classes

      - name: Verify Hexagonal Architecture
        run: |
          cd ${{ matrix.service }}
          mvn test -Dtest=*ArchTest* -B || true
