# Test profile for api-gateway-service

# Allow bean definition overriding for test context
spring.main.allow-bean-definition-overriding=true

# Disable unnecessary auto-configurations for tests
spring.autoconfigure.exclude=\
  org.springframework.cloud.gateway.discovery.reactive.DiscoveryClientServiceDiscoveryClientAutoConfiguration

# Logging
logging.level.com.gogidix=DEBUG
logging.level.org.springframework=WARN
