server:
  port: 8102
  shutdown: graceful
spring:
  application:
    name: country-support-dashboard-service
  data:
    mongodb:
      host: localhost
      port: 27017
      database: country_support_dashboard_db
      auto-index-creation: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.gogidix.customersupport: DEBUG
