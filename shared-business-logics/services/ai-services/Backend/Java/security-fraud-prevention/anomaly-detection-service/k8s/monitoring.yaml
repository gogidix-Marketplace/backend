apiVersion: v1
kind: Service
metadata:
  name: anomaly-detection-service-metrics
  namespace: ai-services
  labels:
    app: anomaly-detection-service
    app.kubernetes.io/name: anomaly-detection-service
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: ai-services
    team: team-ai-security
    domain: security-fraud-prevention
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8086"
    prometheus.io/path: "/actuator/prometheus"
    prometheus.io/scheme: "http"
spec:
  type: ClusterIP
  ports:
  - name: metrics
    port: 8086
    targetPort: 8086
    protocol: TCP
  selector:
    app: anomaly-detection-service
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: anomaly-detection-service
  namespace: ai-services
  labels:
    app: anomaly-detection-service
    app.kubernetes.io/name: anomaly-detection-service
    app.kubernetes.io/component: servicemonitor
    app.kubernetes.io/part-of: ai-services
    team: team-ai-security
    domain: security-fraud-prevention
    release: prometheus
  annotations:
    description: "Prometheus ServiceMonitor for Anomaly Detection Service metrics"
spec:
  selector:
    matchLabels:
      app: anomaly-detection-service
      app.kubernetes.io/name: anomaly-detection-service
  endpoints:
  - port: metrics
    path: /actuator/prometheus
    scheme: http
    interval: 30s
    scrapeTimeout: 10s
    relabelings:
    - sourceLabels: [__meta_kubernetes_pod_name]
      targetLabel: pod
      action: replace
    - sourceLabels: [__meta_kubernetes_pod_node_name]
      targetLabel: node
      action: replace
    - sourceLabels: [__meta_kubernetes_namespace]
      targetLabel: namespace
      action: replace
    metricRelabelings:
    - sourceLabels: [__name__]
      regex: 'jvm_.*|http_.*|process_.*|system_.*|spring_.*|application_.*|anomaly_.*'
      action: keep
  namespaceSelector:
    matchNames:
    - ai-services
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: anomaly-detection-service
  namespace: ai-services
  labels:
    app: anomaly-detection-service
    app.kubernetes.io/component: podmonitor
    team: team-ai-security
    release: prometheus
spec:
  selector:
    matchLabels:
      app: anomaly-detection-service
  podMetricsEndpoints:
  - port: http
    path: /actuator/prometheus
    interval: 30s
    scrapeTimeout: 10s
    relabelings:
    - sourceLabels: [__meta_kubernetes_pod_name]
      targetLabel: pod
    - sourceLabels: [__meta_kubernetes_pod_node_name]
      targetLabel: node
  namespaceSelector:
    matchNames:
    - ai-services
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: anomaly-detection-service
  namespace: ai-services
  labels:
    app: anomaly-detection-service
    app.kubernetes.io/component: prometheus-rule
    team: team-ai-security
    release: prometheus
    role: alert-rules
spec:
  groups:
  - name: anomaly-detection-service
    interval: 30s
    rules:
    - alert: AnomalyDetectionServiceHighErrorRate
      expr: rate(http_server_requests_seconds_count{job="anomaly-detection-service",status=~"5.."}[5m]) > 10
      for: 5m
      labels:
        severity: warning
        team: team-ai-security
      annotations:
        summary: "High error rate for Anomaly Detection Service"
        description: "Error rate is {{ $value }} errors/sec for the last 5 minutes"
    - alert: AnomalyDetectionServiceHighLatency
      expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket{job="anomaly-detection-service"}[5m])) > 1
      for: 10m
      labels:
        severity: warning
        team: team-ai-security
      annotations:
        summary: "High latency for Anomaly Detection Service"
        description: "P95 latency is {{ $value }} seconds"
    - alert: AnomalyDetectionServicePodDown
      expr: up{job="anomaly-detection-service"} == 0
      for: 5m
      labels:
        severity: critical
        team: team-ai-security
      annotations:
        summary: "Anomaly Detection Service pod is down"
        description: "Pod {{ $labels.instance }} has been down for more than 5 minutes"
    - alert: AnomalyDetectionServiceHighMemoryUsage
      expr: jvm_memory_used_bytes{job="anomaly-detection-service",area="heap"} / jvm_memory_max_bytes{job="anomaly-detection-service",area="heap"} > 0.9
      for: 10m
      labels:
        severity: warning
        team: team-ai-security
      annotations:
        summary: "High memory usage for Anomaly Detection Service"
        description: "Heap memory usage is {{ $value | humanizePercentage }}"
    - alert: AnomalyDetectionServiceHighCPUUsage
      expr: rate(process_cpu_seconds_total{job="anomaly-detection-service"}[5m]) > 0.8
      for: 15m
      labels:
        severity: warning
        team: team-ai-security
      annotations:
        summary: "High CPU usage for Anomaly Detection Service"
        description: "CPU usage is {{ $value | humanizePercentage }}"
    - alert: AnomalyDetectionHighAnomaliesDetected
      expr: rate(anomaly_detection_events_total{job="anomaly-detection-service",severity="critical"}[5m]) > 10
      for: 5m
      labels:
        severity: critical
        team: team-ai-security
      annotations:
        summary: "High rate of critical anomalies detected"
        description: "{{ $value }} critical anomalies detected per second"
