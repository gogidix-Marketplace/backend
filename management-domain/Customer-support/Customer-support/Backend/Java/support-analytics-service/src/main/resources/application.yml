server:
  port: 8101
  shutdown: graceful
spring:
  application:
    name: support-analytics-service
  data:
    mongodb:
      host: localhost
      port: 27017
      database: support_analytics_db
      auto-index-creation: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.gogidix.customersupport: DEBUG

app:
  analytics:
    retention-days: 365
    batch-size: 1000
