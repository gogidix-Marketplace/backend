apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-product-recommendationation-service
  namespace: ai-services
  labels:
    app: ai-product-recommendationation-service
    version: v1
    team: team-ai-business-intelligence
    domain: ai-services
    component: business-intelligence-insights
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/ai-product-recommendationation-service-role
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-product-recommendationation-service
  namespace: ai-services
  labels:
    app: ai-product-recommendationation-service
    version: v1
    team: team-ai-business-intelligence
    domain: ai-services
    component: business-intelligence-insights
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-product-recommendationation-service
  namespace: ai-services
  labels:
    app: ai-product-recommendationation-service
    version: v1
    team: team-ai-business-intelligence
    domain: ai-services
    component: business-intelligence-insights
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-product-recommendationation-service
subjects:
- kind: ServiceAccount
  name: ai-product-recommendationation-service
  namespace: ai-services
