name: Security Scan - Platform Services

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  MAVEN_VERSION: '3.9.12'

jobs:
  dependency-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: Set up Maven
      uses: stCarolas/setup-maven@1de1a71b382c93941688b189d9a18c7049058f84
      with:
        maven-version: ${{ env.MAVEN_VERSION }}

    - name: Run OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@e325ac157b4bddfa7e19f9f0f79b51292c6d0c2e
      with:
        project: 'Backend/Java'
        path: 'Backend/Java'
        format: 'HTML'
        out: 'dependency-check-report'

    - name: Upload Dependency Check Report
      uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
      with:
        name: dependency-check-report
        path: dependency-check-report
        retention-days: 7

  sast-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

    - name: Run CodeQL Analysis
      uses: github/codeql-action/analyze@f0f3afee8094fcb0250c4f5a0a2655ffb9b4c8ef
      with:
        languages: java
        queries: security-extended,security-and-quality

    - name: Run Semgrep SAST scan
      uses: returntocorp/semgrep-action@1f8330b95eb4e366c9e3a36b5ac3fe3f3b4ffa7e
      with:
        config: auto

  container-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@2b512430cf1c7c4fe9b7815b4c7d761f6e893f6b

    - name: Build Docker images for scanning
      run: |
        docker build -t platform-service:scan Backend/Java/platform-service
        docker build -t subscription-service:scan Backend/Java/subscription-service
        docker build -t tenant-registry-service:scan Backend/Java/tenant-registry-service
        docker build -t usage-metering-service:scan Backend/Java/usage-metering-service

    - name: Run Trivy vulnerability scanner - platform-service
      uses: aquasecurity/trivy-action@6896a38fa877f2db34aa4fff10fa544dbbf9357c
      with:
        image-ref: 'platform-service:scan'
        format: 'sarif'
        output: 'trivy-results-platform.sarif'

    - name: Run Trivy vulnerability scanner - subscription-service
      uses: aquasecurity/trivy-action@6896a38fa877f2db34aa4fff10fa544dbbf9357c
      with:
        image-ref: 'subscription-service:scan'
        format: 'sarif'
        output: 'trivy-results-subscription.sarif'

    - name: Run Trivy vulnerability scanner - tenant-registry-service
      uses: aquasecurity/trivy-action@6896a38fa877f2db34aa4fff10fa544dbbf9357c
      with:
        image-ref: 'tenant-registry-service:scan'
        format: 'sarif'
        output: 'trivy-results-tenant-registry.sarif'

    - name: Run Trivy vulnerability scanner - usage-metering-service
      uses: aquasecurity/trivy-action@6896a38fa877f2db34aa4fff10fa544dbbf9357c
      with:
        image-ref: 'usage-metering-service:scan'
        format: 'sarif'
        output: 'trivy-results-usage-metering.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@435327b1c2fef2aa9df534fdf274590a098c19f4
      with:
        sarif_file: 'trivy-results-platform.sarif'
        category: 'trivy-platform'

    - name: Upload Trivy scan results
      uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
      with:
        name: trivy-scan-results
        path: |
          trivy-results-*.sarif
        retention-days: 7

  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

    - name: TruffleHog Secret Scanning
      uses: trufflesecurity/trufflehog@a46de8f9e1c421b15cmaf618ca931f3f7225b4fa1f
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD

    - name: Gitleaks scan
      uses: gitleaks/gitleaks-action@v8.2.3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
