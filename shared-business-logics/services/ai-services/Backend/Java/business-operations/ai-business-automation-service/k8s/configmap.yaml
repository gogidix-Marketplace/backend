apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-business-automation-service
  namespace: ai-services
  labels:
    app: ai-business-automation-service
    version: v1
    team: team-ai-business-ops
    component: business-operations
    environment: production
data:
  application.yml: |
    spring:
      application:
        name: ai-business-automation-service
      data:
        mongodb:
          uri: ${SPRING_DATA_MONGODB_URI}
          auto-index-creation: true
      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
        consumer:
          group-id: ${spring.application.name}
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.springframework.kafka.common.serialization.JsonSerializer
      main:
        allow-bean-definition-overriding: true

    server:
      port: ${SERVER_PORT:8080}

    eureka:
      client:
        service-url:
          defaultZone: ${EUREKA_URL}
        enabled: true

    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
      endpoint:
        health:
          show-details: always
      metrics:
        export:
          prometheus:
            enabled: true

    logging:
      level:
        com.gogidix: ${LOG_LEVEL:INFO}
        org.springframework.data.mongodb: ${MONGO_LOG_LEVEL:WARN}
      pattern:
        console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

    # Business Automation Service specific configuration
    business:
      automation:
        max-workflow-steps: 50
        workflow-timeout-minutes: 60
        parallel-executions: 10
        retry-attempts: 3
        retry-delay-seconds: 30
