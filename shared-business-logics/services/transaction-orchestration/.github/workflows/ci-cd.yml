name: Transaction Orchestration Services CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: transaction-orchestration

jobs:
  build-and-test-backend:
    name: Build and Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build with Maven
        working-directory: ./Backend/Java
        run: mvn clean install -DskipTests=false -B

      - name: Generate test coverage report
        working-directory: ./Backend/Java
        run: mvn jacoco:report

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-reports
          path: Backend/Java/**/target/site/jacoco/
          retention-days: 7

      - name: Build all services
        working-directory: ./Backend/Java
        run: mvn clean package -DskipTests

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar-files
          path: Backend/Java/**/target/*.jar
          retention-days: 7

  build-and-test-frontend:
    name: Build and Test Frontend Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Frontends/Web/package-lock.json

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: Frontends/Web/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install dependencies
        working-directory: ./Frontends/Web
        run: npm ci

      - name: Run linting
        working-directory: ./Frontends/Web
        run: npm run lint
        continue-on-error: true

      - name: Run type checking
        working-directory: ./Frontends/Web
        run: npm run build -- --mode development
        continue-on-error: true

      - name: Build frontend
        working-directory: ./Frontends/Web
        run: npm run build

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontends/Web/dist/
          retention-days: 7

      - name: Run frontend tests
        working-directory: ./Frontends/Web
        run: |
          if grep -q '"test"' package.json; then
            npm test
          else
            echo "No test script found, skipping tests"
          fi
        continue-on-error: true

  docker-build-backend:
    name: Build Backend Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test-backend
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - audit-trail-service
          - onboarding-tracker-service
          - progress-step-service
          - status-broadcast-service
          - transaction-monitoring-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend/Java/${{ matrix.service }}
          file: ./Backend/Java/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.meta.outputs.digest }}"

  docker-build-frontend:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test-frontend
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_PREFIX }}-dashboard
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Frontends/Web
          file: ./Frontends/Web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image digest
        run: echo "Frontend dashboard image pushed with digest ${{ steps.meta.outputs.digest }}"

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: [docker-build-backend, docker-build-frontend]
    permissions:
      contents: read
      security-events: write

    strategy:
      matrix:
        service:
          - audit-trail-service
          - onboarding-tracker-service
          - progress-step-service
          - status-broadcast-service
          - transaction-monitoring-service
          - dashboard

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        if: success()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  deploy:
    name: Deploy to Environment
    runs-on: ubuntu-latest
    needs: [docker-build-backend, docker-build-frontend, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure Kubernetes context
        run: |
          echo "Configuring Kubernetes context for ${{ github.event.inputs.environment || 'dev' }} environment"
          # Add your Kubernetes configuration here
          # kubectl config use-context ${{ secrets.KUBE_CONTEXT }}

      - name: Deploy backend services to Kubernetes
        run: |
          echo "Deploying transaction orchestration services to ${{ github.event.inputs.environment || 'dev' }} environment"
          # kubectl apply -f k8s/${{ github.event.inputs.environment || 'dev' }}/

      - name: Deploy frontend dashboard to Kubernetes
        run: |
          echo "Deploying transaction dashboard to ${{ github.event.inputs.environment || 'dev' }} environment"
          # kubectl apply -f k8s/${{ github.event.inputs.environment || 'dev' }}/dashboard/

      - name: Verify deployment
        run: |
          echo "Verifying deployment"
          # kubectl rollout status deployment/transaction-orchestration

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "Deployment successful"
          else
            echo "Deployment failed"
          fi

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      kafka:
        image: confluentinc/cp-kafka:latest
        env:
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        ports:
          - 9092:9092

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Run backend integration tests
        working-directory: ./Backend/Java
        run: mvn verify -DskipUnitTests=true
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/test_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379

      - name: Setup Node.js for frontend tests
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run frontend E2E tests
        working-directory: ./Frontends/Web
        run: |
          if grep -q '"test:e2e"' package.json; then
            npm run test:e2e
          else
            echo "No E2E test script found, skipping"
          fi
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            Backend/Java/**/target/surefire-reports/
            Frontends/Web/test-results/
          retention-days: 7

  performance-test:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run performance tests
        run: |
          echo "Running performance tests..."
          # Add your performance testing commands here (e.g., k6, JMeter)

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-results
          path: performance-results/
          retention-days: 7

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [build-and-test-backend, build-and-test-frontend, docker-build-backend, docker-build-frontend, security-scan, deploy, integration-test, performance-test]
    if: always()

    steps:
      - name: Clean up old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            console.log('Cleaning up old artifacts')
