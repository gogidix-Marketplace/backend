apiVersion: apps/v1
kind: Deployment
metadata:
  name: multimodal-processing-service
  namespace: ai-services
  labels:
    app: multimodal-processing-service
    version: v1
    team: team-ai-content-processing
    domain: ai-services
    component: content-document-processing
spec:
  replicas: 3
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: multimodal-processing-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: multimodal-processing-service
        version: v1
        team: team-ai-content-processing
        domain: ai-services
        component: content-document-processing
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: multimodal-processing-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
      - name: wait-for-mongodb
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z mongodb.ai-services.svc.cluster.local 27017; do echo waiting for mongodb; sleep 2; done']
      - name: wait-for-kafka
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z kafka.ai-services.svc.cluster.local 9092; do echo waiting for kafka; sleep 2; done']
      containers:
      - name: multimodal-processing-service
        image: gogidix/multimodal-processing-service:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: management
          containerPort: 8080
          protocol: TCP
        env:
        - name: SERVICE_NAME
          value: "multimodal-processing-service"
        - name: SERVICE_DATABASE
          value: "multimodal_processing_db"
        - name: SERVER_PORT
          value: "8080"
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: SPRING_DATA_MONGODB_URI
          value: "mongodb://mongodb.ai-services.svc.cluster.local:27017/multimodal_processing_db"
        - name: SPRING_DATA_MONGODB_AUTO_INDEX_CREATION
          value: "true"
        - name: SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING
          value: "true"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka.ai-services.svc.cluster.local:9092"
        - name: EUREKA_URL
          value: "http://eureka-server.discovery.svc.cluster.local:8761/eureka/"
        - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
          value: "health,info,metrics,prometheus"
        - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
          value: "always"
        - name: MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED
          value: "true"
        - name: LOG_LEVEL
          value: "INFO"
        - name: MONGO_LOG_LEVEL
          value: "WARN"
        - name: JAVA_OPTS
          value: "-Xms768m -Xmx1536m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
        envFrom:
        - configMapRef:
            name: multimodal-processing-service
        - secretRef:
            name: multimodal-processing-service
        resources:
          requests:
            memory: "768Mi"
            cpu: "250m"
          limits:
            memory: "1536Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /actuator/health/startup
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /app/logs
        - name: media-cache
          mountPath: /app/media
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
      - name: media-cache
        emptyDir:
          sizeLimit: 5Gi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - multimodal-processing-service
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                - "Standard_D4s_v3"
                - "Standard_D8s_v3"
      tolerations:
      - key: "workload"
        operator: "Equal"
        value: "ai-services"
        effect: "NoSchedule"
      terminationGracePeriodSeconds: 60
