server:
  port: ${SERVICE_PORT:8116}
  servlet:
    context-path: /api/v1
  shutdown: graceful

spring:
  application:
    name: partner-portal-service
  data:
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT:27017}
      database: ${MONGODB_DB:partner_portal}
      username: ${MONGODB_USER:}
      password: ${MONGODB_PASSWORD:}
      authentication-database: ${MONGODB_AUTH_DB:admin}
      auto-index-creation: true
      gridfs:
        database: ${MONGODB_DB:partner_portal}

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    root: INFO
    com.gogidix.courier: ${LOG_LEVEL:DEBUG}

partner:
  verification:
    auto-approve: ${AUTO_APPROVE:false}
    document-types: ${DOCUMENT_TYPES:ID,TAX_CERTIFICATE,BANK_STATEMENT}
