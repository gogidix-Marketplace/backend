name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up JDK 17
        uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run unit tests
        run: cd lock-service && mvn test -B

      - name: Generate test report
        if: always()
        run: cd lock-service && mvn surefire-report:report

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: test-results
          path: lock-service/target/surefire-reports/
          retention-days: 7

  test-with-coverage:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up JDK 17
        uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests with coverage
        run: cd lock-service && mvn clean test jacoco:report -B

      - name: Check coverage threshold
        run: cd lock-service && mvn jacoco:check

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3@4fe8c5f003fa651c1f8cceabe96c08c3b616d63e
        with:
          files: lock-service/target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-umbrella

      - name: Upload coverage report
        uses: actions/upload-artifact@v3@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: coverage-report
          path: lock-service/target/site/jacoco/
          retention-days: 7

  integration-tests:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up JDK 17
        uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run integration tests
        run: cd lock-service && mvn verify -DskipUnitTests -B

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v3@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: integration-test-results
          path: lock-service/target/failsafe-reports/
          retention-days: 7

  architecture-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up JDK 17
        uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run architecture tests
        run: cd lock-service && mvn test -Dtest=ArchTest -B
