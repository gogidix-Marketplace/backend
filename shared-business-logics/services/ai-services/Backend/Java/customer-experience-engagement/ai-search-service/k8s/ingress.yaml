apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-search-service-ingress
  namespace: ai-services
  labels:
    app: ai-search-service
    team: team-ai-customer-experience
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
    nginx.ingress.kubernetes.io/compression-backend: "on"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ai-search.gogidix.com
    secretName: ai-search-service-tls
  rules:
  - host: ai-search.gogidix.com
    http:
      paths:
      - path: /api/search(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: ai-search-service
            port:
              number: 8084
