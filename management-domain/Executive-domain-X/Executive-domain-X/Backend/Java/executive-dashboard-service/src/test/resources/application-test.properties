# Test Configuration
spring.application.name=executive-dashboard-service-test

# MongoDB Test Configuration (using embedded)
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=executive_dashboard_test

# Redis Test Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=15

# Kafka Test Configuration (using embedded)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=executive-dashboard-test-group
spring.kafka.consumer.auto-offset-reset=earliest

# Security
jwt.secret=test-secret-key-for-testing-only-minimum-32-chars
jwt.expiration=3600000

# Logging
logging.level.com.gogidix=DEBUG
logging.level.org.springframework.data=DEBUG
