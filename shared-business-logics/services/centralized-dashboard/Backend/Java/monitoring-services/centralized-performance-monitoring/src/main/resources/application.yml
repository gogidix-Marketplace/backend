# =============================================================================
# Centralized Performance Monitoring Service Configuration
# =============================================================================

spring:
  application:
    name: centralized-performance-monitoring

  # MongoDB Configuration (Time-series metrics storage)
  data:
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT:27017}
      database: ${MONGODB_DB:performance_metrics}
      username: ${MONGODB_USER:}
      password: ${MONGODB_PASSWORD:}
      authentication-database: ${MONGODB_AUTH_DB:admin}
      auto-index-creation: true

  # Redis Configuration (Real-time metrics cache)
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializers.JsonSerializer
      acks: all
      retries: 3
      properties:
        delivery.timeout.ms: 30000
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializers.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.gogidix.monitoring.performance.infrastructure.messaging.event.MetricEvent

  # Actuator Configuration
  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics,prometheus
      base-path: /actuator
    endpoint:
      health:
        show-details: always
        show-components: always
    metrics:
      export:
        prometheus:
          enabled: true
      tags:
        application: ${spring.application.name}

# Server Configuration
server:
  port: ${SERVER_PORT:8910}
  servlet:
    context-path: /
  shutdown: graceful

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# Logging Configuration
logging:
  level:
    root: INFO
    com.gogidix.monitoring: ${LOG_LEVEL:DEBUG}
    org.springframework.data.mongodb: ${MONGO_LOG_LEVEL:INFO}
    org.springframework.data.redis: ${REDIS_LOG_LEVEL:INFO}
    org.springframework.kafka: ${KAFKA_LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} - %msg [tenantId=%X{tenantId}][userId=%X{userId}][traceId=%X{traceId},spanId=%X{spanId}]%n"

# Performance Monitoring Service Specific Configuration
performance:
  metrics:
    retention-days: ${METRICS_RETENTION_DAYS:90}
    aggregation-interval-seconds: ${AGGREGATION_INTERVAL:60}
    batch-size: ${METRICS_BATCH_SIZE:1000}
  alerting:
    enabled: ${ALERTING_ENABLED:true}
    check-interval-seconds: ${ALERT_CHECK_INTERVAL:300}
    notification-endpoints: ${NOTIFICATION_ENDPOINTS:}
  caching:
    ttl-seconds: ${METRICS_CACHE_TTL:300}
    max-entries: ${METRICS_CACHE_MAX_ENTRIES:100000}
