# =============================================================================
# Notification Service Configuration - Sales Department
# Multi-Tenant SaaS Hexagonal Architecture
# =============================================================================

server:
  port: ${SERVICE_PORT:8090}
  servlet:
    context-path: /api/v1
  shutdown: graceful

spring:
  application:
    name: notification-service

  # MongoDB Configuration
  data:
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT:27017}
      database: ${MONGODB_DB:notification-service_db}
      username: ${MONGODB_USER:}
      password: ${MONGODB_PASSWORD:}
      authentication-database: admin
      auto-index-creation: true

  # Redis Configuration
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializers.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializers.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
    topics:
      notification-events: notification-service.events
      domain-events: sales.domain-events

  # Email Configuration
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# OpenAPI / Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    try-it-out-enabled: true
    display-request-duration: true
  show-actuator: true
  packages-to-scan: com.gogidix.sales.notification.interfaces.rest

# Logging Configuration
logging:
  level:
    root: INFO
    com.gogidix.sales.notification: ${LOG_LEVEL:DEBUG}
    org.springframework.data.mongodb: INFO
    org.springframework.kafka: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg [tenantId=%X{tenantId:UNKNOWN}][traceId=%X{traceId:},spanId=%X{spanId:}]%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg [tenantId=%X{tenantId:UNKNOWN}][traceId=%X{traceId:},spanId=%X{spanId:}]%n"
  file:
    name: logs/notification-service.log
    max-size: 100MB
    max-history: 30

# Application Specific Configuration
notification-service:
  channels:
    email:
      enabled: true
      max-retries: 3
      retry-delay-seconds: 60
      batch-size: 100
    sms:
      enabled: true
      max-retries: 3
      retry-delay-seconds: 60
      batch-size: 100
      provider: ${SMS_PROVIDER:twilio}
    push:
      enabled: true
      max-retries: 3
      retry-delay-seconds: 30
      batch-size: 500
      firebase:
        credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    in-app:
      enabled: true
      retention-days: 90

  templates:
    default-locale: en
    supported-locales:
      - en
      - es
      - fr
      - de
      - it
      - pt
      - zh
      - ja
    cache-ttl-minutes: 30

  delivery:
    batch:
      enabled: true
      interval-seconds: 30
      max-batch-size: 1000
    scheduling:
      enabled: true
      pool-size: 5
    tracking:
      enabled: true
      retention-days: 365

  preferences:
    default-channels:
      - EMAIL
      - IN_APP
    channel-priority:
      - IN_APP
      - PUSH
      - EMAIL
      - SMS
