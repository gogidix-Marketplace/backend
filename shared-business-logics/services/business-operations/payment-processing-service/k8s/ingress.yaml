apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment-processing-service-ingress
  namespace: business-operations
  labels:
    app: payment-processing-service
    team: team-d-business-operations
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - payment-processing.gogidix.com
    secretName: payment-processing-service-tls
  rules:
  - host: payment-processing.gogidix.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: payment-processing-service
            port:
              number: 8097
