spring:
  application:
    name: email-sender-service
  data:
    mongodb:
      uri: mongodb://localhost:27017
      database: gogidix_email_sender
    redis:
      host: localhost
      port: 6379
      database: 4
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: email-sender-service
      auto-offset-reset: earliest

server:
  port: 8093

email:
  provider: ${EMAIL_PROVIDER:smtp}
  smtp:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    auth: true
    starttls.enable: true
    ssl.enable: false
    connection.timeout: 5000
    timeout: 5000
    writetimeout: 5000
  from: ${EMAIL_FROM:noreply@localhost}
  from.name: ${EMAIL_FROM_NAME:Gogidix Platform}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    app-name: email-sender-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.gogidix: DEBUG
    org.springframework.data.mongodb: INFO
