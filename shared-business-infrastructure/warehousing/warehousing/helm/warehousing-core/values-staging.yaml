# ==============================================================================
# Warehousing Core Helm Chart - Staging Environment Values
# ==============================================================================
# This file contains staging environment specific overrides.
# Usage: helm install warehousing-core ./warehousing-core -f values-staging.yaml

# ------------------------------------------------------------------------------
# Global Configuration Overrides
# ------------------------------------------------------------------------------
global:
  environment: staging
  labels:
    domain: warehousing
    platform: gogidix
    managed-by: helm
    environment: staging

# ------------------------------------------------------------------------------
# Namespace Configuration
# ------------------------------------------------------------------------------
namespace:
  create: true
  name: warehousing-staging

# ------------------------------------------------------------------------------
# MongoDB Configuration - Staging
# ------------------------------------------------------------------------------
mongodb:
  enabled: true
  architecture: replicaset
  replicaSet:
    name: rs0
    replicas:
      secondary: 1
      arbiter: 0
  auth:
    enabled: true
    rootUser: admin
    existingSecret: mongodb-credentials-staging
    database: warehousing_staging
  persistence:
    enabled: true
    storageClass: "standard"
    size: 50Gi
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi

# ------------------------------------------------------------------------------
# Kafka Configuration - Staging
# ------------------------------------------------------------------------------
kafka:
  enabled: true
  replicas: 2
  controller:
    replicaCount: 2
  broker:
    replicaCount: 2
    persistence:
      size: 50Gi
      storageClass: "standard"
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi

# ------------------------------------------------------------------------------
# Redis Configuration - Staging
# ------------------------------------------------------------------------------
redis:
  enabled: true
  architecture: replication
  replica:
    replicaCount: 2
  auth:
    enabled: true
    existingSecret: redis-credentials-staging
  master:
    persistence:
      enabled: true
      size: 10Gi
      storageClass: "standard"
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 125m
      memory: 256Mi

