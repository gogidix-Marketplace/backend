version: '3.8'

services:
  infrastructure-database:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infrastructure-database-service
    ports:
      - "8091:8091"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=infrastructure_database_dev
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SERVER_PORT=8091
    depends_on:
      - mongodb
      - redis
      - kafka
    networks:
      - gogidix-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: infrastructure-database-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=infrastructure_database_dev
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    networks:
      - gogidix-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: infrastructure-database-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - gogidix-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  zookeeper:
    image: bitnami/zookeeper:3.8
    container_name: infrastructure-database-zookeeper
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    networks:
      - gogidix-network
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:3.5
    container_name: infrastructure-database-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      - zookeeper
    networks:
      - gogidix-network
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  postgresql:
    image: postgres:16-alpine
    container_name: infrastructure-database-postgresql
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=gogidix_db
      - POSTGRES_USER=gogidix
      - POSTGRES_PASSWORD=gogidix123
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    networks:
      - gogidix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gogidix"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongodb-data:
    driver: local
  mongodb-config:
    driver: local
  redis-data:
    driver: local
  postgresql-data:
    driver: local

networks:
  gogidix-network:
    driver: bridge
