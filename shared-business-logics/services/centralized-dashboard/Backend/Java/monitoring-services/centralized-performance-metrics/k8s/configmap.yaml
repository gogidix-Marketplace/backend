apiVersion: v1
kind: ConfigMap
metadata:
  name: centralized-performance-metrics-config
  namespace: centralized-dashboard
  labels:
    app: centralized-performance-metrics
    team: team-f-centralized-dashboard
data:
  mongodb-database: "performance_metrics"
  redis-host: "redis.internal"
  redis-port: "6379"
  eureka-service-url: "http://eureka-server:8761/eureka"
  influxdb-org: "gogidix"
  influxdb-bucket: "performance_metrics"
  influxdb-retention-policy: "30d"
