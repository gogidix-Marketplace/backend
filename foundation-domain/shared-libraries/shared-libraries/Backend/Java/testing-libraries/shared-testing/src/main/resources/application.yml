server:
  port: 8304

spring:
  application:
    name: shared-testing-service
  
  profiles:
    active: development

  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-durations-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  # Test Database Configuration
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000

  # JPA Configuration for Testing
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # H2 Console for Testing
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  # Redis Configuration for Testing
  data:
    redis:
      host: localhost
  port: 8304  # Different port for testing
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  # Kafka Configuration for Testing
  kafka:
    bootstrap-servers: localhost:9093
    consumer:
      group-id: shared-testing-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# =============================================================================
# EUREKA CLIENT CONFIGURATION
# =============================================================================
eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: ${HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true
    metadata-map:
      version: '@project.version@'
      description: 'Shared Testing Library Service'
      domain: 'shared-libraries'
      architecture: 'hexagonal'

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,testcontainers
  endpoint:
    health:
      show-details: always
    testcontainers:
      enabled: true
  info:
    env:
      enabled: true

logging:
  level:
    com.gogidix.testing: DEBUG
    org.testcontainers: INFO
    org.springframework.test: INFO
    org.springframework.boot.test: INFO
    com.github.tomakehurst.wiremock: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%logger{36}] - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%logger{36}] - %msg%n'

# Gogidix Testing Configuration
gogidix:
  testing:
    testcontainers:
      enabled: true
      reuse: true  # Reuse containers across test runs for speed
      cleanup: true  # Auto cleanup after tests
    
    wiremock:
      enabled: true
  port: 8304
      record-mappings: false
      verbose-logging: false
    
    database:
      seed-data: true
      cleanup-after-test: true
      isolation-level: READ_COMMITTED
    
    integration:
      timeout: 30000  # 30 seconds for integration tests
      retry-attempts: 3
      parallel-execution: true
    
    performance:
      enabled: false  # Disable by default, enable for performance tests
      load-testing: false
      stress-testing: false
      
    security:
      mock-authentication: true
      mock-authorization: true
      test-jwt-secret: test-jwt-secret-for-testing-only-256-bits-long
      
    mock-services:
      external-apis: true
      third-party-services: true
      payment-gateways: true
