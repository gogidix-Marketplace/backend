# ------------------------------------------------------------------------------
# HPA Overrides - Staging
# ------------------------------------------------------------------------------
# Reduce max replicas in staging
fulfillmentCoreService:
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4

inventoryCoreService:
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4

outboundCoreService:
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4

# ------------------------------------------------------------------------------
# Ingress Configuration - Staging
# ------------------------------------------------------------------------------
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
  hosts:
    - host: api.warehousing-staging.gogidix.com
      paths:
        - path: /(/|$)(.*)
          pathType: Prefix
          serviceName: fulfillment-core-service
          servicePort: 8202
  tls:
    - secretName: warehousing-staging-tls
      hosts:
        - api.warehousing-staging.gogidix.com

# ------------------------------------------------------------------------------
# Observability - Staging
# ------------------------------------------------------------------------------
observability:
  logging:
    enabled: true
    format: json
    level: debug
  tracing:
    enabled: true
    sampler: 0.5
  metrics:
    enabled: true
