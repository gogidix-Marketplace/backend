apiVersion: v1
kind: Secret
metadata:
  name: onboarding-tracker-service-secrets
  namespace: transaction-orchestration
  labels:
    app: onboarding-tracker-service
    team: team-b-transaction
type: Opaque
stringData:
  mongodb-username: "onboarding_tracker_user"
  mongodb-password: "CHANGE_ME_PROD_PASSWORD"
  mongodb-uri: "mongodb://onboarding_tracker_user:CHANGE_ME_PROD_PASSWORD@mongodb:27017/onboarding_tracker_db?authSource=admin"
