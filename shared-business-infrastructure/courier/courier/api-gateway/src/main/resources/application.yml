server:
  port: 8092

spring:
  application:
    name: courier-api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: courier-service-route
          uri: lb://courier-service
          predicates:
            - Path=/api/courier/**
          filters:
            - name: AuthenticationFilter
            - name: RateLimitFilter
            - name: RequestLoggingFilter

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway