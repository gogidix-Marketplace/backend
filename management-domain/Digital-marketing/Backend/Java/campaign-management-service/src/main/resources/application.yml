# =============================================================================
# Campaign Management Service Configuration
# Digital-Marketing-Domain - Gogidix Ecosystem
# =============================================================================

server:
  port: 8086
  servlet:
    context-path: /api/v1

spring:
  application:
    name: campaign-management-service

  # MongoDB Configuration
  data:
    mongodb:
      host: localhost
      port: 27017
      database: digital_marketing_campaigns
      # username: ${MONGO_USERNAME:}
      # password: ${MONGO_PASSWORD:}
      # authentication-database: admin
      auto-index-creation: true

  # Redis Configuration (for caching)
  redis:
    host: localhost
    port: 6379
    database: 0
    # password: ${REDIS_PASSWORD:}
    timeout: 5000
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms

  # Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 300000  # 5 minutes
      cache-null-values: false
      key-prefix: "campaign-mgmt:"

  # Kafka Configuration (for event streaming)
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializers.JsonSerializer
      properties:
        acks: 1
        retries: 3
    consumer:
      group-id: campaign-management-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializers.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        max.poll.records: 100

# Mongock Configuration
mongock:
  enabled: true
  migration-scan-package: com.gogidix.marketing.campaign.migrations

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.gogidix: DEBUG
    org.springframework.data.mongodb: DEBUG
    io.mongock: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 100
        minimum-number-of-calls: 10
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 60s
        failure-rate-threshold: 50
        slow-call-rate-threshold: 100
        slow-call-duration-threshold: 10s
    instances:
      backendService:
        base-config: default

  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
    instances:
      backendService:
        base-config: default

  timelimiter:
    configs:
      default:
        timeout-duration: 10s
    instances:
      backendService:
        base-config: default

# Application-Specific Configuration
app:
  campaign:
    # Campaign auto-archiving after completion (days)
    archive-after-days: 90

    # Maximum campaign budget (currency units)
    max-budget: 1000000

    # Default campaign duration (days)
    default-duration: 30

    # Maximum number of active campaigns per tenant
    max-active-campaigns: 50

    # Campaign status transition rules
    status-transitions:
      DRAFT: [SCHEDULED, CANCELLED]
      SCHEDULED: [ACTIVE, PAUSED, CANCELLED]
      ACTIVE: [PAUSED, COMPLETED, CANCELLED]
      PAUSED: [ACTIVE, CANCELLED]
      COMPLETED: [ARCHIVED]
      CANCELLED: [ARCHIVED]
      ARCHIVED: []

    # Supported campaign channels
    supported-channels:
      - EMAIL
      - SOCIAL_MEDIA
      - SMS
      - PUSH_NOTIFICATION
      - WEB
      - DISPLAY_ADS
      - SEARCH_ADS
      - VIDEO_ADS
      - INFLUENCER
      - AFFILIATE
      - DIRECT_MAIL
      - EVENTS

    # Supported campaign types
    supported-types:
      - AWARENESS
      - ACQUISITION
      - RETENTION
      - CONVERSION
      - LOYALTY
      - REFERRAL
      - REENGAGEMENT
      - LAUNCH
      - PROMOTION
      - BRAND

    # Budget alert thresholds (percentage)
    budget-alert-thresholds:
      warning: 75
      critical: 90

  # Asset management
  assets:
    # Maximum file size (MB)
    max-file-size: 50

    # Supported file types
    supported-types:
      - image/jpeg
      - image/png
      - image/gif
      - image/svg+xml
      - video/mp4
      - video/quicktime
      - application/pdf
      - text/html

    # Asset storage location
    storage-location: ${ASSET_STORAGE:/tmp/campaign-assets}

  # Metrics tracking
  metrics:
    # Default aggregation interval (minutes)
    aggregation-interval: 60

    # Metrics retention period (days)
    retention-days: 365

    # Real-time metrics enabled
    real-time-enabled: true

---
# ============================================================================
# Profile: test
# ============================================================================
spring:
  config:
    activate:
      on-profile: test

  data:
    mongodb:
      database: test_digital_marketing_campaigns

  kafka:
    bootstrap-servers: ${KAFKA_TEST_SERVER:localhost:9094}

# Mongock disabled in tests (use setup scripts)
mongock:
  enabled: false

logging:
  level:
    com.gogidix: TRACE

---
# ============================================================================
# Profile: integration
# ============================================================================
spring:
  config:
    activate:
      on-profile: integration

  data:
    mongodb:
      database: test_digital_marketing_campaigns

mongock:
  enabled: true

---
# ============================================================================
# Profile: production
# ============================================================================
spring:
  config:
    activate:
      on-profile: production

  data:
    mongodb:
      host: ${MONGO_HOST}
      port: ${MONGO_PORT:27017}
      database: ${MONGO_DB:digital_marketing_campaigns}
      username: ${MONGO_USERNAME}
      password: ${MONGO_PASSWORD}
      authentication-database: admin

  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

logging:
  level:
    root: WARN
    com.gogidix: INFO
    org.springframework.data.mongodb: WARN

# Enable production monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

