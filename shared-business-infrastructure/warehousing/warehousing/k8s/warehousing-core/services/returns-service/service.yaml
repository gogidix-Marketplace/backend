apiVersion: v1
kind: Service
metadata:
  name: returns-service
  namespace: warehousing-core
  labels:
    app: returns-service
    service: returns-service
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
  - name: http
    port: 8208
    targetPort: http
    protocol: TCP
  - name: management
    port: 8209
    targetPort: management
    protocol: TCP
  selector:
    app: returns-service
---
apiVersion: v1
kind: Service
metadata:
  name: returns-service-headless
  namespace: warehousing-core
  labels:
    app: returns-service
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8208
    targetPort: http
    protocol: TCP
  selector:
    app: returns-service
