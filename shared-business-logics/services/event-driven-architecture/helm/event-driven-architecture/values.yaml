    pathType: Prefix
    annotations: {}
  envVars:
    SPRING_PROFILES_ACTIVE: "prod"
    SERVER_PORT: "8201"
    MANAGEMENT_SERVER_PORT: "8202"
    KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    DATABASE_URL: "jdbc:postgresql://postgres:5432/event_aggregator"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 70
    targetMemoryUtilization: 80
  pdb:
    enabled: true
    minAvailable: 1
  monitoring:
