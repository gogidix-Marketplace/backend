name: CI - Hotfix (Fast-Track)

on:
  pull_request:
    branches: [hotfix, production]
    types: [opened, synchronize, reopened]
  push:
    branches: [hotfix]
  workflow_dispatch:

concurrency:
  group: ci-hotfix-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ============================================
  # Install Shared Libraries
  # ============================================
  install-shared-libraries:
    name: Install Shared Libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: 'maven'
      - name: Install shared-libraries to local .m2
        working-directory: foundation-domain/shared-libraries/shared-libraries/Backend/Java
        run: mvn clean install -DskipTests -B -q
      - name: Cache .m2 repository
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: m2-shared-libs-hotfix-${{ github.sha }}

  # ============================================
  # Detect Hotfix Scope
  # ============================================
  detect-changes:
    name: Detect Hotfix Changes
    runs-on: ubuntu-latest
    needs: install-shared-libraries
    outputs:
      foundation: ${{ steps.filter.outputs.foundation }}
      management: ${{ steps.filter.outputs.management }}
      shared-logics: ${{ steps.filter.outputs.shared-logics }}
      shared-infra: ${{ steps.filter.outputs.shared-infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: production
          filters: |
            foundation:
              - 'foundation-domain/**'
            management:
              - 'management-domain/**'
            shared-logics:
              - 'shared-business-logics/**'
            shared-infra:
              - 'shared-business-infrastructure/**'

  # ============================================
  # Build & Test Affected Domains
  # ============================================
  build-hotfix:
    name: Hotfix Build - ${{ matrix.domain }}
    runs-on: ubuntu-latest
    needs: detect-changes
    strategy:
      fail-fast: true
      matrix:
        include:
          - domain: foundation-domain
            changed: ${{ needs.detect-changes.outputs.foundation == 'true' }}
            path: foundation-domain
          - domain: management-domain
            changed: ${{ needs.detect-changes.outputs.management == 'true' }}
            path: management-domain
          - domain: shared-business-logics
            changed: ${{ needs.detect-changes.outputs.shared-logics == 'true' }}
            path: shared-business-logics
          - domain: shared-business-infrastructure
            changed: ${{ needs.detect-changes.outputs.shared-infra == 'true' }}
            path: shared-business-infrastructure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: 'maven'
      - name: Restore shared-libraries from cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: m2-shared-libs-hotfix-${{ github.sha }}
      - name: Skip if no changes
        if: matrix.changed != 'true'
        run: |
          echo "No changes detected in ${{ matrix.domain }}, skipping build"
          echo "skip=true" >> $GITHUB_ENV
      - name: Build & Test Affected Services
        if: env.skip != 'true'
        run: |
          echo "Building hotfix for ${{ matrix.domain }}"
          FAILED=0
          for pom in $(find ${{ matrix.path }} -name "pom.xml" -type f | grep -v target | head -50); do
            dir=$(dirname "$pom")
            echo "::group::Building $dir"
            if ! (cd "$dir" && mvn clean verify -B); then
              echo "::error::Build failed in $dir"
              FAILED=1
            fi
            echo "::endgroup::"
          done
          if [ "$FAILED" -ne 0 ]; then exit 1; fi

  # ============================================
  # Build Hotfix Docker Images
  # ============================================
  docker-hotfix:
    name: Hotfix Docker Images
    runs-on: ubuntu-latest
    needs: [detect-changes, build-hotfix]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push Hotfix Images
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION="hotfix-${SHORT_SHA}"
          echo "Building hotfix images: ${VERSION}" >> $GITHUB_STEP_SUMMARY

          FAILED=0
          for jar in $(find . -path "*/target/*.jar" -not -name "*-sources.jar" -not -name "*-javadoc.jar" | grep -v shared-libraries | grep -v target | head -50); do
            service_dir=$(dirname $(dirname "$jar"))
            service_name=$(basename "$service_dir")
            if [[ "$service_name" != "target" && "$service_name" != "classes" ]]; then
              IMAGE_TAG="ghcr.io/${{ github.repository }}/${service_name}:${VERSION}"
              echo "::group::Building hotfix $service_name"
              if [ -f "$service_dir/Dockerfile" ]; then
                docker build -t "$IMAGE_TAG" "$service_dir"
                docker push "$IMAGE_TAG"
                echo "- $service_name" >> $GITHUB_STEP_SUMMARY
              elif [ -f "$service_dir/src/main/docker/Dockerfile" ]; then
                docker build -t "$IMAGE_TAG" -f "$service_dir/src/main/docker/Dockerfile" "$service_dir"
                docker push "$IMAGE_TAG"
                echo "- $service_name" >> $GITHUB_STEP_SUMMARY
              fi
              echo "::endgroup::"
            fi
          done
          if [ "$FAILED" -ne 0 ]; then exit 1; fi

  # ============================================
  # Security Scan Hotfix Images
  # ============================================
  scan-hotfix:
    name: Scan Hotfix Images
    runs-on: ubuntu-latest
    needs: docker-hotfix
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy Scan Hotfix Images
        env:
          TRIVY_TIMEOUT: 10m
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION="hotfix-${SHORT_SHA}"

          FAILED=0
          for image in $(ghcr.io/${{ github.repository }}/*:${VERSION}); do
            echo "::group::Scanning $image"
            if ! docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity "CRITICAL,HIGH" --exit-code 1 "$image" 2>/dev/null; then
              echo "::error::Vulnerabilities found in $image"
              FAILED=1
            fi
            echo "::endgroup::"
          done
          if [ "$FAILED" -ne 0 ]; then exit 1; fi

  # ============================================
  # Hotfix Production Approval
  # ============================================
  approve-hotfix:
    name: Hotfix Production Approval
    runs-on: ubuntu-latest
    needs: [build-hotfix, scan-hotfix]
    environment: production
    steps:
      - run: |
          echo "## Hotfix Production Approval" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Hotfix requires explicit production approval." >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Deploy Hotfix to Production
  # ============================================
  deploy-hotfix:
    name: Deploy Hotfix to Production
    runs-on: ubuntu-latest
    needs: approve-hotfix
    environment: production
    steps:
      - run: |
          echo "## 🚀 Hotfix Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deploying hotfix to production..." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ *Actual deployment disabled until cloud provider is configured*" >> $GITHUB_STEP_SUMMARY
