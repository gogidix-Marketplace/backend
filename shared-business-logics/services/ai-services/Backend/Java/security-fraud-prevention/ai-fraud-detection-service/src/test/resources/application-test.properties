# Test configuration properties

# Enable bean overriding for tests
spring.main.allow-bean-definition-overriding=true

# MongoDB test configuration (using real MongoDB at localhost:27017)
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=ai-fraud-detection-test

# Disable actuator security for tests
management.security.enabled=false

# Test logging
logging.level.com.gogidix.aiservices.aifrauddetectionservice=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG

# Random port for web tests
server.port=0

# Disable auto-configuration that conflicts with test configuration
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
