apiVersion: v1
kind: ConfigMap
metadata:
  name: data-aggregation-service-config
  namespace: centralized-dashboard
  labels:
    app: data-aggregation-service
    team: team-f-centralized-dashboard
data:
  database-url: "jdbc:postgresql://postgres:5432/data_aggregation"
  redis-host: "redis"
  redis-port: "6379"
  kafka-bootstrap-servers: "kafka:9092"
  courier-service-url: "http://courier-service:8901"
  warehouse-service-url: "http://warehouse-service:8902"
  social-commerce-service-url: "http://social-commerce-service:8903"
  dashboard-core-service-url: "http://dashboard-core-service:8904"
