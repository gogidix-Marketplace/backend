apiVersion: v1
kind: Service
metadata:
  name: cycle-counting-service
  namespace: warehousing-core
  labels:
    app: cycle-counting-service
    service: cycle-counting-service
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
  - name: http
    port: 8214
    targetPort: http
    protocol: TCP
  - name: management
    port: 8215
    targetPort: management
    protocol: TCP
  selector:
    app: cycle-counting-service
---
apiVersion: v1
kind: Service
metadata:
  name: cycle-counting-service-headless
  namespace: warehousing-core
  labels:
    app: cycle-counting-service
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8214
    targetPort: http
    protocol: TCP
  selector:
    app: cycle-counting-service
