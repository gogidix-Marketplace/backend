    restart: unless-stopped

  # ------------------------------------------------------------------------
  # Availability Service - Driver Availability Tracking
  # ------------------------------------------------------------------------
  availability-service:
    build:
      context: ./Drivers/availability-service
      dockerfile: Dockerfile
    container_name: availability-service
    ports:
      - "8106:8106"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: availability-service
      SERVER_PORT: 8106
      MONGODB_URI: mongodb://admin:admin123@mongodb-primary:27017,availability-db?authSource=admin&replicaSet=rs0
      KAFKA_BROKERS: kafka:9092
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      X-TENANT-ID: availability-service
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      TENANT_CONFIG_SERVICE_URL: http://tenant-config-service:8100
      DRIVER_POOL_SERVICE_URL: http://driver-pool-service:8105
      GPS_TRACKING_SERVICE_URL: http://gps-tracking-service:8109
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
    depends_on:
      mongodb-primary:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      tenant-config-service:
        condition: service_healthy
      driver-pool-service:
        condition: service_healthy
      gps-tracking-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8106/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - courier-network
    restart: unless-stopped

  # ------------------------------------------------------------------------
  # Performance Service - Driver Performance Analytics
  # ------------------------------------------------------------------------
  performance-service:
    build:
      context: ./Drivers/performance-service
      dockerfile: Dockerfile
    container_name: performance-service
    ports:
      - "8107:8107"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: performance-service
      SERVER_PORT: 8107
      MONGODB_URI: mongodb://admin:admin123@mongodb-primary:27017,performance-db?authSource=admin&replicaSet=rs0
