# GitLab CI/CD Pipeline for Shared Utilities Library
# Comprehensive automation with testing, security, and deployment
# Spring Boot 3.1.5 with Java 17

stages:
  - validate
  - test
  - security
  - build
  - package
  - deploy

variables:
  # Maven Configuration
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  
  # Docker Configuration
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_NAME: "$CI_REGISTRY_IMAGE/shared-utilities"
  
  # Application Configuration
  SERVICE_NAME: "shared-utilities"
  SERVICE_PORT: "8707"
  
  # Deployment Configuration
  KUBE_NAMESPACE: "gogidix-infrastructure"
  DEPLOYMENT_NAME: "shared-utilities"

# Cache Maven dependencies
cache:
  paths:
    - .m2/repository/
    - target/

# =====================================
# VALIDATION STAGE
# =====================================
validate:code-quality:
  stage: validate
  image: maven:3.9-eclipse-temurin-17
  script:
    - echo "🔍 Running code quality validation..."
    - mvn $MAVEN_CLI_OPTS validate
    - mvn $MAVEN_CLI_OPTS compile
    - echo "✅ Code quality validation completed"
  artifacts:
    reports:
      junit: target/surefire-reports/TEST-*.xml
    paths:
      - target/
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

validate:dependencies:
  stage: validate
  image: maven:3.9-eclipse-temurin-17
  script:
    - echo "🔍 Validating dependencies..."
    - mvn $MAVEN_CLI_OPTS dependency:analyze
    - mvn $MAVEN_CLI_OPTS dependency:tree
    - echo "✅ Dependency validation completed"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# =====================================
# TESTING STAGE
# =====================================
test:unit:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  services:
    - postgres:15-alpine
    - redis:7-alpine
  variables:
    POSTGRES_DB: gogidix_utilities_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    REDIS_PASSWORD: redis123
    SPRING_PROFILES_ACTIVE: test
  script:
    - echo "🧪 Running unit tests..."
    - mvn $MAVEN_CLI_OPTS test
    - echo "✅ Unit tests completed"
  artifacts:
    reports:
      junit: target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: target/site/jacoco/jacoco.xml
    paths:
      - target/surefire-reports/
      - target/site/jacoco/
    expire_in: 1 week
  coverage: '/Total.*?([0-9]{1,3})%/'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

test:integration:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  before_script:
    - docker info
  script:
    - echo "🔗 Running integration tests..."
    - mvn $MAVEN_CLI_OPTS verify -Pintegration-test
    - echo "✅ Integration tests completed"
  artifacts:
    reports:
      junit: target/failsafe-reports/TEST-*.xml
    paths:
      - target/failsafe-reports/
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

# =====================================
# SECURITY STAGE
# =====================================
security:dependency-scan:
  stage: security
  image: maven:3.9-eclipse-temurin-17
  script:
    - echo "🔒 Running dependency vulnerability scan..."
    - mvn $MAVEN_CLI_OPTS org.owasp:dependency-check-maven:check
    - echo "✅ Dependency scan completed"
  artifacts:
    reports:
      dependency_scanning: target/dependency-check-report.json
    paths:
      - target/dependency-check-report.html
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

security:container-scan:
  stage: security
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  before_script:
    - docker info
    - apk add --no-cache curl
  script:
    - echo "🐳 Building image for security scan..."
    - docker build -t $IMAGE_NAME:security .
    - echo "🔒 Running container security scan..."
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock 
      -v $PWD:/tmp/trivy aquasec/trivy:latest image 
      --format json --output /tmp/trivy/security-report.json $IMAGE_NAME:security
    - echo "✅ Container security scan completed"
  artifacts:
    reports:
      container_scanning: security-report.json
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# =====================================
# BUILD STAGE
# =====================================
build:package:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  script:
    - echo "📦 Packaging application..."
    - mvn $MAVEN_CLI_OPTS clean package -DskipTests
    - echo "JAR file created: $(ls -la target/*.jar)"
    - echo "✅ Packaging completed"
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

# =====================================
# PACKAGE STAGE
# =====================================
package:docker-image:
  stage: package
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker info
  script:
    - echo "🐳 Building Docker image..."
    - |
      docker build \
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
        --build-arg VCS_REF=$CI_COMMIT_SHA \
        --build-arg VERSION=$CI_COMMIT_TAG \
        --tag $IMAGE_NAME:$CI_COMMIT_SHA \
        --tag $IMAGE_NAME:latest \
        .
    - echo "📤 Pushing Docker image..."
    - docker push $IMAGE_NAME:$CI_COMMIT_SHA
    - docker push $IMAGE_NAME:latest
    - echo "✅ Docker image packaged and pushed"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# =====================================
# DEPLOYMENT STAGE
# =====================================
deploy:development:
  stage: deploy
  image: bitnami/kubectl:latest
  environment:
    name: development
    url: https://dev.gogidix.com/api/utilities
  variables:
    KUBE_NAMESPACE: "gogidix-dev"
  before_script:
    - echo $KUBE_CONFIG | base64 -d > kubeconfig
    - export KUBECONFIG=kubeconfig
    - kubectl version --client
  script:
    - echo "🚀 Deploying to development environment..."
    - kubectl set image deployment/$DEPLOYMENT_NAME 
      shared-utilities=$IMAGE_NAME:$CI_COMMIT_SHA 
      -n $KUBE_NAMESPACE
    - kubectl rollout status deployment/$DEPLOYMENT_NAME -n $KUBE_NAMESPACE
    - echo "✅ Development deployment completed"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy:production:
  stage: deploy
  image: bitnami/kubectl:latest
  environment:
    name: production
    url: https://api.gogidix.com/utilities
  variables:
    KUBE_NAMESPACE: "gogidix-prod"
  before_script:
    - echo $KUBE_CONFIG | base64 -d > kubeconfig
    - export KUBECONFIG=kubeconfig
    - kubectl version --client
  script:
    - echo "🚀 Deploying to production environment..."
    - kubectl set image deployment/$DEPLOYMENT_NAME 
      shared-utilities=$IMAGE_NAME:$CI_COMMIT_SHA 
      -n $KUBE_NAMESPACE
    - kubectl rollout status deployment/$DEPLOYMENT_NAME -n $KUBE_NAMESPACE
    - echo "🧪 Running production health checks..."
    - ./docker/health-check.sh
    - echo "✅ Production deployment completed"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false