apiVersion: v1
kind: ConfigMap
metadata:
  name: shared-utilities-config
  namespace: gogidix-infrastructure
  labels:
    app: shared-utilities
    component: utilities
    tier: infrastructure
data:
  # Database Configuration
  db.host: "postgres-shared-utilities.gogidix-infrastructure.svc.cluster.local"
  db.port: "5432"
  db.name: "gogidix_utilities"
  
  # Redis Configuration  
  redis.host: "redis-shared-utilities.gogidix-infrastructure.svc.cluster.local"
  redis.port: "6379"
  redis.database: "2"
  
  # Application Configuration
  server.port: "8707"
  management.port: "8707"
  spring.profiles.active: "kubernetes"
  
  # Utility-specific Configuration
  temp.directory: "/tmp/utilities"
  max.file.size: "100MB"
  cache.ttl: "3600"
  
  # JVM Configuration
  java.opts: "-Xmx512m -Xms256m -XX:+UseG1GC -XX:+UseStringDeduplication"
