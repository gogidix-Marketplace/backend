openapi: 3.0.0
info:
  title: shared-security API
  description: API documentation for shared security library
  version: 1.0.0
  contact:
    name: Gogidix Technologies
    email: tech@gogidix.com

paths:
  /health:
    get:
      summary: Health check endpoint
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
