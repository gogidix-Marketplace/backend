name: AI Services CD

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: gogidix/ai-services

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - ml-model-training-service
          - nlp-service
          - predictive-analytics-service
          - computer-vision-service
          - anomaly-detection-service
          - recommendation-service

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@2b512430cf1c7c4fe9b7815b4c7d761f6e893f6b

      - name: Log in to Container Registry
        uses: docker/login-action@e92390c5fb421da1463b202fbb5d8c4abc1a1ff6
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@8e5442c4c6b23faec5f45e6f8a52f03446a791ce
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@af5a7ed5ba88268de6df9df61a84dfe726b25e69
        with:
          context: Backend/Nodes/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image scan
        uses: aquasecurity/trivy-action@6896a38fa877f2db34aa4fff10fa544dbbf9357c
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  deploy-kubernetes:
    name: Deploy to Kubernetes
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up kubectl
        uses: azure/setup-kubectl@7c9cd5b7a80e4137fef6d0fcc6593e306757c0f4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kubeconfig
          export KUBECONFIG=~/.kubeconfig

      - name: Deploy services
        run: |
          kubectl apply -f k8s/ -n ai-services

      - name: Verify deployment
        run: |
          kubectl rollout status deployment -n ai-services
          kubectl get pods -n ai-services

  deploy-docker-compose:
    name: Deploy via Docker Compose
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Deploy to staging
        uses: appleboy/ssh-action@0115c43364095a48675e36533e2b748471b6f5af
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/gogidix/ai-services
            docker-compose pull
            docker-compose up -d
            docker-compose ps

  notify:
    name: Notify Deployment
    needs: [deploy-kubernetes, deploy-docker-compose]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Send notification
        run: |
          echo "Deployment notification would be sent here"
          # Add Slack/Teams notification integration
