apiVersion: v1
kind: Service
metadata:
  name: ai-customer-engagement-service-metrics
  namespace: ai-services
  labels:
    app: ai-customer-engagement-service
    team: team-ai-customer-experience
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"
spec:
  type: ClusterIP
  ports:
  - name: metrics
    port: 8080
    targetPort: management
    protocol: TCP
  selector:
    app: ai-customer-engagement-service
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ai-customer-engagement-service
  namespace: ai-services
  labels:
    app: ai-customer-engagement-service
    team: team-ai-customer-experience
    release: prometheus-operator
spec:
  selector:
    matchLabels:
      app: ai-customer-engagement-service
  endpoints:
  - port: metrics
    path: /actuator/prometheus
    interval: 30s
    scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
    - ai-services
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-customer-engagement-service-alerts
  namespace: ai-services
  labels:
    app: ai-customer-engagement-service
    team: team-ai-customer-experience
data:
  alerts.yml: |
    groups:
    - name: ai-customer-engagement-service
      rules:
      - alert: AICustomerEngagementServiceDown
        expr: up{job="ai-customer-engagement-service"} == 0
        for: 5m
        labels:
          severity: critical
          team: team-ai-customer-experience
        annotations:
          summary: "AI Customer Engagement Service is down"
          description: "AI Customer Engagement Service has been down for more than 5 minutes"
      - alert: AICustomerEngagementServiceHighErrorRate
        expr: rate(http_requests_total{job="ai-customer-engagement-service",status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          team: team-ai-customer-experience
        annotations:
          summary: "High error rate on AI Customer Engagement Service"
          description: "Error rate is {{ $value }} errors per second"
      - alert: AICustomerEngagementServiceHighMemory
        expr: jvm_memory_used_bytes{job="ai-customer-engagement-service",area="heap"} / jvm_memory_max_bytes{job="ai-customer-engagement-service",area="heap"} > 0.9
        for: 10m
        labels:
          severity: warning
          team: team-ai-customer-experience
        annotations:
          summary: "High memory usage on AI Customer Engagement Service"
          description: "Heap memory usage is above 90%"
