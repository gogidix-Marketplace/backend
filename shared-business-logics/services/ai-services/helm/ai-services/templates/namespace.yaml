{{/*
Create the ai-services namespace with appropriate labels and policies
*/}}
{{- if .Values.namespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace.name }}
  labels:
    name: {{ .Values.namespace.name }}
    {{- with .Values.namespace.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.global.environment }}
    environment: {{ .Values.global.environment }}
    {{- end }}
---
{{- if .Values.resourceQuota.enabled }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "ai-services.fullname" . }}-resource-quota
  namespace: {{ .Values.namespace.name }}
spec:
  hard:
    {{- with .Values.resourceQuota.hard }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
---
{{- if .Values.limitRange.enabled }}
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "ai-services.fullname" . }}-limit-range
  namespace: {{ .Values.namespace.name }}
spec:
  limits:
    - type: Container
      {{- with .Values.limitRange.default }}
      default:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.limitRange.defaultRequest }}
      defaultRequest:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
