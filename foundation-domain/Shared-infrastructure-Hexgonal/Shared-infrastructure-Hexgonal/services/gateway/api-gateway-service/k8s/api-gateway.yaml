apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: infrastructure
data:
  application.yml: |
    spring:
      application:
        name: api-gateway-service
      cloud:
        gateway:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                  - PATCH
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
      config:
        import: optional:configserver:http://config-server.infrastructure.svc.cluster.local:8888

    server:
      port: 8080
      shutdown: graceful

    eureka:
      client:
        service-url:
          defaultZone: http://discovery-service-0.infrastructure.svc.cluster.local:8761/eureka/
        enabled: true
        fetch-registry: true
        register-with-eureka: true
        registry-fetch-interval-seconds: 30
      instance:
        prefer-ip-address: false
        lease-renewal-interval-in-seconds: 10
        lease-expiration-duration-in-seconds: 30

    management:
      endpoints:
        web:
          exposure:
            include: health,info,gateway,metrics,prometheus
      endpoint:
        health:
          probes:
            enabled: true
          show-details: always
      metrics:
        export:
          prometheus:
            enabled: true

    logging:
      level:
        org.springframework.cloud.gateway: INFO
        org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping: DEBUG
        com.gogidix: INFO
        reactor.netty: INFO

    resilience4j:
      circuitbreaker:
        configs:
          default:
            sliding-window-size: 50
            permitted-number-of-calls-in-half-open-state: 2
            wait-duration-in-open-state: 5000
            failure-rate-threshold: 50
            slow-call-rate-threshold: 100
            slow-call-duration-threshold: 2000
      retry:
        configs:
          default:
            max-attempts: 3
            wait-duration: 100
            retry-exceptions:
              - java.io.IOException
              - java.util.concurrent.TimeoutException
            ignore-exceptions:
              - java.lang.IllegalArgumentException

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: infrastructure
  labels:
    app: api-gateway
    component: gateway
    domain: infrastructure
    tier: frontend
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: api-gateway

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-headless
  namespace: infrastructure
  labels:
    app: api-gateway
    component: gateway
    domain: infrastructure
    tier: frontend
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: api-gateway

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: infrastructure
  labels:
    app: api-gateway
    component: gateway
    domain: infrastructure
    tier: frontend
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        component: gateway
        domain: infrastructure
        tier: frontend
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: api-gateway
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: api-gateway
                topologyKey: kubernetes.io/hostname
      containers:
      - name: api-gateway
        image: api-gateway-service:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: JAVA_OPTS
          value: "-Xms512m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: logs
        emptyDir: {}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: infrastructure
  labels:
    app: api-gateway

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: infrastructure
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: api-gateway

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: infrastructure
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Pods
        value: 4
        periodSeconds: 30

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-ingress
  namespace: infrastructure
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.gogidix.com
    - "*.api.gogidix.com"
    secretName: api-gateway-tls
  rules:
  - host: api.gogidix.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8080
