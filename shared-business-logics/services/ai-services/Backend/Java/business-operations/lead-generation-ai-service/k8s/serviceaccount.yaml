apiVersion: v1
kind: ServiceAccount
metadata:
  name: lead-generation-ai-service
  namespace: ai-services
  labels:
    app: lead-generation-ai-service
    team: team-ai-business-ops
  annotations:
    iam.gke.io/gcp-service-account: lead-generation-ai-service@gogidix-ai.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lead-generation-ai-service-role
  namespace: ai-services
  labels:
    app: lead-generation-ai-service
    team: team-ai-business-ops
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lead-generation-ai-service-rolebinding
  namespace: ai-services
  labels:
    app: lead-generation-ai-service
    team: team-ai-business-ops
subjects:
- kind: ServiceAccount
  name: lead-generation-ai-service
  namespace: ai-services
roleRef:
  kind: Role
  name: lead-generation-ai-service-role
  apiGroup: rbac.authorization.k8s.io
