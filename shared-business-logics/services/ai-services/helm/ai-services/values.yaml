        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 3
      readiness:
        enabled: true
        path: /actuator/health/readiness
        initialDelaySeconds: 45
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      startup:
        enabled: true
        path: /actuator/health/startup
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 18

    nodeSelector: {}
    tolerations: []
    affinity: {}

    volumeMounts:
      - name: models
        mountPath: /models
    volumes:
      - name: models
        persistentVolumeClaim:
          claimName: ai-models-pvc

