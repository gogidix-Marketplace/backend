apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: security
data:
  application.yml: |
    spring:
      application:
        name: auth-service
      profiles:
        active: prod
      data:
        mongodb:
          host: mongodb-0.mongodb.infrastructure.svc.cluster.local
          port: 27017
          database: auth_db
          username: ${MONGODB_USERNAME}
          password: ${MONGODB_PASSWORD}
      redis:
        host: redis.infrastructure.svc.cluster.local
          port: 6379
          password: ${REDIS_PASSWORD}
          timeout: 3000
          lettuce:
            pool:
              max-active: 8
              max-idle: 8
              min-idle: 0
      security:
        oauth2:
          resource-server:
            jwt:
              public-key-location: classpath:public-key.pem
              issuer-uri: http://localhost:8080

    server:
      port: 8080
      shutdown: graceful

    eureka:
      client:
        service-url:
          defaultZone: http://discovery-service-0.infrastructure.svc.cluster.local:8761/eureka/
        enabled: true
        register-with-eureka: true
        fetch-registry: true
      instance:
        prefer-ip-address: false
        lease-renewal-interval-in-seconds: 10
        lease-expiration-duration-in-seconds: 30

    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
      endpoint:
        health:
          probes:
            enabled: true
          show-details: always
      metrics:
        export:
          prometheus:
            enabled: true

    jwt:
      secret: ${JWT_SECRET:default-secret-key-for-development-change-in-production}
      expiration: 86400000
      refresh-expiration: 604800000

    logging:
      level:
        com.gogidix: INFO
        org.springframework.security: INFO
        org.springframework.security.authentication: DEBUG

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: security
  labels:
    app: auth-service
    component: authentication
    domain: security
    tier: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: auth-service

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: security
  labels:
    app: auth-service
    component: authentication
    domain: security
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        component: authentication
        domain: security
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: auth-service
      terminationGracePeriodSeconds: 30
      containers:
      - name: auth-service
        image: auth-service:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: JAVA_OPTS
          value: "-Xms512m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: MONGODB_USERNAME
          valueFrom:
            secretKeyRef:
              name: mongodb-credentials
              key: username
        - name: MONGODB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-credentials
              key: password
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: secret
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: logs
        emptyDir: {}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
  namespace: security
  labels:
    app: auth-service

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-service-pdb
  namespace: security
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: auth-service

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-service-hpa
  namespace: security
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
