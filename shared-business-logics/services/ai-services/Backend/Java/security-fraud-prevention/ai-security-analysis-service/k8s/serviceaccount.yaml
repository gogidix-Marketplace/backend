apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-security-analysis-service
  namespace: ai-services
  labels:
    app: ai-security-analysis-service
    app.kubernetes.io/name: ai-security-analysis-service
    app.kubernetes.io/instance: ai-security-analysis-service
    app.kubernetes.io/component: serviceaccount
    app.kubernetes.io/part-of: ai-services
    team: team-ai-security
    domain: security-fraud-prevention
  annotations:
    description: "Service account for AI Security Analysis Service - handles AI-powered security threat analysis"
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-security-analysis-service
  namespace: ai-services
  labels:
    app: ai-security-analysis-service
    app.kubernetes.io/component: role
    team: team-ai-security
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-security-analysis-service
  namespace: ai-services
  labels:
    app: ai-security-analysis-service
    app.kubernetes.io/component: rolebinding
    team: team-ai-security
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-security-analysis-service
subjects:
- kind: ServiceAccount
  name: ai-security-analysis-service
  namespace: ai-services
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-security-analysis-service-metrics
  labels:
    app: ai-security-analysis-service
    app.kubernetes.io/component: clusterrole
    team: team-ai-security
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - nodes
  - nodes/metrics
  verbs:
  - get
  - list
- nonResourceURLs:
  - "/metrics"
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-security-analysis-service-metrics
  labels:
    app: ai-security-analysis-service
    app.kubernetes.io/component: clusterrolebinding
    team: team-ai-security
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-security-analysis-service-metrics
subjects:
- kind: ServiceAccount
  name: ai-security-analysis-service
  namespace: ai-services
