server:
  port: ${SERVICE_PORT:8118}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: public-quote-service
  data:
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT:27017}
      database: ${MONGODB_DB:public_quote}
      auto-index-creation: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    root: INFO
    com.gogidix.courier: ${LOG_LEVEL:DEBUG}

quote:
  validity-minutes: ${QUOTE_VALIDITY_MINUTES:30}
