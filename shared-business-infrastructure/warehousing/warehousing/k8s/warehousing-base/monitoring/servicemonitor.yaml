# ServiceMonitor for Prometheus Operator
# This file defines ServiceMonitor resources for all warehousing services
# when using Prometheus Operator for monitoring

---
# Inventory ServiceMonitors
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: inventory-core-service
  namespace: warehousing-core
  labels:
    app: inventory-core-service
    component: inventory
    part-of: warehousing-core
spec:
  selector:
    matchLabels:
      app: inventory-core-service
  endpoints:
    - port: management
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
      - warehousing-core

