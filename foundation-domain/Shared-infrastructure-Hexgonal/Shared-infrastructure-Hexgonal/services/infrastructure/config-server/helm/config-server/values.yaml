# Default values for config-server

replicaCount: 2

image:
  repository: gogidix/config-server
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: "config-server"

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8888

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: config-server.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "500m"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - config-server
          topologyKey: kubernetes.io/hostname

# Environment variables
env:
  springProfilesActive: "prod"
  eurekaUrl: "http://discovery-service.infrastructure.svc.cluster.local:8761/eureka/"
  kafkaBootstrapServers: "kafka.infrastructure.svc.cluster.local:9092"

# Config Server credentials
credentials:
  secret:
    name: config-server-credentials
    usernameKey: username
    passwordKey: password

# Encrypt key
encrypt:
  secret:
    name: config-server-encrypt
    key: key

# Health checks
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Monitoring
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

# Git configuration
git:
  uri: "file:///tmp/config-repo"
  label: "main"
  searchPaths: "applications,*"
