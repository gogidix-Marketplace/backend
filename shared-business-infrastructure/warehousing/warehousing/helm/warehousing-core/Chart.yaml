apiVersion: v2
name: warehousing-core
description: A comprehensive Helm chart for Gogidix Warehousing Core Domain - includes all microservices, databases, and infrastructure components
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - warehousing
  - logistics
  - inventory
  - fulfillment
  - storage
  - microservices
  - gogidix
  - core-domain
maintainers:
  - name: Gogidix Platform Team
    email: platform@gogidix.com
dependencies:
  - name: mongodb
    repository: https://charts.bitnami.com/bitnami
    version: ~15.0.0
    alias: mongodb
    condition: mongodb.enabled
  - name: kafka
    repository: https://charts.bitnami.com/bitnami
    version: ~30.0.0
    alias: kafka
    condition: kafka.enabled
  - name: redis
    repository: https://charts.bitnami.com/bitnami
    version: ~19.0.0
    alias: redis
    condition: redis.enabled
  - name: common
    repository: https://charts.bitnami.com/bitnami
    version: ~2.0.0
    alias: common
    condition: common.enabled
annotations:
  artifacthub.io/category: logistics
  artifacthub.io/license: "PROPRIETARY"
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.gogidix.com/warehousing-core
    - name: Support
      url: https://support.gogidix.com
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/containsSecurityUpdates: "false"
