apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lead-generation-ai-service-ingress
  namespace: ai-services
  labels:
    app: lead-generation-ai-service
    version: v1
    team: team-ai-business-ops
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - lead-generation-ai.gogidix.com
    - lead-generation-api.gogidix.com
    secretName: lead-generation-ai-service-tls
  rules:
  - host: lead-generation-ai.gogidix.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lead-generation-ai-service
            port:
              number: 8080
  - host: lead-generation-api.gogidix.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lead-generation-ai-service
            port:
              number: 8080
