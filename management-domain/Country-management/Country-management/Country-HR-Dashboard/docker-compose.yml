version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: country-hr-postgres
    environment:
      POSTGRES_DB: country_hr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - country-hr-network

  # Kafka for HQ metrics
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: country-hr-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - country-hr-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: country-hr-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - country-hr-network

  # Backend Service
  country-hr-backend:
    build:
      context: ./Backend/Java/country-hr-service
      dockerfile: Dockerfile
    container_name: country-hr-backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/country_hr
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_PROFILES_ACTIVE: prod
      COUNTRY_CODE: NGA
      COUNTRY_NAME: Nigeria
      COUNTRY_CURRENCY: NGN
      HQ_HR_SERVICE_URL: http://hq-hr-service:8080/api/v1/hq-hr
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - country-hr-network
    restart: unless-stopped

  # Frontend Dashboard
  country-hr-frontend:
    build:
      context: ./Frontends/country-hr-web-dashboard
      dockerfile: Dockerfile
    container_name: country-hr-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://country-hr-backend:8080/api/v1/country-hr
    ports:
      - "3000:3000"
    depends_on:
      - country-hr-backend
    networks:
      - country-hr-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  country-hr-network:
    driver: bridge
