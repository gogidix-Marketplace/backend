stages:
  - verify
  - test
  - build
  - docker

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=${CI_PROJECT_DIR}/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  DOCKER_IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  DOCKER_LATEST_TAG: $CI_REGISTRY_IMAGE:latest

cache:
  paths:
    - .m2/repository/
    - target/

verify:
  stage: verify
  image: eclipse-temurin:17-jdk
  script:
    - make verify
  artifacts:
    reports:
      junit: target/surefire-reports/TEST-*.xml
    expire_in: 1 week

test:
  stage: test
  image: eclipse-temurin:17-jdk
  needs: [verify]
  script:
    - ./mvnw $MAVEN_CLI_OPTS clean test
  artifacts:
    reports:
      junit: target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: target/site/jacoco/jacoco.xml
    expire_in: 1 week
  coverage: '/Total.*?([0-9]{1,3})%/'

build:
  stage: build
  image: eclipse-temurin:17-jdk
  needs: [verify, test]
  script:
    - ./mvnw $MAVEN_CLI_OPTS clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 week

docker:
  stage: docker
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  needs: [build]
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $DOCKER_IMAGE_TAG -t $DOCKER_LATEST_TAG .
    - docker push $DOCKER_IMAGE_TAG
    - docker push $DOCKER_LATEST_TAG
  only:
    - main
    - develop