apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-inference-service
  namespace: ai-services
  labels:
    app: ai-inference-service
    team: team-ai-mlops
  annotations:
    iam.gke.io/gcp-service-account: ai-inference-service@gogidix-ai.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-inference-service-role
  namespace: ai-services
  labels:
    app: ai-inference-service
    team: team-ai-mlops
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-inference-service-rolebinding
  namespace: ai-services
  labels:
    app: ai-inference-service
    team: team-ai-mlops
subjects:
- kind: ServiceAccount
  name: ai-inference-service
  namespace: ai-services
roleRef:
  kind: Role
  name: ai-inference-service-role
  apiGroup: rbac.authorization.k8s.io
