apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: supply-chain-optimization-service
  namespace: ai-services
  labels:
    app: supply-chain-optimization-service
    app.kubernetes.io/name: supply-chain-optimization-service
    app.kubernetes.io/instance: supply-chain-optimization-service
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: ai-services
    team: team-ai-business-ops
    domain: business-operations
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "false"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://*.gogidix.com,https://gogidix.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-Requested-With"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - supply-chain-optimization.gogidix.com
    - supply-chain-optimization-service.ai-services.svc.cluster.local
    secretName: supply-chain-optimization-service-tls
  rules:
  - host: supply-chain-optimization.gogidix.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: supply-chain-optimization-service
            port:
              number: 8081
  - host: supply-chain-optimization-service.ai-services.svc.cluster.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: supply-chain-optimization-service
            port:
              number: 8081
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: supply-chain-optimization-service-metrics
  namespace: ai-services
  labels:
    app: supply-chain-optimization-service
    app.kubernetes.io/name: supply-chain-optimization-service
    app.kubernetes.io/component: metrics
    team: team-ai-business-ops
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - supply-chain-optimization-metrics.gogidix.com
    secretName: supply-chain-optimization-service-metrics-tls
  rules:
  - host: supply-chain-optimization-metrics.gogidix.com
    http:
      paths:
      - path: /actuator/prometheus
        pathType: Prefix
        backend:
          service:
            name: supply-chain-optimization-service
            port:
              number: 8081
