apiVersion: v1
kind: Secret
metadata:
  name: centralized-performance-metrics-secrets
  namespace: centralized-dashboard
  labels:
    app: centralized-performance-metrics
    team: team-f-centralized-dashboard
type: Opaque
stringData:
  mongodb-username: "performance_metrics_user"
  mongodb-password: "CHANGE_ME_PROD_PASSWORD"
  oauth2-issuer-uri: "https://auth.gogidix.com/auth/realms/gogidix"
  oauth2-jwk-set-uri: "https://auth.gogidix.com/auth/realms/gogidix/protocol/openid-connect/certs"
  influxdb-url: "http://influxdb.centralized-dashboard.svc.cluster.local:8086"
  influxdb-token: "CHANGE_ME_INFLUXDB_TOKEN"
