spring:
  application:
    name: tenant-hierarchy-service
  data:
    mongodb:
      uri: mongodb://localhost:27017
      database: gogidix_tenant_hierarchy

server:
  port: 8340

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.gogidix.ecommerce.tenanthierarchy: DEBUG
