# Test Configuration for Location Service

# Spring Profile
spring.profiles.active=test

# MongoDB Test Configuration (using Testcontainers)
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=location_test

# Kafka Test Configuration (using Testcontainers)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=location-test-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Logging
logging.level.root=INFO
logging.level.com.gogidix.courier.locationservice=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
