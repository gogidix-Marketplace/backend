apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-summarization-service-ingress
  namespace: ai-services
  labels:
    app: ai-summarization-service
    team: team-ai-content-processing
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/limit-rps: "50"
spec:
  tls:
  - hosts:
    - ai-summarization.gogidix.com
    secretName: ai-summarization-service-tls
  rules:
  - host: ai-summarization.gogidix.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ai-summarization-service
            port:
              number: 8080
