name: Deploy

on:
  push:
    branches:
      - main: deploy-production
      - develop: deploy-staging

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging-api.gogidix.com

    steps:
      - name: Checkout code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

      - name: Set up JDK 17
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      - name: Build Docker image
        run: |
          docker build -t ai-fraud-detection:staging .
          docker tag ai-fraud-detection:staging registry.gogidix.com/ai-fraud-detection:staging

      - name: Login to registry
        run: echo ${{ secrets.REGISTRY_PASSWORD }} | docker login registry.gogidix.com -u ${{ secrets.REGISTRY_USER }} --password-stdin

      - name: Push to registry
        run: docker push registry.gogidix.com/ai-fraud-detection:staging

      - name: Deploy to staging
        run: |
          kubectl set image deployment/ai-fraud-detection ai-fraud-detection=registry.gogidix.com/ai-fraud-detection:staging -n staging

  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.gogidix.com

    steps:
      - name: Checkout code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

      - name: Set up JDK 17
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      - name: Build Docker image
        run: |
          docker build -t ai-fraud-detection:${{ github.sha }} .
          docker tag ai-fraud-detection:${{ github.sha }} registry.gogidix.com/ai-fraud-detection:latest

      - name: Login to registry
        run: echo ${{ secrets.REGISTRY_PASSWORD }} | docker login registry.gogidix.com -u ${{ secrets.REGISTRY_USER }} --password-stdin

      - name: Push to registry
        run: docker push registry.gogidix.com/ai-fraud-detection:latest

      - name: Deploy to production
        run: |
          kubectl set image deployment/ai-fraud-detection ai-fraud-detection=registry.gogidix.com/ai-fraud-detection:latest -n production
