apiVersion: v1
kind: ServiceMonitor
metadata:
  name: ai-content-generation-service
  namespace: ai-services
  labels:
    app: ai-content-generation-service
    team: team-ai-customer-experience
  annotations:
    release: "prometheus"
spec:
  selector:
    matchLabels:
      app: ai-content-generation-service
  endpoints:
  - port: management
    path: /actuator/prometheus
    interval: 30s
    scrapeTimeout: 10s
    scheme: http
  namespaceSelector:
    matchNames:
    - ai-services
---
apiVersion: v1
kind: PodMonitor
metadata:
  name: ai-content-generation-service
  namespace: ai-services
  labels:
    app: ai-content-generation-service
    team: team-ai-customer-experience
spec:
  selector:
    matchLabels:
      app: ai-content-generation-service
  podMetricsEndpoints:
  - port: management
    path: /actuator/prometheus
    interval: 30s
  namespaceSelector:
    matchNames:
    - ai-services
---
apiVersion: v1
kind: PrometheusRule
metadata:
  name: ai-content-generation-service
  namespace: ai-services
  labels:
    app: ai-content-generation-service
    team: team-ai-customer-experience
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
  - name: ai-content-generation-service
    interval: 30s
    rules:
    - alert: AiContentGenerationServiceHighErrorRate
      annotations:
        description: High error rate detected for ai-content-generation-service
        summary: Error rate above 5% for 5 minutes
      expr: |
        sum(rate(http_server_requests_seconds_count{app="ai-content-generation-service",status=~"5.."}[5m])) /
        sum(rate(http_server_requests_seconds_count{app="ai-content-generation-service"}[5m])) > 0.05
      for: 5m
      labels:
        severity: warning
        team: team-ai-customer-experience

    - alert: AiContentGenerationServiceHighLatency
      annotations:
        description: High latency detected for ai-content-generation-service
        summary: P99 latency above 2s for 5 minutes
      expr: |
        histogram_quantile(0.99,
          sum(rate(http_server_requests_seconds_bucket{app="ai-content-generation-service"}[5m])) by (le)
        ) > 2
      for: 5m
      labels:
        severity: warning
        team: team-ai-customer-experience

    - alert: AiContentGenerationServicePodNotReady
      annotations:
        description: Pod {{ $labels.pod }} is not ready
        summary: Pod readiness check failing
      expr: |
        kube_pod_status_ready{namespace="ai-services",pod=~"ai-content-generation-service-.*"} == 0
      for: 5m
      labels:
        severity: critical
        team: team-ai-customer-experience

    - alert: AiContentGenerationServiceHighMemoryUsage
      annotations:
        description: High memory usage detected for ai-content-generation-service
        summary: Memory usage above 80%
      expr: |
        sum(container_memory_working_set_bytes{namespace="ai-services",pod=~"ai-content-generation-service-.*"}) /
        sum(kube_pod_container_resource_limits{namespace="ai-services",pod=~"ai-content-generation-service-.*",resource="memory"}) > 0.8
      for: 10m
      labels:
        severity: warning
        team: team-ai-customer-experience

    - alert: AiContentGenerationServiceHighCPUUsage
      annotations:
        description: High CPU usage detected for ai-content-generation-service
        summary: CPU usage above 80%
      expr: |
        sum(rate(container_cpu_usage_seconds_total{namespace="ai-services",pod=~"ai-content-generation-service-.*"}[5m])) /
        sum(kube_pod_container_resource_limits{namespace="ai-services",pod=~"ai-content-generation-service-.*",resource="cpu"}) > 0.8
      for: 10m
      labels:
        severity: warning
        team: team-ai-customer-experience

    - alert: AiContentGenerationServiceRestarting
      annotations:
        description: Pod {{ $labels.pod }} is restarting frequently
        summary: High pod restart rate detected
      expr: |
        increase(kube_pod_container_status_restarts_total{namespace="ai-services",pod=~"ai-content-generation-service-.*"}[1h]) > 5
      for: 5m
      labels:
        severity: warning
        team: team-ai-customer-experience
