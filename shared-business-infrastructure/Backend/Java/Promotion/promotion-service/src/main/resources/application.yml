spring:
  application:
    name: promotion-service
  data:
    mongodb:
      uri: mongodb://localhost:27017
      database: gogidix_promotion
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092
      bindings:
        promotionEvents-out-0:
          destination: promotion-events
          content-type: application/json
server:
  port: 8090
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
logging:
  level:
    com.gogidix.ecommerce.promotion: DEBUG
