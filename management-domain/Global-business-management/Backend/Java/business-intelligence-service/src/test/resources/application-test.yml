server:
  port: 8080

spring:
  application:
    name: business-intelligence-service
  data:
    mongodb:
      database: business-intelligence-service_test_db
      host: localhost
      port: 27017
  cache:
    type: simple

# Logging configuration for tests
logging:
  level:
    com.gogidix.globalbusiness: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.springframework.test: DEBUG

# Test-specific configurations
bi:
  reports:
    max-retry-attempts: 3
    generation-timeout-seconds: 300
  insights:
    confidence-threshold: 0.7
    max-insights-per-query: 100
  forecasts:
    max-horizon-days: 365
    min-historical-points: 30

# Scheduling configuration (disabled for tests)
scheduling:
  enabled: false

# Cache configuration for tests
cache:
  ttl:
    reports: 3600
    insights: 1800
    forecasts: 7200
