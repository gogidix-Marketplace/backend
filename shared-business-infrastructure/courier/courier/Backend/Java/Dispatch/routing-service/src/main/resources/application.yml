# =============================================================================
# Routing Service Configuration
# =============================================================================

server:
  port: ${SERVICE_PORT:8104}
  servlet:
    context-path: /api/v1
  shutdown: graceful

spring:
  application:
    name: routing-service

  # MongoDB Configuration
  data:
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT:27017}
      database: ${MONGODB_DB:routing_service}
      username: ${MONGODB_USER:}
      password: ${MONGODB_PASSWORD:}
      authentication-database: ${MONGODB_AUTH_DB:admin}
      auto-index-creation: true

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializers.JsonSerializer
      acks: all
      retries: 3
      properties:
        delivery.timeout.ms: 30000
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializers.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
    topic:
      routing-events: routing-events

  # Cache Configuration
  cache:
    type: simple
    cache-names: routes,optimizedRoutes

  # Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# Logging Configuration
logging:
  level:
    root: INFO
    com.gogidix.courier: ${LOG_LEVEL:DEBUG}
    org.springframework.data.mongodb: ${MONGO_LOG_LEVEL:INFO}
    org.springframework.kafka: ${KAFKA_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} - %msg [tenantId=%X{tenantId}][userId=%X{userId}][traceId=%X{traceId},spanId=%X{spanId}]%n"

# Service Specific Configuration
routing:
  optimization:
    default:
      algorithm: NEAREST_NEIGHBOR
      max-alternatives: 3
      max-iterations: 1000
      population-size: 100
      mutation-rate: 0.1
      crossover-rate: 0.8
    constraints:
      max-route-duration-seconds: 28800  # 8 hours
      max-route-distance-meters: 500000  # 500 km
      consider-time-windows: true
      consider-traffic: false
      consider-driver-breaks: true
  calculation:
    average-speed-kmh: 30  # Average speed for urban delivery
    service-duration-seconds: 300  # 5 minutes default service time
    max-detour-meters: 5000  # 5 km max detour
    max-detour-seconds: 900  # 15 minutes max detour time
