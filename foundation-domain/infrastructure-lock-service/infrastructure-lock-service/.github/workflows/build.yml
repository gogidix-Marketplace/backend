name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up JDK 17
        uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: cd lock-service && mvn clean compile -B

      - name: Package with Maven
        run: cd lock-service && mvn package -DskipTests -B

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: jar-artifact
          path: lock-service/target/*.jar
          retention-days: 7
