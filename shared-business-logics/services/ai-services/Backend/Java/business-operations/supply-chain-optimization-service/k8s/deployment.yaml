apiVersion: v1
kind: Namespace
metadata:
  name: ai-services
  labels:
    name: ai-services
    environment: production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supply-chain-optimization-service
  namespace: ai-services
  labels:
    app: supply-chain-optimization-service
    app.kubernetes.io/name: supply-chain-optimization-service
    app.kubernetes.io/instance: supply-chain-optimization-service
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: ai-services
    app.kubernetes.io/managed-by: kubernetes
    team: team-ai-business-ops
    domain: business-operations
spec:
  replicas: 2
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: supply-chain-optimization-service
  template:
    metadata:
      labels:
        app: supply-chain-optimization-service
        app.kubernetes.io/name: supply-chain-optimization-service
        app.kubernetes.io/instance: supply-chain-optimization-service
        app.kubernetes.io/version: "1.0.0"
        team: team-ai-business-ops
        domain: business-operations
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: supply-chain-optimization-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: supply-chain-optimization-service
        image: gogidix/supply-chain-optimization-service:1.0.0
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8081
          protocol: TCP
        - name: management
          containerPort: 8081
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: SERVER_PORT
          value: "8081"
        - name: JAVA_OPTS
          value: "-Xmx1g -Xms768m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError"
        - name: SPRING_APPLICATION_NAME
          value: "supply-chain-optimization-service"
        - name: SPRING_MAIN_BANNER_MODE
          value: "off"
        - name: AI_SERVICE_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: supply-chain-optimization-service-config
              key: ai-service-base-url
        - name: AI_SERVICE_OPTIMIZATION_ENDPOINT
          value: "/api/v1/optimize"
        - name: AI_SERVICE_TIMEOUT
          value: "30000"
        - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
          value: "health,info,metrics,prometheus"
        - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
          value: "always"
        - name: LOGGING_LEVEL_COM_GOGIDIX_AISERVICES
          value: "INFO"
        envFrom:
        - configMapRef:
            name: supply-chain-optimization-service-config
        resources:
          requests:
            memory: "768Mi"
            cpu: "250m"
          limits:
            memory: "1.5Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 18
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
      terminationGracePeriodSeconds: 30
