{{/*
===============================================================================
Secrets Template
===============================================================================
Creates Kubernetes secrets for storing sensitive configuration data.
*/}}
{{- if not .Values.mongodb.auth.existingSecret }}
{{- if .Values.mongodb.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "warehousing-core.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
type: Opaque
stringData:
  mongodb-root-password: {{ .Values.mongodb.auth.rootPassword | default (randAlphaNum 32) | quote }}
  mongodb-passwords: {{ .Values.mongodb.auth.passwords | default (randAlphaNum 32) | quote }}
  mongodb-replica-set-key: {{ .Values.mongodb.auth.replicaSetKey | default (randAlphaNum 32) | quote }}
  mongodb-username: {{ .Values.mongodb.auth.username | default "warehousing" | quote }}
{{- end }}
{{- end }}

{{- if not .Values.redis.auth.existingSecret }}
{{- if .Values.redis.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "warehousing-core.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
type: Opaque
stringData:
  redis-password: {{ .Values.redis.auth.password | default (randAlphaNum 32) | quote }}
{{- end }}
{{- end }}

{{- if .Values.secrets }}
{{- range $secretName, $secretData := .Values.secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "warehousing-core.labels" $ | nindent 4 }}
type: Opaque
{{- if $secretData.stringData }}
stringData:
  {{- toYaml $secretData.stringData | nindent 2 }}
{{- end }}
{{- if $secretData.data }}
data:
  {{- toYaml $secretData.data | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}

{{- if .Values.global.tls }}
---
apiVersion: v1
kind: Secret
metadata:
  name: warehousing-core-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "warehousing-core.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.global.tls.crt | default "" }}
  tls.key: {{ .Values.global.tls.key | default "" }}
{{- end }}

{{- if .Values.registrySecret }}
{{- if .Values.registrySecret.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.registrySecret.name | default "gogidix-registry-secret" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "warehousing-core.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ template "imagePullSecret" . }}
{{- end }}
{{- end }}

{{- if .Values.observability.datadog.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: datadog-api-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "warehousing-core.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.observability.datadog.apiKey | default "" | quote }}
{{- end }}

{{/*
Common warehousing secrets
*/}}
---
apiVersion: v1
kind: Secret
metadata:
  name: warehousing-common-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "warehousing-core.labels" . | nindent 4 }}
    app.kubernetes.io/component: common
type: Opaque
stringData:
  MONGODB_USERNAME: {{ .Values.mongodb.auth.username | default "warehousing" | quote }}
  # MONGODB_PASSWORD will be populated from mongodb-credentials secret
  SPRING_DATA_MONGODB_URI: {{ printf "mongodb://${.Values.mongodb.auth.username | default "warehousing"}:${MONGODB_PASSWORD}@mongodb-0.mongodb-headless.${.Release.Namespace}.svc.cluster.local:27017/warehousing_core?authSource=admin" | quote }}

{{/*
Helper template to create docker registry secret
*/}}
{{- define "imagePullSecret" }}
{{- with .Values.registrySecret }}
{{- printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}" .registry .username .password (printf "%s:%s" .username .password | b64enc) | b64enc }}
{{- end }}
{{- end }}
