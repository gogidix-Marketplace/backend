version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: corporate-cms-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: corporate_cms_dev
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - corporate-cms-network

  corporate-cms-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: corporate-cms-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATA_MONGODB_URI: mongodb://admin:admin123@mongodb:27017/corporate_cms_dev?authSource=admin
      JWT_SECRET: 5VHxJk8MqP2nL9rWtY3uBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ
      UPLOAD_DIR: /app/uploads
    depends_on:
      - mongodb
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - corporate-cms-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/cms/v1/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  corporate-cms-network:
    driver: bridge
