# Test configuration for tenant-config-service

spring:
  application:
    name: tenant-config-service

  # MongoDB Test Configuration
  data:
    mongodb:
      auto-index-creation: true

  # Kafka Test Configuration
  kafka:
    consumer:
      auto-offset-reset: earliest
      group-id: test-group

# Logging for tests
logging:
  level:
    root: WARN
    com.gogidix.courier: DEBUG
    org.testcontainers: INFO
