# Test Configuration for dispatch-core-service

# Spring Boot
spring.application.name=dispatch-core-service-test
spring.profiles.active=test

# Main allow bean override
spring.main.allow-bean-definition-overriding=true

# Exclude MongoDB auto-configuration for unit tests
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

# Logging
logging.level.root=INFO
logging.level.com.gogidix=DEBUG

# Kafka (disable for tests)
spring.kafka.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
