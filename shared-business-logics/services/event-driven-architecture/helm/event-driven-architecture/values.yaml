# Global Horizontal Pod Autoscaler defaults
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilization: 70
  targetMemoryUtilization: 80

# Global Pod Disruption Budget defaults
pdb:
  enabled: true
  minAvailable: 1

# Global Monitoring defaults
monitoring:
  enabled: true
  serviceMonitorEnabled: true
  prometheusScrape: true
  interval: 30s
  scrapeTimeout: 10s

# Service Account
serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountToken: false

# Pod Security Context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Container Security Context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

# Node Selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Database credentials (use --set or existing secret)
database:
  existingSecret: false
  secretName: ""
  username: "postgres"
  password: "CHANGE_ME"

# Redis credentials
redis:
  existingSecret: false
  secretName: ""
  password: ""
  database: 0

# Kafka configuration
kafka:
  consumerGroup: "event-driven-architecture-group"
  autoCreateTopics: true
  numPartitions: 3
  replicationFactor: 2

# Event-driven specific configuration
eventDriven:
  message:
    batchSize: 100
    maxRetries: 3
    retryBackoffMs: 1000
  event:
    retentionHours: 168
    aggregationWindowMs: 60000
  async:
    maxConcurrentTasks: 10
    taskTimeoutMs: 30000
    queueCapacity: 1000
  routing:
    strategy: "topic-based"
    fallbackEnabled: true
