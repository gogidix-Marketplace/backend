spring:
  application:
    name: infrastructure-config-service

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017}
      database: ${MONGODB_DATABASE:infrastructure_config}
      auto-index-creation: true

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 2
        max-wait: -1ms

  cache:
    type: redis
    redis:
      time-to-live: 300000
      cache-null-values: false
      key-prefix: "config:"
      use-key-prefix: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: infrastructure-config-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

server:
  port: ${SERVER_PORT:8090}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,configprops
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 100
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 10
    instances:
      configRepository:
        base-config: default

logging:
  level:
    root: INFO
    com.gogidix: DEBUG
    org.springframework.data.mongodb: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/infrastructure-config-service.log
    max-size: 100MB
    max-history: 30

# Application properties
infrastructure-config:
  encryption:
    key: ${ENCRYPTION_KEY:40 chars long secure encryption key default value!!!}
    algorithm: AES/GCM/NoPadding
  versioning:
    enabled: true
    max-versions: 50
  validation:
    strict-mode: true
    schema-validation: true
  cache:
    config-ttl: 300000
    feature-flag-ttl: 60000
    secret-ttl: 120000
  audit:
    enabled: true
    retention-days: 90

---
# Development profile
spring:
  config:
    activate:
      on-profile: dev
  data:
    mongodb:
      uri: mongodb://localhost:27017
      database: infrastructure_config_dev

logging:
  level:
    com.gogidix: DEBUG
    org.springframework.data.mongodb: DEBUG

infrastructure-config:
  validation:
    strict-mode: false

---
# Staging profile
spring:
  config:
    activate:
      on-profile: staging
  data:
    mongodb:
      database: infrastructure_config_staging

logging:
  level:
    com.gogidix: INFO
    root: INFO

---
# Production profile
spring:
  config:
    activate:
      on-profile: prod
  data:
    mongodb:
      database: infrastructure_config_prod

logging:
  level:
    root: WARN
    com.gogidix: INFO

infrastructure-config:
  validation:
    strict-mode: true
  audit:
    retention-days: 365
