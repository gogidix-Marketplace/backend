apiVersion: v1
kind: ConfigMap
metadata:
  name: status-broadcast-service-config
  namespace: transaction-orchestration
  labels:
    app: status-broadcast-service
    team: team-b-transaction
data:
  database-url: "jdbc:postgresql://postgres:5432/status_broadcast_db"
  kafka-bootstrap-servers: "kafka:9092"
  application.yaml: |
    server:
      port: 8084
      shutdown: graceful

    spring:
      application:
        name: status-broadcast-service

      datasource:
        url: ${DATABASE_URL}
        username: ${DATABASE_USERNAME}
        password: ${DATABASE_PASSWORD}
        driver-class-name: org.postgresql.Driver
        hikari:
          maximum-pool-size: 20
          minimum-idle: 5
          connection-timeout: 30000
          idle-timeout: 600000
          max-lifetime: 1800000

      jpa:
        hibernate:
          ddl-auto: validate
        show-sql: false
        properties:
          hibernate:
            dialect: org.hibernate.dialect.PostgreSQLDialect
            format_sql: true
            jdbc:
              batch_size: 100
            order_inserts: true
            order_updates: true
        open-in-view: false

      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
        consumer:
          group-id: status-broadcast-service-group
          auto-offset-reset: earliest
          key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
          value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
          properties:
            spring.json.trusted.packages: "*"
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
          acks: all
          retries: 3

    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
      endpoint:
        health:
          show-details: always
          show-components: always
      metrics:
        export:
          prometheus:
            enabled: true
        distribution:
          percentiles-histogram:
            http.server.requests: true
          slo:
            http.server.requests: 50ms,100ms,200ms,500ms,1s,2s

    logging:
      level:
        root: INFO
        com.gogidix.transaction.status: INFO
        org.hibernate.SQL: WARN
      pattern:
        console: '%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n'
        file: '%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n'
      file:
        name: /logs/status-broadcast-service.log
        max-size: 100MB
        max-history: 30

    application:
      cors:
        allowed-origins: ${CORS_ORIGINS}
        allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
        allowed-headers: "*"
        allow-credentials: true
        max-age: 3600
      websocket:
        max-session-timeout-minutes: 30
        max-text-message-buffer-size: 8192
        max-binary-message-buffer-size: 8192

    springdoc:
      api-docs:
        path: /api-docs
      swagger-ui:
        path: /swagger-ui.html
        enabled: true
      show-actuator: true
