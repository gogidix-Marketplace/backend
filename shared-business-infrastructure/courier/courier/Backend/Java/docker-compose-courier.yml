version: '3.8'

# ============================================================================
# Gogidix Courier Services - Docker Compose Configuration
# ============================================================================
# This docker-compose file orchestrates all 20+ microservices in the
# courier-services domain, including infrastructure components.
#
# Infrastructure Services:
#   - MongoDB Replica Set (ports 27017-27019)
#   - Zookeeper (port 2181)
#   - Kafka (ports 9092-9093)
#   - Redis (port 6379)
#   - Eureka Server (port 8761)
#
# Usage:
#   docker-compose -f docker-compose-courier.yml up -d
# ============================================================================

services:
  # ==========================================================================
  # INFRASTRUCTURE SERVICES
  # ==========================================================================

  # ------------------------------------------------------------------------
  # MongoDB Replica Set Configuration
  # ------------------------------------------------------------------------
  mongodb-primary:
    image: mongo:7.0
    container_name: mongodb-primary-courier
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_REPLICA_SET_NAME: rs0
    volumes:
      - mongodb-primary-data:/data/db
      - mongodb-config:/data/configdb
      - ./scripts/mongodb-init.sh:/docker-entrypoint-initdb.d/mongodb-init.sh:ro
    command: mongod --replSet rs0 --bind_ip_all
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - courier-network
    restart: unless-stopped

  mongodb-secondary-1:
    image: mongo:7.0
    container_name: mongodb-secondary-1-courier
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_REPLICA_SET_NAME: rs0
    volumes:
      - mongodb-secondary-1-data:/data/db
      - mongodb-config:/data/configdb
    command: mongod --replSet rs0 --bind_ip_all
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - courier-network
    restart: unless-stopped

  mongodb-secondary-2:
    image: mongo:7.0
    container_name: mongodb-secondary-2-courier
    ports:
      - "27019:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_REPLICA_SET_NAME: rs0
    volumes:
      - mongodb-secondary-2-data:/data/db
      - mongodb-config:/data/configdb
    command: mongod --replSet rs0 --bind_ip_all
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - courier-network
    restart: unless-stopped

  # ------------------------------------------------------------------------
  # MongoDB Replica Set Initialization
  # ------------------------------------------------------------------------
  mongodb-init:
    image: mongo:7.0
    container_name: mongodb-init-courier
    depends_on:
      - mongodb-primary
      - mongodb-secondary-1
      - mongodb-secondary-2
    networks:
      - courier-network
    volumes:
      - ./scripts/mongodb-init.sh:/mongodb-init.sh:ro
    command: >
      bash -c "
        sleep 20 &&
        mongosh --host mongodb-primary:27017 -u admin -p admin123 --authenticationDatabase admin --eval '
        rs.initiate({
          _id: \"rs0\",
          members: [
            {_id: 0, host: \"mongodb-primary:27017\"},
            {_id: 1, host: \"mongodb-secondary-1:27017\"},
            {_id: 2, host: \"mongodb-secondary-2:27017\"}
          ]
        })
        ' &&
        sleep 10 &&
        mongosh --host mongodb-primary:27017 -u admin -p admin123 --authenticationDatabase admin --eval 'rs.status()'
      "
    restart: "no"

  # ------------------------------------------------------------------------
  # Zookeeper - Required for Kafka
  # ------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper-courier
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_MAX_CLIENT_CNXNS: 0
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - courier-network
    restart: unless-stopped

  # ------------------------------------------------------------------------
  # Kafka - Message Broker
  # ------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-courier
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - courier-network
    restart: unless-stopped

  # ------------------------------------------------------------------------
  # Kafka UI - Optional Management Interface
  # ------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-courier
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: courier-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - courier-network
    restart: unless-stopped

  # ------------------------------------------------------------------------
  # Redis - Caching and Session Store
  # ------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis-courier
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redis123
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - courier-network
    restart: unless-stopped

  # ------------------------------------------------------------------------
  # Redis Commander - Optional Management Interface
  # ------------------------------------------------------------------------
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander-courier
    depends_on:
      - redis
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379:0:redis123
    networks:
      - courier-network
    restart: unless-stopped

  # ------------------------------------------------------------------------
  # Eureka Server - Service Discovery
  # ------------------------------------------------------------------------
  eureka-server:
    image: springcloud/eureka:latest
    container_name: eureka-server-courier
    ports:
      - "8761:8761"
    environment:
      SPRING_APPLICATION_NAME: eureka-server
      SPRING_CLOUD_CONFIG_ENABLED: "false"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      EUREKA_SERVER_ENABLE_SELF_PRESERVATION: "false"
      EUREKA_INSTANCE_HOSTNAME: eureka-server
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JAVA_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - courier-network
    restart: unless-stopped

  # ==========================================================================
  # COURIER SERVICES
  # ==========================================================================

  # ------------------------------------------------------------------------
  # Tenant Config Service - Multi-tenant Configuration Management
  # ------------------------------------------------------------------------
  tenant-config-service:
    build:
      context: ./TenantConfig/tenant-config-service
      dockerfile: Dockerfile
    container_name: tenant-config-service
    ports:
      - "8100:8100"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: tenant-config-service
      SERVER_PORT: 8100
      MONGODB_URI: mongodb://admin:admin123@mongodb-primary:27017,tenant-config-db?authSource=admin&replicaSet=rs0
      KAFKA_BROKERS: kafka:9092
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      X-TENANT-ID: tenant-config-service
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
    depends_on:
      mongodb-primary:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - courier-network
    restart: unless-stopped

  # ------------------------------------------------------------------------
  # Dispatch Core Service - Central Dispatch Logic
  # ------------------------------------------------------------------------
  dispatch-core-service:
    build:
      context: ./Dispatch/dispatch-core-service
      dockerfile: Dockerfile
    container_name: dispatch-core-service
    ports:
      - "8101:8101"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: dispatch-core-service
      SERVER_PORT: 8101
      MONGODB_URI: mongodb://admin:admin123@mongodb-primary:27017,dispatch-core-db?authSource=admin&replicaSet=rs0
      KAFKA_BROKERS: kafka:9092
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      X-TENANT-ID: dispatch-core-service
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      TENANT_CONFIG_SERVICE_URL: http://tenant-config-service:8100
      ASSIGNMENT_SERVICE_URL: http://assignment-service:8102
      ROUTING_SERVICE_URL: http://routing-service:8104
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
    depends_on:
      mongodb-primary:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      tenant-config-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8101/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
