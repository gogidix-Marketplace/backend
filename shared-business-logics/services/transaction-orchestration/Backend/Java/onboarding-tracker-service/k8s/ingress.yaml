apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: onboarding-tracker-service-ingress
  namespace: transaction-orchestration
  labels:
    app: onboarding-tracker-service
    team: team-b-transaction
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - onboarding-tracker.gogidix.com
    secretName: onboarding-tracker-service-tls
  rules:
  - host: onboarding-tracker.gogidix.com
    http:
      paths:
      - path: /api/onboarding(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: onboarding-tracker-service
            port:
              number: 8082
      - path: /
        pathType: Prefix
        backend:
          service:
            name: onboarding-tracker-service
            port:
              number: 8082
